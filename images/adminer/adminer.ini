; The PHP settings of the Adminer container. The container has 256 MB of memory.
expose_php = Off
memory_limit = 160M
max_execution_time = 300
upload_max_filesize = 64M
post_max_size = 64M
; The edge proxy terminates TLS. With this setting, Adminer sends its session cookie only over
; HTTPS.
session.cookie_secure = 1
session.cookie_httponly = 1
session.cookie_samesite = Lax
session.save_path = /tmp
; A session ends after one hour with no request. The temporary database user expires too.
session.gc_maxlifetime = 3600
