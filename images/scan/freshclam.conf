# The settings of freshclam in the malware scanner (images/scan/Containerfile).
DatabaseDirectory /var/lib/clamav
DatabaseMirror database.clamav.net
# The agent starts freshclam before a scan, at most one time in each hour.
Checks 1
LogTime yes
LogVerbose no
Foreground yes
ConnectTimeout 30
ReceiveTimeout 300
TestDatabases yes
Bytecode yes
