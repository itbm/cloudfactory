syntax = "proto3";

// The API of the Cloudfactory agent (spec section 6.4).
//
// The agent accepts only these typed actions. It does not accept shell commands.
// The panel calls the agent over mutual TLS. The agent accepts the job, runs it,
// and reports each step to the panel at /api/agent/v1/jobs/{id}/events.
// Thus each method returns as soon as the agent has accepted the job.
//
// The panel uses the Connect protocol with JSON. The field names in JSON are
// lowerCamelCase, for example "jobId".
package cloudfactory.agent.v1;

option go_package = "github.com/itbm/cloudfactory/agent/gen/cloudfactory/agent/v1;agentv1";

service AgentService {
  rpc CreateWebsite(WebsiteRequest) returns (JobAccepted);
  rpc DeleteWebsite(DeleteWebsiteRequest) returns (JobAccepted);
  rpc SetWebsitePower(SetWebsitePowerRequest) returns (JobAccepted);
  rpc SetLimits(SetLimitsRequest) returns (JobAccepted);
  rpc SetRuntime(WebsiteRequest) returns (JobAccepted);
  rpc AddDomain(DomainRequest) returns (JobAccepted);
  rpc RemoveDomain(DomainRequest) returns (JobAccepted);
  rpc CreateDatabase(CreateDatabaseRequest) returns (JobAccepted);
  rpc DeleteDatabase(DeleteDatabaseRequest) returns (JobAccepted);
  rpc SetDatabaseUser(SetDatabaseUserRequest) returns (JobAccepted);
  rpc DeleteDatabaseUser(DeleteDatabaseUserRequest) returns (JobAccepted);
  rpc Backup(BackupRequest) returns (JobAccepted);
  rpc Restore(RestoreRequest) returns (JobAccepted);
  rpc InstallHostUpdates(HostRequest) returns (JobAccepted);
  rpc Reboot(HostRequest) returns (JobAccepted);
  rpc UpdateAgent(UpdateAgentRequest) returns (JobAccepted);
  rpc PruneBackups(PruneBackupsRequest) returns (JobAccepted);
  rpc SetSftp(SetSftpRequest) returns (JobAccepted);
  rpc ConfigureHost(ConfigureHostRequest) returns (JobAccepted);
  rpc SetPanelCertificate(SetPanelCertificateRequest) returns (JobAccepted);
  rpc SetDatabaseServer(DatabaseServerRequest) returns (JobAccepted);
  rpc DeleteDatabaseServer(DeleteDatabaseServerRequest) returns (JobAccepted);
  rpc SetMailServer(SetMailServerRequest) returns (JobAccepted);
  rpc PrepareMailNode(PrepareMailNodeRequest) returns (JobAccepted);
  rpc SetMailNode(SetMailNodeRequest) returns (JobAccepted);
  rpc SetMailDomain(MailDomainRequest) returns (JobAccepted);
  rpc DeleteMailDomain(MailDomainRequest) returns (JobAccepted);
  rpc SetMailbox(SetMailboxRequest) returns (JobAccepted);
  rpc DeleteMailbox(MailAddressRequest) returns (JobAccepted);
  rpc SetMailAlias(SetMailAliasRequest) returns (JobAccepted);
  rpc DeleteMailAlias(MailAddressRequest) returns (JobAccepted);

  // Returns the actual state of the server at once. This method does not make a job.
  rpc GetStatus(GetStatusRequest) returns (HostStatus);
}

message JobAccepted {
  string job_id = 1;
  // True when the agent already ran this job. The agent then reports the same result again.
  bool duplicate = 2;
}

message Limits {
  double vcpus = 1;
  int64 memory_bytes = 2;
  int64 disk_bytes = 3;
  int64 disk_io_bytes_per_second = 4;
  int64 processes = 5;
}

message Domain {
  string name = 1;
  // "primary", "redirect" or "alias".
  string kind = 2;
}

message Website {
  string id = 1;
  string unix_user = 2;
  // The image reference with the tag, for example "ghcr.io/cloudfactory/frankenphp-php8.4:8.4.0-1".
  string image = 3;
  // The digest that the agent pulls, for example "sha256:...". Empty for a custom image.
  string image_digest = 4;
  // "frankenphp", "apache-php-fpm" or "custom".
  string runtime = 5;
  string php_version = 6;
  bool worker_mode = 7;
  repeated string extensions = 8;
  map<string, string> php_ini = 9;
  Limits limits = 10;
  repeated Domain domains = 11;
  // Runtime "custom": the port in the container that serves HTTP. 0 means 8080 (FR-307).
  int32 container_port = 12;
  // Runtime "custom": the start command, as a list of arguments. Empty means the command of the image.
  repeated string command = 13;
  // The directory in /app that the web server serves, for example "web". Empty means "public",
  // and "." means /app itself.
  string document_root = 14;
  // The ID of the customer of the website. The website can connect to the database servers of
  // its customer on this server (DatabaseServer). Each website has a customer.
  //
  // The agent records the value in CreateWebsite. After that, it keeps the value of the
  // website. SetRuntime records the value only for a website that has none.
  string database_instance = 15;
}

// A database server of a customer: one database container with one engine, in its own gVisor
// sandbox, with its own data and its own limits. A customer can have more than one database
// server on a server. Each database is in one database server.
//
// All database servers of a customer on a server publish their ports on the address of the
// customer. The websites of the customer on the server can connect to them.
message DatabaseServer {
  string id = 1;
  // The ID of the customer.
  string customer = 2;
  // "mariadb", "postgresql" or "valkey".
  string engine = 3;
  // The port on the address of the customer. The first database server of an engine has the
  // usual port of the engine (3306, 5432 or 6379). A second one has the next port.
  int32 port = 4;
  // The limits of the container: vcpus, memory_bytes and disk_bytes. 0 means no limit.
  Limits limits = 5;
}

// SetDatabaseServer makes a database server, or changes the limits of a database server.
// A change of the limits restarts the database server.
message DatabaseServerRequest {
  string job_id = 1;
  DatabaseServer database_server = 2;
}

// Email. A server with the role "email" has one mail server (Stalwart) in a container, for
// all customers of the server. The panel keeps the customers apart: it sends a mail domain
// only for the customer that controls the domain.

// SetMailServer starts the mail server, opens the mail ports in the firewall, and gets a TLS
// certificate for the host name from the edge proxy.
message SetMailServerRequest {
  string job_id = 1;
  // The name of the mail server in the DNS, for example "mail.example.net".
  string hostname = 2;
}

// A mail cluster: mail servers on three or five servers that share their data. The mail
// service continues when one server fails. The panel makes a cluster in three steps:
// PrepareMailNode on each server, SetMailNode on each server, then SetMailServer on each
// server.

// PrepareMailNode makes the keys of the server for a mail cluster. The result of the job has
// "keys": the public keys "wireguardKey", "keepKey" and "nodeKey". The private keys stay on
// the server.
message PrepareMailNodeRequest {
  string job_id = 1;
}

// A member of a mail cluster.
message MailClusterMember {
  // The number of the member, from 1. It does not change.
  int32 id = 1;
  // The host name of the mail server of the member.
  string name = 2;
  // The public IP address of the server.
  string endpoint = 3;
  // The address of the member in the private network of the cluster (IPv4).
  string address = 4;
  // Members with the same number are near to each other.
  int32 region = 5;
  // The public keys from PrepareMailNode.
  string wireguard_key = 6;
  string keep_key = 7;
  string node_key = 8;
}

// SetMailNode makes the server a member of a mail cluster. It makes the private network of
// the cluster, and starts the cluster store and the database node of the server. The result
// of the job has "database": the number of database nodes ("size") and the state of the node
// ("state").
message SetMailNodeRequest {
  string job_id = 1;
  // The name of the cluster.
  string cluster = 2;
  // The host name that all members share.
  string hostname = 3;
  // The number of this server in members.
  int32 self = 4;
  // All members: three or five.
  repeated MailClusterMember members = 5;
  // The secrets of the cluster: 32 hexadecimal digits each. All members get the same secrets.
  string db_password = 6;
  string keep_secret = 7;
  string peer_secret = 8;
  // True only for the one server that starts a new database cluster. The other servers
  // join it.
  bool bootstrap = 9;
}

// SetMailDomain adds a domain to the mail server. The result of the job has "records": the
// DNS records that the owner of the domain adds (MX, SPF, DKIM and DMARC). DeleteMailDomain
// removes a domain with no mailboxes and no other addresses.
message MailDomainRequest {
  string job_id = 1;
  string domain = 2;
}

// SetMailbox makes a mailbox, or changes its size or its password.
message SetMailboxRequest {
  string job_id = 1;
  string domain = 2;
  // The part of the address before the @ sign.
  string local_part = 3;
  int64 quota_bytes = 4;
  // The bcrypt hash of the password. The agent never gets the password. Empty: the mailbox
  // keeps its password.
  string password_hash = 5;
  // True: the job sets the encryption of the mailbox. False: the encryption does not change.
  bool set_encryption = 6;
  // The OpenPGP public key of the owner of the mailbox, in ASCII armour. The mail server
  // encrypts each new message with it before it stores the message. Only the private key,
  // which the server never gets, can decrypt the message. Empty: the encryption is off.
  string public_key = 7;
  // True: the job writes the file with the private keys to the files of the mailbox. The
  // panel adds this field each time that it sends the job: the job record does not have it.
  bool set_key_file = 8;
  // The private keys that the panel made for the mailbox, in ASCII armour. Each key is
  // protected with the password of the mailbox. The PGP plugin of the webmail reads the file
  // with that password. Empty: the job removes the file.
  string private_keys = 9;
}

// DeleteMailbox removes a mailbox and its messages. DeleteMailAlias removes an alias or a
// forwarder.
message MailAddressRequest {
  string job_id = 1;
  string domain = 2;
  string local_part = 3;
}

// SetMailAlias makes an address with no mailbox. The mail server sends each message for the
// address to all destinations: an alias has one destination, a forwarder has a list.
message SetMailAliasRequest {
  string job_id = 1;
  string domain = 2;
  string local_part = 3;
  repeated string destinations = 4;
}

// Stops a database server and removes its data. The panel sends it only for a database
// server with no databases.
message DeleteDatabaseServerRequest {
  string job_id = 1;
  string database_server = 2;
}

message HealthCheck {
  // The status that each check expects. 0 accepts each status below 500, for example a redirect.
  int32 status = 1;
  double max_error_rate = 2;
  int32 seconds = 3;
}

// For CreateWebsite and SetRuntime.
message WebsiteRequest {
  string job_id = 1;
  Website website = 2;
  // SetRuntime: the agent goes back to this tag when the health check fails.
  string previous_tag = 3;
  string previous_image_id = 4;
  HealthCheck health_check = 5;
  // CreateWebsite: copy the files and databases of this website (a staging copy).
  string copy_from = 6;
  string copy_from_unix_user = 7;
  // CreateWebsite with copy_from: the databases to copy, and a new user for the copies.
  repeated DatabaseCopy copy_databases = 8;
  repeated DatabaseUserCopy copy_users = 9;
  // CreateWebsite with copy_from: the database servers of the copies. The agent makes a
  // database server that it does not have.
  repeated DatabaseServer database_servers = 10;
}

// A staging copy copies the database "from" of the source website into the new database "to".
message DatabaseCopy {
  string engine = 1;
  string from = 2;
  string to = 3;
  // The IDs of the database servers of the two databases.
  string from_server = 4;
  string to_server = 5;
}

// A new database user of the staging copy, with read-write access to all copies in its
// database server.
message DatabaseUserCopy {
  string engine = 1;
  string name = 2;
  string password = 3;
  // The ID of the database server of the user.
  string database_server = 4;
}

message DeleteWebsiteRequest {
  string job_id = 1;
  string website_id = 2;
  string unix_user = 3;
  // The agent also removes the databases and the database users of the website.
  repeated DatabaseRef databases = 4;
  repeated DatabaseRef database_users = 5;
}

message SetWebsitePowerRequest {
  string job_id = 1;
  string website_id = 2;
  string unix_user = 3;
  // "start", "stop" or "restart".
  string power = 4;
}

message SetLimitsRequest {
  string job_id = 1;
  string website_id = 2;
  string unix_user = 3;
  Limits limits = 4;
}

message DomainRequest {
  string job_id = 1;
  string website_id = 2;
  string unix_user = 3;
  string domain = 4;
  string kind = 5;
  string primary = 6;
}

// Each database and user name starts with the Unix user of the website and "_". The database
// is in a database server of the customer of the website. The agent makes a database server
// that it does not have.
message CreateDatabaseRequest {
  string job_id = 1;
  string website_id = 2;
  string unix_user = 3;
  // "mariadb" or "postgresql".
  string engine = 4;
  string name = 5;
  // Optional: a new user with read-write access to the database.
  string user = 6;
  string password = 7;
  // "website": only the website container can connect. "anywhere": any address, with TLS.
  string access = 8;
  DatabaseServer database_server = 9;
}

message DeleteDatabaseRequest {
  string job_id = 1;
  string website_id = 2;
  string engine = 3;
  string name = 4;
  string unix_user = 5;
  // The users with access to the database. The agent removes their access first.
  repeated string users = 6;
  // The ID of the database server of the database.
  string database_server = 7;
}

message DatabaseGrant {
  string database = 1;
  // "readonly" or "readwrite".
  string privileges = 2;
}

// Sets the full state of a database user: its password, where it can connect from, and its
// access to each database of the website in the database server of the user.
message SetDatabaseUserRequest {
  string job_id = 1;
  string website_id = 2;
  string unix_user = 3;
  string engine = 4;
  string name = 5;
  // Empty: keep the password.
  string password = 6;
  string access = 7;
  // True: make a new user. The job fails when the user exists.
  bool create = 8;
  repeated DatabaseGrant grants = 9;
  // All databases of the website in the database server of the user. The user has no access
  // to the others.
  repeated string website_databases = 10;
  DatabaseServer database_server = 11;
}

message DeleteDatabaseUserRequest {
  string job_id = 1;
  string website_id = 2;
  string unix_user = 3;
  string engine = 4;
  string name = 5;
  repeated string website_databases = 6;
  // The ID of the database server of the user.
  string database_server = 7;
}

// A database or a database user of a website.
message DatabaseRef {
  string engine = 1;
  string name = 2;
  // The ID of its database server.
  string database_server = 3;
}

message BackupRequest {
  string job_id = 1;
  string website_id = 2;
  string unix_user = 3;
  string kind = 4;
  repeated DatabaseRef databases = 5;
  // The restic repository, for example "s3:s3.amazonaws.com/bucket/path" or "b2:bucket:path".
  string target = 6;
  // The environment variables of restic for the object storage, for example AWS_ACCESS_KEY_ID.
  map<string, string> credentials = 7;
  // When set, the agent removes the snapshots of the website that the policy does not keep (FR-902).
  Retention retention = 8;
}

// The snapshots of a website that the agent keeps. The policy applies to the snapshots of the
// same kind as the backup, so that the scheduled backups do not remove the manual backups.
message Retention {
  int32 daily = 1;
  int32 weekly = 2;
  int32 monthly = 3;
  // When more than 0, the agent also keeps this number of the newest snapshots.
  int32 last = 4;
}

// Removes the data that no snapshot uses from the repository (FR-902).
message PruneBackupsRequest {
  string job_id = 1;
  string target = 2;
  map<string, string> credentials = 3;
  // The IDs of deleted websites. The agent removes all their snapshots first.
  repeated string forget_website_ids = 4;
}

message RestoreRequest {
  string job_id = 1;
  string website_id = 2;
  string unix_user = 3;
  string snapshot_id = 4;
  // "website", "database", "mailbox" or "file".
  string scope = 5;
  // The database ("mariadb:name" or "postgresql:name"), the mailbox, or the file path.
  string item = 6;
  // The restic repository, for example "s3:s3.amazonaws.com/bucket/path" or "b2:bucket:path".
  string target = 7;
  // Scope "database": the SHA-256 hash of the dump at backup time.
  string dump_sha256 = 8;
  map<string, string> credentials = 9;
  // Scope "website": the agent removes the files of the website that are not in the snapshot.
  bool delete_extra = 10;
  // Scope "database": the ID of the database server of the database.
  string database_server = 11;
}

// Sets the SFTP access of a website. The owner signs in as the Unix user of the website and sees
// only the files of the website.
message SetSftpRequest {
  string job_id = 1;
  string website_id = 2;
  string unix_user = 3;
  bool enabled = 4;
  // SFTP accepts SSH keys only. The agent locks the password of the user each time.
  reserved 5, 6;
  reserved "password", "remove_password";
  // The public SSH keys, one OpenSSH key in each item.
  repeated string authorized_keys = 7;
}

// Changes the settings of the host. The agent writes the units of all containers again and
// restarts them.
message ConfigureHostRequest {
  string job_id = 1;
  // "systrap" or "kvm" (FR-310).
  string gvisor_platform = 2;
}

// Changes the certificate method of the panel domain. Only the agent on the panel server accepts
// it. The agent reads the domain from the settings of the panel, not from the request.
message SetPanelCertificateRequest {
  string job_id = 1;
  // "internal" (the certificate authority of the panel) or "letsencrypt".
  string method = 2;
}

message HostRequest {
  string job_id = 1;
  // InstallHostUpdates: "security", "all", "manual" or "tools". "tools" updates only the
  // held container tools (FR-1113).
  string policy = 2;
}

message UpdateAgentRequest {
  string job_id = 1;
  string version = 2;
  // The agent refuses a version that is older than its own version, unless this is true.
  bool allow_downgrade = 3;
}

message GetStatusRequest {}

message PendingUpdate {
  string name = 1;
  string from = 2;
  string to = 3;
  bool security = 4;
}

message Service {
  string name = 1;
  // "running", "stopped" or "failed".
  string state = 2;
}

message HostStatus {
  string agent_version = 1;
  string kernel = 2;
  string podman_version = 3;
  string gvisor_version = 4;
  repeated PendingUpdate pending_updates = 5;
  bool reboot_required = 6;
  repeated Service services = 7;
}
