syntax = "proto3";

// The API of the Cloudfactory agent (spec section 6.4).
//
// The agent accepts only these typed actions. It does not accept shell commands.
// The panel calls the agent over mutual TLS. The agent accepts the job, runs it,
// and reports each step to the panel at /api/agent/v1/jobs/{id}/events.
// Thus each method returns as soon as the agent has accepted the job.
//
// The panel uses the Connect protocol with JSON. The field names in JSON are
// lowerCamelCase, for example "jobId".
package cloudfactory.agent.v1;

option go_package = "github.com/itbm/cloudfactory/agent/gen/cloudfactory/agent/v1;agentv1";

service AgentService {
  rpc CreateWebsite(WebsiteRequest) returns (JobAccepted);
  rpc DeleteWebsite(DeleteWebsiteRequest) returns (JobAccepted);
  rpc SetWebsitePower(SetWebsitePowerRequest) returns (JobAccepted);
  rpc SetLimits(SetLimitsRequest) returns (JobAccepted);
  rpc SetRuntime(WebsiteRequest) returns (JobAccepted);
  rpc AddDomain(DomainRequest) returns (JobAccepted);
  rpc RemoveDomain(DomainRequest) returns (JobAccepted);
  rpc CreateDatabase(CreateDatabaseRequest) returns (JobAccepted);
  rpc DeleteDatabase(DeleteDatabaseRequest) returns (JobAccepted);
  rpc SetDatabaseUser(SetDatabaseUserRequest) returns (JobAccepted);
  rpc DeleteDatabaseUser(DeleteDatabaseUserRequest) returns (JobAccepted);
  rpc Backup(BackupRequest) returns (JobAccepted);
  rpc Restore(RestoreRequest) returns (JobAccepted);
  rpc InstallHostUpdates(HostRequest) returns (JobAccepted);
  rpc Reboot(HostRequest) returns (JobAccepted);
  rpc UpdateAgent(UpdateAgentRequest) returns (JobAccepted);
  rpc PruneBackups(PruneBackupsRequest) returns (JobAccepted);
  rpc SetSftp(SetSftpRequest) returns (JobAccepted);
  rpc ConfigureHost(ConfigureHostRequest) returns (JobAccepted);
  rpc SetPanelCertificate(SetPanelCertificateRequest) returns (JobAccepted);
  // Sets the panel domains of the resellers (white label). Only the panel server has them.
  rpc SetPanelBrands(SetPanelBrandsRequest) returns (JobAccepted);
  rpc SetDatabaseServer(DatabaseServerRequest) returns (JobAccepted);
  rpc DeleteDatabaseServer(DeleteDatabaseServerRequest) returns (JobAccepted);
  rpc SetMailServer(SetMailServerRequest) returns (JobAccepted);
  rpc PrepareMailNode(PrepareMailNodeRequest) returns (JobAccepted);
  rpc SetMailNode(SetMailNodeRequest) returns (JobAccepted);
  rpc SetMailDomain(MailDomainRequest) returns (JobAccepted);
  rpc DeleteMailDomain(MailDomainRequest) returns (JobAccepted);
  rpc SetMailbox(SetMailboxRequest) returns (JobAccepted);
  rpc DeleteMailbox(MailAddressRequest) returns (JobAccepted);
  rpc SetMailAlias(SetMailAliasRequest) returns (JobAccepted);
  rpc DeleteMailAlias(MailAddressRequest) returns (JobAccepted);
  rpc SetDnsZones(SetDnsZonesRequest) returns (JobAccepted);
  rpc DeleteDnsZones(DeleteDnsZonesRequest) returns (JobAccepted);
  rpc SetCronJobs(SetCronJobsRequest) returns (JobAccepted);
  rpc RunCronJob(RunCronJobRequest) returns (JobAccepted);
  rpc Deploy(DeployRequest) returns (JobAccepted);
  rpc ActivateRelease(ActivateReleaseRequest) returns (JobAccepted);
  rpc InstallDependencies(InstallDependenciesRequest) returns (JobAccepted);
  rpc SetMesh(SetMeshRequest) returns (JobAccepted);
  rpc RotateMeshKey(RotateMeshKeyRequest) returns (JobAccepted);
  rpc SendDatabaseServer(SendDatabaseServerRequest) returns (JobAccepted);
  rpc ReceiveDatabaseServer(ReceiveDatabaseServerRequest) returns (JobAccepted);
  // Sets the packs of the server: all packs that the panel has installed (docs/packs.md). The
  // agent checks the signature of each pack, saves the packs, lets Podman pull the images of
  // each pack only with a signature of its publisher, and loads the runtimes of the packs.
  rpc SetPacks(SetPacksRequest) returns (JobAccepted);
  // Installs WordPress in the document root of a running PHP website (FR-206). The agent makes
  // the MariaDB database and its user, downloads WordPress with WP-CLI, writes wp-config.php
  // and runs the installer. The document root must be empty, or have only the default page.
  rpc InstallWordPress(InstallWordPressRequest) returns (JobAccepted);
  // Reads the versions of WordPress, of its plugins and of its themes, and the updates that
  // are available. The result has the inventory.
  rpc CheckWordPress(CheckWordPressRequest) returns (JobAccepted);
  // Saves a restore point, then updates WordPress, plugins and themes, then does a health
  // check. When an update or the health check fails, the agent puts back the restore point.
  rpc UpdateWordPress(UpdateWordPressRequest) returns (JobAccepted);
  // Puts back the restore point of the last update of a WordPress site.
  rpc RestoreWordPress(RestoreWordPressRequest) returns (JobAccepted);
  // Runs one WP-CLI command in the container of a website, as the website user, with no shell.
  rpc RunWpCli(RunWpCliRequest) returns (JobAccepted);
  // Sets the certificates from the panel on the edge proxy of the server: the certificates
  // that a customer uploaded, and the certificates that the panel got from an ACME CA with
  // DNS validation. The list is complete. A certificate that the edge proxy has and that is not
  // in the list goes. Each host of a certificate then uses that certificate, and the edge proxy
  // does not get a certificate for the host itself.
  rpc SetCertificates(SetCertificatesRequest) returns (JobAccepted);
  // The import of an account from a different hosting panel, for example cPanel or
  // DirectAdmin (docs/imports.md). The worker of the agent keeps the backup archive in its own
  // directory and reads it as a stream. It never extracts the archive as root: the Unix user
  // of a website writes the files, and the database clients and the mail server get the
  // content of the dumps and of the messages.
  rpc FetchImport(FetchImportRequest) returns (JobAccepted);
  rpc ImportFiles(ImportFilesRequest) returns (JobAccepted);
  rpc ImportDatabase(ImportDatabaseRequest) returns (JobAccepted);
  rpc ImportMail(ImportMailRequest) returns (JobAccepted);
  rpc DeleteImport(DeleteImportRequest) returns (JobAccepted);

  // Returns the actual state of the server at once. This method does not make a job.
  rpc GetStatus(GetStatusRequest) returns (HostStatus);

  // The file manager and the logs of a website. These methods do not make a job: they give
  // the result at once. The agent does each of them as the Unix user of the website, in the
  // directory of the website.
  rpc ListFiles(FileRequest) returns (FileList);
  rpc ReadFile(FileRequest) returns (FileContent);
  rpc WriteFile(WriteFileRequest) returns (FileEntry);
  rpc MakeDirectory(FileRequest) returns (FileEntry);
  rpc MoveFile(MoveFileRequest) returns (FileEntry);
  rpc DeleteFile(FileRequest) returns (FileDeleted);
  rpc GetLogs(GetLogsRequest) returns (Logs);
}

message JobAccepted {
  string job_id = 1;
  // True when the agent already ran this job. The agent then reports the same result again.
  bool duplicate = 2;
}

message Limits {
  double vcpus = 1;
  int64 memory_bytes = 2;
  int64 disk_bytes = 3;
  int64 disk_io_bytes_per_second = 4;
  int64 processes = 5;
}

message Domain {
  string name = 1;
  // "primary", "redirect" or "alias".
  string kind = 2;
}

message Website {
  string id = 1;
  string unix_user = 2;
  // The image reference with the tag, for example "ghcr.io/cloudfactory/frankenphp-php8.4:8.4.0-1".
  string image = 3;
  // The digest that the agent pulls, for example "sha256:...". Empty for a custom image.
  string image_digest = 4;
  // "frankenphp", "apache-php-fpm", "node", "python" or "custom".
  string runtime = 5;
  string php_version = 6;
  bool worker_mode = 7;
  repeated string extensions = 8;
  map<string, string> php_ini = 9;
  Limits limits = 10;
  repeated Domain domains = 11;
  // Runtime "custom": the port in the container that serves HTTP. 0 means 8080 (FR-307).
  int32 container_port = 12;
  // Runtime "custom": the start command, as a list of arguments. Empty means the command of the image.
  // Runtimes "node" and "python": the start command of the application, as for a worker.
  repeated string command = 13;
  // The directory in /app that the web server serves, for example "web". Empty means "public",
  // and "." means /app itself.
  string document_root = 14;
  // The ID of the customer of the website. The website can connect to the database servers of
  // its customer on this server (DatabaseServer). Each website has a customer.
  //
  // The agent records the value in CreateWebsite. After that, it keeps the value of the
  // website. SetRuntime records the value only for a website that has none.
  string database_instance = 15;
  // True for a background worker: the container serves no HTTP. It has no port on the private
  // service address, no route in the edge proxy, and it is not a network member that answers.
  // It can connect to the members of its networks. "command" is its start command, for each
  // runtime. The command runs in the gVisor sandbox as the Unix user of the website, with the
  // limits of the website.
  bool worker = 16;
  // A path prefix for the route of the website in the edge proxy, for example "/01jbq3z5k8n6/".
  // Empty for a usual website: its route has all paths of its domains. With a value, the
  // route has only the paths that start with the prefix, so that more than one website can
  // have the same domain. The panel uses it for the database tool of each customer
  // (Adminer), which has one domain for all customers. The domain has no redirect.
  string route_path = 17;
  // The environment variables of the container of the website, and of its build containers. The
  // agent writes them to a file that only the Unix user of the website can read
  // (EnvironmentFile in the unit), so the values are not in the unit or in a command line. The
  // panel adds the variables of a website to the job each time that it sends it. A plugin that
  // the panel runs (runtime "custom") gets its token this way too (docs/plugins.md).
  map<string, string> environment = 18;
}

// A database server of a customer: one database container with one engine, in its own gVisor
// sandbox, with its own data and its own limits. A customer can have more than one database
// server on a server. Each database is in one database server.
//
// All database servers of a customer on a server publish their ports on the address of the
// customer. The websites of the customer on the server can connect to them.
message DatabaseServer {
  string id = 1;
  // The ID of the customer.
  string customer = 2;
  // "mariadb", "postgresql" or "valkey".
  string engine = 3;
  // The port on the address of the customer. The first database server of an engine has the
  // usual port of the engine (3306, 5432 or 6379). A second one has the next port.
  int32 port = 4;
  // The limits of the container: vcpus, memory_bytes and disk_bytes. 0 means no limit.
  Limits limits = 5;
}

// SetDatabaseServer makes a database server, or changes the limits of a database server.
// A change of the limits restarts the database server.
message DatabaseServerRequest {
  string job_id = 1;
  DatabaseServer database_server = 2;
}

// Email. A server with the role "email" has one mail server (Stalwart) in a container, for
// all customers of the server. The panel keeps the customers apart: it sends a mail domain
// only for the customer that controls the domain.

// SetMailServer starts the mail server, opens the mail ports in the firewall, and gets a TLS
// certificate for the host name from the edge proxy.
message SetMailServerRequest {
  string job_id = 1;
  // The name of the mail server in the DNS, for example "mail.example.net".
  string hostname = 2;
}

// A mail cluster: mail servers on three or five servers that share their data. The mail
// service continues when one server fails. The panel makes a cluster in three steps:
// PrepareMailNode on each server, SetMailNode on each server, then SetMailServer on each
// server.

// PrepareMailNode makes the keys of the server for a mail cluster. The result of the job has
// "keys": the public keys "wireguardKey", "keepKey" and "nodeKey". The private keys stay on
// the server.
message PrepareMailNodeRequest {
  string job_id = 1;
}

// A member of a mail cluster.
message MailClusterMember {
  // The number of the member, from 1. It does not change.
  int32 id = 1;
  // The host name of the mail server of the member.
  string name = 2;
  // The public IP address of the server.
  string endpoint = 3;
  // The address of the member in the private network of the cluster (IPv4).
  string address = 4;
  // Members with the same number are near to each other.
  int32 region = 5;
  // The public keys from PrepareMailNode.
  string wireguard_key = 6;
  string keep_key = 7;
  string node_key = 8;
}

// SetMailNode makes the server a member of a mail cluster. It makes the private network of
// the cluster, and starts the cluster store and the database node of the server. The result
// of the job has "database": the number of database nodes ("size") and the state of the node
// ("state").
message SetMailNodeRequest {
  string job_id = 1;
  // The name of the cluster.
  string cluster = 2;
  // The host name that all members share.
  string hostname = 3;
  // The number of this server in members.
  int32 self = 4;
  // All members: three or five.
  repeated MailClusterMember members = 5;
  // The secrets of the cluster: 32 hexadecimal digits each. All members get the same secrets.
  string db_password = 6;
  string keep_secret = 7;
  string peer_secret = 8;
  // True only for the one server that starts a new database cluster. The other servers
  // join it.
  bool bootstrap = 9;
}

// SetMailDomain adds a domain to the mail server. The result of the job has "records": the
// DNS records that the owner of the domain adds (MX, SPF, DKIM and DMARC). DeleteMailDomain
// removes a domain with no mailboxes and no other addresses.
message MailDomainRequest {
  string job_id = 1;
  string domain = 2;
}

// SetMailbox makes a mailbox, or changes its size or its password.
message SetMailboxRequest {
  string job_id = 1;
  string domain = 2;
  // The part of the address before the @ sign.
  string local_part = 3;
  int64 quota_bytes = 4;
  // The hash of the password: bcrypt, or a crypt hash from an import (rule
  // "mailPasswordHash"). The agent never gets the password. Empty: the mailbox keeps its
  // password.
  string password_hash = 5;
  // True: the job sets the encryption of the mailbox. False: the encryption does not change.
  bool set_encryption = 6;
  // The OpenPGP public key of the owner of the mailbox, in ASCII armour. The mail server
  // encrypts each new message with it before it stores the message. Only the private key,
  // which the server never gets, can decrypt the message. Empty: the encryption is off.
  string public_key = 7;
  // True: the job writes the file with the private keys to the files of the mailbox. The
  // panel adds this field each time that it sends the job: the job record does not have it.
  bool set_key_file = 8;
  // The private keys that the panel made for the mailbox, in ASCII armour. Each key is
  // protected with the password of the mailbox. The PGP plugin of the webmail reads the file
  // with that password. Empty: the job removes the file.
  string private_keys = 9;
}

// DeleteMailbox removes a mailbox and its messages. DeleteMailAlias removes an alias or a
// forwarder.
message MailAddressRequest {
  string job_id = 1;
  string domain = 2;
  string local_part = 3;
}

// SetMailAlias makes an address with no mailbox. The mail server sends each message for the
// address to all destinations: an alias has one destination, a forwarder has a list.
message SetMailAliasRequest {
  string job_id = 1;
  string domain = 2;
  string local_part = 3;
  repeated string destinations = 4;
}

// Stops a database server and removes its data. The panel sends it only for a database
// server with no databases.
message DeleteDatabaseServerRequest {
  string job_id = 1;
  string database_server = 2;
}

message HealthCheck {
  // The status that each check expects. 0 accepts each status below 500, for example a redirect.
  int32 status = 1;
  double max_error_rate = 2;
  int32 seconds = 3;
}

// For CreateWebsite and SetRuntime.
message WebsiteRequest {
  string job_id = 1;
  Website website = 2;
  // SetRuntime: the agent goes back to this tag when the health check fails.
  string previous_tag = 3;
  string previous_image_id = 4;
  HealthCheck health_check = 5;
  // CreateWebsite: copy the files and databases of this website (a staging copy).
  string copy_from = 6;
  string copy_from_unix_user = 7;
  // CreateWebsite with copy_from: the databases to copy, and a new user for the copies.
  repeated DatabaseCopy copy_databases = 8;
  repeated DatabaseUserCopy copy_users = 9;
  // CreateWebsite with copy_from: the database servers of the copies. The agent makes a
  // database server that it does not have.
  repeated DatabaseServer database_servers = 10;
}

// A staging copy copies the database "from" of the source website into the new database "to".
message DatabaseCopy {
  string engine = 1;
  string from = 2;
  string to = 3;
  // The IDs of the database servers of the two databases.
  string from_server = 4;
  string to_server = 5;
}

// A new database user of the staging copy, with read-write access to all copies in its
// database server.
message DatabaseUserCopy {
  string engine = 1;
  string name = 2;
  string password = 3;
  // The ID of the database server of the user.
  string database_server = 4;
}

message DeleteWebsiteRequest {
  string job_id = 1;
  string website_id = 2;
  string unix_user = 3;
  // The agent also removes the databases and the database users of the website.
  repeated DatabaseRef databases = 4;
  repeated DatabaseRef database_users = 5;
}

message SetWebsitePowerRequest {
  string job_id = 1;
  string website_id = 2;
  string unix_user = 3;
  // "start", "stop" or "restart".
  string power = 4;
}

message SetLimitsRequest {
  string job_id = 1;
  string website_id = 2;
  string unix_user = 3;
  Limits limits = 4;
}

message DomainRequest {
  string job_id = 1;
  string website_id = 2;
  string unix_user = 3;
  string domain = 4;
  string kind = 5;
  string primary = 6;
}

// Each database and user name starts with the Unix user of the website and "_". The database
// is in a database server of the customer of the website. The agent makes a database server
// that it does not have.
message CreateDatabaseRequest {
  string job_id = 1;
  string website_id = 2;
  string unix_user = 3;
  // "mariadb" or "postgresql".
  string engine = 4;
  string name = 5;
  // Optional: a new user with read-write access to the database.
  string user = 6;
  string password = 7;
  // "website": only the website container can connect. "anywhere": any address, with TLS.
  string access = 8;
  DatabaseServer database_server = 9;
}

message DeleteDatabaseRequest {
  string job_id = 1;
  string website_id = 2;
  string engine = 3;
  string name = 4;
  string unix_user = 5;
  // The users with access to the database. The agent removes their access first.
  repeated string users = 6;
  // The ID of the database server of the database.
  string database_server = 7;
  // The ID of the customer of the website. It is necessary for a website of a different
  // server, which connects through the network of the customer.
  string customer = 8;
}

message DatabaseGrant {
  string database = 1;
  // "readonly" or "readwrite".
  string privileges = 2;
}

// Sets the full state of a database user: its password, where it can connect from, and its
// access to each database of the website in the database server of the user.
message SetDatabaseUserRequest {
  string job_id = 1;
  string website_id = 2;
  string unix_user = 3;
  string engine = 4;
  string name = 5;
  // Empty: keep the password.
  string password = 6;
  string access = 7;
  // True: make a new user. The job fails when the user exists.
  bool create = 8;
  repeated DatabaseGrant grants = 9;
  // All databases of the website in the database server of the user. The user has no access
  // to the others.
  repeated string website_databases = 10;
  DatabaseServer database_server = 11;
}

message DeleteDatabaseUserRequest {
  string job_id = 1;
  string website_id = 2;
  string unix_user = 3;
  string engine = 4;
  string name = 5;
  repeated string website_databases = 6;
  // The ID of the database server of the user.
  string database_server = 7;
  // The ID of the customer of the website. It is necessary for a website of a different
  // server.
  string customer = 8;
}

// A database or a database user of a website.
message DatabaseRef {
  string engine = 1;
  string name = 2;
  // The ID of its database server.
  string database_server = 3;
}

message BackupRequest {
  string job_id = 1;
  string website_id = 2;
  string unix_user = 3;
  string kind = 4;
  repeated DatabaseRef databases = 5;
  // The restic repository, for example "s3:s3.amazonaws.com/bucket/path" or "b2:bucket:path".
  string target = 6;
  // The environment variables of restic for the object storage, for example AWS_ACCESS_KEY_ID.
  map<string, string> credentials = 7;
  // When set, the agent removes the snapshots of the website that the policy does not keep (FR-902).
  Retention retention = 8;
  // True: the backup has only the dumps of the databases, not the files of the website. The
  // panel sends such a backup to the server of a database server when the website is on a
  // different server. The snapshot has the kind "<kind>-databases".
  bool databases_only = 9;
  // The ID of the customer of the website. It is necessary with databases_only: the agent
  // has no record of a website of a different server.
  string customer = 10;
}

// The snapshots of a website that the agent keeps. The policy applies to the snapshots of the
// same kind as the backup, so that the scheduled backups do not remove the manual backups.
message Retention {
  int32 daily = 1;
  int32 weekly = 2;
  int32 monthly = 3;
  // When more than 0, the agent also keeps this number of the newest snapshots.
  int32 last = 4;
}

// Removes the data that no snapshot uses from the repository (FR-902).
message PruneBackupsRequest {
  string job_id = 1;
  string target = 2;
  map<string, string> credentials = 3;
  // The IDs of deleted websites. The agent removes all their snapshots first.
  repeated string forget_website_ids = 4;
}

message RestoreRequest {
  string job_id = 1;
  string website_id = 2;
  string unix_user = 3;
  string snapshot_id = 4;
  // "website", "database", "mailbox" or "file".
  string scope = 5;
  // The database ("mariadb:name" or "postgresql:name"), the mailbox, or the file path.
  string item = 6;
  // The restic repository, for example "s3:s3.amazonaws.com/bucket/path" or "b2:bucket:path".
  string target = 7;
  // Scope "database": the SHA-256 hash of the dump at backup time.
  string dump_sha256 = 8;
  map<string, string> credentials = 9;
  // Scope "website": the agent removes the files of the website that are not in the snapshot.
  bool delete_extra = 10;
  // Scope "database": the ID of the database server of the database.
  string database_server = 11;
  // Scope "database": the ID of the customer of the website. It is necessary for a website
  // of a different server.
  string customer = 12;
}

// Sets the SFTP access of a website. The owner signs in as the Unix user of the website and sees
// only the files of the website.
message SetSftpRequest {
  string job_id = 1;
  string website_id = 2;
  string unix_user = 3;
  bool enabled = 4;
  // SFTP accepts SSH keys only. The agent locks the password of the user each time.
  reserved 5, 6;
  reserved "password", "remove_password";
  // The public SSH keys, one OpenSSH key in each item.
  repeated string authorized_keys = 7;
}

// Changes the settings of the host. The agent writes the units of all containers again and
// restarts them.
message ConfigureHostRequest {
  string job_id = 1;
  // "systrap" or "kvm" (FR-310).
  string gvisor_platform = 2;
}

// Changes the certificate method of the panel domain. Only the agent on the panel server accepts
// it. The agent reads the domain from the settings of the panel, not from the request.
message SetPanelCertificateRequest {
  string job_id = 1;
  // "internal" (the certificate authority of the panel) or "letsencrypt".
  string method = 2;
}

// The panel domains of the resellers. The edge proxy sends each of them to the panel, as the
// panel domain, and gets a TLS certificate for each of them: from Let's Encrypt for a public
// name, else from the certificate authority of the panel. The list is the full list: a domain
// that is not in it loses its route and its certificate policy.
message SetPanelBrandsRequest {
  string job_id = 1;
  repeated string domains = 2;
}

message SetPacksRequest {
  string job_id = 1;
  // All packs of the panel. A pack that the server has and that is not in the list goes.
  repeated Pack packs = 2;
}

message SetCertificatesRequest {
  string job_id = 1;
  // All certificates from the panel for this server.
  repeated EdgeCertificate certificates = 2;
}

// One certificate from the panel and the hosts of this server that use it.
message EdgeCertificate {
  // The ID of the certificate in the panel.
  string id = 1;
  // The domains of the websites of this server that use the certificate. The certificate is
  // valid for each of them.
  repeated string hosts = 2;
  // The certificate chain in PEM format: the certificate first, then the intermediate
  // certificates.
  string certificate_pem = 3;
  // The private key of the certificate in PEM format.
  string private_key_pem = 4;
}

// One pack: its manifest, its signature and the public key of its publisher.
message Pack {
  // The exact bytes of pack.json that the publisher signed. The agent checks them again.
  string manifest = 1;
  // The signature of the manifest in base64, as "cosign sign-blob" writes it. Empty for a
  // pack with no signature from the developer mode of the panel.
  string signature = 2;
  // The ECDSA P-256 public key of the publisher in PEM format. Empty with no signature.
  string public_key = 3;
}

// One other server that this server has an encrypted tunnel to.
message MeshPeer {
  // The ID of the other server in the panel.
  string server = 1;
  // The public key of the other server: 32 bytes in base64.
  string public_key = 2;
  // The secret key of this pair of servers: 32 bytes in base64. The panel makes it.
  string preshared_key = 3;
  // The public address and the UDP port of the other server, for example
  // "203.0.113.2:51820" or "[2001:db8::2]:51820".
  string endpoint = 4;
  // The mesh address of the other server.
  string address = 5;
  // The addresses of the network members on the other server that a website of this server
  // can connect to. The tunnel sends the traffic for these addresses to the other server.
  repeated string members = 6;
}

// One network member on this server: a database server with a name ("<name>.internal") and
// an address of the mesh range. The name and the address are the same on each server.
message NetworkMember {
  // The ID of the database server.
  string id = 1;
  // The member address.
  string address = 2;
  // The port that the member answers on: the usual port of its engine.
  int32 port = 3;
  // The mesh addresses of the other servers that have a website in a network of the member.
  // Only these servers can connect to the member through a tunnel.
  repeated string servers = 4;
}

// The name of one network member for a website.
message NetworkName {
  // The host name, for example "shop-db.internal".
  string name = 1;
  // The member address.
  string address = 2;
  // The port of the member.
  int32 port = 3;
}

// One website of this server, with the network members that it can connect to. The agent
// writes the names in the hosts file of the website container, and the firewall lets only
// this website connect to these members.
message NetworkWebsite {
  // The ID of the website.
  string id = 1;
  repeated NetworkName names = 2;
}

// The full mesh state of one server: its tunnels to other servers. The traffic between the
// servers goes through the public internet, and WireGuard encrypts it.
message Mesh {
  // The panel increases the version at each change. The agent reports the version that it has.
  int64 version = 1;
  // The address range of the mesh: a private IPv4 network, for example "10.207.0.0/16".
  string range = 2;
  // The mesh address of this server. An empty address with no peers takes the server out of
  // the mesh.
  string address = 3;
  // The UDP port of the tunnels on this server.
  int32 port = 4;
  repeated MeshPeer peers = 5;
  // The networks of the customers on this server. A server with no tunnel can have them:
  // then the request has the range, and no address and no peers.
  repeated NetworkMember members = 6;
  repeated NetworkWebsite websites = 7;
}

// Sets the tunnels of this server. The request always has the full state, so the agent can
// do the same job again. The agent refuses a key that is not 32 bytes, an address outside
// the mesh range, and a peer address that is not a public address.
message SetMeshRequest {
  string job_id = 1;
  Mesh mesh = 2;
}

// Makes a new tunnel key on this server. The result has the new public key ("publicKey").
// The private key does not leave the server. The tunnels of the server stop until each peer
// has the new public key (SetMesh).
message RotateMeshKeyRequest {
  string job_id = 1;
}

// The move of a database server to a different server, with the same ID, name and member
// address. The panel sends ReceiveDatabaseServer to the new server and SendDatabaseServer to
// the old server. The old server stops the database server and sends its data through the
// tunnel between the two servers, to the transfer port of the new server. The new server then
// starts the database server. The data of the old server stay until the panel sends
// DeleteDatabaseServer to it.
message SendDatabaseServerRequest {
  string job_id = 1;
  string database_server = 2;
  // "mariadb", "postgresql" or "valkey".
  string engine = 3;
  // The mesh address of the new server. It must be the address of a peer of this server.
  string to = 4;
  // The secret of this move: 64 hexadecimal characters. The new server accepts only a
  // connection that sends it first.
  string token = 5;
}

message ReceiveDatabaseServerRequest {
  string job_id = 1;
  // The database server with its port and its limits on this server.
  DatabaseServer database_server = 2;
  // The mesh address of the old server. It must be the address of a peer of this server.
  string from = 3;
  string token = 4;
  // The time that this server waits for the old server to connect, in seconds. 0 means 15
  // minutes. The data has no time limit, but a connection that sends nothing for 2 minutes
  // ends.
  int32 timeout_seconds = 5;
}

message HostRequest {
  string job_id = 1;
  // InstallHostUpdates: "security", "all", "manual" or "tools". "tools" updates only the
  // held container tools (FR-1113).
  string policy = 2;
}

message UpdateAgentRequest {
  string job_id = 1;
  string version = 2;
  // The agent refuses a version that is older than its own version, unless this is true.
  bool allow_downgrade = 3;
}

message GetStatusRequest {}

message PendingUpdate {
  string name = 1;
  string from = 2;
  string to = 3;
  bool security = 4;
}

message Service {
  string name = 1;
  // "running", "stopped" or "failed".
  string state = 2;
}

// One record of a DNS zone. The agent checks each field and writes the zone file itself: the
// panel sends no text of a zone file.
message DnsRecord {
  // The name in the zone: "@" for the zone itself, or labels such as "www" and "_dmarc".
  string name = 1;
  // "A", "AAAA", "CNAME", "MX", "TXT", "SRV", "CAA" or "NS".
  string type = 2;
  // In seconds, from 60 to 604800.
  int32 ttl = 3;
  // A: an IPv4 address. AAAA: an IPv6 address. CNAME, MX and NS: a host name with no dot at
  // the end. TXT: the text, with no quotation marks around it. SRV: "weight port target".
  // CAA: 'flags tag "value"'.
  string value = 4;
  // MX and SRV only.
  int32 priority = 5;
}

// A DNS zone with all its records. The zone has one or more NS records with the name "@": the
// first one is the primary name server in the SOA record.
message DnsZone {
  string name = 1;
  // The time of the last change, in seconds. The agent does not replace a zone with a zone
  // that has a smaller serial.
  int64 serial = 2;
  repeated DnsRecord records = 3;
  // The private DNSSEC key of the zone: an ECDSA P-256 key in the PKCS #8 PEM format. Empty
  // when DNSSEC is off. The DNS server then removes the keys and the signatures of the zone.
  string dnssec_key = 4;
  // The key tag of the key. The agent imports the key only when the DNS server does not
  // have a key with this tag.
  int32 dnssec_key_tag = 5;
}

// Writes DNS zones on this server, and starts the DNS server (the container cf-dns) if it
// does not operate. Each zone replaces the zone with the same name. The other zones stay.
message SetDnsZonesRequest {
  string job_id = 1;
  // At most 100 zones.
  repeated DnsZone zones = 2;
}

// Removes DNS zones from this server, with their DNSSEC keys. A zone that the server does
// not have is not an error.
message DeleteDnsZonesRequest {
  string job_id = 1;
  repeated string names = 2;
}

message HostStatus {
  string agent_version = 1;
  string kernel = 2;
  string podman_version = 3;
  string gvisor_version = 4;
  repeated PendingUpdate pending_updates = 5;
  bool reboot_required = 6;
  repeated Service services = 7;
}

// A cron job of a website: a command that the agent runs in the container of the website at
// the times of the schedule.
message CronJob {
  string id = 1;
  // Five fields: minute, hour, day of the month, month, day of the week. The time is UTC.
  string schedule = 2;
  // One line. The agent runs it with "sh -c" in the directory /app of the container.
  string command = 3;
  bool enabled = 4;
}

// SetCronJobs replaces all cron jobs of a website.
message SetCronJobsRequest {
  string job_id = 1;
  string website_id = 2;
  repeated CronJob cron_jobs = 3;
}

// RunCronJob runs the command of one cron job now.
message RunCronJobRequest {
  string job_id = 1;
  string website_id = 2;
  CronJob cron_job = 3;
}

// Deploy gets the code of a Git repository into a new release directory, runs the build
// commands, and starts the website from the new release with no stop. If a step fails, the
// website continues from the release that it had.
message DeployRequest {
  string job_id = 1;
  // The website with the document root of the new release, for example
  // "releases/<release_id>/public".
  Website website = 2;
  string release_id = 3;
  string repository = 4;
  string branch = 5;
  repeated string build_commands = 6;
  // The environment variables of the build commands. The agent does not keep them.
  map<string, string> secrets = 7;
  // The private SSH key for the repository, or empty. The agent does not keep it.
  string deploy_key = 8;
  HealthCheck health_check = 9;
  // The IDs of the earlier releases that stay on the server. The agent removes all other
  // release directories, but not the new release and not the release that the website had.
  repeated string keep_releases = 10;
  // The agent keeps the SSH key of the Git host from the first deploy of the website, and
  // refuses a host with a different key. True removes the stored keys before this deploy,
  // for a Git host that changed its key.
  bool forget_host_key = 11;
}

// ActivateRelease starts the website from a release that is on the server.
message ActivateReleaseRequest {
  string job_id = 1;
  // The website with the document root of the release.
  Website website = 2;
  string release_id = 3;
  HealthCheck health_check = 4;
}

// InstallDependencies runs the install command of a Node.js or Python website, for example
// "npm ci", in a build container in the application directory (the document root). Then it
// starts the website again with no stop, as SetRuntime does. If a step fails, the website
// continues with the container that it had.
message InstallDependenciesRequest {
  string job_id = 1;
  Website website = 2;
  // One command line for "sh -c".
  string command = 3;
  HealthCheck health_check = 4;
}

// For ListFiles, ReadFile, MakeDirectory and DeleteFile. The path starts with "/", which is
// the directory of the website, for example "/public/index.php".
message FileRequest {
  string website_id = 1;
  string path = 2;
}

message FileEntry {
  string name = 1;
  // "file", "directory", "link" or "other".
  string type = 2;
  int64 size_bytes = 3;
  // RFC 3339.
  string modified = 4;
  // The permission bits, for example "0640".
  string mode = 5;
  // The target of a link.
  string target = 6;
}

message FileList {
  repeated FileEntry entries = 1;
  // True when the directory has more entries than the agent gives.
  bool truncated = 2;
}

message FileContent {
  FileEntry file = 1;
  bytes content = 2;
}

message WriteFileRequest {
  string website_id = 1;
  string path = 2;
  bytes content = 3;
  // True refuses to replace a file.
  bool create_only = 4;
}

message MoveFileRequest {
  string website_id = 1;
  string from = 2;
  string to = 3;
}

message FileDeleted {}

message GetLogsRequest {
  string website_id = 1;
  // The maximum number of lines of each stream. 0 means 200.
  int32 lines = 2;
}

message LogLine {
  // RFC 3339.
  string at = 1;
  // "access" (standard output of the container) or "error" (standard error).
  string stream = 2;
  string text = 3;
}

message Logs {
  repeated LogLine lines = 1;
}

// InstallWordPress. The database and its user are new. The names start with the Unix user of
// the website (CF-01).
message InstallWordPressRequest {
  string job_id = 1;
  string website_id = 2;
  // A MariaDB database server of the customer, on this server. The agent makes it when it
  // does not have it.
  DatabaseServer database_server = 3;
  string database_name = 4;
  string database_user = 5;
  string database_password = 6;
  // The title of the site.
  string title = 7;
  // The first administrator.
  string admin_user = 8;
  string admin_email = 9;
  string admin_password = 10;
  // A WordPress locale, for example "en_GB".
  string locale = 11;
  // The address of the site: "https://" and the name of the website. The edge proxy can serve
  // the name later, when the owner verifies the domain.
  string url = 12;
}

message CheckWordPressRequest {
  string job_id = 1;
  string website_id = 2;
}

// UpdateWordPress. Each list has the names of the plugins or themes to update.
message UpdateWordPressRequest {
  string job_id = 1;
  string website_id = 2;
  // "": no update of WordPress. "minor": the latest version with the same major version, for
  // example 6.8.1 to 6.8.3. "latest": the latest version.
  string core = 3;
  repeated string plugins = 4;
  repeated string themes = 5;
  // The database of the site, for the restore point. With no database, the restore point has
  // only the files.
  DatabaseRef database = 6;
  HealthCheck health_check = 7;
}

message RestoreWordPressRequest {
  string job_id = 1;
  string website_id = 2;
  // The database of the site. The agent loads the dump of the restore point into it.
  DatabaseRef database = 3;
}

// RunWpCli. The arguments come after "wp", for example ["plugin", "list"]. The agent adds
// --path with the document root of the website.
message RunWpCliRequest {
  string job_id = 1;
  string website_id = 2;
  repeated string args = 3;
}

// Downloads the backup archive of an import to this server. The result has "sha256" and
// "bytes". With inspect, the result also has "account": the description of the account in the
// format "cf-account/1".
message FetchImportRequest {
  string job_id = 1;
  string import_id = 2;
  // An HTTPS URL of the archive. Empty: the agent downloads the upload of the import from the
  // panel (/api/agent/v1/imports/{id}/archive).
  string url = 3;
  // The SHA-256 hash that the archive must have. Empty for the first download of the archive.
  string sha256 = 4;
  // The largest size of the archive, in bytes.
  int64 max_bytes = 5;
  bool inspect = 6;
}

// Copies the files of one website from the archive into the directory of the website, as the
// Unix user of the website. The result has "files", "bytes", "skipped" and "rewritten".
message ImportFilesRequest {
  string job_id = 1;
  string import_id = 2;
  string website_id = 3;
  string unix_user = 4;
  // The directory in the archive. A part of the path with the name of a tar archive goes into
  // that nested archive.
  string path = 5;
  // Directories in path that the agent does not copy.
  repeated string exclude = 6;
  // The agent removes all files of the website first.
  bool replace = 7;
  // A WordPress configuration file (relative to path) whose database settings change to
  // wordpress_values: DB_NAME, DB_USER, DB_PASSWORD and DB_HOST.
  string wordpress_config = 8;
  map<string, string> wordpress_values = 9;
}

// Loads a database dump of the archive into a database of a website. The database is empty
// first, as for a restore.
message ImportDatabaseRequest {
  string job_id = 1;
  string import_id = 2;
  string website_id = 3;
  string unix_user = 4;
  // "mariadb".
  string engine = 5;
  string name = 6;
  // The dump in the archive: plain SQL, or SQL in gzip, bzip2 or zstd.
  string path = 7;
  // The ID of the database server of the database.
  string database_server = 8;
  // The ID of the customer of the website. It is necessary for a website of a different server.
  string customer = 9;
}

// Copies the messages of Maildir folders in the archive into mailboxes of the mail server. A
// job that runs again does not copy a message two times. The result has "messages" (the
// number of messages that the job copied) and "failed" for each address.
message ImportMailRequest {
  string job_id = 1;
  string import_id = 2;
  repeated ImportMailbox mailboxes = 3;
}

message ImportMailbox {
  string domain = 1;
  string local_part = 2;
  // The Maildir in the archive.
  string path = 3;
}

// Removes the archive of an import and the records of its jobs from this server.
message DeleteImportRequest {
  string job_id = 1;
  string import_id = 2;
}
