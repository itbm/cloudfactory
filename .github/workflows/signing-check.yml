# Checks that the signing key in the repository secrets agrees with cosign.pub. It signs a
# test file in the same way as the release workflow, and then verifies the signature with
# cosign.pub. It does not publish anything. Refer to docs/releasing.md.
#
# Secrets:
#   COSIGN_PRIVATE_KEY  The private key that matches cosign.pub in the repository root.
#   COSIGN_PASSWORD     The password of the private key.
name: Signing check

on:
  workflow_dispatch:
  # Pull requests from forks do not get the secrets, so the check fails for them.
  pull_request:
    paths:
      - cosign.pub
      - .github/workflows/signing-check.yml
  push:
    branches: [main]
    paths:
      - cosign.pub
      - .github/workflows/signing-check.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The same cosign release as the release workflow.
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v2.5.2
      - name: Sign a test file and verify it with cosign.pub
        env:
          COSIGN_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          set -eu
          test -s cosign.pub || { echo "::error::cosign.pub is missing. See docs/releasing.md."; exit 1; }
          test -n "$COSIGN_KEY" || { echo "::error::The secret COSIGN_PRIVATE_KEY is not set. See docs/releasing.md."; exit 1; }
          test -n "$COSIGN_PASSWORD" || { echo "::error::The secret COSIGN_PASSWORD is not set. See docs/releasing.md."; exit 1; }
          work=$(mktemp -d)
          printf 'Signing check for %s, run %s\n' "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > "$work/check.txt"
          cosign sign-blob --yes --key env://COSIGN_KEY --tlog-upload=false --output-signature "$work/check.txt.sig" "$work/check.txt"
          # The release workflow signs files with no transparency log entry, so do not look for one.
          cosign verify-blob --key cosign.pub --insecure-ignore-tlog=true --signature "$work/check.txt.sig" "$work/check.txt"
          # The installation script, the agent and the panel verify with OpenSSL or Go, not cosign.
          base64 -d "$work/check.txt.sig" > "$work/check.txt.der"
          openssl dgst -sha256 -verify cosign.pub -signature "$work/check.txt.der" "$work/check.txt"
          echo "The signing key agrees with cosign.pub:"
          openssl pkey -pubin -in cosign.pub -outform DER | sha256sum | cut -d' ' -f1
