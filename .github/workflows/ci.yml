name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web panel
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npm run build

  api:
    name: Panel API (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.4']
    defaults:
      run:
        working-directory: api
    # A server keeps the data of the panel in PostgreSQL (docs/decisions.md). This is the same
    # PostgreSQL release as images/postgresql.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: cloudfactory
          POSTGRES_PASSWORD: cloudfactory
          POSTGRES_DB: cloudfactory_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cloudfactory -d cloudfactory_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, pdo_pgsql, openssl, intl
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: ./vendor/bin/pint --test
      # SQLite in memory: the fast run, and the engine of a developer.
      - run: php artisan test
      # PostgreSQL: the engine of a server. It checks the length of text, the range of numbers
      # and the case of letters in a different way.
      - name: Run the tests with PostgreSQL
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: '5432'
          DB_DATABASE: cloudfactory_test
          DB_USERNAME: cloudfactory
          DB_PASSWORD: cloudfactory
        run: php artisan test

  agent:
    name: Agent
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # R-05: the same Go release as the toolchain line in go.mod.
          go-version: '1.27.3'
          cache-dependency-path: agent/go.sum
      - uses: bufbuild/buf-action@37ac33d8960807670a6e9719080e885197b09cc6 # v1.7.0
        with:
          setup_only: true
      - name: Check the protocol and the generated code
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.9
          go install connectrpc.com/connect/cmd/protoc-gen-connect-go@v1.19.0
          buf lint
          buf generate
          git diff --exit-code -- gen
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      - name: Build for x86-64 and ARM64
        run: |
          GOARCH=amd64 CGO_ENABLED=0 go build -o /dev/null ./cmd/cf-agent
          GOARCH=arm64 CGO_ENABLED=0 go build -o /dev/null ./cmd/cf-agent

  cli:
    name: CLI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...

  # R-10: known vulnerabilities in the dependencies and the Go standard library. The image scans
  # do not see the Go binaries clearly, so the source code is checked here.
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache-dependency-path: agent/go.sum
      - name: govulncheck (agent and CLI)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          (cd agent && govulncheck ./...)
          (cd cli && govulncheck ./...)
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          coverage: none
      - name: composer audit (panel API)
        working-directory: api
        run: composer audit --locked --no-interaction
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: npm audit (web panel)
        working-directory: web
        run: npm audit --package-lock-only

  install:
    name: Installation script
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: shellcheck -s sh install/install.sh install/test.sh images/apache-php-fpm/start.sh images/panel-api/start.sh images/sftp/start.sh
      - run: sh install/test.sh
      - run: dash install/test.sh
