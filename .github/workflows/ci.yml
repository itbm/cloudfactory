name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # On a pull request, a job runs only when the files that it tests change. A change to this
  # workflow runs all jobs. A push to main runs all jobs.
  changes:
    name: Select the jobs
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.select.outputs.web }}
      api: ${{ steps.select.outputs.api }}
      agent: ${{ steps.select.outputs.agent }}
      cli: ${{ steps.select.outputs.cli }}
      audit: ${{ steps.select.outputs.audit }}
      install: ${{ steps.select.outputs.install }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The merge commit of the pull request and its first parent, the base branch.
          fetch-depth: 2
      - name: Select the jobs with changed files
        id: select
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -eu
          if [ "$EVENT" = pull_request ]; then
            git diff --name-only HEAD^1 HEAD >"$RUNNER_TEMP/changed"
          else
            echo .github/workflows/ci.yml >"$RUNNER_TEMP/changed"
          fi
          # want JOB PATTERN...: the job runs when a changed file matches a pattern.
          want() {
            job=$1
            shift
            if grep -qE "^(\.github/workflows/ci\.yml\$|$(IFS='|'; echo "$*"))" "$RUNNER_TEMP/changed"; then
              echo "$job=true" >>"$GITHUB_OUTPUT"
              echo "$job: runs"
            else
              echo "$job=false" >>"$GITHUB_OUTPUT"
              echo "$job: skipped"
            fi
          }
          want web 'web/' 'plugins/'
          # The API tests read the OpenAPI document, the schema, the plugins and the web fixtures.
          want api 'api/' 'openapi/' 'schema/' 'plugins/' 'web/src/test/fixtures/'
          # The agent tests read the schema, the input rules of the API, install.sh and the packs.
          want agent 'agent/' 'schema/' 'api/app/Validation/InputRules\.php$' 'install/install\.sh$' 'plugins/packs/'
          want cli 'cli/'
          want audit 'agent/' 'cli/' 'api/composer\.' 'web/package'
          want install 'install/' 'images/' 'plugins/packs/'

  web:
    name: Web panel
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npm run build
      - name: Test the Cloudflare DNS plugin
        run: node --test test/*.test.mjs
        working-directory: plugins/dns-cloudflare
      - name: Test the DigitalOcean DNS plugin
        run: node --test test/*.test.mjs
        working-directory: plugins/dns-digitalocean
      - name: Test the Hetzner DNS plugin
        run: node --test test/*.test.mjs
        working-directory: plugins/dns-hetzner
      - name: Test the PowerDNS plugin
        run: node --test test/*.test.mjs
        working-directory: plugins/dns-powerdns
      - name: Test the Route 53 DNS plugin
        run: node --test test/*.test.mjs
        working-directory: plugins/dns-route53

  api:
    name: Panel API (PHP ${{ matrix.php }})
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.4']
    defaults:
      run:
        working-directory: api
    # A server keeps the data of the panel in PostgreSQL (docs/decisions.md). This is the same
    # PostgreSQL release as images/postgresql.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: cloudfactory
          POSTGRES_PASSWORD: cloudfactory
          POSTGRES_DB: cloudfactory_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cloudfactory -d cloudfactory_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, pdo_pgsql, openssl, intl
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: ./vendor/bin/pint --test --parallel
      # SQLite in memory: the fast run, and the engine of a developer. --parallel runs one test
      # process for each CPU.
      - run: php artisan test --parallel
      # PostgreSQL: the engine of a server. It checks the length of text, the range of numbers
      # and the case of letters in a different way.
      - name: Run the tests with PostgreSQL
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: '5432'
          DB_DATABASE: cloudfactory_test
          DB_USERNAME: cloudfactory
          DB_PASSWORD: cloudfactory
        # Each test process makes its own database (cloudfactory_test_test_1 and so on).
        run: php artisan test --parallel

  agent:
    name: Agent
    needs: changes
    if: needs.changes.outputs.agent == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # R-05: the same Go release as the toolchain line in go.mod.
          go-version: '1.27.4'
          cache-dependency-path: agent/go.sum
      - uses: bufbuild/buf-action@37ac33d8960807670a6e9719080e885197b09cc6 # v1.7.0
        with:
          setup_only: true
      - name: Check the protocol and the generated code
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.9
          go install connectrpc.com/connect/cmd/protoc-gen-connect-go@v1.19.0
          buf lint
          buf generate
          git diff --exit-code -- gen
      # The input rules of the agent and of the panel API come from schema/input-rules.json.
      - name: Check that the generated input rules are current
        run: |
          go run ./cmd/cf-rules
          git diff --exit-code -- internal/validate/rules_gen.go ../api/app/Validation/InputRules.php
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      # The DNS actions have a test with a real Knot DNS server: Knot must accept the
      # configuration and the zone files of the agent (internal/actions/dns_knot_test.go).
      - name: Test the DNS actions with Knot DNS
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends knot knot-dnsutils
          # Knot DNS 3.5 and later have keymgr in a different package.
          command -v keymgr >/dev/null || sudo apt-get install -y --no-install-recommends knot-keymgr
          sudo systemctl stop knot.service || true
          CF_TEST_KNOT=1 go test ./internal/actions -run '^TestKnotServer' -count=1
      - name: Build for x86-64 and ARM64
        run: |
          GOARCH=amd64 CGO_ENABLED=0 go build -o /dev/null ./cmd/cf-agent
          GOARCH=arm64 CGO_ENABLED=0 go build -o /dev/null ./cmd/cf-agent

  cli:
    name: CLI
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.4'
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...

  # R-10: known vulnerabilities in the dependencies and the Go standard library. The image scans
  # do not see the Go binaries clearly, so the source code is checked here.
  audit:
    name: Dependency audit
    needs: changes
    if: needs.changes.outputs.audit == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.4'
          cache-dependency-path: agent/go.sum
      - name: govulncheck (agent and CLI)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          (cd agent && govulncheck ./...)
          (cd cli && govulncheck ./...)
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          coverage: none
      - name: composer audit (panel API)
        working-directory: api
        run: composer audit --locked --no-interaction
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: npm audit (web panel)
        working-directory: web
        run: npm audit --package-lock-only

  install:
    name: Installation script
    needs: changes
    if: needs.changes.outputs.install == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: shellcheck -s sh install/install.sh install/test.sh images/apache-php-fpm/start.sh images/panel-api/start.sh images/sftp/start.sh images/mariadb/cf-manage plugins/packs/golang/cf-app plugins/packs/mysql/cf-start plugins/packs/mysql/test.sh
      - run: sh install/test.sh
      - run: dash install/test.sh
