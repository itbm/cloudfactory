# Builds the images on a pull request that changes them. The release workflow publishes them.
name: Images

on:
  pull_request:
    paths:
      - images/**
      - api/**
      - web/**
      # The test of the Valkey image uses the access rules and the server options of the agent.
      - agent/internal/actions/valkey*.go
      - agent/internal/quadlet/quadlet.go
      # The panel API image has the terminal relay.
      - agent/cmd/cf-terminal-relay/**
      - agent/internal/relay/**
      - agent/internal/wsock/**
      - agent/go.mod
      - agent/go.sum
      # The panel-api image has the OpenAPI document. The panel images use .dockerignore.
      - openapi/openapi.yaml
      - .dockerignore
      - .github/workflows/images.yml

permissions:
  contents: read

# A new push to a pull request stops the builds of the earlier push.
concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Each image builds only when its files change. A change to this workflow builds all images.
  changes:
    name: Select the images
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.select.outputs.images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The merge commit of the pull request and its first parent, the base branch.
          fetch-depth: 2
      - name: Select the images with changed files
        id: select
        env:
          # The files of each image are the paths that start with an item of "paths".
          IMAGES: |
            [
              { "image": "frankenphp-php8.4", "context": "images/frankenphp", "file": "images/frankenphp/Containerfile", "args": "PHP_VERSION=8.4", "paths": ["images/frankenphp/"] },
              { "image": "frankenphp-php8.5", "context": "images/frankenphp", "file": "images/frankenphp/Containerfile", "args": "PHP_VERSION=8.5", "paths": ["images/frankenphp/"] },
              { "image": "apache-php8.4", "context": "images/apache-php-fpm", "file": "images/apache-php-fpm/Containerfile", "args": "PHP_VERSION=8.4", "paths": ["images/apache-php-fpm/"] },
              { "image": "node22", "context": "images/node", "file": "images/node/Containerfile", "args": "NODE_VERSION=22", "paths": ["images/node/"] },
              { "image": "node24", "context": "images/node", "file": "images/node/Containerfile", "args": "NODE_VERSION=24", "paths": ["images/node/"] },
              { "image": "node26", "context": "images/node", "file": "images/node/Containerfile", "args": "NODE_VERSION=26", "paths": ["images/node/"] },
              { "image": "python3.13", "context": "images/python", "file": "images/python/Containerfile", "args": "PYTHON_VERSION=3.13", "paths": ["images/python/"] },
              { "image": "python3.14", "context": "images/python", "file": "images/python/Containerfile", "args": "PYTHON_VERSION=3.14", "paths": ["images/python/"] },
              { "image": "edge", "context": "images/edge", "file": "images/edge/Containerfile", "args": "", "paths": ["images/edge/"] },
              { "image": "sftp", "context": "images/sftp", "file": "images/sftp/Containerfile", "args": "", "paths": ["images/sftp/"] },
              { "image": "adminer", "context": "images/adminer", "file": "images/adminer/Containerfile", "args": "", "paths": ["images/adminer/"] },
              { "image": "dns", "context": "images/dns", "file": "images/dns/Containerfile", "args": "", "paths": ["images/dns/"] },
              { "image": "panel-api", "context": ".", "file": "images/panel-api/Containerfile", "args": "", "paths": ["images/panel-api/", "api/", "openapi/openapi.yaml", ".dockerignore", "agent/cmd/cf-terminal-relay/", "agent/internal/relay/", "agent/internal/wsock/", "agent/go.mod", "agent/go.sum"] },
              { "image": "panel-web", "context": ".", "file": "images/panel-web/Containerfile", "args": "", "paths": ["images/panel-web/", "web/", ".dockerignore"] },
              { "image": "mariadb", "context": "images/mariadb", "file": "images/mariadb/Containerfile", "args": "", "paths": ["images/mariadb/"] },
              { "image": "postgresql", "context": "images/postgresql", "file": "images/postgresql/Containerfile", "args": "", "paths": ["images/postgresql/"] },
              { "image": "valkey", "context": "images/valkey", "file": "images/valkey/Containerfile", "args": "", "paths": ["images/valkey/", "agent/internal/actions/valkey", "agent/internal/quadlet/quadlet.go"] },
              { "image": "mail", "context": "images/mail", "file": "images/mail/Containerfile", "args": "", "paths": ["images/mail/"] },
              { "image": "mail-keep", "context": "images/mail-keep", "file": "images/mail-keep/Containerfile", "args": "", "paths": ["images/mail-keep/"] },
              { "image": "webmail", "context": "images/webmail", "file": "images/webmail/Containerfile", "args": "", "paths": ["images/webmail/"] },
              { "image": "scan", "context": "images/scan", "file": "images/scan/Containerfile", "args": "", "paths": ["images/scan/"] }
            ]
        run: |
          set -eu
          git diff --name-only HEAD^1 HEAD >"$RUNNER_TEMP/changed"
          images=$(jq -c --rawfile changed "$RUNNER_TEMP/changed" '
            ($changed | split("\n") | map(select(. != ""))) as $files
            | map((.paths + [".github/workflows/images.yml"]) as $paths
              | select(any($files[]; . as $file | any($paths[]; . as $path | $file | startswith($path))))
              | del(.paths))' <<<"$IMAGES")
          echo "Images to build: $(jq -r 'map(.image) | join(", ")' <<<"$images")"
          echo "images=$images" >>"$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.image }}
    needs: changes
    if: needs.changes.outputs.images != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.images) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          build-args: ${{ matrix.args }}
          load: true
          tags: ${{ matrix.image }}:test
      # The Valkey image has a test with the agent code: the rules that keep a website in its
      # own Valkey database (agent/internal/actions/valkey_server_test.go).
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: matrix.image == 'valkey'
        with:
          go-version: '1.27.4'
          cache-dependency-path: agent/go.sum
      - uses: bufbuild/buf-action@37ac33d8960807670a6e9719080e885197b09cc6 # v1.7.0
        if: matrix.image == 'valkey'
        with:
          setup_only: true
      # Audit batch 2, findings 1 and 2: start the image with the limits of its unit, and send a
      # request. A file capability or a missing configuration file stops the container.
      - name: Start the image with no capabilities
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          set -eu
          if [ "$IMAGE" = mariadb ] || [ "$IMAGE" = postgresql ]; then
            # The settings of quadlet.DatabaseUnit. The Unix user of the database server owns
            # the data directory (mode 0700) on a server. That user is the user 999 in the
            # container, which is the database user of the image. The container has no
            # capability.
            data="$RUNNER_TEMP/db"
            sudo install -d -o 999 -g 999 -m 0700 "$data"
            caps="--cap-drop=all --user 999:999"
            if [ "$IMAGE" = mariadb ]; then
              # shellcheck disable=SC2086 # caps holds several options.
              docker run -d --name smoke $caps --security-opt no-new-privileges --read-only --tmpfs /tmp --tmpfs /run/mysqld:mode=1777 \
                -v "$data:/var/lib/mysql" -e MARIADB_ROOT_PASSWORD=smoke -e MYSQL_PWD=smoke -e MARIADB_ROOT_HOST=localhost \
                -e MARIADB_AUTO_UPGRADE=1 mariadb:test
              query() { docker exec smoke mariadb --user=root --skip-column-names --execute='SELECT VERSION()'; }
              marker=mysql
            else
              # shellcheck disable=SC2086 # caps holds several options.
              docker run -d --name smoke $caps --security-opt no-new-privileges --read-only --tmpfs /tmp --tmpfs /var/run/postgresql:mode=1777 \
                --shm-size 256m -v "$data:/var/lib/postgresql/data" -e POSTGRES_PASSWORD=smoke \
                -e 'POSTGRES_INITDB_ARGS=--auth-host=scram-sha-256 --auth-local=trust' postgresql:test
              query() { docker exec smoke psql --username=postgres --tuples-only --no-align --command='SELECT version()'; }
              marker=PG_VERSION
            fi
            version=""
            for _ in $(seq 1 60); do
              version=$(query 2>/dev/null || true)
              [ -n "$version" ] && break
              sleep 2
            done
            docker logs smoke
            docker inspect -f '{{.State.Running}}' smoke | grep -q true
            echo "server version: $version"
            [ -n "$version" ]
            # The data files are in the mount, not in a directory of the container.
            sudo test -e "$data/$marker"
            exit 0
          fi
          if [ "$IMAGE" = valkey ]; then
            # The settings of quadlet.DatabaseUnit and the user file of the agent: the
            # administrator with the hash of its password. Then the tests of the agent make
            # Valkey databases on this server, and check that a user stays in its database.
            # The user 999 of the container owns the data directory and the user file, and the
            # container has no capability.
            data="$RUNNER_TEMP/valkey"
            sudo install -d -o 999 -g 999 -m 0700 "$data"
            printf 'user default on #%s ~* &* +@all\n' "$(printf %s smoke-password | sha256sum | cut -d' ' -f1)" | sudo tee "$data/users.acl" >/dev/null
            sudo chown 999:999 "$data/users.acl"
            sudo chmod 0600 "$data/users.acl"
            docker run -d --name smoke --cap-drop=all --user 999:999 \
              --security-opt no-new-privileges --read-only --tmpfs /tmp -p 127.0.0.1:16379:6379 -v "$data:/data" valkey:test \
              valkey-server --bind 0.0.0.0 --port 6379 --databases 1024 --aclfile /data/users.acl --appendonly yes --save "" --maxmemory 64mb --maxmemory-policy allkeys-lru
            ready() { timeout 5 bash -c 'exec 3<>/dev/tcp/127.0.0.1/16379 && printf "PING\r\n" >&3 && head -c 7 <&3' 2>/dev/null | grep -q NOAUTH; }
            wait_ready() {
              for _ in $(seq 1 30); do
                if ready; then return 0; fi
                sleep 2
              done
              docker logs smoke
              return 1
            }
            wait_ready
            export CF_TEST_VALKEY=127.0.0.1:16379 CF_TEST_VALKEY_PASSWORD=smoke-password
            # The Go code of the agent protocol is not in Git.
            (cd agent && buf generate)
            (cd agent && go test ./internal/actions -run '^TestValkeyServer$' -count=1 -v)
            # Valkey writes the append-only file each second. After a restart, it has the users
            # and the data.
            sleep 3
            docker restart smoke
            wait_ready
            (cd agent && CF_TEST_VALKEY_RESTARTED=1 go test ./internal/actions -run '^TestValkeyServerAfterRestart$' -count=1 -v)
            docker logs smoke
            docker inspect -f '{{.State.Running}}' smoke | grep -q true
            # The data files are in the mount, not in a directory of the container.
            sudo test -d "$data/appendonlydir"
            exit 0
          fi
          if [ "$IMAGE" = mail ]; then
            # The limits of quadlet.MailUnit, with config.json as the agent writes it. Stalwart
            # starts in the recovery mode and answers on its HTTP port.
            mkdir -p "$RUNNER_TEMP/mail/etc" "$RUNNER_TEMP/mail/data"
            printf '%s\n' '{"@type":"RocksDb","path":"/var/lib/stalwart/"}' >"$RUNNER_TEMP/mail/etc/config.json"
            sudo chown 2000:2000 "$RUNNER_TEMP/mail/data"
            docker run -d --name smoke --cap-drop=all --security-opt no-new-privileges --read-only --tmpfs /tmp \
              -v "$RUNNER_TEMP/mail/etc/config.json:/etc/stalwart/config.json:ro" -v "$RUNNER_TEMP/mail/data:/var/lib/stalwart" \
              -e STALWART_RECOVERY_MODE=1 -e "STALWART_RECOVERY_ADMIN=admin:$(openssl rand -hex 24)" \
              -p 127.0.0.1:18080:8080 mail:test
            code=000
            for _ in $(seq 1 30); do
              code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/ || true)
              [ "$code" != 000 ] && break
              sleep 2
            done
            docker logs smoke
            docker inspect -f '{{.State.Running}}' smoke | grep -q true
            [ "$code" != 000 ]
            # The rules of the spam filter are in the image, and the mail server can read them.
            docker exec smoke gzip -t /usr/local/share/stalwart/spam-filter-rules.json.gz
            exit 0
          fi
          if [ "$IMAGE" = mail-keep ]; then
            # The limits of quadlet.MailKeepUnit. A member needs the keys of the other members,
            # so this check starts the program only to print its options.
            docker run --rm --cap-drop=all --security-opt no-new-privileges --read-only mail-keep:test --help
            exit 0
          fi
          if [ "$IMAGE" = scan ]; then
            # The limits of a scan (actions.scanFiles): a user that is not root, no network, and
            # the website and the signatures read-only. The check does not get the signatures
            # from database.clamav.net. A signature of the hash of the EICAR test file finds it.
            mkdir -p "$RUNNER_TEMP/scan/site/public" "$RUNNER_TEMP/scan/sigs"
            # The text is in two parts, so that a scanner does not find this workflow file.
            printf '%s%s' 'X5O!P%@AP[4\PZX54(P^)7CC)7}$EICAR' '-STANDARD-ANTIVIRUS-TEST-FILE!$H+H*' >"$RUNNER_TEMP/scan/site/public/eicar.php"
            echo '<?php echo "ok";' >"$RUNNER_TEMP/scan/site/public/index.php"
            echo "$(md5sum <"$RUNNER_TEMP/scan/site/public/eicar.php" | cut -d' ' -f1):68:Cf.Test.Eicar" >"$RUNNER_TEMP/scan/sigs/test.hdb"
            chmod -R a+rX "$RUNNER_TEMP/scan"
            set +e
            out=$(docker run --rm --user 1001:1001 --network=none --cap-drop=all --security-opt no-new-privileges --read-only --tmpfs /tmp \
              -v "$RUNNER_TEMP/scan/site:/scan:ro" -v "$RUNNER_TEMP/scan/sigs:/var/lib/clamav:ro" \
              scan:test clamscan --recursive --infected --stdout --tempdir=/tmp --database=/var/lib/clamav /scan)
            code=$?
            set -e
            echo "$out"
            # clamscan ends with 1 when it finds malware.
            [ "$code" = 1 ]
            echo "$out" | grep -qx '/scan/public/eicar.php: Cf.Test.Eicar.UNOFFICIAL FOUND'
            echo "$out" | grep -qx 'Infected files: 1'
            docker run --rm --user 1001:1001 --network=none --read-only scan:test freshclam --version
            exit 0
          fi
          if [ "$IMAGE" = webmail ]; then
            # The limits of quadlet.WebmailUnit. The start script installs the pinned PGP plugin,
            # and the webmail answers.
            printf '%s\n' HOSTNAME=0.0.0.0 PORT=3000 JMAP_SERVER_URL=https://mail.example.com STALWART_FEATURES=true \
              "SESSION_SECRET=$(openssl rand -hex 32)" "ADMIN_PASSWORD=$(openssl rand -hex 32)" \
              BULWARK_TELEMETRY=off BULWARK_UPDATE_CHECK=off STALWART_ADMIN_ACCESS=off >"$RUNNER_TEMP/webmail.env"
            docker run -d --name smoke --cap-drop=all --security-opt no-new-privileges --read-only --tmpfs /tmp \
              -v /app/data --env-file "$RUNNER_TEMP/webmail.env" -p 127.0.0.1:18080:3000 webmail:test
            ok=""
            for _ in $(seq 1 60); do
              if docker logs smoke 2>&1 | grep -q 'cf-webmail: installed the PGP plugin'; then ok=1; break; fi
              sleep 2
            done
            docker logs smoke
            docker inspect -f '{{.State.Running}}' smoke | grep -q true
            [ -n "$ok" ]
            # /api/health/ready also needs the mail server, which this check does not start.
            curl -sf -o /dev/null http://127.0.0.1:18080/api/health/live
            exit 0
          fi
          if [ "$IMAGE" = dns ]; then
            # The limits of quadlet.DnsUnit, with a configuration and a zone as the agent writes
            # them. Knot loads the zone and answers a query for it.
            mkdir -p "$RUNNER_TEMP/dns/etc/zones" "$RUNNER_TEMP/dns/db"
            printf '%s\n' 'server:' '    rundir: "/run/knot"' '    listen: 0.0.0.0@8053' 'database:' '    storage: "/var/lib/knot"' \
              'template:' '  - id: default' '    storage: "/etc/knot/zones"' '    file: "%s.zone"' '    zonefile-sync: -1' \
              '    zonefile-load: whole' '    journal-content: none' 'zone:' '  - domain: example.com.' >"$RUNNER_TEMP/dns/etc/knot.conf"
            printf '%s\n' '$ORIGIN example.com.' '$TTL 3600' '@ 3600 IN SOA ns1.example.com. hostmaster.example.com. 1 3600 900 1209600 300' \
              '@ 3600 IN NS ns1.example.com.' 'ns1 3600 IN A 203.0.113.10' >"$RUNNER_TEMP/dns/etc/zones/example.com.zone"
            sudo chown -R root:root "$RUNNER_TEMP/dns"
            docker run -d --name smoke --cap-drop=all --security-opt no-new-privileges --read-only --tmpfs /run/knot --tmpfs /tmp \
              -v "$RUNNER_TEMP/dns/etc:/etc/knot:ro" -v "$RUNNER_TEMP/dns/db:/var/lib/knot" dns:test
            answer=""
            for _ in $(seq 1 30); do
              answer=$(docker exec smoke kdig @127.0.0.1 -p 8053 +short ns1.example.com A 2>/dev/null || true)
              [ "$answer" = "203.0.113.10" ] && break
              sleep 2
            done
            docker logs smoke
            docker inspect -f '{{.State.Running}}' smoke | grep -q true
            [ "$answer" = "203.0.113.10" ]
            exit 0
          fi
          if [ "$IMAGE" = sftp ]; then
            # The capabilities of quadlet.SftpUnit. sshd makes the host keys and answers with
            # its version line.
            mkdir -p "$RUNNER_TEMP/sftp/sites" "$RUNNER_TEMP/sftp/keys" "$RUNNER_TEMP/sftp/users" "$RUNNER_TEMP/sftp/host-keys"
            # Root owns these directories on a server (the agent makes them). With no DAC_OVERRIDE,
            # root in the container cannot write the host keys to a directory of the runner user.
            sudo chown root:root "$RUNNER_TEMP/sftp/sites" "$RUNNER_TEMP/sftp/keys" "$RUNNER_TEMP/sftp/users" "$RUNNER_TEMP/sftp/host-keys"
            sudo chmod 0700 "$RUNNER_TEMP/sftp/host-keys"
            docker run -d --name smoke --cap-drop=all --cap-add SYS_CHROOT --cap-add SETUID --cap-add SETGID --cap-add KILL \
              --security-opt no-new-privileges --read-only --tmpfs /run --tmpfs /tmp -p 127.0.0.1:12200:2200 \
              -v "$RUNNER_TEMP/sftp/sites:/srv/cloudfactory/sites" -v "$RUNNER_TEMP/sftp/keys:/etc/cloudfactory/sftp:ro" \
              -v "$RUNNER_TEMP/sftp/users:/var/lib/extrausers:ro" -v "$RUNNER_TEMP/sftp/host-keys:/etc/ssh/keys" sftp:test
            banner=""
            for _ in $(seq 1 30); do
              banner=$(timeout 5 bash -c 'exec 3<>/dev/tcp/127.0.0.1/12200 && head -c 8 <&3' 2>/dev/null || true)
              [ "$banner" = "SSH-2.0-" ] && break
              sleep 2
            done
            docker logs smoke
            docker inspect -f '{{.State.Running}}' smoke | grep -q true
            [ "$banner" = "SSH-2.0-" ]
            exit 0
          fi
          if [ "$IMAGE" = panel-api ]; then
            # The settings of quadlet.PanelUnits: PostgreSQL, and the HTTPS port for the agent on
            # the panel server with the certificate of the panel (audit findings B2 and B4).
            work="$RUNNER_TEMP/panel"
            mkdir -p "$work/data/pki/agents"
            newcert() { openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -nodes -days 30 -subj "$1" -keyout "$2.key" -out "$2.crt" 2>/dev/null; }
            fingerprint() { openssl x509 -in "$1" -outform DER | sha256sum | cut -d' ' -f1; }
            # The same certificate as install.sh makes: a name, and no IP address.
            newcert "/CN=panel.example.com/O=Cloudfactory panel" "$work/data/pki/panel"
            newcert "/CN=panel-1" "$work/agent"
            panel_fingerprint=$(fingerprint "$work/data/pki/panel.crt")
            # The user of the panel owns /data on a server, and that user is root in the
            # container. With no DAC_OVERRIDE, root cannot read the key of the runner user.
            sudo chown -R root:root "$work/data"
            docker network create smoke
            docker run -d --name smoke-db --network smoke -e POSTGRES_USER=cloudfactory -e POSTGRES_PASSWORD=smoke -e POSTGRES_DB=cloudfactory postgres:18
            docker run -d --name smoke --network smoke --cap-drop=all --security-opt no-new-privileges \
              -p 127.0.0.1:18080:8080 -p 127.0.0.1:18443:8443 -v "$work/data:/data" \
              -e "APP_KEY=base64:$(openssl rand -base64 32)" -e QUEUE_CONNECTION=database \
              -e DB_CONNECTION=pgsql -e DB_HOST=smoke-db -e DB_PORT=5432 -e DB_DATABASE=cloudfactory -e DB_USERNAME=cloudfactory -e DB_PASSWORD=smoke -e DB_SSLMODE=disable \
              -e CF_AGENT_CLIENT_CERT=/data/pki/panel.crt -e CF_AGENT_CLIENT_KEY=/data/pki/panel.key -e CF_AGENT_CERTIFICATES=/data/pki/agents panel-api:test
            # The start script waits for the database and makes the tables before it serves.
            code=000
            for _ in $(seq 1 60); do
              code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/up || true)
              [ "$code" = 200 ] && break
              sleep 2
            done
            docker logs smoke
            docker inspect -f '{{.State.Running}}' smoke | grep -q true
            [ "$code" = 200 ]
            # The HTTPS port has the certificate of the panel, also for a client that connects to
            # an IP address and sends no server name, as the agent does.
            served=$(openssl s_client -connect 127.0.0.1:18443 -noservername </dev/null 2>/dev/null | openssl x509 -outform DER | sha256sum | cut -d' ' -f1)
            echo "served certificate: $served, panel certificate: $panel_fingerprint"
            [ "$served" = "$panel_fingerprint" ]
            # A join on the HTTPS port with the client certificate makes the server of the panel
            # ("local"). Then the agent can report on that port with its certificate.
            token=$(docker exec smoke php artisan cloudfactory:install admin@example.com | sed -n 's/.*"joinToken":"\([^"]*\)".*/\1/p')
            [ -n "$token" ]
            agent_fingerprint=$(fingerprint "$work/agent.crt")
            jq -n --arg token "$token" --arg fingerprint "$agent_fingerprint" --rawfile pem "$work/agent.crt" \
              '{token: $token, name: "panel-1", agentUrl: "https://169.254.1.3:7443", certificateSha256: $fingerprint, certificatePem: $pem, agentVersion: "0.0.0", os: "debian-13", arch: "x86-64", roles: ["web"]}' >"$work/join.json"
            # -k: the certificate has no IP address. The check of its fingerprint is above, and
            # the agent does the same check for each connection.
            agent_token=$(curl -sS --fail-with-body -k --cert "$work/agent.crt" --key "$work/agent.key" -H 'Content-Type: application/json' -H 'Accept: application/json' \
              -d @"$work/join.json" https://127.0.0.1:18443/api/agent/v1/join | jq -r .agentToken)
            [ -n "$agent_token" ] && [ "$agent_token" != null ]
            report() {
              curl -s -o /dev/null -w '%{http_code}' -k -H "Authorization: Bearer $agent_token" -H 'Content-Type: application/json' -H 'Accept: application/json' -d '{"agentVersion":"0.0.0"}' "$@"
            }
            check() {
              want=$1
              shift
              got=$(report "$@")
              echo "report $*: $got (want $want)"
              [ "$got" = "$want" ]
            }
            check 200 --cert "$work/agent.crt" --key "$work/agent.key" https://127.0.0.1:18443/api/agent/v1/report
            # The token alone is not sufficient: no certificate, a header that the client sets,
            # and the HTTP port, which removes the header.
            check 401 https://127.0.0.1:18443/api/agent/v1/report
            check 401 -H "X-Cloudfactory-Direct-Cert-Sha256: $agent_fingerprint" https://127.0.0.1:18443/api/agent/v1/report
            check 401 -H "X-Cloudfactory-Direct-Cert-Sha256: $agent_fingerprint" http://127.0.0.1:18080/api/agent/v1/report
            # A client of the HTTPS port cannot pass as the edge proxy.
            check 401 -H 'X-Cloudfactory-Edge: 1' -H "X-Client-Cert-Sha256: $agent_fingerprint" https://127.0.0.1:18443/api/agent/v1/report
            # The terminal relay of the unit cf-panel-terminal: the same image, a read-only root
            # file system, no capabilities, and only APP_KEY.
            docker run -d --name smoke-relay --cap-drop=all --security-opt no-new-privileges --read-only --tmpfs /tmp \
              -p 127.0.0.1:18090:8090 -e "APP_KEY=base64:$(openssl rand -base64 32)" panel-api:test cf-terminal-relay --listen :8090
            code=000
            for _ in $(seq 1 15); do
              code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18090/up || true)
              [ "$code" = 200 ] && break
              sleep 1
            done
            docker logs smoke-relay
            [ "$code" = 200 ]
            # A connection with no valid ticket gets no terminal.
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:18090/api/terminal/01m82jppdpt215s2n6f4p03hwd/browser?ticket=1.00")
            [ "$code" = 403 ]
            exit 0
          fi
          if [ "$IMAGE" != "${IMAGE#node}" ] || [ "$IMAGE" != "${IMAGE#python}" ]; then
            # The settings of quadlet.ContainerUnit for a Node.js or Python website: a read-only
            # root file system, no capabilities, the Unix user of the website, and the directory
            # of the website at /app. First a new website with no application gets the welcome
            # page. Then the install command runs in a build container, as the agent runs it,
            # and the container runs the start command of the application.
            app="$RUNNER_TEMP/app" src="$RUNNER_TEMP/app-src"
            mkdir -p "$app" "$src"
            sudo chown 1001:1001 "$app"
            run() { docker run --cap-drop=all --security-opt no-new-privileges --read-only --tmpfs /tmp --user 1001:1001 -v "$app:/app" "$@"; }
            case "$IMAGE" in
              node*)
                start='npm start' install='npm install --omit=dev'
                printf '%s\n' '{"name":"smoke","version":"1.0.0","private":true,"scripts":{"start":"node server.js"}}' >"$src/package.json"
                printf '%s\n' 'require("node:http").createServer((q, r) => r.end("smoke " + process.env.SMOKE)).listen(process.env.PORT, process.env.HOST);' >"$src/server.js"
                ;;
              python*)
                start='python app.py' install='python -m venv .venv && .venv/bin/pip install -r requirements.txt'
                : >"$src/requirements.txt"
                printf '%s\n' 'import os, sys' 'from http.server import BaseHTTPRequestHandler, HTTPServer' \
                  'assert sys.prefix.endswith("/.venv"), sys.prefix' \
                  'class H(BaseHTTPRequestHandler):' \
                  '    def do_GET(self):' \
                  '        self.send_response(200); self.end_headers(); self.wfile.write(("smoke " + os.environ["SMOKE"]).encode())' \
                  'HTTPServer((os.environ["HOST"], int(os.environ["PORT"])), H).serve_forever()' >"$src/app.py"
                ;;
            esac
            get() {
              body=""
              for _ in $(seq 1 30); do
                body=$(curl -s http://127.0.0.1:18080/ || true)
                [ -n "$body" ] && break
                sleep 2
              done
              docker logs smoke
              docker inspect -f '{{.State.Running}}' smoke | grep -q true
              docker rm -f smoke >/dev/null
            }
            # The welcome page of a new website.
            run -d --name smoke -p 127.0.0.1:18080:8080 "$IMAGE:test" sh -c "$start"
            get
            echo "$body" | grep -q 'This website is ready'
            # The application, with its dependencies.
            sudo cp -r "$src/." "$app/"
            sudo chown -R 1001:1001 "$app"
            run --rm --env CF_APP_DIR=/app --workdir /app "$IMAGE:test" sh -c "set -e; $install"
            run -d --name smoke -p 127.0.0.1:18080:8080 --env SMOKE=ok "$IMAGE:test" sh -c "$start"
            get
            echo "body: $body"
            [ "$body" = "smoke ok" ]
            exit 0
          fi
          case "$IMAGE" in
            frankenphp-*|apache-*) args="--read-only --tmpfs /tmp --user 1001:1001" want=200 ;;
            # Adminer answers only on the address of a sign-in: /<tool>/<32 hex digits>/.
            adminer) args="--read-only --tmpfs /tmp --user 1001:1001" want=200 path=/test/0123456789abcdef0123456789abcdef/ ;;
            panel-web) args="--read-only --tmpfs /tmp" want=200 ;;
            edge) args="--read-only --tmpfs /data --tmpfs /run/caddy-admin" want=any ;;
          esac
          # shellcheck disable=SC2086 # args holds several options.
          docker run -d --name smoke --cap-drop=all --security-opt no-new-privileges -p 127.0.0.1:18080:8080 $args "$IMAGE:test"
          code=000
          for _ in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:18080${path:-/}" || true)
            # Wait for the wanted code. Apache can answer 503 before php-fpm opens its socket.
            if [ "$want" = any ]; then [ "$code" != 000 ] && break; else [ "$code" = "$want" ] && break; fi
            sleep 2
          done
          docker logs smoke
          docker inspect -f '{{.State.Running}}' smoke | grep -q true
          if [ "$want" = any ]; then [ "$code" != 000 ]; else [ "$code" = "$want" ]; fi
      - name: Scan for known vulnerabilities (FR-1102)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.image }}:test
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          # CVE scan, finding 4: gosu in the mariadb and postgresql bases only changes the user at
          # start. It does no TLS, HTTP or parsing, so the Go standard-library CVEs that Trivy
          # reports in it do not apply. The gosu project treats them as false positives.
          skip-files: /usr/local/bin/gosu
