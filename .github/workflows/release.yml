# Publishes a release when a maintainer pushes a tag such as v0.1.0 (spec section 7.18).
#
# Secrets:
#   COSIGN_PRIVATE_KEY  The private key that matches cosign.pub in the repository root.
#   COSIGN_PASSWORD     The password of the private key.
name: Release

on:
  push:
    tags: ['v*.*.*']
  # FR-1109: the rebuild workflow starts this workflow to build the images again.
  workflow_dispatch:
    inputs:
      images_only:
        description: Build only the images, with a new tag such as 0.1.0-r42.
        type: boolean
        default: true

# CF-17: each job gets only the permissions that it needs.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}
  # The gVisor release that the installation script installs. Change it here.
  GVISOR_VERSION: '20261019.0'
  # CF-16: the SHA-512 checksums of this gVisor release. They must agree with
  # agent/internal/gvisor/gvisor.go. The installation script does not download a checksum.
  GVISOR_SHA512_X86_64: 7cbc2aeeee809dcccfb40e612504a1b76f2c119790cee59e482f7b35428cccc4f71705e7e322442d07d1f7d29b5d9e72e31319fc3088d6dcbec9fc7c1f0d8881
  GVISOR_SHA512_AARCH64: 6b14b582cd3185169df54275eed8721d94c9b40e6cb1533d0d0c46573271c6d2d03db586ea1caac46a45e805797f00b115bead9fb93636a1ffa69f2430958977

jobs:
  images:
    name: Image ${{ matrix.image }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: frankenphp-php8.2, context: images/frankenphp, file: images/frankenphp/Containerfile, args: PHP_VERSION=8.2 }
          - { image: frankenphp-php8.3, context: images/frankenphp, file: images/frankenphp/Containerfile, args: PHP_VERSION=8.3 }
          - { image: frankenphp-php8.4, context: images/frankenphp, file: images/frankenphp/Containerfile, args: PHP_VERSION=8.4 }
          - { image: frankenphp-php8.5, context: images/frankenphp, file: images/frankenphp/Containerfile, args: PHP_VERSION=8.5 }
          - { image: apache-php8.2, context: images/apache-php-fpm, file: images/apache-php-fpm/Containerfile, args: PHP_VERSION=8.2 }
          - { image: apache-php8.3, context: images/apache-php-fpm, file: images/apache-php-fpm/Containerfile, args: PHP_VERSION=8.3 }
          - { image: apache-php8.4, context: images/apache-php-fpm, file: images/apache-php-fpm/Containerfile, args: PHP_VERSION=8.4 }
          - { image: apache-php8.5, context: images/apache-php-fpm, file: images/apache-php-fpm/Containerfile, args: PHP_VERSION=8.5 }
          - { image: edge, context: images/edge, file: images/edge/Containerfile, args: '' }
          - { image: mariadb, context: images/mariadb, file: images/mariadb/Containerfile, args: '' }
          - { image: postgresql, context: images/postgresql, file: images/postgresql/Containerfile, args: '' }
          - { image: panel-api, context: ., file: images/panel-api/Containerfile, args: '' }
          - { image: panel-web, context: ., file: images/panel-web/Containerfile, args: '' }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      # Stop before the images are pushed, so that no unsigned image gets a release tag.
      - name: Check the signing key
        env:
          COSIGN_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          test -s cosign.pub || { echo "::error::cosign.pub is missing. See docs/releasing.md."; exit 1; }
          test -n "$COSIGN_KEY" || { echo "::error::The secret COSIGN_PRIVATE_KEY is not set. See docs/releasing.md."; exit 1; }
          test -n "$COSIGN_PASSWORD" || { echo "::error::The secret COSIGN_PASSWORD is not set. See docs/releasing.md."; exit 1; }
      - name: Find the image tag
        id: tag
        run: |
          set -eu
          latest=$(git describe --tags --abbrev=0 --match 'v*.*.*')
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            git checkout -q "$latest"
            echo "tag=${latest#v}-r${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      # Cosign 2 stores signatures as ".sig" tags. Podman and the panel read this format.
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
        with:
          cosign-release: v2.5.2
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push for x86-64 and ARM64
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          build-args: ${{ matrix.args }}
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          # The agent and the panel use the version with no "v", for example 0.1.0.
          tags: ${{ env.REGISTRY }}/${{ matrix.image }}:${{ steps.tag.outputs.tag }}
      - name: Scan for known vulnerabilities (FR-1102)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          # CVE scan, finding 4: gosu in the mariadb and postgresql bases only changes the user at
          # start. It does no TLS, HTTP or parsing, so the Go standard-library CVEs that Trivy
          # reports in it do not apply. The gosu project treats them as false positives.
          skip-files: /usr/local/bin/gosu
      - name: Attach the SBOM (FR-1102)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.REGISTRY }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
      - name: Sign the image and the SBOM (FR-1101)
        env:
          COSIGN_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          IMAGE: ${{ env.REGISTRY }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes --key env://COSIGN_KEY "$IMAGE"
          cosign attest --yes --key env://COSIGN_KEY --type spdxjson --predicate sbom.spdx.json "$IMAGE"

  binaries:
    name: Agent, CLI and installation script
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Check the signing key
        env:
          COSIGN_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          test -s cosign.pub || { echo "::error::cosign.pub is missing. See docs/releasing.md."; exit 1; }
          test -n "$COSIGN_KEY" || { echo "::error::The secret COSIGN_PRIVATE_KEY is not set. See docs/releasing.md."; exit 1; }
          test -n "$COSIGN_PASSWORD" || { echo "::error::The secret COSIGN_PASSWORD is not set. See docs/releasing.md."; exit 1; }
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          # R-05: the same Go release as the toolchain line in go.mod.
          go-version: '1.27.3'
      # Cosign 2 stores signatures as ".sig" tags. Podman and the panel read this format.
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
        with:
          cosign-release: v2.5.2
      - name: Build
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -eu
          v="${VERSION#v}"
          mkdir -p dist
          for arch in amd64 arm64; do
            (cd agent && CGO_ENABLED=0 GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=$v" -o "../dist/cf-agent_linux_$arch" ./cmd/cf-agent)
            # R-13: a signed manifest binds the binary to its version (selfupdate.Manifest).
            printf 'version=%s\nasset=%s\nsha256=%s\n' "$v" "cf-agent_linux_$arch" "$(sha256sum "dist/cf-agent_linux_$arch" | cut -d' ' -f1)" > "dist/cf-agent_linux_$arch.manifest"
          done
          for os in linux darwin windows; do
            for arch in amd64 arm64; do
              ext=""; [ "$os" = windows ] && ext=".exe"
              (cd cli && CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=$v" -o "../dist/cf_${os}_${arch}${ext}" ./cmd/cf)
            done
          done
      - name: Put the release values in the installation script
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -eu
          test -s cosign.pub || { echo "cosign.pub is missing. See docs/releasing.md."; exit 1; }
          grep -q "^const Version = \"$GVISOR_VERSION\"" agent/internal/gvisor/gvisor.go || { echo "agent/internal/gvisor/gvisor.go: Version is not $GVISOR_VERSION."; exit 1; }
          for arch in x86_64:$GVISOR_SHA512_X86_64 aarch64:$GVISOR_SHA512_AARCH64; do
            if ! grep -q "\"$GVISOR_VERSION/${arch%%:*}\": *\"${arch#*:}\"" agent/internal/gvisor/gvisor.go; then
              echo "agent/internal/gvisor/gvisor.go has no checksum for gVisor $GVISOR_VERSION ${arch%%:*}."; exit 1
            fi
          done
          python3 - "$VERSION" "$GVISOR_VERSION" "$REGISTRY" "$GVISOR_SHA512_X86_64" "$GVISOR_SHA512_AARCH64" <<'PY'
          import sys
          version, gvisor, registry = sys.argv[1].lstrip("v"), sys.argv[2], sys.argv[3]
          script = open("install/install.sh").read()
          script = script.replace("__CF_VERSION__", version).replace("__GVISOR_VERSION__", gvisor)
          script = script.replace("__CF_REGISTRY__", registry)
          script = script.replace("__GVISOR_SHA512_X86_64__", sys.argv[4]).replace("__GVISOR_SHA512_AARCH64__", sys.argv[5])
          script = script.replace("__COSIGN_PUBLIC_KEY__", open("cosign.pub").read().strip())
          open("dist/install.sh", "w").write(script)
          PY
          cp cosign.pub dist/cosign.pub
      - name: Sign each file (FR-1810, FR-1812)
        env:
          COSIGN_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          set -eu
          cd dist
          for f in cf-agent_* cf_* install.sh; do
            cosign sign-blob --yes --key env://COSIGN_KEY --tlog-upload=false --output-signature "$f.sig" "$f"
            sha256sum "$f" > "$f.sha256"
          done
          # Check one signature as the installation script does.
          base64 -d install.sh.sig > /tmp/sig.der
          openssl dgst -sha256 -verify cosign.pub -signature /tmp/sig.der install.sh
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
