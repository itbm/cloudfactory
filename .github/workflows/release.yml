# Publishes a release (spec section 7.18). Start it in one of two ways:
# - Push a tag such as v0.1.0. The workflow makes the GitHub release.
# - Publish a release with a new tag such as v0.1.0 on the GitHub website. The workflow adds
#   the files to that release. Use this way when you cannot push a tag, for example on a phone.
#
# The build jobs make and sign everything, but they do not publish it: the images go to the
# registry by digest only, with no tag. The last job (publish) runs only when every build job
# is successful. It checks the image signatures, tags the images and adds the files to the
# GitHub release. If one build fails, no image tag and no release file changes.
#
# Secrets:
#   COSIGN_PRIVATE_KEY  The private key that matches cosign.pub in the repository root.
#   COSIGN_PASSWORD     The password of the private key.
name: Release

on:
  push:
    tags: ['v*.*.*']
  release:
    types: [published]
  # FR-1109: the rebuild workflow starts this workflow to build the images again.
  workflow_dispatch:
    inputs:
      images_only:
        description: Build only the images, with a new tag such as 0.1.0-r42.
        type: boolean
        default: true

# CF-17: each job gets only the permissions that it needs.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}
  # The gVisor release that the installation script installs. Change it here.
  GVISOR_VERSION: '20261019.0'
  # CF-16: the SHA-512 checksums of this gVisor release. They must agree with
  # agent/internal/gvisor/gvisor.go. The installation script does not download a checksum.
  GVISOR_SHA512_X86_64: 7cbc2aeeee809dcccfb40e612504a1b76f2c119790cee59e482f7b35428cccc4f71705e7e322442d07d1f7d29b5d9e72e31319fc3088d6dcbec9fc7c1f0d8881
  GVISOR_SHA512_AARCH64: 6b14b582cd3185169df54275eed8721d94c9b40e6cb1533d0d0c46573271c6d2d03db586ea1caac46a45e805797f00b115bead9fb93636a1ffa69f2430958977

jobs:
  # A release made on the website can also start a tag push event for the same tag. Only one
  # of the two runs continues: the push run stops when the release already exists.
  plan:
    name: Decide what to build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      run: ${{ steps.plan.outputs.run }}
    steps:
      - name: Decide
        id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          run=true
          case "$GITHUB_EVENT_NAME" in
          push | release)
            if ! printf '%s\n' "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
              echo "::notice::$GITHUB_REF_NAME is not a version tag such as v0.1.0. Nothing to do."
              run=false
            elif [ "$GITHUB_EVENT_NAME" = push ] && gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
              echo "::notice::The release $GITHUB_REF_NAME exists. The run for the release event builds it."
              run=false
            fi
            ;;
          esac
          echo "run=$run" >> "$GITHUB_OUTPUT"

  images:
    name: Image ${{ matrix.image }}
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: frankenphp-php8.4, context: images/frankenphp, file: images/frankenphp/Containerfile, args: PHP_VERSION=8.4 }
          - { image: frankenphp-php8.5, context: images/frankenphp, file: images/frankenphp/Containerfile, args: PHP_VERSION=8.5 }
          - { image: apache-php8.4, context: images/apache-php-fpm, file: images/apache-php-fpm/Containerfile, args: PHP_VERSION=8.4 }
          - { image: apache-php8.5, context: images/apache-php-fpm, file: images/apache-php-fpm/Containerfile, args: PHP_VERSION=8.5 }
          - { image: edge, context: images/edge, file: images/edge/Containerfile, args: '' }
          - { image: sftp, context: images/sftp, file: images/sftp/Containerfile, args: '' }
          - { image: mariadb, context: images/mariadb, file: images/mariadb/Containerfile, args: '' }
          - { image: postgresql, context: images/postgresql, file: images/postgresql/Containerfile, args: '' }
          - { image: panel-api, context: ., file: images/panel-api/Containerfile, args: '' }
          - { image: panel-web, context: ., file: images/panel-web/Containerfile, args: '' }
    steps:
      # Servers pull the images with no login, so each image package must be public before
      # production. This step only gives a warning for a private package. It does not stop the
      # build. A package that does not exist yet (404) is correct: the push makes it.
      - name: Check the package visibility
        env:
          OWNER: ${{ github.repository_owner }}
          IMAGE: ${{ matrix.image }}
        run: |
          set -eu
          owner=$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')
          for p in "$IMAGE" build-cache; do
            token=$(curl -sS "https://ghcr.io/token?scope=repository:$owner/$p:pull" | jq -r '.token // empty')
            code=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $token" "https://ghcr.io/v2/$owner/$p/tags/list")
            case "$code" in
            200) echo "ghcr.io/$owner/$p is public." ;;
            404) echo "ghcr.io/$owner/$p does not exist yet. The push makes it." ;;
            *) echo "::warning::The package ghcr.io/$owner/$p is not public (HTTP $code). Servers cannot pull a private image with no login. Before production, make it public at https://github.com/users/$owner/packages/container/$p/settings (Danger Zone, Change visibility). See docs/releasing.md." ;;
            esac
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # Stop before the build if the signing key is not available.
      - name: Check the signing key
        env:
          COSIGN_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          test -s cosign.pub || { echo "::error::cosign.pub is missing. See docs/releasing.md."; exit 1; }
          test -n "$COSIGN_KEY" || { echo "::error::The secret COSIGN_PRIVATE_KEY is not set. See docs/releasing.md."; exit 1; }
          test -n "$COSIGN_PASSWORD" || { echo "::error::The secret COSIGN_PASSWORD is not set. See docs/releasing.md."; exit 1; }
      - name: Find the image tag
        id: tag
        run: |
          set -eu
          latest=$(git describe --tags --abbrev=0 --match 'v*.*.*')
          if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ]; then
            echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            git checkout -q "$latest"
            echo "tag=${latest#v}-r${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Cosign 2 stores signatures as ".sig" tags. Podman and the panel read this format.
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v2.5.2
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The image goes to the registry by digest only. The publish job adds the tag when every
      # build is successful.
      - name: Build and push by digest for x86-64 and ARM64
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          # CF_REFRESH has a new value for each run. Each Containerfile uses it before its security
          # upgrade step, so that step never comes from the cache.
          build-args: |
            ${{ matrix.args }}
            CF_REFRESH=${{ github.run_id }}-${{ github.run_attempt }}
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          sbom: true
          outputs: type=image,name=${{ env.REGISTRY }}/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          # The layers of the last build, for example the PHP extensions, come from this cache.
          # The cache is in its own package, so that the image packages have only release tags.
          # A failure to write the cache does not stop the release.
          cache-from: type=registry,ref=${{ env.REGISTRY }}/build-cache:${{ matrix.image }}
          cache-to: type=registry,ref=${{ env.REGISTRY }}/build-cache:${{ matrix.image }},mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true
      - name: Scan for known vulnerabilities (FR-1102)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          # CVE scan, finding 4: gosu in the mariadb and postgresql bases only changes the user at
          # start. It does no TLS, HTTP or parsing, so the Go standard-library CVEs that Trivy
          # reports in it do not apply. The gosu project treats them as false positives.
          skip-files: /usr/local/bin/gosu
      - name: Attach the SBOM (FR-1102)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.REGISTRY }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          # The next step attaches the SBOM to the image with cosign. On a release event, the
          # action would also upload it to the release, which this job has no permission to do.
          upload-artifact: false
          upload-release-assets: false
      - name: Sign the image and the SBOM (FR-1101)
        env:
          COSIGN_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          IMAGE: ${{ env.REGISTRY }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}
        # --recursive also signs the image of each platform in the multi-platform index. Podman
        # selects the image for its platform and checks the signature of that image, not of
        # the index. With only the index signed, Podman refuses the image with "A signature
        # was required, but no signature exists".
        run: |
          cosign sign --yes --recursive --key env://COSIGN_KEY "$IMAGE"
          cosign attest --yes --key env://COSIGN_KEY --type spdxjson --predicate sbom.spdx.json "$IMAGE"
      - name: Record the digest for the publish job
        env:
          IMAGE: ${{ matrix.image }}
          # The agent and the panel use the version with no "v", for example 0.1.0.
          TAG: ${{ steps.tag.outputs.tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -eu
          mkdir -p digests
          printf '%s %s %s\n' "$IMAGE" "$TAG" "$DIGEST" > "digests/$IMAGE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.image }}
          path: digests/${{ matrix.image }}
          if-no-files-found: error
          retention-days: 7

  binaries:
    name: Agent, CLI and installation script
    needs: plan
    if: needs.plan.outputs.run == 'true' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the signing key
        env:
          COSIGN_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          test -s cosign.pub || { echo "::error::cosign.pub is missing. See docs/releasing.md."; exit 1; }
          test -n "$COSIGN_KEY" || { echo "::error::The secret COSIGN_PRIVATE_KEY is not set. See docs/releasing.md."; exit 1; }
          test -n "$COSIGN_PASSWORD" || { echo "::error::The secret COSIGN_PASSWORD is not set. See docs/releasing.md."; exit 1; }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # R-05: the same Go release as the toolchain line in go.mod.
          go-version: '1.27.4'
      # Cosign 2 stores signatures as ".sig" tags. Podman and the panel read this format.
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v2.5.2
      - name: Build
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -eu
          v="${VERSION#v}"
          mkdir -p dist
          for arch in amd64 arm64; do
            (cd agent && CGO_ENABLED=0 GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=$v" -o "../dist/cf-agent_linux_$arch" ./cmd/cf-agent)
            # R-13: a signed manifest binds the binary to its version (selfupdate.Manifest).
            printf 'version=%s\nasset=%s\nsha256=%s\n' "$v" "cf-agent_linux_$arch" "$(sha256sum "dist/cf-agent_linux_$arch" | cut -d' ' -f1)" > "dist/cf-agent_linux_$arch.manifest"
          done
          for os in linux darwin windows; do
            for arch in amd64 arm64; do
              ext=""; [ "$os" = windows ] && ext=".exe"
              (cd cli && CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=$v" -o "../dist/cf_${os}_${arch}${ext}" ./cmd/cf)
            done
          done
      - name: Put the release values in the installation script
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -eu
          test -s cosign.pub || { echo "cosign.pub is missing. See docs/releasing.md."; exit 1; }
          grep -q "^const Version = \"$GVISOR_VERSION\"" agent/internal/gvisor/gvisor.go || { echo "agent/internal/gvisor/gvisor.go: Version is not $GVISOR_VERSION."; exit 1; }
          for arch in x86_64:$GVISOR_SHA512_X86_64 aarch64:$GVISOR_SHA512_AARCH64; do
            if ! grep -q "\"$GVISOR_VERSION/${arch%%:*}\": *\"${arch#*:}\"" agent/internal/gvisor/gvisor.go; then
              echo "agent/internal/gvisor/gvisor.go has no checksum for gVisor $GVISOR_VERSION ${arch%%:*}."; exit 1
            fi
          done
          python3 - "$VERSION" "$GVISOR_VERSION" "$REGISTRY" "$GVISOR_SHA512_X86_64" "$GVISOR_SHA512_AARCH64" <<'PY'
          import sys
          version, gvisor, registry = sys.argv[1].lstrip("v"), sys.argv[2], sys.argv[3]
          script = open("install/install.sh").read()
          script = script.replace("__CF_VERSION__", version).replace("__GVISOR_VERSION__", gvisor)
          script = script.replace("__CF_REGISTRY__", registry)
          script = script.replace("__GVISOR_SHA512_X86_64__", sys.argv[4]).replace("__GVISOR_SHA512_AARCH64__", sys.argv[5])
          script = script.replace("__COSIGN_PUBLIC_KEY__", open("cosign.pub").read().strip())
          open("dist/install.sh", "w").write(script)
          PY
          cp cosign.pub dist/cosign.pub
      - name: Sign each file (FR-1810, FR-1812)
        env:
          COSIGN_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          set -eu
          cd dist
          for f in cf-agent_* cf_* install.sh; do
            cosign sign-blob --yes --key env://COSIGN_KEY --tlog-upload=false --output-signature "$f.sig" "$f"
            sha256sum "$f" > "$f.sha256"
          done
          # Check one signature as the installation script does.
          base64 -d install.sh.sig > /tmp/sig.der
          openssl dgst -sha256 -verify cosign.pub -signature /tmp/sig.der install.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # Runs only when every build job is successful. A rebuild (workflow_dispatch) has no binaries
  # job and makes no GitHub release.
  publish:
    name: Publish the images and the release
    needs: [plan, images, binaries]
    if: >-
      always() && needs.plan.outputs.run == 'true' && needs.images.result == 'success' &&
      (needs.binaries.result == 'success' || (github.event_name == 'workflow_dispatch' && needs.binaries.result == 'skipped'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v2.5.2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - name: Log in to the registry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          command -v skopeo >/dev/null || { sudo apt-get update -q && sudo apt-get install -yq skopeo; }
          printf '%s' "$GH_TOKEN" | skopeo login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          printf '%s' "$GH_TOKEN" | cosign login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      # Check every signature before the first tag is added.
      - name: Check the image signatures
        run: |
          set -eu
          for f in digests/*; do
            read -r image tag digest < "$f"
            cosign verify --key cosign.pub "$REGISTRY/$image@$digest" > /dev/null
            echo "$image@$digest: the signature is correct."
            # Podman checks the image of its platform, so each platform needs a signature too.
            children=$(skopeo inspect --raw "docker://$REGISTRY/$image@$digest" |
              jq -r '.manifests[]? | select(.platform.os != "unknown") | .digest')
            test -n "$children" || { echo "::error::$image@$digest has no platform images."; exit 1; }
            for child in $children; do
              cosign verify --key cosign.pub "$REGISTRY/$image@$child" > /dev/null
              echo "$image@$child: the signature is correct."
            done
          done
      # A tag copy keeps the digest, so the signatures stay valid.
      - name: Tag the images
        run: |
          set -eu
          for f in digests/*; do
            read -r image tag digest < "$f"
            ref="$REGISTRY/$image"
            skopeo copy --all --preserve-digests --quiet "docker://$ref@$digest" "docker://$ref:$tag"
            got=$(skopeo inspect --raw "docker://$ref:$tag" | sha256sum | cut -d' ' -f1)
            test "sha256:$got" = "$digest" || { echo "::error::$ref:$tag has the digest sha256:$got, not $digest."; exit 1; }
            echo "$ref:$tag -> $digest"
          done
      # Servers pull the images with no login. In release 0.1.9, two packages were private, and
      # each website with those images failed with "unauthorized". Thus the release stops here
      # until each package is public. The image jobs give only a warning before the build.
      - name: Check that a server can pull each image with no login
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          set -eu
          owner=$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')
          private=0
          for f in digests/*; do
            read -r image tag digest < "$f"
            token=$(curl -sS "https://ghcr.io/token?scope=repository:$owner/$image:pull" | jq -r '.token // empty')
            code=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $token" "https://ghcr.io/v2/$owner/$image/tags/list")
            if [ "$code" = 200 ]; then
              echo "ghcr.io/$owner/$image is public."
            else
              echo "::error::The package ghcr.io/$owner/$image is not public (HTTP $code). Servers cannot pull it. Make it public at https://github.com/users/$owner/packages/container/$image/settings (Danger Zone, Change visibility), then run this job again. See docs/releasing.md."
              private=1
            fi
          done
          test "$private" -eq 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: github.event_name != 'workflow_dispatch'
        with:
          name: release-files
          path: dist
      - name: Publish the release
        if: github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # The release was made on the website. Add the files to it.
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
          fi
