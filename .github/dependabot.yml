# CF-17: the workflows pin each action to a commit SHA. Dependabot proposes the updates.
# Audit finding S12: Dependabot also proposes the updates of the PHP, JavaScript and Go
# packages, and of the base images of the containers.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: composer
    directory: /api
    schedule:
      interval: weekly
    groups:
      php:
        update-types: [minor, patch]
    ignore:
      # PHPUnit 13 needs PHP 8.4, but composer.json and the CI also accept PHP 8.3. Remove this
      # rule when the API stops support for PHP 8.3.
      - dependency-name: phpunit/phpunit
        update-types: ['version-update:semver-major']

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      javascript:
        update-types: [minor, patch]

  - package-ecosystem: gomod
    directories: [/agent, /cli]
    schedule:
      interval: weekly
    groups:
      go:
        update-types: [minor, patch]

  # The base images. Each directory in images/ has one Containerfile.
  - package-ecosystem: docker
    directories: ['/images/*']
    schedule:
      interval: weekly
    groups:
      base-images:
        update-types: [minor, patch]
    ignore:
      # A new major release of a database cannot open the data files of the old release, and you
      # cannot go back after the upgrade. Each server needs an upgrade procedure first, so do a
      # major upgrade in its own pull request. MariaDB stays on a long-term support release.
      - dependency-name: library/mariadb
        update-types: ['version-update:semver-major']
      - dependency-name: library/postgres
        update-types: ['version-update:semver-major']
