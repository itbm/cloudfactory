openapi: 3.1.0
info:
  title: Cloudfactory panel API
  version: 0.1.0
  summary: The public API of the Cloudfactory panel.
  description: |
    The web panel and the `cf` command line tool use only this API (FR-103).

    A change does not happen at once. The panel records the desired state, puts a job
    in the queue, and returns the job with status 202. The agent on the server applies the
    change and reports each step. Get the job to see its progress (spec section 6.3).

    Each API token has scopes and an expiry date (FR-104). A GET request needs the
    `<area>:read` scope. Other methods need `<area>:write`. A write scope also gives read access.
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only
servers:
  - url: https://panel.example.com/api
security:
  - token: []
tags:
  - name: Auth
  - name: Websites
  - name: Files
    description: The file manager of a website.
  - name: Cron jobs
  - name: Commands
    description: >-
      Run a command in the container of a website, and the command log of the website. The
      command runs as the Unix user of the website, in the gVisor sandbox, with the limits of the
      website.
  - name: Deploys
    description: Deploys of a website from a Git repository.
  - name: Previews
    description: The preview websites of the pull requests of a website that deploys from Git.
  - name: Databases
  - name: DNS
    description: DNS hosting. The zones of the customers and their records.
  - name: Certificates
    description: >-
      The TLS certificates of the customers: uploads, and certificates from Let's Encrypt with
      DNS validation. Refer to docs/certificates.md. These routes need the websites scope.
  - name: Networks
    description: The private networks of the customers, like a VPC.
  - name: Backups
  - name: Email
  - name: Usage
    description: The usage history for the graphs, and the alerts near the limits.
  - name: Jobs
  - name: Servers
    description: Administrators only.
  - name: Images
    description: Administrators only.
  - name: Customers
  - name: Imports
    description: >-
      The import of an account from cPanel, DirectAdmin, Plesk or HestiaCP. Administrators only.
      Refer to docs/imports.md.
  - name: Users
    description: The users who can sign in. These routes need the users scope.
  - name: Audit
  - name: Plugins
    description: Programs outside the panel with their own token. Refer to docs/plugins.md.
  - name: Packs
    description: Signed manifests that add a website runtime, for example Go. Only an administrator. Refer to docs/packs.md.
  - name: Notifications
    description: >-
      Email notifications. Each user chooses the events that give an email. An administrator sets
      the SMTP server and the templates of the panel. A reseller can set its own SMTP server and
      templates for the emails to its customers. These routes need the notifications scope.
  - name: Agent
    description: Only the agent on a server uses these routes. They use the agent token, not a user token.

paths:
  /v1/auth/login:
    post:
      tags: [Auth]
      summary: Sign in
      description: >-
        Sign in with an email address and a password. The token expires after 12 hours. The panel
        examines the password first. A wrong password gives an error on `email`, also when TOTP is
        on for the user. When the password is correct and TOTP is on for the user, a request with
        no `totp` gives status 422 with `totpRequired: true` and an error on `totp`. This answer is
        not a failed attempt: send the request again with the code. A wrong code gives an error on
        `totp`, and it is a failed attempt. A TOTP code is good one time only. After 5 failed
        attempts from one address, the account is locked for that address for 30 seconds, and the
        time doubles after each further failure, up to one hour. After 100 failed attempts in one
        hour from all addresses, the account is locked for all addresses.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
                totp: { type: string, pattern: '^[0-9]{6}$', description: Necessary when TOTP is on for the user. }
                deviceId:
                  type: string
                  maxLength: 100
                  description: >-
                    A random ID that the client keeps, 16 to 100 letters, digits, "-" or "_". After the
                    first sign-in of a user, a sign-in from a device that the panel does not know
                    sends an email to the user. With no ID, the panel knows a device by its user agent.
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  expiresAt: { type: string, format: date-time }
        '422':
          description: >-
            The email address, the password or the code is not correct, or the user must give a
            TOTP code. `totpRequired` is in the answer only when the password is correct and the
            request had no code.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/ValidationError' }
                  - type: object
                    properties:
                      totpRequired: { type: boolean, description: The password is correct. Send the request again with `totp`. }
        '403': { description: The customer of the user is suspended. The panel gives this answer only to a user who also gave a correct TOTP code. A user with no TOTP gets the 422 answer with an error on `email`. }
        '429': { description: Too many attempts from this address, or too many failed attempts for this account. The Retry-After header gives the number of seconds to wait. }

  /v1/auth/methods:
    get:
      tags: [Auth]
      summary: The ways to sign in
      description: >-
        The ways to sign in that the sign-in page shows, for the domain of the request. A person who
        has not signed in can read it.
      security: []
      responses:
        '200':
          description: The ways to sign in.
          content:
            application/json:
              schema:
                type: object
                required: [passwordReset, passkeys, providers]
                properties:
                  passwordReset:
                    type: boolean
                    description: >-
                      The panel can send an email with a link to set a new password: an SMTP server
                      is on for the reseller of this panel domain, or for the panel.
                  passkeys:
                    type: boolean
                    description: >-
                      Passkeys work on this domain (FR-103). A passkey works only on the panel
                      domain or on the panel domain of a reseller brand.
                  providers:
                    type: array
                    description: >-
                      The identity providers for single sign-on. The list is empty on a domain that is
                      not the panel domain. To sign in, the browser goes to /v1/auth/sso/{id}.
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        name: { type: string }

  /v1/auth/password-reset:
    post:
      tags: [Auth]
      summary: Ask for an email to set a new password
      description: >-
        Sends an email with a link to set a new password. The answer is the same for each email,
        also for an email with no user. The link goes to the panel domain of the brand of the user.
        The code of the link is after `#` in the link. A link works one time only, for 60 minutes,
        and a new link stops the earlier link. The panel sends one link in each minute for one
        user. A new password does not turn off TOTP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email, maxLength: 255 }
      responses:
        '202':
          description: The panel sends the email if a user has this email.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
        '422': { $ref: '#/components/responses/Invalid' }
        '429': { description: More than 5 requests in one minute from this address. }

  /v1/auth/password-reset/confirm:
    post:
      tags: [Auth]
      summary: Set a new password with the link
      description: >-
        Sets a new password with the email and the code from the link. The panel then signs out
        all sessions of the user, deletes the API tokens of the user and removes the sign-in lock
        for the network of the request. TOTP stays on. A code works one time only.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, token, password, password_confirmation]
              properties:
                email: { type: string, format: email, maxLength: 255 }
                token: { type: string, maxLength: 200, description: The code from the link. }
                password: { type: string, minLength: 12 }
                password_confirmation: { type: string }
      responses:
        '204': { description: The password is changed. Sign in with the new password. }
        '422':
          description: The code is not correct or is too old (an error on `token`), or the new password is not valid.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
        '429': { description: More than 10 requests in one minute from this address. }

  /v1/auth/passkey/options:
    post:
      tags: [Auth]
      summary: Start to sign in with a passkey
      description: >-
        The first step to sign in with a passkey (FR-103). Give `publicKey` to the browser
        (PublicKeyCredential.parseRequestOptionsFromJSON). The browser shows the passkeys of the
        domain, so the request has no email. The challenge works one time only, for 5 minutes.
      security: []
      responses:
        '200':
          description: The options for the browser.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PasskeyCeremony' }
        '409': { description: Passkeys do not work on this domain. Open the panel at its own domain. }
        '429': { description: Too many requests from this address. }

  /v1/auth/passkey:
    post:
      tags: [Auth]
      summary: Sign in with a passkey
      description: >-
        The second step to sign in with a passkey. Give the answer of the browser
        (PublicKeyCredential.toJSON()). The passkey must verify the user, for example with a
        fingerprint, so the panel does not ask for a TOTP code. The passkey must be for the domain
        of the challenge. The token expires after 12 hours, as for a sign-in with a password.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ceremony, credential]
              properties:
                ceremony: { type: string, maxLength: 100, description: The `ceremony` of /v1/auth/passkey/options. }
                credential: { type: object, additionalProperties: true, description: The JSON of the browser (PublicKeyCredential.toJSON()). }
                deviceId: { type: string, maxLength: 100, description: The same as for /v1/auth/login. }
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  expiresAt: { type: string, format: date-time }
        '403': { description: The account is suspended, or the user cannot sign in. }
        '422': { description: 'The challenge is too old or was used (error on `ceremony`), or the panel does not know the passkey or cannot verify it (error on `credential`).', content: { application/json: { schema: { $ref: '#/components/schemas/ValidationError' } } } }
        '429': { description: Too many requests from this address. }

  /v1/auth/sso/{id}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    get:
      tags: [Auth]
      summary: Start single sign-on
      description: >-
        For a browser navigation, not for a script. The answer sends the browser to the identity
        provider, and sets a cookie that binds the sign-in to this browser. With `connect`, the
        sign-in connects the account of the provider to a user (/v1/me/identities/{id}). Single
        sign-on works only on the panel domain. When the provider is off or not available, the
        answer sends the browser to `/login#sso-error=<reason>`.
      security: []
      parameters:
        - { name: connect, in: query, required: false, schema: { type: string }, description: 'The ticket of /v1/me/identities/{id}.' }
      responses:
        '302': { description: The address of the identity provider. }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Single sign-on does not work on this domain. }

  /v1/auth/sso/oidc/callback:
    get:
      tags: [Auth]
      summary: The redirect address for the OpenID Connect providers
      description: >-
        The address is the same for all the providers: the state identifies the provider. The
        provider sends the browser to this address with a code. The panel changes the code into
        an ID token, and verifies the signature, the issuer, the audience, the time and the nonce of
        the token. The answer sends the browser to `/sso#ticket=<ticket>`, to
        `/settings#sso-connected=<id>` after a connection, or to `/login#sso-error=<reason>`. The
        reasons are `expired`, `cancelled`, `failed`, `no-account`, `taken`, `disabled` and
        `unavailable`.
      security: []
      parameters:
        - { name: code, in: query, required: false, schema: { type: string } }
        - { name: state, in: query, required: true, schema: { type: string } }
        - { name: error, in: query, required: false, schema: { type: string } }
      responses:
        '302': { description: The address of the web panel. }

  /v1/auth/sso/saml/acs:
    post:
      tags: [Auth]
      summary: The assertion consumer service for the SAML providers
      description: >-
        The address is the same for all the providers: the RelayState identifies the provider. The
        provider posts the SAML answer (HTTP-POST binding). The issuer of the answer must be the
        provider, and the answer or its assertion must have a valid signature of the certificate of
        the provider. The answers are the same as for /v1/auth/sso/oidc/callback.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [SAMLResponse, RelayState]
              properties:
                SAMLResponse: { type: string }
                RelayState: { type: string }
      responses:
        '302': { description: The address of the web panel. }

  /v1/auth/sso/saml/metadata:
    get:
      tags: [Auth]
      summary: The SAML metadata of the panel
      description: The metadata of the panel as a SAML service provider, for all the SAML providers. The address is also the entity ID of the panel.
      security: []
      responses:
        '200':
          description: The metadata.
          content:
            application/samlmetadata+xml:
              schema: { type: string }

  /v1/auth/sso/complete:
    post:
      tags: [Auth]
      summary: End single sign-on
      description: >-
        Changes the ticket of /v1/auth/sso/oidc/callback or /v1/auth/sso/saml/acs into a session
        token. A ticket works for 5 minutes. When TOTP is on for the user, a request with no `totp`
        gives status 422 with `totpRequired: true`, as for /v1/auth/login. After 5 wrong codes, the
        ticket stops. The token expires after 12 hours.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ticket]
              properties:
                ticket: { type: string, maxLength: 100 }
                totp: { type: string, pattern: '^[0-9]{6}$' }
                deviceId: { type: string, maxLength: 100, description: The same as for /v1/auth/login. }
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  expiresAt: { type: string, format: date-time }
        '403': { description: The account is suspended. }
        '422':
          description: The ticket is too old (error on `ticket`), or the code is missing or not correct (error on `totp`).
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/ValidationError' }
                  - type: object
                    properties:
                      totpRequired: { type: boolean }
        '429': { description: Too many failed attempts for this account. }

  /v1/auth/logout:
    post:
      tags: [Auth]
      summary: Sign out
      description: Deletes the token of this request. The token does not work after this request.
      responses:
        '204': { description: Signed out. }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /v1/me:
    get:
      tags: [Auth]
      summary: Get the user of the token
      description: An administrator or a reseller must turn on TOTP. Until then (totpSetupRequired), a sign-in session can use only this route, /v1/me/password, /v1/me/totp/setup, /v1/me/totp/enable and /v1/auth/logout. Each other route gives 403 with the code totp_setup_required. An API token is not in the scope of this rule.
      responses:
        '200':
          description: The user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /v1/me/password:
    put:
      tags: [Auth]
      summary: Change your password
      description: Needs a sign-in session token. An API token cannot change the password. Give the current password, and your TOTP code when TOTP is on. The panel signs out all other sessions of the user and deletes all API tokens of the user. A user with a temporary password (mustChangePassword) can use only this route, /v1/me and /v1/auth/logout. Each other route gives 403 with the code password_change_required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, password, password_confirmation]
              properties:
                currentPassword: { type: string }
                password: { type: string, minLength: 12 }
                password_confirmation: { type: string }
                totp: { type: string, pattern: '^[0-9]{6}$' }
      responses:
        '204': { description: Changed. }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Invalid' }

  /v1/me/totp/setup:
    post:
      tags: [Auth]
      summary: Start to set up TOTP
      description: Needs a sign-in session token. The panel makes a new TOTP key and keeps it for 10 minutes. TOTP is on only after you confirm a code with /v1/me/totp/enable.
      responses:
        '200':
          description: The new key, and an otpauth URI for a QR code.
          content:
            application/json:
              schema:
                type: object
                properties:
                  secret: { type: string }
                  uri: { type: string }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: TOTP is already on. }

  /v1/me/totp/enable:
    post:
      tags: [Auth]
      summary: Turn on TOTP
      description: Needs a sign-in session token. Give your password and a code from the app for the key from /v1/me/totp/setup.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, code]
              properties:
                password: { type: string }
                code: { type: string, pattern: '^[0-9]{6}$' }
      responses:
        '204': { description: TOTP is on. }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: TOTP is already on. }
        '422': { $ref: '#/components/responses/Invalid' }

  /v1/me/totp/disable:
    post:
      tags: [Auth]
      summary: Turn off TOTP
      description: Needs a sign-in session token. Give your password and a code from the app.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, code]
              properties:
                password: { type: string }
                code: { type: string, pattern: '^[0-9]{6}$' }
      responses:
        '204': { description: TOTP is off. }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Invalid' }

  /v1/me/passkeys:
    get:
      tags: [Auth]
      summary: List your passkeys
      description: The passkeys of the user of the token (FR-103). An API token can read the list, but only a sign-in session can change it.
      responses:
        '200':
          description: The passkeys, the oldest first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Passkey' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    post:
      tags: [Auth]
      summary: Add a passkey
      description: >-
        The second step to add a passkey. Needs a sign-in session token. Give the answer of the
        browser (PublicKeyCredential.toJSON()) for the options of /v1/me/passkeys/options. The
        passkey must verify the user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ceremony, name, credential]
              properties:
                ceremony: { type: string, maxLength: 100, description: The `ceremony` of /v1/me/passkeys/options. }
                name: { type: string, maxLength: 100, description: 'A name for the passkey, for example "iPhone".' }
                credential: { type: object, additionalProperties: true, description: The JSON of the browser (PublicKeyCredential.toJSON()). }
      responses:
        '201':
          description: The passkey.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Passkey' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Invalid' }

  /v1/me/passkeys/options:
    post:
      tags: [Auth]
      summary: Start to add a passkey
      description: >-
        The first step to add a passkey. Needs a sign-in session token. Give your password, and
        your TOTP code when TOTP is on. After 5 incorrect attempts, the panel refuses for 15
        minutes. Give `publicKey` to the browser (PublicKeyCredential.parseCreationOptionsFromJSON).
        The passkey is for the domain of the request. A user can have 20 passkeys.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string }
                totp: { type: string, pattern: '^[0-9]{6}$', description: Necessary when TOTP is on for the user. }
      responses:
        '200':
          description: The options for the browser.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PasskeyCeremony' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Passkeys do not work on this domain. Open the panel at its own domain. }
        '422': { $ref: '#/components/responses/Invalid' }
        '429': { description: Too many incorrect attempts. Wait 15 minutes. }

  /v1/me/passkeys/{id}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    patch:
      tags: [Auth]
      summary: Rename a passkey
      description: Needs a sign-in session token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 100 }
      responses:
        '200':
          description: The passkey.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Passkey' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }
    delete:
      tags: [Auth]
      summary: Remove a passkey
      description: >-
        Needs a sign-in session token. Give your password, and your TOTP code when TOTP is on. The
        passkey stays on the device: remove it there also.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string }
                totp: { type: string, pattern: '^[0-9]{6}$' }
      responses:
        '204': { description: Removed. }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }
        '429': { description: Too many incorrect attempts. Wait 15 minutes. }

  /v1/me/identities:
    get:
      tags: [Auth]
      summary: List the single sign-on providers and your connected accounts
      responses:
        '200':
          description: Each provider that is on, and the account of the user at it.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/UserIdentity' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /v1/me/identities/{id}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    post:
      tags: [Auth]
      summary: Start to connect an account of a provider
      description: >-
        Needs a sign-in session token. Give your password, and your TOTP code when TOTP is on. Open
        `url` in the browser: the user signs in at the provider, and the panel connects the account.
        The address works one time only, for 5 minutes. An account of a provider connects to one
        user only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string }
                totp: { type: string, pattern: '^[0-9]{6}$' }
      responses:
        '200':
          description: The address for the browser.
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: { type: string }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Single sign-on does not work on this domain. }
        '422': { $ref: '#/components/responses/Invalid' }
    delete:
      tags: [Auth]
      summary: Disconnect an account of a provider
      description: Needs a sign-in session token. Give your password, and your TOTP code when TOTP is on.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string }
                totp: { type: string, pattern: '^[0-9]{6}$' }
      responses:
        '204': { description: Disconnected. }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }

  /v1/identity-providers:
    get:
      tags: [Auth]
      summary: List the single sign-on providers
      description: Only for an administrator, with the users scope.
      responses:
        '200':
          description: The providers.
          content:
            application/json:
              schema:
                type: object
                required: [data, serviceProvider]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/IdentityProvider' } }
                  serviceProvider:
                    type: object
                    description: The values to give to a provider. They are the same for all the providers.
                    required: [redirectUri, entityId, acsUrl]
                    properties:
                      redirectUri: { type: string, description: OpenID Connect. Register this address at the provider. }
                      entityId: { type: string, description: SAML. The entity ID of the panel, and the address of its metadata. }
                      acsUrl: { type: string, description: SAML. The assertion consumer service of the panel. }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Auth]
      summary: Add a single sign-on provider
      description: >-
        Needs the sign-in session of an administrator. Give your password, and your TOTP code when
        TOTP is on. For OpenID Connect, the panel reads the discovery document of the issuer.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IdentityProviderInput' }
      responses:
        '201':
          description: The provider.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IdentityProvider' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Invalid' }

  /v1/identity-providers/{id}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    put:
      tags: [Auth]
      summary: Change a single sign-on provider
      description: >-
        Needs the sign-in session of an administrator, with your password and your TOTP code. The
        protocol does not change. With no `clientSecret`, the secret stays.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IdentityProviderInput' }
      responses:
        '200':
          description: The provider.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IdentityProvider' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }
    delete:
      tags: [Auth]
      summary: Remove a single sign-on provider
      description: Needs the sign-in session of an administrator, with your password and your TOTP code. The panel also removes the connected accounts of the users.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string }
                totp: { type: string, pattern: '^[0-9]{6}$' }
      responses:
        '204': { description: Removed. }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }

  /v1/tokens:
    get:
      tags: [Auth]
      summary: List your API tokens
      description: Needs a session token or the tokens:read scope.
      responses:
        '200':
          description: The tokens. The secret part is not shown again.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Token' } }
    post:
      tags: [Auth]
      summary: Make an API token
      description: Needs a session token or the tokens:write scope. The new token can have only the scopes of the token that makes it. Give your password, and your TOTP code when TOTP is on.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, scopes, expiresInDays, password]
              properties:
                name: { type: string, maxLength: 100 }
                scopes: { type: array, minItems: 1, items: { $ref: '#/components/schemas/Scope' } }
                expiresInDays: { type: integer, minimum: 1, maximum: 365 }
                password: { type: string, description: The password of the user. }
                totp: { type: string, pattern: '^[0-9]{6}$', description: Necessary when TOTP is on for the user. }
      responses:
        '201':
          description: The token. Copy it now. The panel shows it only once.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer }
                  token: { type: string }
                  scopes: { type: array, items: { $ref: '#/components/schemas/Scope' } }
                  expiresAt: { type: string, format: date-time }
        '403': { description: The token does not have the tokens:write scope, or it does not have a scope that the new token asks for. }
        '422': { $ref: '#/components/responses/Invalid' }

  /v1/tokens/{id}:
    delete:
      tags: [Auth]
      summary: Revoke an API token
      description: Needs a session token or the tokens:write scope.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '204': { description: Revoked. }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/websites:
    get:
      tags: [Websites]
      summary: List websites
      description: Administrators see all websites. Resellers see the websites of their customers. Owners see their own websites.
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/WebsiteStatus' } }
        - { name: q, in: query, description: Part of the website name., schema: { type: string } }
        - { name: perPage, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: One page of websites.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Website' } }
                  meta: { type: object }
                  links: { type: object }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Websites]
      summary: Create a website
      description: >-
        FR-201. The panel selects the web server with the fewest websites when you do not give
        `serverId`. A healthy server comes before a degraded server. A server in a different state
        does not get a website. A PHP website starts with the extensions opcache, intl, gd, zip,
        mysqli, pdo_mysql and pdo_pgsql when the plan has them. The edge proxy serves the primary
        domain only after it is verified (refer to "Add a redirect or an alias").


        With `kind` "private" or "worker", the website has no domain and no public address. The
        name in the request is a short name, and the panel makes the name of the website from
        it: the network name, for example `orders-a1b2.internal`. A different website of the
        customer connects to a private website by this name on port 80. A worker runs `command`
        in its container and serves no HTTP. Each kind is a website of the plan of the
        customer. The agent of the server must be from a release with these functions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, imageId]
              properties:
                name: { type: string, description: 'The primary domain, in lower case. For the kinds "private" and "worker": a short name of lower-case letters, digits and "-", for example "queue".' }
                kind: { $ref: '#/components/schemas/WebsiteKind' }
                command: { type: string, maxLength: 1000, description: 'Necessary for the kind "worker": one command line for the shell of the container, for example "php artisan queue:work". It runs in the gVisor sandbox as the Unix user of the website, in the directory /app. Also the start command of a Node.js or Python website, for example "npm start". The default for Node.js is "npm start", and for Python "python app.py". The application listens on the port in the variable PORT (8080). Not permitted for the other websites.' }
                installCommand: { type: [string, 'null'], maxLength: 1000, description: 'Only for a Node.js or Python image: the command that installs the dependencies, for example "npm ci --omit=dev". The default for Node.js is "npm install --omit=dev", and for Python "python -m venv .venv && .venv/bin/pip install -r requirements.txt". An empty value or null means no install step.' }
                application: { type: string, maxLength: 100 }
                imageId: { type: string }
                planId: { type: string, description: The plan of the customer when you do not give it. Only an administrator or the reseller of the customer can give a different plan. }
                serverId: { type: string }
                customerId: { type: string, description: Necessary for administrators and resellers. }
                documentRoot: { type: string, maxLength: 200, description: 'The directory of the website that the web server serves, relative to the directory of the website, for example "public". The default is ".". Not for an application image.' }
      responses:
        '202': { $ref: '#/components/responses/WebsiteJob' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Invalid' }

  /v1/websites/{id}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    get:
      tags: [Websites]
      summary: Get a website
      responses:
        '200':
          description: The website.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Website' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Websites]
      summary: Change a website
      description: Only administrators can set `limits` (FR-202). Only an administrator or the reseller of the customer can change `planId`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                application: { type: string }
                planId: { type: string }
                limits: { $ref: '#/components/schemas/Limits' }
                managedByTerraform: { type: boolean }
      responses:
        '200':
          description: Changed. `job` is null when the agent does not have to do anything.
          content:
            application/json:
              schema:
                type: object
                properties:
                  website: { $ref: '#/components/schemas/Website' }
                  job: { oneOf: [{ $ref: '#/components/schemas/Job' }, { type: 'null' }] }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Invalid' }
    delete:
      tags: [Websites]
      summary: Remove a website
      description: >-
        The agent of the server of the website removes the website, with its databases and its
        database users. For a website with a database in a database server on a different
        server, the panel first sends a job for each such database and each such database user
        to the agent of that server, and the response has the first of these jobs. The panel
        removes the website when these jobs are complete. When one fails, the website stays:
        remove it again.
      responses:
        '202': { $ref: '#/components/responses/JobOnly' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/websites/{id}/power:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    post:
      tags: [Websites]
      summary: Start, stop or restart a website
      description: >-
        The panel refuses start and restart with status 409 while the customer of the website is
        suspended. The panel refuses all actions with status 422 for a website with the status
        `failed`, because the server has no container for it. Refer to "Make a failed website
        again". The panel refuses a stop with status 409 for a website that is stopped.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [start, stop, restart] }
      responses:
        '202': { $ref: '#/components/responses/JobOnly' }
        '409': { description: The customer of the website is suspended, or the status of the website does not permit the action. }
        '422': { $ref: '#/components/responses/Invalid' }

  /v1/websites/{id}/retry:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    post:
      tags: [Websites]
      summary: Make a failed website again
      description: >-
        Starts the job that makes the website again, with the settings that the website has now.
        Use this request when the first job failed, for example because the server could not pull
        the image. The job keeps what a previous run made. The panel accepts the request only for
        a website with the status `failed`. A staging copy cannot be made again: delete it, and
        make the staging copy again.
      responses:
        '202': { $ref: '#/components/responses/WebsiteJob' }
        '409': { description: The customer of the website is suspended. }
        '422': { $ref: '#/components/responses/Invalid' }

  /v1/websites/{id}/staging:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    post:
      tags: [Websites]
      summary: Make a staging copy
      description: >-
        FR-205. The copy has the name `staging.<domain>`. It gets a copy of each MariaDB and
        PostgreSQL database of the website. Each copy is in the database server of its source
        database, and each database server gets one new database user with read-write access to
        the copies in it. The data of a Valkey database is not copied: the copy gets a new, empty
        Valkey database, with its own user, for each Valkey database of the website. The response
        shows the passwords of the new users once. The response is 422 when a database server
        has no space for the copies, and when the website has a database in a database server
        on a different server.
      responses:
        '202':
          description: The job makes the copy.
          content:
            application/json:
              schema:
                type: object
                properties:
                  website: { $ref: '#/components/schemas/Website' }
                  job: { $ref: '#/components/schemas/Job' }
                  databaseCredentials:
                    type: array
                    items:
                      type: object
                      properties:
                        engine: { $ref: '#/components/schemas/Engine' }
                        user: { type: string }
                        password: { type: string }
                        databases: { type: array, items: { type: string } }
                        host: { type: string, description: The host name that the application of the copy connects to. }
                        port: { type: integer }
                        databaseServerId: { type: string }
        '422': { $ref: '#/components/responses/Invalid' }

  /v1/websites/{websiteId}/domains:
    parameters:
      - { $ref: '#/components/parameters/WebsiteId' }
    post:
      tags: [Websites]
      summary: Add a redirect or an alias
      description: >-
        You cannot add the panel domain, a reseller panel domain, the host name of a server, or a
        sub-domain of one of these. The edge proxy serves the domain only after you prove that you
        control it. Add the TXT record in "verification", then verify the domain. A domain is
        verified at once when you are an administrator, or when it is a sub-domain of a verified
        domain of the same customer. A website can have 50 domains. A customer can add 30
        domains in one hour (status 429 after that). When a different customer has the domain,
        the error message gives a TXT record. With that record, you prove that you control the
        domain, and the panel takes the domain from the other website.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, kind]
              properties:
                name: { type: string }
                kind: { type: string, enum: [redirect, alias] }
      responses:
        '202':
          description: The domain. The job is null until the domain is verified.
          content:
            application/json:
              schema:
                type: object
                properties:
                  domain: { $ref: '#/components/schemas/Domain' }
                  job: { oneOf: [{ $ref: '#/components/schemas/Job' }, { type: 'null' }] }
        '422': { $ref: '#/components/responses/Invalid' }

  /v1/websites/{websiteId}/domains/{name}/verify:
    parameters:
      - { $ref: '#/components/parameters/WebsiteId' }
      - { name: name, in: path, required: true, schema: { type: string } }
    post:
      tags: [Websites]
      summary: Verify a domain
      description: The panel reads the TXT record of the domain. When it holds the token, the edge proxy starts to serve the domain.
      responses:
        '202':
          description: The domain is verified. The job adds the domain to the edge proxy.
          content:
            application/json:
              schema:
                type: object
                properties:
                  domain: { $ref: '#/components/schemas/Domain' }
                  job: { oneOf: [{ $ref: '#/components/schemas/Job' }, { type: 'null' }] }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { description: The TXT record does not have the token. }

  /v1/websites/{websiteId}/domains/{name}/primary:
    parameters:
      - { $ref: '#/components/parameters/WebsiteId' }
      - { name: name, in: path, required: true, schema: { type: string } }
    post:
      tags: [Websites]
      summary: Make a domain the primary domain
      description: >-
        FR-401. The domain must be verified. The old primary domain becomes an alias. The website
        takes the name of the new primary domain.
      responses:
        '202': { $ref: '#/components/responses/WebsiteJob' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }

  /v1/websites/{websiteId}/domains/{name}/check:
    parameters:
      - { $ref: '#/components/parameters/WebsiteId' }
      - { name: name, in: path, required: true, schema: { type: string } }
    post:
      tags: [Websites]
      summary: Check the DNS of a domain again
      description: >-
        FR-402 and FR-403. The agent checks the DNS of the domain. When the domain points to the
        server, the edge proxy gets a certificate.
      responses:
        '202':
          description: The job checks the domain.
          content:
            application/json:
              schema:
                type: object
                properties:
                  domain: { $ref: '#/components/schemas/Domain' }
                  job: { $ref: '#/components/schemas/Job' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }

  /v1/websites/{websiteId}/sftp:
    parameters:
      - { $ref: '#/components/parameters/WebsiteId' }
    put:
      tags: [Websites]
      summary: Set the SFTP access of a website
      description: >-
        Spec section 10. The owner signs in with the user name of the website and an SSH key.
        The server refuses passwords, and allows only SFTP, in the directory of the website. To
        turn on SFTP, give at least one key. SFTP does not turn on for a website that the panel
        could not make (422) or for a suspended customer (409). A suspension turns SFTP off and
        stops the open sessions. When the suspension ends, the websites that had SFTP get it
        again with the same keys.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
                authorizedKeys: { type: array, maxItems: 20, items: { type: string, description: 'One OpenSSH public key, for example "ssh-ed25519 AAAA... me@laptop".' } }
      responses:
        '202':
          description: The job sets the access.
          content:
            application/json:
              schema:
                type: object
                properties:
                  sftp: { $ref: '#/components/schemas/Sftp' }
                  job: { $ref: '#/components/schemas/Job' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: The customer of the website is suspended. }
        '422': { $ref: '#/components/responses/Invalid' }

  /v1/websites/{websiteId}/domains/{name}:
    parameters:
      - { $ref: '#/components/parameters/WebsiteId' }
      - { name: name, in: path, required: true, schema: { type: string } }
    delete:
      tags: [Websites]
      summary: Remove a domain
      description: You cannot remove the primary domain. The job is null when the domain was not verified.
      responses:
        '202': { $ref: '#/components/responses/JobOnly' }
        '422': { $ref: '#/components/responses/Invalid' }

  /v1/websites/{websiteId}/runtime:
    parameters:
      - { $ref: '#/components/parameters/WebsiteId' }
    put:
      tags: [Websites]
      summary: Change the runtime
      description: |
        FR-303 to FR-305. Change the image, the PHP extensions, php.ini values or worker mode.
        For a Node.js or Python website: change the version (an image of the same family), the
        start command or the install command. A change of the version of a Node.js or Python
        website with an install command makes the job `InstallDependencies`: the dependencies
        are for one version.
        The agent starts the new container, does a health check, and only then sends traffic to it.
        If the health check fails, the website stays on the previous image. For a website with the
        status `failed`, the panel makes the website again with the new settings: the job has the
        action `CreateWebsite`, and there is no previous image to go back to.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                imageId: { type: string }
                workerMode: { type: boolean, description: Only for FrankenPHP. }
                command: { type: string, maxLength: 1000, description: 'Only for a worker, or a Node.js or Python website: the new start command. The agent starts a new container with it.' }
                installCommand: { type: [string, 'null'], maxLength: 1000, description: 'Only for a Node.js or Python website: the new install command. It runs at the next install, deploy or change of the version. An empty value or null means no install step.' }
                documentRoot: { type: string, maxLength: 200, description: 'Batch 1, finding 11. The directory in /app that the web server serves, for example "web". "." is /app. The default is "public".' }
                extensions: { type: array, items: { type: string }, description: Only the extensions of the plan. }
                phpIni:
                  type: object
                  description: >-
                    Permitted keys and values: memory_limit (16M to the memory limit of the website),
                    upload_max_filesize and post_max_size (a size up to 16G), max_execution_time (1 to
                    3600), max_input_vars (100 to 100000), display_errors (On or Off), date.timezone (a
                    time zone), opcache.memory_consumption (8 to the memory limit in megabytes). The
                    panel refuses -1 (no limit).
                  additionalProperties: { type: string }
      responses:
        '202': { $ref: '#/components/responses/WebsiteJob' }
        '200': { description: Nothing changed. `job` is null. }
        '422': { $ref: '#/components/responses/Invalid' }

  /v1/websites/{websiteId}/runtime/revert:
    parameters:
      - { $ref: '#/components/parameters/WebsiteId' }
    post:
      tags: [Websites]
      summary: Go back to the previous image
      responses:
        '202': { $ref: '#/components/responses/WebsiteJob' }
        '422': { $ref: '#/components/responses/Invalid' }

  /v1/websites/{websiteId}/runtime/install:
    parameters:
      - { $ref: '#/components/parameters/WebsiteId' }
    post:
      tags: [Websites]
      summary: Install the dependencies of a Node.js or Python website
      description: >-
        The agent runs the install command of the website in a build container: the image of the
        website, the gVisor sandbox, the Unix user and the limits of the website, with the
        application directory as the working directory and the environment variables of the
        website. Then it starts a new container and does a health check before it sends traffic
        to it, as for a change of the runtime. If the command fails, the website continues with
        the container that it had. The job has the action `InstallDependencies`.
      responses:
        '202': { $ref: '#/components/responses/JobOnly' }
        '409': { description: The customer of the website is suspended. }
        '422': { $ref: '#/components/responses/Invalid' }

  /v1/websites/{websiteId}/environment:
    parameters:
      - { $ref: '#/components/parameters/WebsiteId' }
    patch:
      tags: [Websites]
      summary: Set or remove environment variables of a website
      description: >-
        Sets each variable with a value, and removes each variable with the value null. Each
        website, of each runtime, has at most 50 variables. The names PORT, HOST, HOME, PATH, PWD
        and the names that start with CF_ are not available. The panel keeps the values
        encrypted, and the API never gives them: `environment` of the website has the names
        only. The agent writes the variables to a file that only the Unix user of the website can
        read, and starts a new container with them, with no stop (a job `SetRuntime`). The build
        commands of a deploy and the install command also get them. If the health check of the
        new container fails, the old container continues with the old values, and the website
        gets the new values at its next start.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [variables]
              properties:
                variables:
                  type: object
                  maxProperties: 50
                  additionalProperties: { type: [string, 'null'], maxLength: 4096 }
                  example: { NODE_ENV: production, OLD_KEY: null }
      responses:
        '202': { $ref: '#/components/responses/WebsiteJob' }
        '200': { description: Nothing changed. `job` is null. }
        '409': { description: The customer of the website is suspended. }
        '422': { $ref: '#/components/responses/Invalid' }

  /v1/websites/{websiteId}/files:
    parameters:
      - { $ref: '#/components/parameters/WebsiteId' }
    get:
      tags: [Files]
      summary: List the files of a directory of a website
      description: >-
        The file manager. The agent does each request as the Unix user of the website, in the
        directory of the website, and gives the answer at once: these routes make no job. A path
        starts with `/`, which is the directory of the website. The container of the website has
        that directory at `/app`. A path has no `.` part and no `..` part. A symbolic link that
        goes out of the directory of the website gives status 403. The list has the directories
        first, and at most 2,000 entries. The routes of the file manager refuse a website that
        the panel could not make (422). When the panel cannot connect to the server, the status
        is 503.
      parameters:
        - { name: path, in: query, schema: { type: string, default: / } }
      responses:
        '200':
          description: The entries of the directory.
          content:
            application/json:
              schema:
                type: object
                properties:
                  path: { type: string }
                  entries: { type: array, items: { $ref: '#/components/schemas/FileEntry' } }
                  truncated: { type: boolean, description: True when the directory has more entries than the list. }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }
        '503': { description: The panel cannot connect to the server of the website. }
    delete:
      tags: [Files]
      summary: Delete a file or a directory of a website
      description: A directory goes with all that it contains. You cannot delete `/`. A suspended customer cannot change files (409).
      parameters:
        - { name: path, in: query, required: true, schema: { type: string } }
      responses:
        '204': { description: Deleted. }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: The customer of the website is suspended. }
        '422': { $ref: '#/components/responses/Invalid' }
        '503': { description: The panel cannot connect to the server of the website. }

  /v1/websites/{websiteId}/files/content:
    parameters:
      - { $ref: '#/components/parameters/WebsiteId' }
    get:
      tags: [Files]
      summary: Read a file of a website
      description: >-
        The file has at most 2 MB. Use SFTP for a larger file. A file that is UTF-8 text has the
        encoding `utf8`. Each other file has the encoding `base64`.
      parameters:
        - { name: path, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: The file and its content.
          content:
            application/json:
              schema:
                type: object
                properties:
                  file: { $ref: '#/components/schemas/FileEntry' }
                  encoding: { type: string, enum: [utf8, base64] }
                  content: { type: string }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }
        '503': { description: The panel cannot connect to the server of the website. }
    put:
      tags: [Files]
      summary: Write a file of a website
      description: >-
        Makes the file, or replaces its content in one step. The file has at most 5 MB. Use SFTP
        for a larger file. A file that exists keeps its permission bits. The directory of the
        file must exist. With `createOnly`, a file that exists gives status 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path, content]
              properties:
                path: { type: string, example: /public/index.php }
                content: { type: string }
                encoding: { type: string, enum: [utf8, base64], default: utf8 }
                createOnly: { type: boolean, default: false }
      responses:
        '200':
          description: The file.
          content:
            application/json:
              schema:
                type: object
                properties:
                  file: { $ref: '#/components/schemas/FileEntry' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'The file exists already, or the customer of the website is suspended.' }
        '422': { $ref: '#/components/responses/Invalid' }
        '503': { description: The panel cannot connect to the server of the website. }

  /v1/websites/{websiteId}/files/directories:
    parameters:
      - { $ref: '#/components/parameters/WebsiteId' }
    post:
      tags: [Files]
      summary: Make a directory in the files of a website
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path: { type: string, example: /public/images }
      responses:
        '201':
          description: The directory.
          content:
            application/json:
              schema:
                type: object
                properties:
                  file: { $ref: '#/components/schemas/FileEntry' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'A file or a directory with this name exists already, or the customer of the website is suspended.' }
        '422': { $ref: '#/components/responses/Invalid' }
        '503': { description: The panel cannot connect to the server of the website. }

  /v1/websites/{websiteId}/files/move:
    parameters:
      - { $ref: '#/components/parameters/WebsiteId' }
    post:
      tags: [Files]
      summary: Move or rename a file or a directory of a website
      description: The route does not replace a path that exists (409).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from, to]
              properties:
                from: { type: string }
                to: { type: string }
      responses:
        '200':
          description: The file or the directory at its new path.
          content:
            application/json:
              schema:
                type: object
                properties:
                  file: { $ref: '#/components/schemas/FileEntry' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'A file or a directory with the new name exists already, or the customer of the website is suspended.' }
        '422': { $ref: '#/components/responses/Invalid' }
        '503': { description: The panel cannot connect to the server of the website. }

  /v1/websites/{websiteId}/logs:
    parameters:
      - { $ref: '#/components/parameters/WebsiteId' }
    get:
      tags: [Websites]
      summary: Read the last log lines of a website
      description: >-
        The output of the container of the website, oldest line first. The stream `access` is
        the standard output, which has the access log of the runtime images as JSON. The stream
        `error` is the standard error, which has the errors of the web server and of PHP. The
        server keeps the last 10 MB. A website gets its log file at its first start with an
        agent that has this method: restart an older website one time.
      parameters:
        - { name: lines, in: query, schema: { type: integer, minimum: 1, maximum: 2000, default: 200 }, description: The number of lines that the agent reads from the end of the log. }
        - { name: stream, in: query, schema: { type: string, enum: [access, error] }, description: Only the lines of this stream. }
      responses:
        '200':
          description: The log lines.
          content:
            application/json:
              schema:
                type: object
                properties:
                  lines:
                    type: array
                    items:
                      type: object
                      properties:
                        at: { type: string, format: date-time }
                        stream: { type: string, enum: [access, error] }
                        text: { type: string }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }
        '503': { description: The panel cannot connect to the server of the website. }

  /v1/websites/{websiteId}/usage:
    parameters:
      - { $ref: '#/components/parameters/WebsiteId' }
    get:
      tags: [Usage]
      summary: Read the usage history of a website
      description: >-
        The resource use of the website for a graph. The agent reports each minute. The panel
        keeps buckets of 5 minutes for 8 days, and buckets of 1 hour for 400 days. The range
        `24h` has a point for each 5 minutes, `7d` for each hour, `30d` for each 3 hours, `90d`
        for each 12 hours and `1y` for each 2 days. A point with no report has null values.
        The bandwidth is the traffic of the domains of the website through the edge proxy in
        the current calendar month (UTC).
      parameters:
        - { $ref: '#/components/parameters/UsageRange' }
      responses:
        '200':
          description: The history.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/UsageHistory' }
                  - type: object
                    properties:
                      limits: { $ref: '#/components/schemas/Limits' }
                      bandwidth:
                        type: object
                        properties:
                          month: { type: string, example: '2026-11' }
                          bytes: { type: integer }
                          limitBytes: { type: integer, description: 0 means no limit. }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }

  /v1/usage-alerts:
    get:
      tags: [Usage]
      summary: List the usage alerts
      description: >-
        An alert opens when a resource of a website, a server or a database server reaches the
        warning percent of its limit, and becomes critical at the critical percent. It closes
        when the use goes 5 points below the warning percent. CPU and memory use the average of
        the last 30 minutes. An administrator sees all alerts, also those of the servers. A
        reseller sees the alerts of its customers, and an owner the alerts of their websites
        and database servers. The panel does not stop a website at its limit because of an
        alert. The panel fires the Laravel events `UsageAlertRaised` and `UsageAlertResolved`
        for delivery, for example by email.
      parameters:
        - { name: state, in: query, schema: { type: string, enum: [open, resolved, all], default: open } }
        - { name: subjectType, in: query, schema: { type: string, enum: [website, server, database_server] } }
        - { name: subjectId, in: query, schema: { type: string } }
      responses:
        '200':
          description: The alerts, open and critical first. At most 200.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/UsageAlert' } }
                  settings: { $ref: '#/components/schemas/UsageAlertSettings' }
        '422': { $ref: '#/components/responses/Invalid' }

  /v1/websites/{websiteId}/cron-jobs:
    parameters:
      - { $ref: '#/components/parameters/WebsiteId' }
    get:
      tags: [Cron jobs]
      summary: List the cron jobs of a website
      responses:
        '200':
          description: The cron jobs.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/CronJob' } }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Cron jobs]
      summary: Add a cron job to a website
      description: >-
        The agent runs the command with `sh -c` in the directory `/app` of the container of the
        website, as the Unix user of the website, with the limits of the website. The schedule
        has the five fields of cron: minute, hour, day of the month, month and day of the week.
        Its time is UTC. A command that still runs does not start again, and the agent stops a
        command after 1 hour. A stopped website has no runs. A website can have 20 cron jobs.
        The job sends all cron jobs of the website to the agent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [schedule, command]
              properties:
                schedule: { type: string, example: '*/5 * * * *' }
                command: { type: string, maxLength: 1000, example: php artisan schedule:run, description: One line. }
                enabled: { type: boolean, default: true }
      responses:
        '202': { $ref: '#/components/responses/CronJobJob' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: The customer of the website is suspended. }
        '422': { $ref: '#/components/responses/Invalid' }

  /v1/websites/{websiteId}/cron-jobs/{cronJobId}:
    parameters:
      - { $ref: '#/components/parameters/WebsiteId' }
      - { name: cronJobId, in: path, required: true, schema: { type: string } }
    patch:
      tags: [Cron jobs]
      summary: Change a cron job, or turn it on or off
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                schedule: { type: string }
                command: { type: string, maxLength: 1000 }
                enabled: { type: boolean }
      responses:
        '202': { $ref: '#/components/responses/CronJobJob' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: The customer of the website is suspended. }
        '422': { $ref: '#/components/responses/Invalid' }
    delete:
      tags: [Cron jobs]
      summary: Delete a cron job
      responses:
        '202': { $ref: '#/components/responses/JobOnly' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: The customer of the website is suspended. }

  /v1/websites/{websiteId}/cron-jobs/{cronJobId}/run:
    parameters:
      - { $ref: '#/components/parameters/WebsiteId' }
      - { name: cronJobId, in: path, required: true, schema: { type: string } }
    post:
      tags: [Cron jobs]
      summary: Run the command of a cron job now
      description: >-
        The job fails when the command gives an exit code that is not 0. When the job is
        complete, the cron job has the result in `lastRunAt`, `lastExitCode` and `lastOutput`.
      responses:
        '202': { $ref: '#/components/responses/JobOnly' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'The website does not run, or its customer is suspended.' }

  /v1/websites/{websiteId}/commands:
    parameters:
      - { $ref: '#/components/parameters/WebsiteId' }
    get:
      tags: [Commands]
      summary: List the command log of a website
      description: >-
        Each command that a user ran in the container of the website, with who ran it, when,
        from which address and the result. The newest command is first. The list has no output:
        get one command for its output. A user who is not an administrator sees a command of an
        administrator or of the provider with the name "Administrator" or "Your provider" and
        with no address.
      parameters:
        - { name: source, in: query, schema: { type: string, enum: [run] } }
        - { name: q, in: query, description: A part of the command text., schema: { type: string, maxLength: 200 } }
        - { name: perPage, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: One page of the command log.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/WebsiteCommand' } }
                  meta:
                    type: object
                    properties:
                      currentPage: { type: integer }
                      lastPage: { type: integer }
                      total: { type: integer }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }
    post:
      tags: [Commands]
      summary: Run a command now
      description: >-
        The agent runs the command with `sh -c` in the directory `/app` of the container of the
        website, as the Unix user of the website, with the limits of the website. The command has
        no terminal and no input. The panel adds the command to the command log before it sends
        the job. The job succeeds when the command ran, also when its exit code is not 0. When the
        job is complete, the command has the exit code and the last 64 KiB of the output. A
        website can run 2 commands at the same time.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [command]
              properties:
                command: { type: string, maxLength: 1000, example: php artisan migrate --force, description: One line. }
                timeoutSeconds: { type: integer, minimum: 1, maximum: 3600, default: 600, description: The agent stops the command after this time. }
      responses:
        '202':
          description: The entry of the command log, and the job that runs the command.
          content:
            application/json:
              schema:
                type: object
                properties:
                  command: { $ref: '#/components/schemas/WebsiteCommand' }
                  job: { $ref: '#/components/schemas/Job' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'The website does not run, its customer is suspended, or 2 commands of the website run now.' }
        '422': { $ref: '#/components/responses/Invalid' }

  /v1/websites/{websiteId}/commands/{commandId}:
    parameters:
      - { $ref: '#/components/parameters/WebsiteId' }
      - { name: commandId, in: path, required: true, schema: { type: string } }
    get:
      tags: [Commands]
      summary: Get one command of the command log, with its output
      responses:
        '200':
          description: The command.
          content:
            application/json:
              schema:
                type: object
                properties:
                  command:
                    allOf:
                      - { $ref: '#/components/schemas/WebsiteCommand' }
                      - type: object
                        properties:
                          output: { type: [string, 'null'], description: 'The end of the standard output and the standard error. For a command that did not start, the reason.' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/websites/{websiteId}/deploy:
    parameters:
      - { $ref: '#/components/parameters/WebsiteId' }
    get:
      tags: [Deploys]
      summary: Show the Git repository and the releases of a website
      responses:
        '200':
          description: The repository, or null when the website has none, and the last 20 releases.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Deploy' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Deploys]
      summary: Connect a website to a Git repository, or change the deploy settings
      description: >-
        The repository is an `https://` address with no user name and no password, or an SSH
        address such as `git@github.com:acme/shop.git`. For a private repository, use an SSH
        address and add `deployKey` to the repository as a read-only deploy key. The panel makes
        the key of the website at the first request. The route starts no deploy.


        Each deploy makes a release: the directory `releases/<id>` in the files of the website.
        The agent gets the code and runs the build commands in a build container: a container
        from the image of the website, as the Unix user of the website, in a gVisor sandbox,
        with the limits of the website. Thus the image must have `git`. The working directory of
        the build commands is the release. The directory `/app/shared` is for the files that all
        releases use, for example an `.env` file. The link `/app/current` points to the release
        that the website serves.


        The migration command runs after the build commands, in the build container, before the
        switch. After the switch, the agent checks the website for 5 minutes. When the check
        fails, the website goes back to the previous release. After a migration command, the
        website keeps the new release, and the owner gets the email `deploy.attention`.


        The trigger `schedule` checks the branch each `checkMinutes` minutes, and deploys each new
        commit one time. A commit whose deploy failed does not deploy again on the next check.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [repository, branch]
              properties:
                repository: { type: string, example: 'git@github.com:acme/shop.git' }
                branch: { type: string, example: main }
                webDirectory: { type: string, default: public, description: 'The directory in the repository that the web server serves. "." is the repository itself.' }
                trigger: { type: string, enum: [manual, webhook, schedule], default: manual, description: 'With "webhook", a signed request to `webhookUrl` starts a deploy. With "schedule", the panel checks the branch each `checkMinutes` minutes.' }
                checkMinutes: { type: integer, minimum: 1, maximum: 1440, default: 5, description: The interval of the branch check for the trigger "schedule". }
                buildCommands: { type: array, maxItems: 10, items: { type: string, maxLength: 1000 }, example: ['composer install --no-dev', 'ln -s /app/shared/.env .env'] }
                migrationCommand: { type: [string, 'null'], maxLength: 1000, example: 'php artisan migrate --force', description: A command that changes the database. Empty or null removes it. }
      responses:
        '200':
          description: The repository and the releases.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Deploy' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }
    delete:
      tags: [Deploys]
      summary: Disconnect the Git repository of a website
      description: >-
        The website continues to serve the release that it has, and its files stay on the
        server. The panel removes the key, the webhook, the secrets and the list of releases.
      responses:
        '204': { description: Disconnected. }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: A deploy is in progress. }

  /v1/websites/{websiteId}/deploy/webhook:
    parameters:
      - { $ref: '#/components/parameters/WebsiteId' }
    post:
      tags: [Deploys]
      summary: Make a new webhook address and secret
      description: >-
        The old address stops at once. Give the new `webhookUrl` and `webhookSecret` to the Git
        host.
      responses:
        '200':
          description: The repository with the new address and secret.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Deploy' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: The customer of the website is suspended. }
        '422': { $ref: '#/components/responses/Invalid' }

  /v1/websites/{websiteId}/deploy/secrets/{name}:
    parameters:
      - { $ref: '#/components/parameters/WebsiteId' }
      - { name: name, in: path, required: true, schema: { type: string, pattern: '^[A-Z_][A-Z0-9_]{0,63}$' } }
    put:
      tags: [Deploys]
      summary: Set a secret of the build commands
      description: >-
        A secret is an environment variable of the build commands. The panel keeps the value
        encrypted, and no route gives it. The agent gets the secrets with each deploy and does
        not keep them. A website can have 50 secrets.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value: { type: string, maxLength: 4096, description: One line. }
      responses:
        '200':
          description: The repository and the releases.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Deploy' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }
    delete:
      tags: [Deploys]
      summary: Remove a secret of the build commands
      responses:
        '200':
          description: The repository and the releases.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Deploy' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }

  /v1/websites/{websiteId}/deploy/releases:
    parameters:
      - { $ref: '#/components/parameters/WebsiteId' }
    post:
      tags: [Deploys]
      summary: Deploy the branch now
      description: >-
        The job gets the code, builds it, runs the migration command, starts a new container
        from the new release, checks it, and only then sends the traffic to it. Then the agent
        checks the website for 5 minutes. If a step or this check fails, the website goes back to
        the release that it had, and the release has the state `failed` with the error. After a
        migration command, a failed check does not go back: the release has `healthError`. The
        server keeps the last 5 releases. A website has one deploy at a time (409).
      responses:
        '202': { $ref: '#/components/responses/ReleaseJob' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'A deploy is in progress, or the customer of the website is suspended.' }
        '422': { $ref: '#/components/responses/Invalid' }

  /v1/websites/{websiteId}/deploy/releases/{releaseId}/activate:
    parameters:
      - { $ref: '#/components/parameters/WebsiteId' }
      - { name: releaseId, in: path, required: true, schema: { type: string } }
    post:
      tags: [Deploys]
      summary: Go back to a release that is on the server
      description: >-
        The job starts the website from the release with no stop, as a deploy does. The release
        must have the state `ready`. The route runs no build command.
      responses:
        '202': { $ref: '#/components/responses/ReleaseJob' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'A deploy is in progress, or the customer of the website is suspended.' }
        '422': { $ref: '#/components/responses/Invalid' }

  /v1/websites/{websiteId}/previews:
    parameters:
      - { $ref: '#/components/parameters/WebsiteId' }
    get:
      tags: [Previews]
      summary: Show the preview settings and the previews of a website
      responses:
        '200':
          description: The settings and the previews.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Previews' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Previews]
      summary: Turn the previews of pull requests on or off, or change their settings
      description: >-
        A website that deploys from Git can get a preview website for each pull request to its
        branch. The webhook of the website (`webhookUrl` of the deploy settings) gets the pull
        request events of GitHub, GitLab, Gitea, Forgejo and Bitbucket Cloud. A preview is a
        website of the plan, with the name `pr-<number>.<domain>`, on the server of the website.
        It deploys the head branch of the pull request. The panel removes it when the pull
        request closes, and removes all previews when the previews go off.


        The customer must control `domain`: it is a sub-domain of a verified domain of the
        customer, or it is in a DNS zone of the customer that the public DNS delegates to the
        panel. Add a wildcard DNS record `*.<domain>` that points to the server of the website.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
                domain: { type: [string, 'null'], example: preview.example.com, description: Required when enabled is true. }
                limit: { type: integer, minimum: 1, maximum: 10, default: 3, description: The largest number of previews at the same time. }
                copyEnvironment: { type: boolean, default: false, description: True gives the environment variables and the build secrets of the website to each preview. }
      responses:
        '200':
          description: The settings and the previews.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Previews' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: The customer of the website is suspended. }
        '422': { $ref: '#/components/responses/Invalid' }
    post:
      tags: [Previews]
      summary: Make the preview of a pull request, or deploy it again
      description: >-
        For a Git host whose pull request events the panel does not read, or for a CI pipeline.
        The webhook does the same for each pull request event. The panel makes no preview when
        the website has `limit` previews, or when the plan has no space for one more website
        (422).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [number, branch]
              properties:
                number: { type: integer, minimum: 1, maximum: 999999, description: The number of the pull request. }
                branch: { type: string, example: feature/export, description: The head branch of the pull request. It must be in the repository of the website. }
                title: { type: [string, 'null'], maxLength: 200 }
                url: { type: [string, 'null'], maxLength: 500, description: The page of the pull request on the Git host. }
      responses:
        '202':
          description: The panel makes the preview or deploys it.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [started, queued, waiting, removing] }
                  message: { type: string }
                  preview: { $ref: '#/components/schemas/Preview' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: The customer of the website is suspended. }
        '422': { $ref: '#/components/responses/Invalid' }

  /v1/websites/{websiteId}/previews/{number}:
    parameters:
      - { $ref: '#/components/parameters/WebsiteId' }
      - { name: number, in: path, required: true, schema: { type: integer } }
    delete:
      tags: [Previews]
      summary: Remove the preview of a pull request
      description: The panel removes the preview website. A preview that the panel could not make has no job.
      responses:
        '202':
          description: The removal started.
          content:
            application/json:
              schema:
                type: object
                properties:
                  job: { oneOf: [{ $ref: '#/components/schemas/Job' }, { type: 'null' }] }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/hooks/deploy/{token}:
    parameters:
      - { name: token, in: path, required: true, schema: { type: string } }
    post:
      tags: [Deploys]
      summary: Start a deploy from a webhook
      description: >-
        The address is `webhookUrl` of the deploy settings. Each request must have a signature
        from `webhookSecret` (401): `X-Hub-Signature-256: sha256=<HMAC-SHA256 of the body>` from
        GitHub, Gitea, Forgejo or a script, `X-Gitea-Signature`, `X-Forgejo-Signature` or
        `X-Gogs-Signature` with the HMAC-SHA256 as hexadecimal, `X-Hub-Signature:
        sha256=<HMAC-SHA256>` from Bitbucket, or `X-Gitlab-Token: <secret>` from GitLab.


        A push to the branch of the website starts a deploy when the trigger is `webhook`. The
        panel reads the push events of GitHub, GitLab, Gitea, Forgejo, Gogs and Bitbucket, and
        `ref` of a different request, for example `refs/heads/main` or `main`. A push to a
        different branch, a tag, a removed branch and a different event start no deploy
        (`ignored`). A push while a deploy is in progress starts a deploy when that deploy is
        complete (`queued`). At most 30 requests in one minute from one address.


        A pull request event of GitHub, GitLab, Gitea, Forgejo, Gogs or Bitbucket Cloud (the
        event header of the Git host) makes, deploys or removes the preview of the pull request,
        when the website has previews. It needs the same signature. It never deploys the branch
        of the website, and it does not need the trigger `webhook`. The panel ignores a pull
        request from a different repository, for example a fork, and a pull request to a
        different branch.
      security: []
      parameters:
        - { name: X-Hub-Signature-256, in: header, required: false, schema: { type: string, example: 'sha256=5d1f...' } }
        - { name: X-Gitlab-Token, in: header, required: false, schema: { type: string } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                ref: { type: string, example: refs/heads/main }
                after: { type: string, description: The ID of the new commit. }
      responses:
        '200':
          description: 'A test request of the Git host (`ok`), a request that starts no deploy (`ignored`), a pull request event that changes no preview, or a preview that the panel could not make (`failed`).'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HookAnswer' }
        '202':
          description: 'The deploy started, or it starts when the deploy in progress is complete, or the panel makes, deploys or removes a preview.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HookAnswer' }
        '401': { description: The request has no correct signature. }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'The panel could not make the website, or its customer is suspended.' }

  /v1/websites/{websiteId}/databases:
    parameters:
      - { $ref: '#/components/parameters/WebsiteId' }
    get:
      tags: [Databases]
      summary: List the databases and database users of a website
      responses:
        '200':
          description: The databases and users.
          content:
            application/json:
              schema:
                type: object
                properties:
                  prefix: { type: string, description: 'The start of each database and user name: the Unix user of the website and an underscore.' }
                  databases:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        engine: { $ref: '#/components/schemas/Engine' }
                        name: { type: string }
                        databaseServerId: { type: string, description: The database server that has the database. }
                        host:
                          type: string
                          description: >-
                            The host name that the application of the website connects to. It is
                            the name of the engine, for example `mariadb.internal`, for a database
                            server on the server of the website. It is the network name, for example
                            `shop-db.internal`, for a database server on a different server.
                        port:
                          type: integer
                          description: >-
                            The port that the application connects to: the port of the database
                            server on the server of the website, or the usual port of the engine
                            for a database server on a different server.
                        sizeBytes: { type: integer, description: Not used for Valkey. }
                        number:
                          type: [integer, 'null']
                          minimum: 1
                          description: >-
                            Valkey only. The database number that the application selects. The value is
                            null until the job that makes the database is complete.
                        keys: { type: [integer, 'null'], description: Valkey only. The number of keys in the last report of the server. }
                  users: { type: array, items: { $ref: '#/components/schemas/DatabaseUser' } }
                  servers:
                    type: array
                    description: >-
                      The database servers that can get a database of this website: those of its
                      customer on its server, then those of its customer on a different server
                      that are in a network with the website. Each one also has `remote`: true
                      for a database server on a different server.
                    items: { $ref: '#/components/schemas/DatabaseServer' }
    post:
      tags: [Databases]
      summary: Create a database
      description: >-
        FR-501 and FR-502. The full name is the prefix of the website and the name that you give,
        for example "acme_x7k2_shop". By default the panel also makes a user with the same name and
        read-write access. Only the website container can connect.


        Each database is in one database server of the customer of the website (see "Database
        servers"). The website container connects to it with the host name `mariadb.internal`,
        `postgres.internal` or `valkey.internal`, and the port of the database server. A website
        cannot connect to the database servers of a different customer.


        `databaseServerId` selects the database server. It can be a database server of the
        customer on a different server that is in a network with the website: the website then
        connects to the network name of the database server, for example `shop-db.internal`,
        on the usual port of the engine. The job goes to the agent of the server of the
        database server. With no `databaseServerId`, the database goes into the first database
        server of the engine that has space, and the database servers on the server of the
        website are first. When the website can use no database server of the engine, the
        panel makes one on the server of the website with the plan of the customer. The response is 422 when the database server has the number of databases
        that its plan allows, and when the plan of the customer allows no more database servers.


        A Valkey database is a database number and a user with the same name in a Valkey
        database server. The application connects to the host `valkey.internal` and the port of
        the database server, with the user name, the password and the database number. The user
        has access to that number only. `createUser` must not be false. The list of the
        databases gives the number when the job is complete.


        The response is 422 when the agent of the server did not report that it can operate
        database servers (see `databaseInstances` of the server), and when it did not report the
        engine (see `databaseEngines` of the server). Update the agent of the server.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [engine, name]
              properties:
                engine: { $ref: '#/components/schemas/Engine' }
                name: { type: string, pattern: '^[a-z0-9][a-z0-9_]{0,31}$', description: The name after the prefix. You can also give the full name. }
                createUser: { type: boolean, default: true }
                databaseServerId:
                  type: [string, 'null']
                  description: A database server of the customer of the website, on the server of the website, with the engine of the database.
      responses:
        '202':
          description: The password is shown only once. The panel does not keep it.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  name: { type: string }
                  user: { type: [string, 'null'] }
                  password: { type: [string, 'null'] }
                  databaseServerId: { type: string }
                  host: { type: string }
                  port: { type: integer }
                  job: { $ref: '#/components/schemas/Job' }
        '422': { $ref: '#/components/responses/Invalid' }

  /v1/websites/{websiteId}/databases/{databaseId}:
    parameters:
      - { $ref: '#/components/parameters/WebsiteId' }
      - { name: databaseId, in: path, required: true, schema: { type: string } }
    delete:
      tags: [Databases]
      summary: Remove a database
      description: >-
        The agent removes the access of each user to the database, then the database. The users
        stay. The user of a Valkey database goes with the database.
      responses:
        '202': { $ref: '#/components/responses/JobOnly' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/websites/{websiteId}/databases/{databaseId}/adminer:
    parameters:
      - { $ref: '#/components/parameters/WebsiteId' }
      - { name: databaseId, in: path, required: true, schema: { type: string } }
    post:
      tags: [Databases]
      summary: Open a database in Adminer
      description: >-
        Single sign-on for the database tool. The panel makes a temporary database user with
        access to this one database, and gives its password in the response one time. The panel
        does not keep the password. Send the fields of `form` to the sign-in form of Adminer at
        `login.url`, as `auth[driver]`, `auth[server]`, `auth[username]`, `auth[password]` and
        `auth[db]`, with a POST request. The web panel does this in a new window.


        Each customer has one Adminer container on the panel server, in its own gVisor sandbox,
        and it can connect only to the database servers of its customer. The first request
        starts it. Wait until `GET /v1/adminer-logins/{id}` gives the status `ready`. The
        temporary database user expires after 60 minutes, and the panel then removes it.
        Adminer opens only MariaDB and PostgreSQL databases: the response is 422 for a Valkey
        database. The response is 409 when the customer is suspended.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                privileges: { type: string, enum: [readonly, readwrite], default: readwrite }
      responses:
        '202':
          description: The panel makes the temporary database user, and starts Adminer if necessary.
          content:
            application/json:
              schema:
                type: object
                properties:
                  login: { $ref: '#/components/schemas/AdminerLogin' }
                  form:
                    type: object
                    description: The fields of the sign-in form of Adminer. Only this response has the password.
                    properties:
                      driver: { type: string, enum: [server, pgsql], description: '"server" is MariaDB.' }
                      server: { type: string, description: 'The name of the database server for Adminer, for example "shop-db.internal" or "mariadb.internal:3307".' }
                      username: { type: string }
                      password: { type: string }
                      db: { type: string }
                  jobs: { type: array, items: { $ref: '#/components/schemas/Job' } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: The customer of the website is suspended. }
        '422': { $ref: '#/components/responses/Invalid' }

  /v1/adminer-logins/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [Databases]
      summary: Get the state of an Adminer sign-in
      description: Only the user who opened the database sees the sign-in. The response has no password.
      responses:
        '200':
          description: The sign-in.
          content:
            application/json:
              schema:
                type: object
                properties:
                  login: { $ref: '#/components/schemas/AdminerLogin' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/websites/{websiteId}/database-users:
    parameters:
      - { $ref: '#/components/parameters/WebsiteId' }
    post:
      tags: [Databases]
      summary: Create a database user
      description: >-
        A user can have access to more than one database of the website, with a permission for each
        database. For example, a sync user can have read-only access to production and read-write
        access to staging. The engine cannot be `valkey`: a Valkey database comes with its user.


        A user is in one database server: the database server of its databases. The response is
        422 when the databases are in more than one database server. A user with no database
        needs `databaseServerId` when the customer has more than one database server of the
        engine on the server of the website.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [engine, name]
              properties:
                engine: { $ref: '#/components/schemas/Engine' }
                name: { type: string, pattern: '^[a-z0-9][a-z0-9_]{0,31}$', description: The name after the prefix. }
                access: { type: string, enum: [website, anywhere], default: website }
                grants: { type: array, items: { $ref: '#/components/schemas/GrantInput' } }
                databaseServerId: { type: [string, 'null'], description: The database server of a user with no database. }
      responses:
        '202': { $ref: '#/components/responses/DatabaseUserJob' }
        '422': { $ref: '#/components/responses/Invalid' }

  /v1/websites/{websiteId}/database-users/{userId}:
    parameters:
      - { $ref: '#/components/parameters/WebsiteId' }
      - { name: userId, in: path, required: true, schema: { type: string } }
    patch:
      tags: [Databases]
      summary: Change a database user
      description: >-
        "grants" replaces all grants of the user. Each database must be in the database server of
        the user. "resetPassword" makes a new password. The user of a Valkey database accepts
        only "resetPassword".
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                access: { type: string, enum: [website, anywhere] }
                grants: { type: array, items: { $ref: '#/components/schemas/GrantInput' } }
                resetPassword: { type: boolean }
      responses:
        '202': { $ref: '#/components/responses/DatabaseUserJob' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }
    delete:
      tags: [Databases]
      summary: Remove a database user
      description: The response is 422 for the user of a Valkey database. Remove the database.
      responses:
        '202': { $ref: '#/components/responses/JobOnly' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }

  /v1/database-servers:
    get:
      tags: [Databases]
      summary: List database servers
      description: >-
        The database servers of the customers that you can see. A customer makes database
        servers as it makes websites. A database server is one container with one engine
        (MariaDB, PostgreSQL or Valkey), its own data and its own limits for CPU, memory and
        disk space. All websites of the customer on the same server can connect to it.
      parameters:
        - { name: customerId, in: query, schema: { type: string } }
        - { name: serverId, in: query, schema: { type: string } }
        - { name: engine, in: query, schema: { $ref: '#/components/schemas/Engine' } }
      responses:
        '200':
          description: The database servers.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/DatabaseServer' } }
    post:
      tags: [Databases]
      summary: Create a database server
      description: >-
        The plan of the customer gives the number of database servers that the customer can
        have (`databaseServers` of the plan). For a reseller, the database servers of its
        customers count too. The new database server gets the plan of the customer: the plan
        gives its limits (`databaseLimits`) and the number of its databases (`databases`). Only
        an administrator, or the reseller of the customer, can select a different plan. Only an
        administrator can set `limits`.


        The first database server of an engine has the usual port of the engine (3306, 5432 or
        6379). A second one of the same engine, for the same customer on the same server, has
        the next port.


        The database server is on a server that has a website of the customer: by default the
        server with the most websites of the customer. The response is 422 when the customer has
        no website, when the agent of the server cannot operate database servers or the engine,
        and when the plan allows no more database servers.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [engine]
              properties:
                engine: { $ref: '#/components/schemas/Engine' }
                name:
                  type: [string, 'null']
                  pattern: '^[a-z0-9]([a-z0-9-]{0,38}[a-z0-9])?$'
                  description: A name for the customer, for example "shop". With none, the name is the engine and a number, for example "mariadb-1".
                customerId: { type: [string, 'null'], description: Default is the customer of the user. }
                planId: { type: [string, 'null'], description: Default is the plan of the customer. }
                serverId: { type: [string, 'null'], description: An administrator can select each server with the web role. Other users can select a server that has a website of the customer. }
                limits: { $ref: '#/components/schemas/DatabaseLimits' }
      responses:
        '202':
          description: The job makes the database server.
          content:
            application/json:
              schema:
                type: object
                properties:
                  databaseServer: { $ref: '#/components/schemas/DatabaseServer' }
                  job: { $ref: '#/components/schemas/Job' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: The customer is suspended. }
        '422': { $ref: '#/components/responses/Invalid' }

  /v1/database-servers/{id}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    get:
      tags: [Databases]
      summary: Get a database server
      responses:
        '200':
          description: The database server.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DatabaseServer' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Databases]
      summary: Change a database server
      description: >-
        Changes the name, the plan or the limits. A new plan gives the database server the
        limits of that plan. Only an administrator, or the reseller of the customer, can select
        the plan, and only an administrator can set `limits`. The response is 422 when the
        database server has more databases than the new plan allows, and when a change of the
        database server is in progress.


        New limits restart the database server. The agent makes the disk larger while the
        database server operates. To make the disk smaller, the agent stops the database server.
        When the data does not fit on the smaller disk, the job fails, and the database server
        keeps its plan and its limits.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, pattern: '^[a-z0-9]([a-z0-9-]{0,38}[a-z0-9])?$' }
                planId: { type: string }
                limits: { $ref: '#/components/schemas/DatabaseLimits' }
      responses:
        '200':
          description: Changed. `job` is null when the limits did not change.
          content:
            application/json:
              schema:
                type: object
                properties:
                  databaseServer: { $ref: '#/components/schemas/DatabaseServer' }
                  job: { oneOf: [{ $ref: '#/components/schemas/Job' }, { type: 'null' }] }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }
    delete:
      tags: [Databases]
      summary: Remove a database server
      description: >-
        The agent stops the database server and removes its data. The response is 422 when the
        database server has a database or a database user: remove them first. The database
        server has the status `removing` until the job is complete.
      responses:
        '202': { $ref: '#/components/responses/JobOnly' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }

  /v1/database-servers/{id}/retry:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    post:
      tags: [Databases]
      summary: Make a failed database server again
      description: >-
        For a database server with the status `failed`: the agent could not make it, for example
        because the server could not pull the image. The response is 422 for each other status.
      responses:
        '202':
          description: The job makes the database server.
          content:
            application/json:
              schema:
                type: object
                properties:
                  databaseServer: { $ref: '#/components/schemas/DatabaseServer' }
                  job: { $ref: '#/components/schemas/Job' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: The customer is suspended. }
        '422': { $ref: '#/components/responses/Invalid' }

  /v1/database-servers/{id}/usage:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    get:
      tags: [Usage]
      summary: Read the usage history of a database server
      description: Memory and disk of the database server. Refer to the usage history of a website for the ranges.
      parameters:
        - { $ref: '#/components/parameters/UsageRange' }
      responses:
        '200':
          description: The history.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UsageHistory' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/database-servers/{id}/move:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    post:
      tags: [Databases]
      summary: Move a database server to a different server
      description: >-
        Only an administrator. The database server keeps its ID, its name, its databases, its
        users and its network name. Its data goes through the encrypted tunnel between the two
        servers. The database server does not operate while the data moves. After the move, a
        website on a different server connects through a network with the network name, for
        example `shop-db.internal`. A website that uses the name of the engine, for example
        `mariadb.internal`, connects only on the server of the database server.


        The response is 422 when: the server is the same server, the server does not have the
        web role, a server is not healthy, an agent cannot move database servers, a website
        with a database in the database server is not on the new server and not in a network
        with the database server, or the database server does not operate or changes now. When
        the move fails, the database server stays on the old server and operates there.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [serverId]
              properties:
                serverId: { type: string, description: The server that gets the database server. }
      responses:
        '202':
          description: >-
            The new server receives the database server, and the old server sends it. The first
            job is the job of the new server.
          content:
            application/json:
              schema:
                type: object
                properties:
                  databaseServer: { $ref: '#/components/schemas/DatabaseServer' }
                  jobs:
                    type: array
                    items: { $ref: '#/components/schemas/Job' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }

  /v1/networks:
    get:
      tags: [Networks]
      summary: List private networks
      description: >-
        The private networks of the customers that you can see. Each customer has the network
        "default". The plan of the customer gives the number of named networks in addition to
        it (`networks` of the plan). A website connects to each other member of each network
        that it is in, by the name `<name>.internal`, on its own server and on a different
        server.
      parameters:
        - { name: customerId, in: query, schema: { type: string } }
      responses:
        '200':
          description: The networks.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Network' } }
    post:
      tags: [Networks]
      summary: Create a named network
      description: >-
        The response is 422 when the plan of the customer does not let the customer have one
        more named network. For a reseller, the named networks of its customers count too.
        Each member must be a website or a database server of the customer.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, pattern: '^[a-z0-9]([a-z0-9-]{0,38}[a-z0-9])?$', description: 'Not "default".' }
                customerId: { type: [string, 'null'], description: Default is the customer of the user. }
                websiteIds: { type: array, maxItems: 1000, items: { type: string } }
                databaseServerIds: { type: array, maxItems: 1000, items: { type: string } }
      responses:
        '201':
          description: The network.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Network' }
        '422': { $ref: '#/components/responses/Invalid' }

  /v1/networks/{id}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    get:
      tags: [Networks]
      summary: Get a private network
      responses:
        '200':
          description: The network.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Network' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Networks]
      summary: Rename a network or change its members
      description: >-
        A list of members replaces the members of that type. A request with no list keeps
        the members of that type. The network "default" keeps its name. The response is 422
        when a website with a database in a database server on a different server would have
        no network with that database server.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, pattern: '^[a-z0-9]([a-z0-9-]{0,38}[a-z0-9])?$' }
                websiteIds: { type: array, maxItems: 1000, items: { type: string } }
                databaseServerIds: { type: array, maxItems: 1000, items: { type: string } }
      responses:
        '200':
          description: The network.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Network' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }
    delete:
      tags: [Networks]
      summary: Remove a named network
      description: >-
        The members stay. They lose the connections of this network. The network "default"
        cannot be removed (422). The response is also 422 when a website with a database in a
        database server on a different server would have no network with that database server.
      responses:
        '204': { description: The network is removed. }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }

  /v1/certificates:
    get:
      tags: [Certificates]
      summary: List certificates
      description: >-
        The certificates of the customers that you can see. Each verified domain of a website
        uses the best certificate of its customer that is valid for it. A domain with no such
        certificate gets a certificate from the edge proxy.
      parameters:
        - { name: customerId, in: query, schema: { type: string } }
      responses:
        '200':
          description: The certificates, in the order that the panel got them.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Certificate' } }
    post:
      tags: [Certificates]
      summary: Add a certificate
      description: >-
        With the source `upload`, send the certificate chain and its private key in PEM format.
        The chain can have the certificates in any order. The key must not have a password.


        With the source `acme`, the panel gets a certificate for `domain` from Let's Encrypt
        with DNS validation. With `wildcard`, the certificate is also valid for `*.domain`. The
        customer must have a DNS zone for the domain on the DNS page, and the registrar must
        send the queries for the zone to the name servers of the panel. The order runs after
        the response: read the certificate again to see its state.


        A certificate must not be valid for a host name of the panel or of a server. Each
        customer can have 20 certificates (`CF_CERTIFICATES_PER_CUSTOMER`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source]
              properties:
                source: { type: string, enum: [upload, acme] }
                customerId: { type: [string, 'null'], description: Default is the customer of the user. }
                certificate: { type: string, maxLength: 65536, description: 'For "upload": the certificate chain in PEM format.' }
                privateKey: { type: string, maxLength: 65536, description: 'For "upload": the private key in PEM format, with no password.' }
                domain: { type: string, description: 'For "acme": the domain, for example example.com.' }
                wildcard: { type: boolean, description: 'For "acme": the certificate is also valid for each name directly below the domain.' }
      responses:
        '201':
          description: The certificate. For an order, the state is `issuing`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Certificate' }
        '409': { description: The customer is suspended. }
        '422': { $ref: '#/components/responses/Invalid' }
        '429': { description: Too many certificate changes in one hour. }

  /v1/certificates/{id}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    get:
      tags: [Certificates]
      summary: Get a certificate with its chain
      responses:
        '200':
          description: The certificate, with the certificate chain in PEM format. The API never gives the private key.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Certificate' }
                  - type: object
                    properties:
                      certificatePem: { type: [string, 'null'] }
        '404': { description: Not found. }
    put:
      tags: [Certificates]
      summary: Replace an uploaded certificate
      description: >-
        Replaces the chain and the key of an uploaded certificate, for example with a renewed
        certificate from your CA. The panel renews a certificate with the source `acme` itself.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [certificate, privateKey]
              properties:
                certificate: { type: string, maxLength: 65536 }
                privateKey: { type: string, maxLength: 65536 }
      responses:
        '200':
          description: The certificate. The servers get the new certificate.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Certificate' }
        '409': { description: The customer is suspended. }
        '422': { $ref: '#/components/responses/Invalid' }
        '429': { description: Too many certificate changes in one hour. }
    delete:
      tags: [Certificates]
      summary: Remove a certificate
      description: The domains that used the certificate get a certificate from the edge proxy again.
      responses:
        '202':
          description: The panel removed the certificate. The jobs send the new list of certificates to the servers.
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobs: { type: integer, description: The number of jobs. }
        '404': { description: Not found. }

  /v1/certificates/{id}/renew:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    post:
      tags: [Certificates]
      summary: Renew a certificate now
      description: >-
        Starts a new order for a certificate with the source `acme`: a renewal, or a new try
        after an order failed. An order that runs starts again. The panel also renews each
        certificate itself after two thirds of its lifetime.
      responses:
        '202':
          description: The order started.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Certificate' }
        '409': { description: The customer is suspended. }
        '422': { $ref: '#/components/responses/Invalid' }
        '429': { description: Too many certificate changes in one hour. }

  /v1/dns-zones:
    get:
      tags: [DNS]
      summary: List DNS zones
      description: >-
        The DNS zones of the customers that you can see. A customer makes a zone for a domain,
        and then gives the name servers of the panel (`nameServers`) to the registrar of the
        domain. The servers with the role `dns` answer the queries for each zone.
      parameters:
        - { name: customerId, in: query, schema: { type: string } }
      responses:
        '200':
          description: The zones, and the host names of the name servers of the panel.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/DnsZone' } }
                  nameServers: { type: array, items: { type: string }, description: Empty when the panel has no DNS server. A zone cannot be made then. }
    post:
      tags: [DNS]
      summary: Create a DNS zone
      description: >-
        The plan of the customer gives the number of zones that the customer can have
        (`dnsZones` of the plan). For a reseller, the zones of its customers count too.


        The new zone gets one NS record for each name server of the panel, and the A and AAAA
        records of the domains of the websites of the customer that are in the zone.


        The response is 422 when a different customer has a zone with this name, with a name
        above it or with a name in it. The message then gives a TXT record. Add the record at
        your current DNS provider to prove that you control the domain, and send the request
        again. Only an administrator can make a zone for the domain of the panel or for the
        host name of a server.


        With `accountId`, the zone goes to an external DNS provider, for example Cloudflare, and
        not to the DNS servers of the panel. The panel still keeps the records. With
        `importRecords` (the default), the zone first gets the records that the provider has
        for the name now. The provider must answer: the response is 422 when it refuses the
        credentials. `zone.provider.imported` gives the result of the copy.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, description: 'The domain, for example example.com.' }
                customerId: { type: [string, 'null'], description: Default is the customer of the user. }
                accountId: { type: [string, 'null'], description: 'A DNS account of the customer, or of the panel (`/v1/dns-accounts`). Null: the DNS servers of the panel.' }
                importRecords: { type: boolean, default: true, description: With `accountId` only. }
      responses:
        '202': { $ref: '#/components/responses/DnsZoneJobs' }
        '409': { description: The customer is suspended. }
        '422': { $ref: '#/components/responses/Invalid' }
        '429': { description: Too many DNS changes in one minute. }

  /v1/dns-zones/{id}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    get:
      tags: [DNS]
      summary: Get a DNS zone with its records
      responses:
        '200':
          description: The zone.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DnsZone' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [DNS]
      summary: Remove a DNS zone
      description: >-
        Each DNS server removes the zone with all its records and its DNSSEC key. The zone has
        the status `removing` until each job is complete. Before you remove a zone, change the
        name servers at the registrar of the domain: while the registrar sends the queries to
        the panel, a different customer of the panel could make a zone with the same name.
        `jobs` is empty when the panel has no DNS server.


        A zone at an external DNS provider goes from the provider first. The response is 422
        when the provider does not remove it. With `keepAtProvider`, the zone stays at the
        provider, and only the panel stops changing it.
      parameters:
        - { name: keepAtProvider, in: query, schema: { type: boolean, default: false } }
      responses:
        '202': { $ref: '#/components/responses/DnsJobs' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }

  /v1/dns-zones/{id}/records:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    post:
      tags: [DNS]
      summary: Add a record to a DNS zone
      description: >-
        The response is 422 when the record is not correct for its type, when the zone has an
        equal record, when a CNAME record and a different record would have the same name, and
        when the zone has 1000 records.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: '#/components/schemas/DnsRecordInput' }
                - { type: object, required: [type, value] }
      responses:
        '202': { $ref: '#/components/responses/DnsRecordJobs' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }
        '429': { description: Too many DNS changes in one minute. }

  /v1/dns-zones/{id}/records/{recordId}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
      - { name: recordId, in: path, required: true, schema: { type: string } }
    patch:
      tags: [DNS]
      summary: Change a record of a DNS zone
      description: >-
        Changes the name, the value, the TTL or the priority. The type of a record does not
        change. A record that the panel made for a website (`managed` is `website`) becomes a
        record of the user: the panel does not change it after that. The response is 422 for an
        NS record of the zone itself (`managed` is `ns`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DnsRecordInput' }
      responses:
        '202': { $ref: '#/components/responses/DnsRecordJobs' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }
        '429': { description: Too many DNS changes in one minute. }
    delete:
      tags: [DNS]
      summary: Remove a record from a DNS zone
      description: The response is 422 for an NS record of the zone itself.
      responses:
        '202': { $ref: '#/components/responses/DnsJobs' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }
        '429': { description: Too many DNS changes in one minute. }

  /v1/dns-zones/{id}/dnssec:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    put:
      tags: [DNS]
      summary: Turn DNSSEC on or off for a DNS zone
      description: >-
        When DNSSEC is turned on, the panel makes a key for the zone (ECDSA P-256, algorithm
        13), and each DNS server signs the zone with it. The response has the DS record
        (`dnssec.ds`). Give the DS record to the registrar of the domain.


        Before you turn DNSSEC off, remove the DS record at the registrar and wait for one day.
        A resolver that has the DS record refuses a zone that has no signatures. The panel
        makes a new key each time DNSSEC is turned on. `jobs` is empty when the value did not
        change. Turning DNSSEC off also stops a change of the key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        '202': { $ref: '#/components/responses/DnsZoneJobs' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }
        '429': { description: Too many DNS changes in one minute. }

  /v1/dns-zones/{id}/dnssec/rollover:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    post:
      tags: [DNS]
      summary: Start a change of the DNSSEC key of a zone
      description: >-
        The panel makes a new key and changes the key in steps (`dnssec.rollover.step`), so
        that resolvers can check the zone during the change:


        1. `publish`: the DNS servers publish the new key. The step ends about 3 hours after
           each DNS server has the key (`dnssec.rollover.until`).

        2. `submit`: the zone has CDS and CDNSKEY records for the new key. Give the new DS
           record (`dnssec.rollover.newDs`) to the registrar of the domain, and remove the old
           one. The step ends when the public DNS gives the new DS record.

        3. `retire`: both keys sign the zone until the old DS record is out of the caches, at
           least one day (`dnssec.rollover.until`). Then the old key goes.


        The panel checks the DS records every 15 minutes, and when you ask for a check
        (`/check`). Only a zone on the DNS servers of the panel can change its key: an external
        DNS provider makes its own key.
      responses:
        '202': { $ref: '#/components/responses/DnsZoneJobs' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { description: 'DNSSEC is off, the zone is at an external DNS provider, or the key changes already (`errors.rollover`).' }
        '429': { description: Too many DNS changes in one minute. }
    delete:
      tags: [DNS]
      summary: Stop a change of the DNSSEC key
      description: >-
        Only in the steps `publish` and `submit`, and only while the public DNS does not give
        the new DS record. The new key goes, and the old key stays. If you gave the new DS
        record to the registrar, do not stop the change.
      responses:
        '202': { $ref: '#/components/responses/DnsZoneJobs' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { description: 'The key does not change, or the registry has the new DS record (`errors.rollover`).' }
        '429': { description: Too many DNS changes in one minute. }

  /v1/dns-zones/{id}/check:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    post:
      tags: [DNS]
      summary: Ask the public DNS for the name servers of a zone again
      description: >-
        The panel also asks every 15 minutes. When the public DNS gives the name servers of
        the panel (`delegation.state` is `here`), the customer controls the zone: the panel
        then verifies the domains of the websites of the customer that are in the zone. For a
        zone with DNSSEC, the panel also asks for the DS records at the registry
        (`dnssec.parent`), and a change of the key can go to its next step.
      responses:
        '200':
          description: The zone, with the new `delegation`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DnsZone' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { description: Too many checks in one minute. }

  /v1/dns-zones/{id}/sync:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    post:
      tags: [DNS]
      summary: Send a DNS zone to each DNS server again
      description: For a zone with the status `failed`, where a DNS server did not take the last change.
      responses:
        '202': { $ref: '#/components/responses/DnsZoneJobs' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { description: Too many DNS changes in one minute. }

  /v1/dns-zones/{id}/move:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    post:
      tags: [DNS]
      summary: Move a DNS zone to a different DNS provider
      description: >-
        Moves the zone to the provider of a DNS account, or back to the DNS servers of the panel
        (`accountId` null). The records stay. Then give the new name servers
        (`zone.nameServers`) to the registrar of the domain.


        - From the DNS servers of the panel to a provider: the DNS servers of the panel keep the
          zone in a handover time (`zone.provider.handover`). They answer with the NS records of
          the provider. The time ends 48 hours after the public DNS stops giving the name
          servers of the panel.

        - From a provider: the zone stays at the old provider. Remove it there after the
          registrar has the new name servers.

        - A zone with DNSSEC does not move. Turn off DNSSEC first.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accountId]
              properties:
                accountId: { type: [string, 'null'] }
                importRecords: { type: boolean, default: true, description: First copy the records that the new provider has for the name now. }
      responses:
        '202': { $ref: '#/components/responses/DnsZoneJobs' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }
        '429': { description: Too many DNS changes in one minute. }

  /v1/dns-zones/{id}/transfers:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    put:
      tags: [DNS]
      summary: Send a DNS zone to your own secondary DNS servers
      description: >-
        Your secondary DNS servers copy the zone from the DNS servers of the panel with zone
        transfers (AXFR and IXFR). The panel never copies a zone from a different server.


        - `addresses` are the addresses of your secondary DNS servers. Only these addresses can
          copy the zone. They must be public addresses.

        - Configure your secondary DNS servers to copy the zone from the addresses in
          `zone.transfers.primaries`.

        - With `tsig` (the default), a TSIG key signs the transfers. The key has the name
          `transfer.` and the name of the zone. The panel makes the secret, or keeps the secret
          that you give in `secret`. Get the secret from `/transfers/secret`.

        - With `notify` (the default), the DNS servers send NOTIFY to your secondaries after each
          change, so that they copy the change at once.

        - `nameServers` are the host names of your secondaries. The zone gets an NS record for
          each one. Give them to the registrar too.


        A zone at an external DNS provider has no zone transfers from the panel.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [addresses]
              properties:
                addresses: { type: array, minItems: 1, maxItems: 10, items: { type: string }, description: IPv4 or IPv6 addresses. }
                notify: { type: boolean, default: true }
                nameServers: { type: array, maxItems: 4, items: { type: string } }
                tsig: { type: boolean, default: true }
                algorithm: { type: string, enum: [hmac-sha256, hmac-sha512], default: hmac-sha256 }
                secret: { type: [string, 'null'], description: A TSIG secret in base64, with 16 to 64 bytes. Default: the current secret, or a new secret. }
                newSecret: { type: boolean, default: false, description: Make a new secret. Then give the new secret to your secondaries. }
      responses:
        '202': { $ref: '#/components/responses/DnsZoneJobs' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }
        '429': { description: Too many DNS changes in one minute. }
    delete:
      tags: [DNS]
      summary: Stop the zone transfers to your own secondary DNS servers
      description: The zone loses the NS records of your secondaries. `jobs` is empty when the zone had no transfers.
      responses:
        '202': { $ref: '#/components/responses/DnsZoneJobs' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { description: Too many DNS changes in one minute. }

  /v1/dns-zones/{id}/transfers/secret:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    get:
      tags: [DNS]
      summary: Get the TSIG key of the zone transfers
      description: The audit log records each request. The limit is 10 requests in one minute.
      responses:
        '200':
          description: The TSIG key.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TsigKey' }
        '404': { description: The zone does not exist, or its transfers have no TSIG key. }
        '429': { description: Too many requests in one minute. }

  /v1/dns-secondaries:
    get:
      tags: [DNS]
      summary: List the secondary DNS servers of the panel
      description: >-
        Administrators only. A secondary DNS server of the panel copies all zones on the DNS
        servers of the panel with zone transfers. `primaries` has the addresses of the DNS
        servers of the panel: configure each secondary to copy the zones from them. `servers`
        tells if each DNS server of the panel has the current list.
      responses:
        '200':
          description: The secondaries.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/DnsSecondary' } }
                  catalogZone: { type: string, description: 'The name of the catalog zone (RFC 9432). A secondary with `catalog` copies it, and finds each zone in it.' }
                  primaries: { type: array, items: { type: object, properties: { nameServer: { type: string }, addresses: { type: array, items: { type: string } } } } }
                  servers: { type: array, items: { type: object, properties: { server: { type: string }, state: { type: string, enum: [ok, pending, failed] } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [DNS]
      summary: Add a secondary DNS server
      description: >-
        Administrators only. Each DNS server of the panel gets the new list in a job. The panel
        has at most 10 secondaries.


        - `addresses` can copy the zones, and get NOTIFY when `notify` is true. A private
          address is permitted, for example of a secondary in the same private network.

        - With `nameServer`, each zone on the DNS servers of the panel gets an NS record for the
          secondary. The DNS servers then get all zones again.

        - A new secondary has a TSIG key unless `tsig` is false. The panel makes the key name
          and the secret, or keeps the values that you give. A key name cannot start with
          `transfer.`.

        - With `catalog`, the secondary also copies the catalog zone. When the catalog zone
          starts or stops, each DNS server of the panel restarts. It does not answer for a
          short time.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DnsSecondaryInput' }
      responses:
        '202':
          description: The secondary, and the jobs of the DNS servers.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DnsSecondaryJobs' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Invalid' }
        '429': { description: Too many DNS changes in one minute. }

  /v1/dns-secondaries/{id}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    patch:
      tags: [DNS]
      summary: Change a secondary DNS server
      description: >-
        Administrators only. A field that the request does not have keeps its value. A new
        algorithm, or `newSecret`, gives a new secret. The answer is 200 with no jobs when
        nothing changed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DnsSecondaryInput' }
      responses:
        '200':
          description: Nothing changed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DnsSecondaryJobs' }
        '202':
          description: The secondary, and the jobs of the DNS servers.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DnsSecondaryJobs' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }
    delete:
      tags: [DNS]
      summary: Remove a secondary DNS server
      description: Administrators only. The DNS servers of the panel stop the transfers to the secondary.
      responses:
        '202':
          description: The jobs of the DNS servers.
          content:
            application/json:
              schema: { type: object, properties: { jobs: { type: array, items: { $ref: '#/components/schemas/Job' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/dns-secondaries/{id}/secret:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    get:
      tags: [DNS]
      summary: Get the TSIG key of a secondary DNS server
      description: Administrators only. The audit log records each request. The limit is 10 requests in one minute.
      responses:
        '200':
          description: The TSIG key.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TsigKey' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: The secondary does not exist, or it has no TSIG key. }
        '429': { description: Too many requests in one minute. }

  /v1/dns-accounts:
    get:
      tags: [DNS]
      summary: List DNS accounts and DNS providers
      description: >-
        The accounts at external DNS providers that you can use: the accounts of the customers
        that you can see, and the accounts of the panel. `providers` has the DNS providers that
        the plugins that are on offer. A customer does not see the credentials of an account of
        the panel.
      responses:
        '200':
          description: The accounts and the providers.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/DnsAccount' } }
                  providers: { type: array, items: { $ref: '#/components/schemas/DnsProvider' } }
    post:
      tags: [DNS]
      summary: Add a DNS account
      description: >-
        The plugin of the provider checks the credentials first. The response is 422 with the
        error of the plugin when the provider refuses them. Only an administrator can add an
        account of the panel (`customerId` null). Each customer, and the panel, can have 20
        accounts.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, pluginId, provider, credentials]
              properties:
                name: { type: string, maxLength: 60 }
                pluginId: { type: string }
                provider: { type: string, description: The `id` of the provider in the manifest of the plugin. }
                credentials: { type: object, additionalProperties: { type: string }, description: 'A value for each field of the provider, for example `{"apiToken": "…"}`.' }
                customerId: { type: [string, 'null'], description: 'Default: the customer of the user. For an administrator, the default is null: an account of the panel.' }
      responses:
        '201':
          description: The account.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DnsAccount' }
        '422': { $ref: '#/components/responses/Invalid' }
        '429': { description: Too many DNS changes in one minute. }

  /v1/dns-accounts/{id}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    patch:
      tags: [DNS]
      summary: Change a DNS account
      description: >-
        The plugin checks new credentials before the panel keeps them. An empty secret field
        keeps its current value. The zones that the provider could not change go again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 60 }
                credentials: { type: object, additionalProperties: { type: string } }
      responses:
        '200':
          description: The account.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DnsAccount' }
        '403': { description: Only an administrator can change an account of the panel. }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }
    delete:
      tags: [DNS]
      summary: Remove a DNS account
      description: The response is 422 while zones use the account. Move or remove the zones first.
      responses:
        '204': { description: The account is removed. }
        '403': { description: Only an administrator can remove an account of the panel. }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }

  /v1/dns-zones/{id}/import:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    post:
      tags: [DNS]
      summary: Import the records of a zone file
      description: >-
        Reads a zone file in the format of RFC 1035 (the format of BIND), for example the
        export of the current DNS provider of the domain or of cPanel. The panel checks each
        record as it checks a new record, and adds the records that the zone does not have.
        It does not change or remove a record of the zone.


        The panel does not import the SOA record, the NS records of the zone itself, records
        of other types than A, AAAA, CNAME, MX, TXT, SRV, CAA and NS, and names outside the
        zone. It also keeps the A, AAAA and CNAME records that it made for a website. `skipped`
        gives each line that the panel did not import, with a code and a reason. A TTL below
        60 seconds or above 7 days becomes 60 seconds or 7 days, and `note` tells it.


        With `dryRun`, the panel makes no change, and the answer shows what it would import.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [zoneFile]
              properties:
                zoneFile: { type: string, maxLength: 1048576, description: The text of the zone file. }
                dryRun: { type: boolean, default: false }
      responses:
        '200':
          description: The preview (`dryRun`), or an import that added no record.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DnsImport' }
        '202':
          description: The records are in the zone. Each DNS server gets the zone in a job.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DnsImport' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }
        '429': { description: Too many DNS changes in one minute. }

  /v1/dns-zones/{id}/export:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    get:
      tags: [DNS]
      summary: Export a DNS zone as a zone file
      description: >-
        The records of the zone in the format of RFC 1035, with the SOA record that the DNS
        servers of the panel give. A different DNS server or provider can load the file.
      responses:
        '200':
          description: The zone file.
          content:
            application/json:
              schema:
                type: object
                properties:
                  name: { type: string }
                  zoneFile: { type: string }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/mail/domains:
    get:
      tags: [Email]
      summary: List mail domains
      description: >-
        The mail domains of the customers that you can see. A mail domain is a domain that
        receives and sends email on the mail server of one server. All customers of a server
        use one mail server, and the panel keeps them apart.
      parameters:
        - { name: customerId, in: query, schema: { type: string } }
        - { name: serverId, in: query, schema: { type: string } }
      responses:
        '200':
          description: The mail domains.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/MailDomain' } }
    post:
      tags: [Email]
      summary: Add a mail domain
      description: >-
        The customer must control the domain. A verified domain of a website of the customer,
        and each sub-domain of one, needs no proof. An administrator needs no proof. For each
        other domain, the response is 422 with `verification`: add that DNS TXT record and send
        the request again.


        A customer has all its mail domains on one server. By default, that is the first
        server with email turned on. Only an administrator can set `serverId`. The mail server
        makes the DKIM keys of the domain. When the job is complete, `records` of the mail
        domain has the DNS records to add.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, example: example.com }
                customerId: { type: string, description: Necessary for an administrator and a reseller. }
                serverId: { type: string }
      responses:
        '202':
          description: The job adds the domain to the mail server.
          content:
            application/json:
              schema:
                type: object
                properties:
                  mailDomain: { $ref: '#/components/schemas/MailDomain' }
                  job: { $ref: '#/components/schemas/Job' }
        '409': { description: The customer is suspended. }
        '422':
          description: >-
            The request is not valid, or the customer must show that it controls the domain.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  errors: { type: object, additionalProperties: { type: array, items: { type: string } } }
                  verification:
                    type: object
                    description: The DNS TXT record that shows that the customer controls the domain.
                    properties:
                      type: { type: string, enum: [TXT] }
                      name: { type: string }
                      value: { type: string }

  /v1/mail/domains/{id}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    get:
      tags: [Email]
      summary: Get a mail domain
      responses:
        '200':
          description: The mail domain.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MailDomain' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Email]
      summary: Remove a mail domain
      description: The response is 422 when the mail domain has mailboxes, aliases or forwarders.
      responses:
        '202': { $ref: '#/components/responses/JobOnly' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }

  /v1/mail/domains/{id}/check:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    post:
      tags: [Email]
      summary: Check the DNS records of a mail domain
      description: >-
        The panel looks up each record of `records` and sets `found`. The MX record must name
        the mail server. The SPF record can be longer than the value that the panel shows. The
        DKIM records must have the same key.
      responses:
        '200':
          description: The mail domain, with the result of the check.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MailDomain' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/mail/domains/{id}/retry:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    post:
      tags: [Email]
      summary: Add a failed mail domain again
      description: For a mail domain with the status `failed`. The response is 422 for each other status.
      responses:
        '202':
          description: The job adds the domain to the mail server.
          content:
            application/json:
              schema:
                type: object
                properties:
                  mailDomain: { $ref: '#/components/schemas/MailDomain' }
                  job: { $ref: '#/components/schemas/Job' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }

  /v1/mail/mailboxes:
    get:
      tags: [Email]
      summary: List mailboxes
      parameters:
        - { name: customerId, in: query, schema: { type: string } }
        - { name: domainId, in: query, schema: { type: string } }
      responses:
        '200':
          description: The mailboxes.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Mailbox' } }
    post:
      tags: [Email]
      summary: Create a mailbox
      description: >-
        The plan of the customer gives the number of mailboxes (`mailboxes`) and their total
        size (`mailStorageBytes`). The response has the password of the mailbox. The panel
        makes a password when the request has none. The panel shows the password only in this
        response: it sends a hash to the mail server and keeps no password.


        With `encrypt: true`, the panel makes the OpenPGP keys of the mailbox. The mail server
        gets the public key and encrypts each new message with it before it stores the
        message. The panel keeps the private key in a form that only the password of the
        mailbox opens (refer to `GET /v1/mail/mailboxes/{id}/private-key`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domainId, localPart, quotaBytes]
              properties:
                domainId: { type: string }
                localPart: { type: string, pattern: '^[a-z0-9]([a-z0-9._-]{0,62}[a-z0-9])?$', example: info }
                quotaBytes: { type: integer, minimum: 104857600 }
                password: { type: string, minLength: 12, maxLength: 128 }
                encrypt: { type: boolean, description: The panel makes OpenPGP keys for the mailbox. }
      responses:
        '202':
          description: The job makes the mailbox.
          content:
            application/json:
              schema:
                type: object
                properties:
                  mailbox: { $ref: '#/components/schemas/Mailbox' }
                  password: { type: string }
                  job: { $ref: '#/components/schemas/Job' }
        '409': { description: The customer is suspended. }
        '422': { $ref: '#/components/responses/Invalid' }

  /v1/mail/mailboxes/{id}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    patch:
      tags: [Email]
      summary: Change the size, the password or the encryption of a mailbox
      description: >-
        `newPassword: true` asks the panel for a new password. The response has the new
        password one time. A larger mailbox must be in the limit of the plan.


        `publicKey` is one OpenPGP public key block in ASCII armour. The mail server then
        encrypts each new message with the key before it stores the message, and only the
        private key can decrypt the message. Messages that the mailbox has do not change. The
        job fails when the mail server refuses the key, for example a key that cannot encrypt.
        `publicKey: null` turns off the encryption.


        `encrypt: true` is the easy procedure: the panel makes the keys. The request must also
        have `password` or `newPassword`, because the private key gets that password and the
        panel keeps no password. `encrypt: false` turns off the encryption. The panel keeps
        the private keys that it made, because they open the messages from before the change.


        A new password with `currentPassword` also gives the new password to the private keys
        that the panel made. Without `currentPassword`, the private keys keep the old
        password, and `privateKey.passwordCurrent` of the mailbox is false.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                quotaBytes: { type: integer, minimum: 104857600 }
                password: { type: string, minLength: 12, maxLength: 128 }
                newPassword: { type: boolean }
                currentPassword: { type: string, maxLength: 128, description: The password that opens the private keys of the panel. }
                encrypt: { type: boolean, description: 'True: the panel makes OpenPGP keys. False: the encryption is off. Not with `publicKey`.' }
                publicKey: { type: [string, 'null'], maxLength: 65536 }
      responses:
        '200':
          description: The request changed nothing. `job` is null.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MailboxChange' }
        '202':
          description: The job changes the mailbox.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MailboxChange' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }
    delete:
      tags: [Email]
      summary: Remove a mailbox and its messages
      responses:
        '202': { $ref: '#/components/responses/JobOnly' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/mail/mailboxes/{id}/private-key:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    get:
      tags: [Email]
      summary: Get the private keys that the panel made for a mailbox
      description: >-
        The private keys are in ASCII armour, the newest first. Each key is protected with the
        password that the mailbox had when the panel made the key, or with a later password
        (refer to `currentPassword`). A mail program needs the file and that password to read
        the encrypted messages. The panel records each request in the audit log.
      responses:
        '200':
          description: The private keys.
          content:
            application/json:
              schema:
                type: object
                required: [address, privateKey, passwordCurrent]
                properties:
                  address: { type: string }
                  privateKey: { type: string, description: One or more OpenPGP private key blocks. }
                  publicKey: { type: [string, 'null'], description: The public key that the mail server uses now. }
                  passwordCurrent: { type: boolean, description: False when the private keys have an older password of the mailbox. }
        '404': { description: The mailbox is not there, or the panel made no keys for it. }
        '422': { $ref: '#/components/responses/Invalid' }

  /v1/mail/aliases:
    get:
      tags: [Email]
      summary: List aliases and forwarders
      parameters:
        - { name: customerId, in: query, schema: { type: string } }
        - { name: domainId, in: query, schema: { type: string } }
      responses:
        '200':
          description: The aliases and the forwarders.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/MailAlias' } }
    post:
      tags: [Email]
      summary: Create an alias or a forwarder
      description: >-
        An alias is a second address of one mailbox of the same customer: `destinations` has
        the address of that mailbox. A forwarder sends each message to 1 to 50 addresses, which
        can be on other mail servers.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domainId, localPart, kind, destinations]
              properties:
                domainId: { type: string }
                localPart: { type: string, pattern: '^[a-z0-9]([a-z0-9._-]{0,62}[a-z0-9])?$' }
                kind: { type: string, enum: [alias, forwarder] }
                destinations: { type: array, minItems: 1, maxItems: 50, items: { type: string } }
      responses:
        '202':
          description: The job makes the address.
          content:
            application/json:
              schema:
                type: object
                properties:
                  mailAlias: { $ref: '#/components/schemas/MailAlias' }
                  job: { $ref: '#/components/schemas/Job' }
        '409': { description: The customer is suspended. }
        '422': { $ref: '#/components/responses/Invalid' }

  /v1/mail/aliases/{id}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    delete:
      tags: [Email]
      summary: Remove an alias or a forwarder
      responses:
        '202': { $ref: '#/components/responses/JobOnly' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }

  /v1/websites/{websiteId}/snapshots:
    parameters:
      - { $ref: '#/components/parameters/WebsiteId' }
    get:
      tags: [Backups]
      summary: List snapshots
      responses:
        '200':
          description: The newest 100 snapshots.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Snapshot' } }
    post:
      tags: [Backups]
      summary: Back up now
      description: >-
        Makes a manual backup. The panel keeps the newest manual backups of each website (the
        field "manual" of the backup policy). The retention policy of the scheduled backups does
        not remove the manual backups.


        The agent of the server of the website makes the backup of the files and of the
        databases on that server. The response has this job. For a website with a database in
        a database server on a different server, the panel also sends a job to the agent of
        that server. That job makes a snapshot with only those databases (`part` is
        `databases`), in the repository of that server.
      responses:
        '202': { $ref: '#/components/responses/JobOnly' }

  /v1/websites/{websiteId}/snapshots/{snapshotId}/restore:
    parameters:
      - { $ref: '#/components/parameters/WebsiteId' }
      - { name: snapshotId, in: path, required: true, schema: { type: string } }
    post:
      tags: [Backups]
      summary: Restore from a snapshot
      description: >-
        FR-903. Restore the full website, one database or one file. A restore of the full
        website keeps the files that are not in the snapshot, unless removeNewFiles is true.
        A snapshot with the part `databases` has only databases: the scope must be `database`,
        and the agent of the server of the snapshot does the restore.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scope]
              properties:
                scope: { type: string, enum: [website, database, file] }
                item: { type: string, description: 'The database name or file path. A file path starts with "/" and cannot contain "..".' }
                removeNewFiles:
                  type: boolean
                  default: false
                  description: >-
                    Only with the scope "website". The agent removes all files of the website
                    that are not in the snapshot, for example files that an attacker added.
      responses:
        '202': { $ref: '#/components/responses/JobOnly' }
        '422': { $ref: '#/components/responses/Invalid' }

  /v1/backup-policy:
    get:
      tags: [Backups]
      summary: Get the backup policy
      description: An administrator gets all fields. Other users get only daily, weekly, monthly, time and manual.
      responses:
        '200':
          description: The policy.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BackupPolicy' }
    put:
      tags: [Backups]
      summary: Change the backup policy
      description: Administrators only.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BackupPolicy' }
      responses:
        '200':
          description: Changed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BackupPolicy' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Invalid' }

  /v1/backup-policy/servers/{serverId}/credentials:
    parameters:
      - { name: serverId, in: path, required: true, schema: { type: string }, description: The ID of a server with the role "web". }
    put:
      tags: [Backups]
      summary: Set the object storage key of one server
      description: >-
        Administrators only. Make a key at the storage provider that has access to the
        repository of this server only (the field "repository" of the server in the backup
        policy). The panel keeps the key encrypted, never shows it, and sends it to this
        server only. A server with no key of its own gets the shared credentials of the
        backup policy. A restore from the repository that all servers used in an earlier
        version always uses the shared credentials.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [credentials]
              properties:
                credentials:
                  type: object
                  writeOnly: true
                  minProperties: 1
                  description: The restic environment variables of the key, for example AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY. They replace the key that the server has.
                  additionalProperties: { type: string }
      responses:
        '200':
          description: Changed. The backup policy.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BackupPolicy' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }
    delete:
      tags: [Backups]
      summary: Remove the object storage key of one server
      description: Administrators only. The server then gets the shared credentials of the backup policy.
      responses:
        '200':
          description: Removed. The backup policy.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BackupPolicy' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/backup-policy/repository-password:
    get:
      tags: [Backups]
      summary: Get the backup repository and the repository password of each server
      description: >-
        Administrators only. A token needs the scope backups:write, and the token of a plugin
        cannot make this request. Each server that has websites has its own restic repository below
        the backup target, and its own repository password. The panel sends a password only to
        its server. Keep a copy of all passwords in a safe place: without the password of a
        server, you cannot restore the websites of that server with restic directly. Get the
        passwords again after you add a server. The panel records each request in the audit log.
      responses:
        '200':
          description: The repositories and their passwords.
          content:
            application/json:
              schema:
                type: object
                required: [repositories, shared]
                properties:
                  repositories:
                    type: array
                    items:
                      type: object
                      required: [serverId, server, repository, password]
                      properties:
                        serverId: { type: string }
                        server: { type: string, description: The name of the server. }
                        repository: { type: string, nullable: true, description: 'The restic repository of the server, for example s3:s3.amazonaws.com/bucket/servers/SERVER_ID. Null when no backup target is set.' }
                        password: { type: string }
                  shared:
                    type: object
                    nullable: true
                    description: The repository that all servers used in an earlier version of the panel. The panel uses it only to restore the snapshots from that time. Null when the panel never used it.
                    required: [repository, password]
                    properties:
                      repository: { type: string, nullable: true }
                      password: { type: string }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/imports:
    get:
      tags: [Imports]
      summary: List the imports
      description: The 200 newest imports.
      responses:
        '200':
          description: The imports.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Import' } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Imports]
      summary: Start an import of an account
      description: >-
        Give the HTTPS URL of the backup archive, or the name and the size of a file. With a
        URL, the web server downloads the archive at once. With a file, send the file in parts
        to /v1/imports/{id}/archive. The web server then downloads the archive from the panel.
        The server reads the archive, and the import gets the status "ready" with a plan.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customerId, serverId]
              properties:
                customerId: { type: string, description: The customer that gets the websites, the mail domains and the DNS zones. }
                serverId: { type: string, description: The web server of the new websites. Its agent must report the feature "imports". }
                url: { type: string, format: uri, maxLength: 2048, description: An HTTPS URL with no user name and no password, for example a signed URL of object storage. Each server that needs the archive downloads it. The URL must resolve to a public address. }
                fileName: { type: string, maxLength: 255, description: The name of the archive file, with no directory. Not with url. }
                sizeBytes: { type: integer, minimum: 1, description: The size of the file. Necessary with fileName. The limit is 50 GiB by default (CF_IMPORT_MAX_BYTES). }
      responses:
        '201':
          description: The import. With a URL, the job that downloads and reads the archive.
          content:
            application/json:
              schema:
                type: object
                properties:
                  import: { $ref: '#/components/schemas/Import' }
                  job: { oneOf: [{ $ref: '#/components/schemas/Job' }, { type: 'null' }] }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: The customer is suspended. }
        '422': { $ref: '#/components/responses/Invalid' }
        '429': { description: Too many imports in one minute. }

  /v1/imports/{id}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    get:
      tags: [Imports]
      summary: Get an import, with its plan or its parts
      responses:
        '200':
          description: The import.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Imports]
      summary: Remove an import
      description: >-
        Removes the import and its archive from the panel and from each server. The websites,
        the mail domains and the DNS zones of the import stay.
      responses:
        '202':
          description: The jobs that remove the archive from the servers.
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobs: { type: array, items: { $ref: '#/components/schemas/Job' } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: The import runs. Wait until it is complete. }

  /v1/imports/{id}/archive:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    put:
      tags: [Imports]
      summary: Send a part of the archive
      description: >-
        Send the parts in order. Each part has 1 byte to 4 MiB. `offset` is the number of
        bytes that the panel has. After a connection error, read `receivedBytes` and send
        from that offset. After the last part, the web server downloads and reads the archive.
      parameters:
        - { name: offset, in: query, required: true, schema: { type: integer, minimum: 0 } }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary, maxLength: 4194304 }
      responses:
        '200':
          description: The panel has the part. After the last part, the job that downloads and reads the archive.
          content:
            application/json:
              schema:
                type: object
                properties:
                  receivedBytes: { type: integer }
                  job: { oneOf: [{ $ref: '#/components/schemas/Job' }, { type: 'null' }] }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The offset is not the number of bytes that the panel has, or the import does not wait for a file.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  receivedBytes: { type: integer }
        '422': { $ref: '#/components/responses/Invalid' }

  /v1/imports/{id}/start:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    post:
      tags: [Imports]
      summary: Import the selected parts of the account
      description: >-
        Only for an import with the status "ready", one time. The panel makes the records with
        the checks of the API: the websites with their domains, databases and cron jobs, the
        mail domains with their mailboxes and addresses, and the DNS records. Then the servers
        copy the files, the dumps and the messages. Each part gets an item with a state. The
        token needs the scope databases:write for websites with databases, mail:write for mail
        domains and dns:write for DNS zones.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [websites, mailDomains, dnsZones]
              properties:
                websites:
                  type: array
                  items:
                    type: object
                    required: [name]
                    properties:
                      name: { type: string, description: The name of a website of the plan. }
                      imageId: { type: [string, 'null'], description: An official PHP image. The default is the image of the plan. }
                mailDomains: { type: array, items: { type: string } }
                dnsZones: { type: array, items: { type: string } }
                rewriteWordPress: { type: boolean, default: true, description: Put the settings of the new database in wp-config.php of each WordPress website. }
      responses:
        '202':
          description: The import runs.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportDetail' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: The import is not ready, or it started already. }
        '422': { $ref: '#/components/responses/Invalid' }

  /v1/jobs:
    get:
      tags: [Jobs]
      summary: List jobs
      parameters:
        - { name: websiteId, in: query, schema: { type: string } }
        - { name: databaseServerId, in: query, schema: { type: string } }
        - { name: serverId, in: query, schema: { type: string } }
        - { name: perPage, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: state, in: query, schema: { $ref: '#/components/schemas/JobState' } }
      responses:
        '200':
          description: One page of jobs. The newest job is first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Job' } }

  /v1/jobs/{id}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    get:
      tags: [Jobs]
      summary: Get a job
      responses:
        '200':
          description: The job.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Job' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/servers:
    get:
      tags: [Servers]
      summary: List servers
      responses:
        '200':
          description: The servers.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Server' } }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/servers/join-tokens:
    post:
      tags: [Servers]
      summary: Make a join token
      description: FR-1201. Give the token to the install script with `--join`. The token works once and expires after one day.
      responses:
        '201':
          description: The token and the install command.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  expiresAt: { type: string, format: date-time }
                  command: { type: string, description: The install command. When the panel has a CA, the command has its fingerprint (--panel-ca-sha256). }
                  installUrl: { type: string, description: 'The address of the installation script in the command: the script of the release of this panel, or the value of CF_INSTALL_URL.' }
                  panelCaSha256: { type: [string, 'null'], description: The SHA-256 fingerprint of the root certificate of the panel CA. }

  /v1/servers/{id}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    get:
      tags: [Servers]
      summary: Get a server
      responses:
        '200':
          description: The server.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Server' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Servers]
      summary: Change a server
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, pattern: '^[a-z][a-z0-9-]{1,30}$' }
                location: { type: string }
                roles: { type: array, minItems: 1, items: { $ref: '#/components/schemas/ServerRole' } }
                gvisorPlatform: { type: string, enum: [systrap, kvm], description: KVM needs a bare-metal server. }
                updatePolicy: { type: string, enum: [security, all, manual] }
                maintenanceWindow: { type: string, pattern: '^[0-2][0-9]:[0-5][0-9]-[0-2][0-9]:[0-5][0-9]$' }
                dnsName:
                  type: [string, 'null']
                  description: >-
                    The host name of the server as a name server. A change of this name, or of the
                    role `dns`, changes the NS records of each zone: the panel sends all zones to
                    the DNS servers again.
      responses:
        '200':
          description: >-
            Changed. A change of the gVisor platform starts a job that writes the units again and
            restarts the containers. The server shows the new platform when the job succeeds.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Server' }
                  - type: object
                    properties:
                      job: { oneOf: [{ $ref: '#/components/schemas/Job' }, { type: 'null' }] }
        '422': { $ref: '#/components/responses/Invalid' }
    delete:
      tags: [Servers]
      summary: Remove a server
      description: >-
        Removes a server from the panel, for example a server that joined with a wrong address.
        The panel also removes the jobs of the server. It does not change the server itself. The
        answer is status 422 for a server with websites and for the server of the panel.
      responses:
        '204': { description: Removed. }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }

  /v1/servers/{id}/install-updates:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    post:
      tags: [Servers]
      summary: Install host updates now
      description: >-
        FR-1117. The agent restarts only the services that changed. With the policy "tools", the
        agent updates only the container tools (FR-1113). Update them on one server, check it,
        and then update the other servers. The panel refuses a second "tools" update while one
        is in progress.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                policy: { type: string, enum: [security, all, tools], description: The default is the update policy of the server. }
      responses:
        '202': { $ref: '#/components/responses/JobOnly' }
        '422': { $ref: '#/components/responses/Invalid' }

  /v1/servers/{id}/reboot:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    post:
      tags: [Servers]
      summary: Reboot a server
      responses:
        '202': { $ref: '#/components/responses/JobOnly' }
        '422': { $ref: '#/components/responses/Invalid' }

  /v1/servers/{id}/update-agent:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    post:
      tags: [Servers]
      summary: Update the agent
      description: >-
        The agent keeps the previous binary. It goes back to it if the new binary does not start.
        The agent refuses a version that is older than its version, unless allowDowngrade is true.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                allowDowngrade: { type: boolean, default: false }
      responses:
        '202': { $ref: '#/components/responses/JobOnly' }

  /v1/servers/{id}/check-connection:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    post:
      tags: [Servers]
      summary: Test the connection to the agent
      description: >-
        The panel connects to the agent of the server and records the result. `connectionError`
        of the server is null when the connection works.
      responses:
        '200':
          description: The server, with the result of the test.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Server' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/mesh:
    get:
      tags: [Servers]
      summary: Get the mesh
      description: >-
        The mesh is the set of encrypted tunnels between the servers of the panel. The traffic
        between two servers goes through the public internet, and WireGuard encrypts it. The
        answer never has a private key or the secret key of a pair of servers.
      responses:
        '200':
          description: The settings, the servers and the tunnels of the mesh.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Mesh' }
        '403': { $ref: '#/components/responses/Forbidden' }
    patch:
      tags: [Servers]
      summary: Change the address range or the port of the mesh
      description: >-
        A change is possible only while the mesh has no tunnel. After a change of the range,
        each server gets a new mesh address with its next tunnel.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                range: { type: string, description: 'A private IPv4 network with a prefix length from 12 to 22. The default is 10.207.0.0/16.' }
                port: { type: integer, minimum: 1024, maximum: 65535, description: The UDP port of the tunnels on each server. The default is 51820. }
      responses:
        '200':
          description: The mesh.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Mesh' }
        '422': { $ref: '#/components/responses/Invalid' }

  /v1/servers/{id}/usage:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    get:
      tags: [Usage]
      summary: Read the usage history of a server
      description: >-
        CPU, memory and disk in percent of the server, and the traffic of its physical network
        interfaces. Only for administrators. Refer to the usage history of a website for the
        ranges.
      parameters:
        - { $ref: '#/components/parameters/UsageRange' }
      responses:
        '200':
          description: The history.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UsageHistory' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/usage-alerts/settings:
    put:
      tags: [Usage]
      summary: Change the thresholds of the usage alerts
      description: Only for administrators. The thresholds are percents of each limit.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UsageAlertSettings' }
      responses:
        '200':
          description: Changed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UsageAlertSettings' }
        '422': { $ref: '#/components/responses/Invalid' }

  /v1/mesh/servers/{id}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    patch:
      tags: [Servers]
      summary: Change the tunnel address of a server
      description: >-
        The tunnel address is the public IP address that the other servers send the tunnel
        traffic to. With null, the panel finds the address from the address of the agent when
        the server gets its next tunnel. The panel sends the new address to the peers of the server.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tunnelAddress]
              properties:
                tunnelAddress: { type: [string, 'null'], description: A public IPv4 or IPv6 address. }
      responses:
        '200':
          description: The mesh, and one job for each peer of the server.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Mesh' }
                  - type: object
                    properties:
                      jobs: { type: array, items: { $ref: '#/components/schemas/Job' } }
        '422': { $ref: '#/components/responses/Invalid' }

  /v1/mesh/servers/{id}/rotate-key:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    post:
      tags: [Servers]
      summary: Make a new tunnel key on a server
      description: >-
        The server makes a new key pair. The private key does not leave the server. When the job
        is complete, the panel sends the new public key to the peers of the server. The tunnels
        of the server do not operate between these two steps, usually for some seconds.
      responses:
        '202': { $ref: '#/components/responses/JobOnly' }
        '422': { $ref: '#/components/responses/Invalid' }

  /v1/mesh/tunnels:
    post:
      tags: [Servers]
      summary: Make a tunnel between two servers
      description: >-
        The agent of each server must be from a release that reports a tunnel key, and the panel
        must know a public IP address of each server. The panel gives each server a mesh address,
        makes the secret key of the pair, and sends the state to the two servers.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [servers]
              properties:
                servers: { type: array, minItems: 2, maxItems: 2, items: { type: string }, description: The IDs of the two servers. }
      responses:
        '201':
          description: The tunnel, and one job for each of the two servers.
          content:
            application/json:
              schema:
                type: object
                properties:
                  tunnel: { $ref: '#/components/schemas/MeshTunnel' }
                  jobs: { type: array, items: { $ref: '#/components/schemas/Job' } }
        '422': { $ref: '#/components/responses/Invalid' }

  /v1/mesh/tunnels/{id}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    delete:
      tags: [Servers]
      summary: Remove a tunnel
      description: The panel sends the new state to the two servers. A server with no tunnel closes its tunnel port.
      responses:
        '202': { $ref: '#/components/responses/JobList' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/mesh/tunnels/{id}/repair:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    post:
      tags: [Servers]
      summary: Test and repair a tunnel
      description: >-
        The panel sends the state to the two servers again. Each agent applies it, tests the
        tunnel, and reports the result. The panel also does this without a request when a
        server reports that it does not have the current state.
      responses:
        '202': { $ref: '#/components/responses/JobList' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/servers/{id}/mail:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    put:
      tags: [Servers]
      summary: Turn on email for a server
      description: >-
        For a server with the role `email`. The agent starts the mail server (Stalwart) in a
        container, opens the ports 25, 465, 587 and 993, and gets a TLS certificate for the host
        name. The host name must point to the server in the DNS, and the reverse DNS of the
        server must give the host name.


        The same request starts a mail server again when its job failed. The response is 422
        when the server does not have the role, when a change is in progress, and when the
        host name changes while the server has mail domains.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hostname]
              properties:
                hostname: { type: string, example: mail.example.net }
      responses:
        '202':
          description: The job starts the mail server.
          content:
            application/json:
              schema:
                type: object
                properties:
                  server: { $ref: '#/components/schemas/Server' }
                  job: { $ref: '#/components/schemas/Job' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }

  /v1/mail-clusters:
    get:
      tags: [Servers]
      summary: List the mail clusters
      description: Only an administrator sees the mail clusters.
      responses:
        '200':
          description: The mail clusters.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/MailCluster' } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Servers]
      summary: Make a mail cluster
      description: >-
        A mail cluster has 3 or 5 servers with the role `email`. Each member has all the mail,
        so the mail service continues when one server fails. The members can be in different
        regions. They connect through a private network on UDP port 51877.


        Each server must be online, and must not have a mail server. The panel makes the
        cluster in steps: each server makes its keys, the first server starts the database
        cluster, the other servers join it, then the mail servers start. Get the cluster to
        see the step. Add the DNS records in `records`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, hostname, members]
              properties:
                name: { type: string, example: eu, description: 'Lower-case letters, digits and hyphens, 32 characters or fewer.' }
                hostname: { type: string, example: mail.example.net, description: The shared name of the cluster. The MX records of the mail domains use it. }
                members:
                  type: array
                  minItems: 3
                  maxItems: 5
                  items:
                    type: object
                    required: [serverId, hostname, endpoint]
                    properties:
                      serverId: { type: string }
                      hostname: { type: string, example: m1.example.net, description: The name of this member. Mail programs connect to it. }
                      endpoint: { type: string, example: 192.0.2.1, description: The public address of the server. }
                      region: { type: integer, minimum: 0, maximum: 99, description: Servers with the same number are near to each other. }
      responses:
        '202':
          description: The setup starts.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MailCluster' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Invalid' }

  /v1/mail-clusters/{id}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    get:
      tags: [Servers]
      summary: Get a mail cluster
      responses:
        '200':
          description: The mail cluster.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MailCluster' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/mail-clusters/{id}/retry:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    post:
      tags: [Servers]
      summary: Start a failed setup again
      description: >-
        Starts the step that failed again, on the members that did not complete it. The
        response is 422 when the setup did not fail, or when a job of the setup is not complete.
      responses:
        '202':
          description: The step starts again.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MailCluster' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }

  /v1/panel-certificate:
    get:
      tags: [Servers]
      summary: Get the certificate of the panel domain
      description: >-
        The edge proxy on the panel server gets the TLS certificate of the panel domain with one
        of two methods. "internal": the CA of the panel signs it. This works for all domains,
        also localhost and panel.localhost. A browser trusts it only after you add the root
        certificate of the CA (caCertificate). A new panel uses this method. "letsencrypt": Let's
        Encrypt gives it. The domain must be public, and its DNS must point to the panel server.
      responses:
        '200':
          description: The certificate.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PanelCertificate' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [Servers]
      summary: Change the certificate method of the panel domain
      description: >-
        The agent on the panel server changes the method and waits for the new certificate. If
        the certificate does not come in time, the agent goes back to the previous method and the
        job fails. The panel refuses "internal" while other servers do not trust the panel CA
        (serversWithoutCa), and "letsencrypt" for a domain that is not public.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [method]
              properties:
                method: { type: string, enum: [internal, letsencrypt] }
      responses:
        '202':
          description: The job started.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PanelCertificate' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Invalid' }

  /v1/runtime-images:
    get:
      tags: [Images]
      summary: List the images for a new website
      description: >-
        Needs the websites:read scope. A customer or a reseller gets the official images
        only. An administrator also gets the images that they added.
      responses:
        '200':
          description: The images.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [id, name, family, tag, custom]
                      properties:
                        id: { type: string }
                        name: { type: string }
                        family: { type: string }
                        tag: { type: string }
                        phpVersion: { type: [string, 'null'] }
                        version: { type: [string, 'null'], description: 'The version of Node.js, of Python or of the runtime of a pack, for example "24", "3.14" or "1.27".' }
                        custom: { type: boolean }
                        supportEndsAt: { type: [string, 'null'], format: date-time }
                        pack: { oneOf: [{ $ref: '#/components/schemas/PackRef' }, { type: 'null' }], description: The pack that gives the image. Null for the other images. }
                        defaults:
                          type: [object, 'null']
                          description: 'The usual start command and install command of an application image: Node.js, Python or the runtime of a pack. Null for the other images.'
                          properties:
                            command: { type: string }
                            install: { type: string }

  /v1/images:
    get:
      tags: [Images]
      summary: List images
      responses:
        '200':
          description: The images.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Image' } }
    post:
      tags: [Images]
      summary: Add a custom image
      description: FR-1108. The panel accepts only an image with a valid signature.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, reference, tag, policy]
              properties:
                name: { type: string, maxLength: 100 }
                reference: { type: string, description: 'For example "registry.example.com/team/app".' }
                tag: { type: string }
                policy: { type: string, enum: [automatic, manual] }
                containerPort: { type: [integer, 'null'], minimum: 1, maximum: 65535, description: FR-307. The HTTP port in the container. The default is 8080. }
                command: { type: [array, 'null'], maxItems: 32, items: { type: string, maxLength: 1024 }, description: The start command as a list of arguments. Null uses the command of the image. }
      responses:
        '201':
          description: Added.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Image' }
        '422': { $ref: '#/components/responses/Invalid' }

  /v1/images/{id}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    patch:
      tags: [Images]
      summary: Change an image
      description: The update policy. For a custom image, also the port and the start command.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                policy: { type: string, enum: [automatic, security_automatic, manual] }
                containerPort: { type: [integer, 'null'], minimum: 1, maximum: 65535 }
                command: { type: [array, 'null'], maxItems: 32, items: { type: string, maxLength: 1024 } }
      responses:
        '200':
          description: Changed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Image' }

  /v1/images/{id}/check:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    post:
      tags: [Images]
      summary: Check the registry for a new version of an image now
      description: |
        FR-1110. The scheduler does this check each hour for all images. For an official image, the
        panel takes the newest release tag with a good signature from the release key. For an image
        that an administrator added, the panel looks for a new digest of the same tag. The update
        policy of the image then decides if a rollout starts.
      responses:
        '200':
          description: Checked. `checkError` tells why a check failed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Image' }

  /v1/rollouts:
    get:
      tags: [Images]
      summary: List rollouts
      responses:
        '200':
          description: The newest 20 rollouts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Rollout' } }
    post:
      tags: [Images]
      summary: Start a rollout
      description: |
        FR-1103. Update all websites on an image in stages: one canary website, 10%, 50%, then everyone.
        A website that fails its health check goes back to the previous image. If the canary fails,
        the rollout pauses. Only one rollout runs at a time.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [imageId]
              properties:
                imageId: { type: string }
      responses:
        '201':
          description: Started.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Rollout' }
        '422': { $ref: '#/components/responses/Invalid' }

  /v1/rollouts/{id}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    get:
      tags: [Images]
      summary: Get a rollout
      responses:
        '200':
          description: The rollout.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Rollout' }

  /v1/rollouts/{id}/pause:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    post:
      tags: [Images]
      summary: Pause a rollout
      description: >-
        Jobs that run now complete. The next stage does not start. Only a rollout with the state
        `running` can pause.
      responses:
        '200':
          description: Paused.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Rollout' }
        '409': { description: The rollout does not have the state `running`. }

  /v1/rollouts/{id}/resume:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    post:
      tags: [Images]
      summary: Resume a rollout
      description: Only a rollout with the state `paused` can resume.
      responses:
        '200':
          description: Resumed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Rollout' }
        '409': { description: The rollout does not have the state `paused`. }

  /v1/rollouts/{id}/roll-back:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    post:
      tags: [Images]
      summary: Roll back a rollout
      description: >-
        FR-1107. Put all updated websites back on the previous image. Only a rollout with the
        state `running` or `paused` can roll back.
      responses:
        '200':
          description: Rolled back.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Rollout' }
        '409': { description: The rollout is complete, or it is rolled back already. }

  /v1/customers:
    get:
      tags: [Customers]
      summary: List customers
      responses:
        '200':
          description: The customers that you can see.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Customer' } }
    post:
      tags: [Customers]
      summary: Add a customer
      description: Administrators add resellers and owners. Resellers add owners only. With createUser, the panel also makes the first user of the customer, and the answer has the temporary password of that user one time.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, role, planId]
              properties:
                name: { type: string }
                email: { type: string, format: email }
                role: { type: string, enum: [reseller, owner] }
                planId: { type: string }
                createUser: { type: boolean, default: false, description: Also make a user with the name and the email of the customer. An API token needs the users:write scope for this. }
      responses:
        '201':
          description: Added.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Customer' }
                  - type: object
                    properties:
                      user: { $ref: '#/components/schemas/NewUser' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Invalid' }

  /v1/customers/{id}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    patch:
      tags: [Customers]
      summary: Change a customer
      description: A customer cannot move to a plan that allows fewer websites than the customer has. A reseller sets the branding (FR-106). A reseller that sets a new panel domain must prove that it controls the domain, with a verified domain of its own or a DNS TXT record that the error message gives. A reseller can give only the plans in its allowedPlanIds, and cannot lift a suspension that an administrator set.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                planId: { type: string }
                suspended: { type: boolean }
                branding: { $ref: '#/components/schemas/Branding' }
                allowedPlanIds: { type: array, items: { type: string }, description: Only an administrator, for a reseller. The plans that the reseller can give to its customers, in addition to its own plan. }
      responses:
        '200':
          description: Changed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Customer' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/brand:
    get:
      tags: [Customers]
      summary: Get the brand of the sign-in page
      description: >-
        White label. The brand of the reseller whose panel domain is the host of the request, or
        else the default brand of the panel. A person who has not signed in can read it.
      security: []
      responses:
        '200':
          description: The brand.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicBrand' }
  /v1/brand/default:
    get:
      tags: [Customers]
      summary: Get the default brand
      description: Only an administrator. The administrators and the customers of the panel itself see this brand.
      responses:
        '200':
          description: The default brand.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BrandInput' }
    put:
      tags: [Customers]
      summary: Change the default brand
      description: >-
        Only an administrator. A null value removes the field, and the panel then uses its
        built-in value. White text on the colour must have a contrast of 4.5:1 or more. The logo
        is a data URL of a PNG, JPEG or WebP image of 256 KB or less and 2048 by 2048 pixels or
        less. The panel checks the real type of the image.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BrandInput' }
      responses:
        '200':
          description: The default brand.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BrandInput' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /v1/plans:
    get:
      tags: [Customers]
      summary: List plans
      responses:
        '200':
          description: The plans.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Plan' } }
    post:
      tags: [Customers]
      summary: Add a plan
      description: Administrators only.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlanInput' }
      responses:
        '201':
          description: Added.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Plan' }

  /v1/plans/{id}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    patch:
      tags: [Customers]
      summary: Change a plan
      description: Administrators only.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlanInput' }
      responses:
        '200':
          description: Changed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Plan' }

  /v1/users:
    get:
      tags: [Users]
      summary: List users
      description: An administrator sees all users. A reseller sees its own users and the users of its customers. A website owner sees the users of its own account.
      responses:
        '200':
          description: The users that you can see.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/ManagedUser' } }
    post:
      tags: [Users]
      summary: Add a user
      description: The panel sends no email. The answer has a temporary password one time. Give it to the user. The user must set a new password at the first sign-in. An administrator adds users for all customers. A reseller adds users for its own customers only. With customerId null, the new user is an administrator. Only an administrator in a sign-in session can do this, with the password and, when TOTP is on, a code. An API token cannot. After 5 wrong passwords or codes, the answer is 429 for 15 minutes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, customerId]
              properties:
                name: { type: string, maxLength: 200 }
                email: { type: string, format: email }
                customerId: { type: [string, 'null'], description: The customer of the user. The role of the user is the role of the customer. Null makes an administrator. }
                password: { type: string, description: Your password. Necessary when the new user is an administrator. }
                totp: { type: string, pattern: '^[0-9]{6}$', description: Your TOTP code. Necessary when the new user is an administrator and your TOTP is on. }
      responses:
        '201':
          description: Added.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NewUser' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Invalid' }
        '429': { description: Too many requests, or too many wrong passwords or codes for a change to an administrator. The Retry-After header gives the number of seconds to wait. }

  /v1/users/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    delete:
      tags: [Users]
      summary: Delete a user
      description: Deletes the user with all sessions and API tokens. You cannot delete your own user. The rules of POST /v1/users apply. To delete an administrator, give your password and your TOTP code in the body.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                password: { type: string, description: Your password. Necessary when the user is an administrator. }
                totp: { type: string, pattern: '^[0-9]{6}$', description: Your TOTP code. Necessary when the user is an administrator and your TOTP is on. }
      responses:
        '204': { description: Deleted. }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }
        '429': { description: Too many wrong passwords or codes for a change to an administrator. The Retry-After header gives the number of seconds to wait. }

  /v1/users/{id}/reset-password:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    post:
      tags: [Users]
      summary: Give a user a new temporary password
      description: The panel deletes all sessions and API tokens of the user, and removes the sign-in lock. The user must set a new password at the next sign-in. You cannot do this for your own user. The rules of POST /v1/users apply. For an administrator, give your password and your TOTP code. The other administrators then see the change in securityNotices of /v1/me for 7 days.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                removeTotp: { type: boolean, default: false, description: Also turn off TOTP, for a user who lost the device. }
                password: { type: string, description: Your password. Necessary when the user is an administrator. }
                totp: { type: string, pattern: '^[0-9]{6}$', description: Your TOTP code. Necessary when the user is an administrator and your TOTP is on. }
      responses:
        '200':
          description: The user with the temporary password.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NewUser' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }
        '429': { description: Too many requests, or too many wrong passwords or codes for a change to an administrator. The Retry-After header gives the number of seconds to wait. }

  /v1/setup:
    get:
      tags: [Servers]
      summary: Get the setup checklist of the panel
      description: >-
        Only for an administrator. A new panel operates before the items are complete. Each item
        gives its state, the effect while it is open, and the page of the web panel where you
        complete it. The request changes nothing.
      responses:
        '200':
          description: The checklist.
          content:
            application/json:
              schema:
                type: object
                required: [complete, open, items]
                properties:
                  complete: { type: boolean, description: True when no item is open. }
                  open: { type: integer, description: The number of open items. }
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, title, state, effect, detail, action]
                      properties:
                        id: { type: string, enum: [backups, totp, disk-limits, panel-certificate] }
                        title: { type: string }
                        state: { type: string, enum: [done, open, not_applicable], description: '"not_applicable": the item does not apply to this panel, for example a public certificate for panel.localhost.' }
                        effect: { type: string, description: What occurs while the item is open. }
                        detail: { type: string, description: The current state, in words. }
                        action:
                          type: object
                          required: [label, target]
                          properties:
                            label: { type: string }
                            target: { type: string, description: The path of the page in the web panel. }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/account:
    get:
      tags: [Customers]
      summary: Get the account of the signed-in user
      description: >-
        The customer of the user, its plan, how much of the plan it uses, who gives the service,
        and the users who can sign in. For an administrator, who belongs to no customer, all
        fields are null and "users" is empty.
      responses:
        '200':
          description: The account.
          content:
            application/json:
              schema:
                type: object
                required: [customer, provider, plan, usage, backups, users]
                properties:
                  customer:
                    type: [object, 'null']
                    properties:
                      id: { type: string }
                      name: { type: string }
                      email: { type: string }
                      role: { type: string, enum: [reseller, owner] }
                      suspended: { type: boolean, description: True also when the reseller of the customer is suspended. }
                      createdAt: { type: string, format: date-time }
                  provider:
                    type: [object, 'null']
                    description: The reseller that gives the service. Null when the operator of the panel gives it.
                    properties:
                      name: { type: string }
                      email: { type: string }
                  plan: { oneOf: [{ $ref: '#/components/schemas/Plan' }, { type: 'null' }] }
                  usage:
                    type: [object, 'null']
                    properties:
                      websites: { type: integer }
                      databases: { type: integer }
                      dnsZones: { type: integer, description: The number of DNS zones. For a reseller, the zones of its customers count too. }
                      networks: { type: integer, description: The number of named networks. For a reseller, the named networks of its customers count too. }
                      diskBytes: { type: integer }
                      mailboxes: { type: integer, description: The number of mailboxes of the customer. }
                      mailStorageBytes: { type: integer, description: The total of the sizes of the mailboxes. }
                      bandwidthBytes: { type: integer, description: The traffic of the websites in the current calendar month (UTC). }
                      customers: { type: [integer, 'null'], description: Only for a reseller. The number of its customers. }
                  backups:
                    type: object
                    required: [available]
                    properties:
                      available: { type: boolean, description: False when the panel has no object storage for backups. A backup then fails. }
                  users:
                    type: array
                    items: { $ref: '#/components/schemas/User' }
  /v1/me/notification-preferences:
    get:
      tags: [Notifications]
      summary: Get the email notifications of the signed-in user
      description: >-
        The events that the role of the user can receive, and whether each event sends an email
        to the user. A new user receives all events. The security events ("required") always send
        an email.
      responses:
        '200':
          description: The events.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/NotificationPreference' } }
    put:
      tags: [Notifications]
      summary: Choose the email notifications of the signed-in user
      description: Give only the events to change. A required event cannot be turned off.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [events]
              properties:
                events:
                  type: object
                  additionalProperties: { type: boolean }
                  example: { job.failed: false, usage.alert: true }
      responses:
        '200':
          description: The events, after the change.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/NotificationPreference' } }
        '422': { $ref: '#/components/responses/Invalid' }
  /v1/notifications:
    get:
      tags: [Notifications]
      summary: List the emails that the panel sent
      description: >-
        An administrator sees all emails. A reseller sees the emails to its users and to the
        users of its customers. A customer sees the emails to the users of its account. A sign-in
        email has the IP address of the person who signed in, so only that user and the
        administrators see it.
      parameters:
        - { name: state, in: query, schema: { type: string, enum: [queued, sent, failed, skipped] } }
        - { name: event, in: query, schema: { $ref: '#/components/schemas/NotificationEvent' } }
        - { name: perPage, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: One page of emails. The newest email is first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/NotificationDelivery' } }
                  meta:
                    type: object
                    properties:
                      currentPage: { type: integer }
                      lastPage: { type: integer }
                      total: { type: integer }
  /v1/notifications/{id}:
    get:
      tags: [Notifications]
      summary: Get one email, with its text
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: The email.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/NotificationDelivery' }
                  - { type: object, properties: { body: { type: string } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/notifications/{id}/retry:
    post:
      tags: [Notifications]
      summary: Send a failed or skipped email again
      description: >-
        For example after a correction of the SMTP server. An administrator can send each email
        again. A reseller can send again the emails to its customers.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: The email is in the queue.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationDelivery' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'The email is not failed or skipped, or no SMTP server is set.' }
  /v1/mail-server:
    get:
      tags: [Notifications]
      summary: Get the SMTP server
      description: >-
        An administrator gets the server of the panel. A reseller gets its own server. With no
        server of its own, the emails to the customers of a reseller go through the server of
        the panel (panelFallback), with the name of the reseller. Other users get status 403.
      responses:
        '200':
          description: The server. "configured" is false when there is none.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MailServer' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [Notifications]
      summary: Set the SMTP server
      description: >-
        The panel connects only to the SMTP ports 25, 465, 587 and 2525. For a reseller, the host
        must have a public address. The panel never shows the password again: leave out
        "password" to keep it, or send an empty value to remove it. A change of the host, the
        port, the encryption, the user or the password needs a new test.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MailServerInput' }
      responses:
        '200':
          description: The server.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MailServer' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Invalid' }
    delete:
      tags: [Notifications]
      summary: Remove the SMTP server
      responses:
        '204': { description: Removed. }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/mail-server/test:
    post:
      tags: [Notifications]
      summary: Send a test email
      description: >-
        The panel sends the email at once, and gives the answer of the SMTP server. An
        administrator can send it to any address. A reseller sends it to its own address.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                to: { type: string, format: email, description: Administrators only. The default is the address of the user. }
      responses:
        '200':
          description: The result. "sent" is false when the server did not accept the email.
          content:
            application/json:
              schema:
                type: object
                properties:
                  sent: { type: boolean }
                  to: { type: string }
                  error: { type: [string, 'null'] }
                  server: { $ref: '#/components/schemas/MailServer' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: No SMTP server is set. }
  /v1/notification-templates:
    get:
      tags: [Notifications]
      summary: List the email templates
      description: >-
        The subject and the text of the email of each event. In a template, {{name}} is a value,
        for example {{website}}. "variables" gives the values of each event. A reseller gets only
        the events of its customers, and starts from the templates of the panel.
      responses:
        '200':
          description: The templates.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/NotificationTemplate' } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/notification-templates/{event}:
    put:
      tags: [Notifications]
      summary: Change an email template
      parameters: [{ name: event, in: path, required: true, schema: { $ref: '#/components/schemas/NotificationEvent' } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotificationTemplateInput' }
      responses:
        '200':
          description: The template.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationTemplate' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }
    delete:
      tags: [Notifications]
      summary: Reset an email template
      description: The template goes back to the template of the panel (for a reseller) or to the default.
      parameters: [{ name: event, in: path, required: true, schema: { $ref: '#/components/schemas/NotificationEvent' } }]
      responses:
        '200':
          description: The template, after the reset.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationTemplate' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/notification-templates/{event}/preview:
    post:
      tags: [Notifications]
      summary: Preview an email template with example values
      parameters: [{ name: event, in: path, required: true, schema: { $ref: '#/components/schemas/NotificationEvent' } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotificationTemplateInput' }
      responses:
        '200':
          description: The email.
          content:
            application/json:
              schema:
                type: object
                properties:
                  subject: { type: string }
                  text: { type: string }
                  html: { type: string }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }
  /v1/audit:
    get:
      tags: [Audit]
      summary: Read the audit log
      description: FR-105. Each change, with who made it, when, and from which IP address. For a user who is not an administrator, an entry of an administrator or of the provider has the text "Administrator" or "Your provider" as the actor, and no IP address.
      parameters:
        - { name: q, in: query, description: Text in the action or the target. An administrator also searches the actor and an exact IP address., schema: { type: string, maxLength: 200 } }
        - { name: perPage, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: One page of entries. The newest entry is first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        at: { type: string, format: date-time }
                        actor: { type: string }
                        ip: { type: [string, 'null'] }
                        action: { type: string }
                        target: { type: string }
                  meta:
                    type: object
                    properties:
                      currentPage: { type: integer }
                      lastPage: { type: integer }
                      total: { type: integer }

  /v1/plugins:
    get:
      tags: [Plugins]
      summary: List plugins
      description: Needs an administrator and the plugins:read scope.
      responses:
        '200':
          description: The plugins.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Plugin' } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Plugins]
      summary: Install a plugin
      description: >-
        Give the manifest as the exact text of `plugin.json`, and its signature: the base64
        text of an ECDSA P-256 signature over the SHA-256 of the manifest, for example from
        `cosign sign-blob --key cosign.key plugin.json`. A trusted key must have made the
        signature (`/v1/trusted-keys`). Only the developer mode accepts no signature. Give
        your password, and your TOTP code when TOTP is on. The response has the token of the
        plugin and the secret of its webhook. The panel shows them only one time.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [manifest, password]
              properties:
                manifest: { type: string, maxLength: 32768, description: The text of plugin.json. }
                signature: { type: [string, 'null'], maxLength: 512 }
                baseUrl: { type: string, maxLength: 255, description: 'The address where you run the plugin, for example https://uptime.example.net. HTTPS only, except in the developer mode. Not the host name of the panel. Necessary when hosted is false.' }
                hosted: { type: boolean, description: 'True: the panel runs the image of the manifest in a gVisor container. The manifest must have an image.' }
                serverId: { type: [string, 'null'], description: 'With hosted: the server of the container. By default the panel server.' }
                host: { type: [string, 'null'], description: 'With hosted: the host name of the plugin. By default the slug and the plugins domain, for example uptime.plugins.example.com.' }
                password: { type: string }
                totp: { type: [string, 'null'], pattern: '^[0-9]{6}$' }
      responses:
        '201': { $ref: '#/components/responses/PluginCredentials' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Invalid' }

  /v1/plugins/preview:
    post:
      tags: [Plugins]
      summary: Read a manifest before you install it
      description: >-
        Checks the manifest and gives the scopes, the events and the pages that it asks for,
        and the trusted key that signed it. It changes nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [manifest]
              properties:
                manifest: { type: string }
                signature: { type: [string, 'null'] }
      responses:
        '200':
          description: The checked manifest.
          content:
            application/json:
              schema:
                type: object
                properties:
                  manifest: { $ref: '#/components/schemas/PluginManifest' }
                  signedBy: { oneOf: [{ $ref: '#/components/schemas/TrustedKey' }, { type: 'null' }] }
                  installed: { type: [string, 'null'], description: The ID of the installed plugin with the same slug. }
                  developerMode: { type: boolean }
        '422': { $ref: '#/components/responses/Invalid' }

  /v1/plugins/{id}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    get:
      tags: [Plugins]
      summary: Get a plugin
      responses:
        '200':
          description: The plugin.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Plugin' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Plugins]
      summary: Install a new version of a plugin
      description: >-
        The manifest must have the same slug. The token keeps its value and gets the scopes of
        the new manifest. Give your password, and your TOTP code when TOTP is on.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [manifest, password]
              properties:
                manifest: { type: string }
                signature: { type: [string, 'null'] }
                password: { type: string }
                totp: { type: [string, 'null'] }
      responses:
        '200':
          description: The plugin.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Plugin' }
        '422': { $ref: '#/components/responses/Invalid' }
    patch:
      tags: [Plugins]
      summary: Turn a plugin on or off, or change its address
      description: >-
        A plugin that is off has no access: its token and its page tokens get status 403, and
        the panel sends it no events. A new address needs your password, and your TOTP code
        when TOTP is on.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled: { type: boolean }
                baseUrl: { type: string }
                password: { type: string }
                totp: { type: [string, 'null'] }
      responses:
        '200':
          description: The plugin.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Plugin' }
        '422': { $ref: '#/components/responses/Invalid' }
    delete:
      tags: [Plugins]
      summary: Remove a plugin
      description: Removes the plugin, its user, its token, its page tokens and its deliveries.
      responses:
        '204': { description: The plugin is removed. }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/plugins/{id}/credentials:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    post:
      tags: [Plugins]
      summary: Make a new token and a new webhook secret
      description: The old token and the old secret stop at once. Give your password, and your TOTP code when TOTP is on.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string }
                totp: { type: [string, 'null'] }
      responses:
        '200': { $ref: '#/components/responses/PluginCredentials' }
        '422': { $ref: '#/components/responses/Invalid' }

  /v1/plugins/{id}/container:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    post:
      tags: [Plugins]
      summary: Start the container of a plugin again
      description: Only for a plugin that the panel runs. The agent makes the container again, for example after a failure.
      responses:
        '202':
          description: The plugin. The agent starts the container.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Plugin' }
        '422': { $ref: '#/components/responses/Invalid' }

  /v1/plugins/{id}/test:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    post:
      tags: [Plugins]
      summary: Send a test event
      description: Sends the event `plugin.test` to the webhook of the plugin.
      responses:
        '202':
          description: The delivery is in the queue.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PluginDelivery' }
        '422': { $ref: '#/components/responses/Invalid' }

  /v1/plugins/{id}/deliveries:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    get:
      tags: [Plugins]
      summary: List the last 50 deliveries of a plugin
      responses:
        '200':
          description: The deliveries, the newest first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/PluginDelivery' } }

  /v1/plugins/{id}/deliveries/{deliveryId}/retry:
    parameters:
      - { $ref: '#/components/parameters/Id' }
      - { name: deliveryId, in: path, required: true, schema: { type: string } }
    post:
      tags: [Plugins]
      summary: Send a delivery again
      description: Makes a new delivery with the same event and data.
      responses:
        '202':
          description: The new delivery is in the queue.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PluginDelivery' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/trusted-keys:
    get:
      tags: [Plugins, Packs]
      summary: List the trusted keys
      description: The keys of the publishers that the panel trusts. Plugins and packs use the same keys. A token needs the scope plugins:read or packs:read.
      responses:
        '200':
          description: The keys that the panel trusts for plugin manifests and pack manifests.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/TrustedKey' } }
    post:
      tags: [Plugins, Packs]
      summary: Trust a key
      description: An ECDSA P-256 public key in PEM format, for example cosign.pub. Give your password, and your TOTP code when TOTP is on.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, publicKey, password]
              properties:
                name: { type: string, maxLength: 100 }
                publicKey: { type: string, maxLength: 4096 }
                password: { type: string }
                totp: { type: [string, 'null'] }
      responses:
        '201':
          description: The key.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrustedKey' }
        '422': { $ref: '#/components/responses/Invalid' }

  /v1/trusted-keys/{id}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    delete:
      tags: [Plugins, Packs]
      summary: Stop trusting a key
      description: >-
        The installed plugins stay. A new install or update needs a different trusted key. The
        panel refuses to remove a key that signed an installed pack, because each web server
        checks the images of the pack with that key.
      responses:
        '204': { description: The key is removed. }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }

  /v1/plugin-settings:
    get:
      tags: [Plugins]
      summary: Get the plugin settings
      responses:
        '200':
          description: The settings.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PluginSettings' }
    put:
      tags: [Plugins]
      summary: Turn the developer mode on or off
      description: >-
        The developer mode accepts plugins with no signature, addresses with HTTP, and
        webhooks on the loopback interface. Do not use it on a production panel. To turn it
        on, give your password, and your TOTP code when TOTP is on.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [developerMode]
              properties:
                developerMode: { type: boolean }
                password: { type: string }
                totp: { type: [string, 'null'] }
      responses:
        '200':
          description: The settings.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PluginSettings' }
        '422': { $ref: '#/components/responses/Invalid' }

  /v1/packs:
    get:
      tags: [Packs]
      summary: List the packs
      responses:
        '200':
          description: The installed packs, by name.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Pack' } }
    post:
      tags: [Packs]
      summary: Install a pack
      description: >-
        Give the manifest as the exact text of `pack.json`, and its signature: the base64 text
        of an ECDSA P-256 signature over the SHA-256 of the manifest, for example from
        `cosign sign-blob --key cosign.key pack.json`. A trusted key (`/v1/trusted-keys`) or the
        Cloudfactory release key must have made the signature. Only the developer mode for
        packs accepts no signature. Give your password, and your TOTP code when TOTP is on. The
        panel then sends the pack to each web server. Refer to docs/packs.md.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [manifest, password]
              properties:
                manifest: { type: string, maxLength: 32768, description: The exact text of pack.json. The panel keeps the bytes with no change. }
                signature: { type: [string, 'null'], maxLength: 512, description: The base64 text of the signature from cosign sign-blob. }
                password: { type: string }
                totp: { type: [string, 'null'] }
      responses:
        '201':
          description: The pack.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pack' }
        '422': { $ref: '#/components/responses/Invalid' }

  /v1/packs/preview:
    post:
      tags: [Packs]
      summary: Check a pack manifest
      description: Reads the manifest and the signature, and gives what the pack adds. It changes nothing and needs no password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [manifest]
              properties:
                manifest: { type: string, maxLength: 32768 }
                signature: { type: [string, 'null'], maxLength: 512 }
      responses:
        '200':
          description: What the pack adds.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PackPreview' }
        '422': { $ref: '#/components/responses/Invalid' }

  /v1/packs/sync:
    post:
      tags: [Packs]
      summary: Send the packs to the servers again
      description: Sends all packs to each web server in a new job, for example after a failed job. The panel also does this itself, with a longer wait after each failure, when a server reports different packs.
      responses:
        '202':
          description: The jobs are in the queue.
          content:
            application/json:
              schema:
                type: object
                properties:
                  servers: { type: integer, description: The number of web servers. }

  /v1/pack-settings:
    get:
      tags: [Packs]
      summary: Get the pack settings
      responses:
        '200':
          description: The settings.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PackSettings' }
    put:
      tags: [Packs]
      summary: Turn the developer mode for packs on or off
      description: >-
        The developer mode accepts packs with no signature. The servers then run the images of
        such a pack with no signature check. Do not use it on a production panel. To turn it
        on, give your password, and your TOTP code when TOTP is on. The developer mode for
        plugins is a different setting.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [developerMode]
              properties:
                developerMode: { type: boolean }
                password: { type: string }
                totp: { type: [string, 'null'] }
      responses:
        '200':
          description: The settings.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PackSettings' }
        '422': { $ref: '#/components/responses/Invalid' }

  /v1/packs/{id}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    get:
      tags: [Packs]
      summary: Get a pack
      responses:
        '200':
          description: The pack.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pack' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Packs]
      summary: Install a new version of a pack
      description: >-
        The same input as an install. The slug must be the same and the version must be
        different. For an image that websites use, the new digest becomes the available digest
        and waits for a rollout (`/v1/rollouts`). The panel refuses a manifest that removes a
        version that websites use.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [manifest, password]
              properties:
                manifest: { type: string, maxLength: 32768, description: The exact text of pack.json. The panel keeps the bytes with no change. }
                signature: { type: [string, 'null'], maxLength: 512, description: The base64 text of the signature from cosign sign-blob. }
                password: { type: string }
                totp: { type: [string, 'null'] }
      responses:
        '200':
          description: The pack.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pack' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }
    delete:
      tags: [Packs]
      summary: Remove a pack
      description: Removes the pack and its images, and removes the pack from each web server. The panel refuses when websites use the pack.
      responses:
        '204': { description: The pack is removed. }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }

  /v1/plugin-pages:
    get:
      tags: [Plugins]
      summary: List the plugin pages for your role
      description: The pages of the plugins that are on, for the menu of the web panel. Each role.
      responses:
        '200':
          description: The pages.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/PluginPage' } }

  /v1/plugin-pages/{id}/{pageId}/session:
    parameters:
      - { $ref: '#/components/parameters/Id' }
      - { name: pageId, in: path, required: true, schema: { type: string } }
    post:
      tags: [Plugins]
      summary: Get a token for a plugin page
      description: >-
        Only a sign-in session can make this request. The token belongs to you, has the scopes
        of the plugin, and expires after 15 minutes. Your own rights still apply. The web panel
        sends the token to the frame of the page with postMessage.
      responses:
        '201':
          description: The page token.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  expiresAt: { type: string, format: date-time }
                  scopes: { type: array, items: { type: string } }
                  page: { $ref: '#/components/schemas/PluginPage' }
                  user:
                    type: object
                    properties:
                      id: { type: integer }
                      name: { type: string }
                      role: { type: string, enum: [administrator, reseller, owner] }
                      customerId: { type: [string, 'null'] }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/plugin-actions:
    get:
      tags: [Plugins]
      summary: List the plugin actions for your role
      description: The actions of the plugins that are on, for the pages of websites, servers and customers. Each role.
      responses:
        '200':
          description: The actions.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/PluginAction' } }

  /v1/plugin-actions/{id}/{actionId}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
      - { name: actionId, in: path, required: true, schema: { type: string } }
    post:
      tags: [Plugins]
      summary: Run a plugin action
      description: >-
        Only a sign-in session can make this request. The panel sends the plugin a signed request
        with a token that belongs to you, has the scopes of the plugin and expires after 15
        minutes. You must be able to see the target. The plugin has 10 seconds to answer.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetId]
              properties:
                targetId: { type: string, description: The ID of the website, the server or the customer. }
      responses:
        '200':
          description: The answer of the plugin.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  url: { type: [string, 'null'], description: A link on the address of the plugin, or null. }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }
        '502':
          description: The plugin did not answer, or answered with an error.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /agent/v1/join:
    post:
      tags: [Agent]
      summary: Join a server to the panel
      description: The command `cf-agent join` calls this route. The join token works once.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, name, agentUrl, certificateSha256, certificatePem, agentVersion, os, arch]
              properties:
                token: { type: string }
                name: { type: string, pattern: '^[a-z][a-z0-9-]{1,30}$' }
                agentUrl: { type: string, format: uri }
                certificateSha256: { type: string, pattern: '^[0-9a-f]{64}$' }
                certificatePem: { type: string, description: The self-signed certificate of the agent port. The panel trusts only this certificate for the server. }
                agentVersion: { type: string }
                os: { type: string, enum: [debian-13, ubuntu-26.04] }
                osName: { type: string }
                kernel: { type: string }
                arch: { type: string, enum: [x86-64, arm64] }
                bareMetal: { type: boolean }
                podmanVersion: { type: string }
                gvisorVersion: { type: string }
                roles: { type: array, items: { $ref: '#/components/schemas/ServerRole' } }
      responses:
        '201':
          description: Joined. Keep the agent token. The panel shows it only once.
          content:
            application/json:
              schema:
                type: object
                properties:
                  serverId: { type: string }
                  agentToken: { type: string }
                  panelCertificateSha256: { type: [string, 'null'] }
                  panelCaSha256: { type: [string, 'null'], description: The agent trusts a certificate of the panel domain from the CA with this root fingerprint. }
        '401': { description: The join token is not valid or has expired. }
        '422': { $ref: '#/components/responses/Invalid' }

  /agent/v1/jobs/{id}/events:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    post:
      tags: [Agent]
      summary: Report the progress or the result of a job
      security:
        - agentToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state]
              properties:
                state: { type: string, enum: [running, succeeded, failed] }
                step: { type: integer, minimum: 0 }
                error: { type: string, maxLength: 4000 }
                result: { type: object }
      responses:
        '200': { description: Recorded. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /agent/v1/imports/{id}/archive:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    get:
      tags: [Agent]
      summary: Download the uploaded archive of an import
      description: Only for the agent of a server with a FetchImport job of the import that is queued or runs.
      security:
        - agentToken: []
      responses:
        '200':
          description: The archive.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /agent/v1/report:
    post:
      tags: [Agent]
      summary: Report the state of the host
      description: FR-1118. The agent sends this report every minute.
      security:
        - agentToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HostReport' }
      responses:
        '200':
          description: Recorded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  panelCaSha256: { type: [string, 'null'], description: The SHA-256 fingerprint of the root certificate of the panel CA. The agent trusts this CA from now on. }
        '401': { $ref: '#/components/responses/Unauthenticated' }

components:
  securitySchemes:
    token:
      type: http
      scheme: bearer
      description: A session token from /v1/auth/login, or an API token.
    agentToken:
      type: http
      scheme: bearer
      description: |
        The agent token from /agent/v1/join. The edge proxy also checks the client certificate
        and sends its SHA-256 fingerprint in the `X-Client-Cert-Sha256` header.

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string }
    WebsiteId:
      name: websiteId
      in: path
      required: true
      schema: { type: string }
    UsageRange:
      name: range
      in: query
      schema: { type: string, enum: ['24h', '7d', '30d', '90d', '1y'], default: '24h' }

  responses:
    DatabaseUserJob:
      description: The user. The password is shown only once, and only when the panel made a new one.
      content:
        application/json:
          schema:
            type: object
            properties:
              user: { $ref: '#/components/schemas/DatabaseUser' }
              password: { type: [string, 'null'] }
              job: { $ref: '#/components/schemas/Job' }
    DnsJobs:
      description: The jobs are in the queue, one for each DNS server.
      content:
        application/json:
          schema:
            type: object
            properties:
              jobs: { type: array, items: { $ref: '#/components/schemas/Job' } }
    DnsZoneJobs:
      description: The panel recorded the change. The jobs are in the queue, one for each DNS server.
      content:
        application/json:
          schema:
            type: object
            properties:
              zone: { $ref: '#/components/schemas/DnsZone' }
              jobs: { type: array, items: { $ref: '#/components/schemas/Job' } }
    DnsRecordJobs:
      description: The panel recorded the record. The jobs are in the queue, one for each DNS server.
      content:
        application/json:
          schema:
            type: object
            properties:
              record: { $ref: '#/components/schemas/DnsRecord' }
              jobs: { type: array, items: { $ref: '#/components/schemas/Job' } }
    Unauthenticated:
      description: No token, or the token has expired.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    PluginCredentials:
      description: The plugin, its token and the secret of its webhook. The panel shows the token and the secret only one time.
      content:
        application/json:
          schema:
            type: object
            properties:
              plugin: { $ref: '#/components/schemas/Plugin' }
              token: { type: [string, 'null'], description: Null for a plugin that the panel runs. The container gets the token. }
              webhookSecret: { type: [string, 'null'], description: Null for a plugin that the panel runs. }
    Forbidden:
      description: The token does not have the necessary scope or role.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: The item does not exist, or you cannot see it.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Invalid:
      description: One or more fields are not correct.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ValidationError' }
    JobOnly:
      description: The job is in the queue.
      content:
        application/json:
          schema:
            type: object
            properties:
              job: { $ref: '#/components/schemas/Job' }
    CronJobJob:
      description: The cron job, and the job that sends the cron jobs of the website to the agent.
      content:
        application/json:
          schema:
            type: object
            properties:
              cronJob: { $ref: '#/components/schemas/CronJob' }
              job: { $ref: '#/components/schemas/Job' }
    ReleaseJob:
      description: The release and its job.
      content:
        application/json:
          schema:
            type: object
            properties:
              release: { $ref: '#/components/schemas/Release' }
              job: { $ref: '#/components/schemas/Job' }
    JobList:
      description: The jobs are in the queue.
      content:
        application/json:
          schema:
            type: object
            properties:
              jobs: { type: array, items: { $ref: '#/components/schemas/Job' } }
    WebsiteJob:
      description: The panel recorded the change. The job is in the queue.
      content:
        application/json:
          schema:
            type: object
            properties:
              website: { $ref: '#/components/schemas/Website' }
              job: { $ref: '#/components/schemas/Job' }

  schemas:
    PluginManifest:
      type: object
      description: The checked content of plugin.json. Refer to docs/plugins.md.
      properties:
        schema: { type: integer, enum: [1] }
        slug: { type: string, pattern: '^[a-z0-9]([a-z0-9-]{0,38}[a-z0-9])?$' }
        name: { type: string }
        version: { type: string }
        publisher: { type: string }
        description: { type: string }
        scopes: { type: array, items: { $ref: '#/components/schemas/Scope' }, description: 'Not tokens:read, tokens:write, users:write, plugins:read, plugins:write, packs:read or packs:write.' }
        events: { type: array, items: { $ref: '#/components/schemas/PluginEvent' } }
        webhook: { type: [string, 'null'], description: A path, for example /hooks/cloudfactory. }
        pages:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              title: { type: string }
              path: { type: string }
              roles: { type: array, items: { type: string, enum: [administrator, reseller, owner] } }
        actions:
          type: array
          description: Up to 20 buttons on websites, servers or customers.
          items:
            type: object
            properties:
              id: { type: string }
              title: { type: string }
              target: { type: string, enum: [website, server, customer] }
              path: { type: string }
              roles: { type: array, items: { type: string, enum: [administrator, reseller, owner] } }
              confirm: { type: string, description: A question that the web panel asks before it runs the action. Empty for no question. }
        hooks:
          type: array
          description: Before hooks. The plugin can refuse the change.
          items: { $ref: '#/components/schemas/PluginHook' }
        image: { oneOf: [{ $ref: '#/components/schemas/PluginImage' }, { type: 'null' }] }
        commands:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              description: { type: string }
    Plugin:
      type: object
      properties:
        id: { type: string }
        slug: { type: string }
        name: { type: string }
        version: { type: string }
        publisher: { type: string }
        description: { type: string }
        enabled: { type: boolean }
        baseUrl: { type: string }
        webhookUrl: { type: [string, 'null'] }
        scopes: { type: array, items: { $ref: '#/components/schemas/Scope' } }
        events: { type: array, items: { type: string } }
        pages: { type: array, items: { $ref: '#/components/schemas/PluginPage' } }
        actions: { type: array, items: { $ref: '#/components/schemas/PluginAction' } }
        hooks: { type: array, items: { $ref: '#/components/schemas/PluginHook' } }
        image: { oneOf: [{ $ref: '#/components/schemas/PluginImage' }, { type: 'null' }] }
        hosting:
          description: The container of a plugin that the panel runs, or null for a plugin outside the panel.
          oneOf:
            - type: 'null'
            - type: object
              properties:
                serverId: { type: [string, 'null'] }
                serverName: { type: [string, 'null'] }
                host: { type: string }
                status: { type: string, enum: [starting, running, stopped, failed, removing] }
        commands: { type: array, items: { type: object, properties: { name: { type: string }, description: { type: string } } } }
        dnsProviders: { type: array, items: { $ref: '#/components/schemas/DnsProvider' }, description: 'The external DNS providers of the plugin. Each item has the fields of DnsProvider, and `path`, but no `pluginId`.' }
        signedBy: { oneOf: [{ $ref: '#/components/schemas/TrustedKey' }, { type: 'null' }] }
        tokenExpiresAt: { type: [string, 'null'], format: date-time }
        tokenLastUsedAt: { type: [string, 'null'], format: date-time }
        deliveries:
          type: object
          description: The counts of the last 24 hours, and the last delivery.
          properties:
            delivered: { type: integer }
            pending: { type: integer }
            failed: { type: integer }
            last: { oneOf: [{ $ref: '#/components/schemas/PluginDelivery' }, { type: 'null' }] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PluginPage:
      type: object
      properties:
        pluginId: { type: string }
        pluginName: { type: string }
        id: { type: string }
        title: { type: string }
        url: { type: string }
        origin: { type: string, description: The origin of the frame. The web panel sends the page token only to this origin. }
        roles: { type: array, items: { type: string } }
    PluginEvent:
      type: string
      description: An event that a plugin can receive. The named events are changes of the audit log with one action.
      enum: [audit.recorded, job.finished, website.created, website.changed, website.removed, domain.added, domain.verified, domain.removed, database.created, database.removed, backup.started, restore.started, deploy.started, customer.created, customer.changed, user.created]
    PluginImage:
      type: object
      description: A container image for the panel to run. The digest is necessary, so the signature of the manifest covers the image.
      properties:
        ref: { type: string, description: 'The image with a tag, for example ghcr.io/example/uptime:1.4.0.' }
        digest: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        port: { type: integer, minimum: 1024, maximum: 65535, description: The HTTP port in the container. 8080 by default. }
    PluginHook:
      type: object
      properties:
        event: { type: string, enum: [website.creating, website.removing, domain.adding, database.creating, customer.creating] }
        path: { type: string }
        onError: { type: string, enum: [allow, refuse], description: What the panel does when the plugin does not answer in 5 seconds. }
    PluginAction:
      type: object
      properties:
        pluginId: { type: string }
        pluginName: { type: string }
        id: { type: string }
        title: { type: string }
        target: { type: string, enum: [website, server, customer] }
        confirm: { type: [string, 'null'] }
        roles: { type: array, items: { type: string } }
    TrustedKey:
      type: object
      description: A public key of a publisher. Plugins and packs use the same trusted keys.
      properties:
        id: { type: string }
        name: { type: string }
        fingerprint: { type: string, description: The SHA-256 of the DER bytes of the key. }
        publicKey: { type: string }
        createdAt: { type: string, format: date-time }
    PluginDelivery:
      type: object
      properties:
        id: { type: string }
        event: { type: string, description: 'An event of PluginEvent, or plugin.test.' }
        state: { type: string, enum: [pending, delivered, failed] }
        attempts: { type: integer }
        responseStatus: { type: [integer, 'null'] }
        error: { type: [string, 'null'] }
        payload: { type: object, description: 'The body that the webhook gets: id, event, createdAt and data.' }
        createdAt: { type: string, format: date-time }
        deliveredAt: { type: [string, 'null'], format: date-time }
    PluginSettings:
      type: object
      properties:
        developerMode: { type: boolean }
    PackRef:
      type: object
      description: The pack of an image.
      properties:
        id: { type: string }
        slug: { type: string }
        name: { type: string }
        version: { type: string }
    PackRuntime:
      type: object
      description: The runtime of a pack (cf-runtime/1).
      properties:
        contract: { type: string, enum: [cf-runtime/1] }
        type: { type: string, enum: [app] }
        defaultCommand: { type: string }
        defaultInstall: { type: string, description: Empty when the pack has no install command. }
    PackSigner:
      type: object
      properties:
        name: { type: string }
        fingerprint: { type: [string, 'null'], description: The SHA-256 of the DER bytes of the key. Null for the Cloudfactory release key. }
        release: { type: boolean, description: True when the Cloudfactory release key made the signature. }
    Pack:
      type: object
      properties:
        id: { type: string }
        slug: { type: string, description: The name of the runtime, for example golang. }
        name: { type: string }
        version: { type: string }
        publisher: { type: string }
        description: { type: [string, 'null'] }
        signed: { type: boolean }
        signedBy: { oneOf: [{ $ref: '#/components/schemas/PackSigner' }, { type: 'null' }] }
        runtime: { $ref: '#/components/schemas/PackRuntime' }
        images:
          type: array
          description: The images of the pack, the latest version first.
          items:
            type: object
            properties:
              id: { type: string }
              name: { type: string }
              version: { type: string }
              reference: { type: string, description: The repository, with no tag. }
              tag: { type: string }
              digest: { type: string }
              availableDigest: { type: [string, 'null'], description: A new digest from a new version of the pack. It waits for a rollout. }
              supportEndsAt: { type: [string, 'null'], format: date }
              websites: { type: integer }
        servers:
          type: array
          description: The state of the pack on each web server.
          items:
            type: object
            properties:
              id: { type: string }
              name: { type: string }
              version: { type: [string, 'null'], description: The version that the server reported. }
              state: { type: string, enum: [installed, pending, failing] }
        installedBy: { type: [string, 'null'] }
        installedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PackPreview:
      type: object
      properties:
        manifest:
          type: object
          description: The manifest, with only the keys of the contract.
          properties:
            contract: { type: string, enum: [cf-pack/1] }
            kind: { type: string, enum: [runtime] }
            slug: { type: string }
            name: { type: string }
            version: { type: string }
            publisher: { type: string }
            description: { type: string }
            runtime: { $ref: '#/components/schemas/PackRuntime' }
            images:
              type: array
              items:
                type: object
                properties:
                  version: { type: string }
                  ref: { type: string }
                  repository: { type: string }
                  tag: { type: string }
                  digest: { type: string }
                  supportEndsAt: { type: [string, 'null'], format: date }
        signedBy: { oneOf: [{ $ref: '#/components/schemas/PackSigner' }, { type: 'null' }] }
        installed:
          oneOf:
            - type: object
              properties:
                id: { type: string }
                version: { type: string }
            - type: 'null'
        developerMode: { type: boolean }
    PackSettings:
      type: object
      properties:
        developerMode: { type: boolean }
    Error:
      type: object
      properties:
        message: { type: string }
    ValidationError:
      type: object
      properties:
        message: { type: string }
        errors:
          type: object
          additionalProperties: { type: array, items: { type: string } }
    Scope:
      type: string
      enum: [websites:read, websites:write, databases:read, databases:write, dns:read, dns:write, backups:read, backups:write, mail:read, mail:write, servers:read, servers:write, images:read, images:write, customers:read, customers:write, users:read, users:write, audit:read, tokens:read, tokens:write, plugins:read, plugins:write, packs:read, packs:write]
    User:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string }
        role: { type: string, enum: [administrator, reseller, owner] }
        customerId: { type: [string, 'null'] }
        totpEnabled: { type: boolean }
        mustChangePassword: { type: boolean, description: The user has a temporary password and must set a new one. }
    Me:
      allOf:
        - { $ref: '#/components/schemas/User' }
        - type: object
          properties:
            totpSetupRequired: { type: boolean, description: The user is an administrator or a reseller in a sign-in session with no TOTP. The user must turn on TOTP before all other work. }
            securityNotices:
              type: array
              description: For an administrator, the changes that a different person made to the administrator accounts in the last 7 days. Empty for all other users.
              items:
                type: object
                properties:
                  action: { type: string, enum: [Created administrator, Reset password of administrator, Reset password and removed TOTP of administrator, Deleted administrator] }
                  target: { type: string, description: The email address of the administrator that changed. }
                  actor: { type: string }
                  at: { type: string, format: date-time }
            brand: { $ref: '#/components/schemas/Brand', description: 'White label: the brand that the user sees. A customer of a reseller sees only the brand of the reseller.' }
    ManagedUser:
      allOf:
        - { $ref: '#/components/schemas/User' }
        - type: object
          properties:
            createdAt: { type: string, format: date-time }
    NewUser:
      allOf:
        - { $ref: '#/components/schemas/ManagedUser' }
        - type: object
          properties:
            temporaryPassword: { type: string, description: The panel shows this value one time only. }
    Passkey:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        domain: { type: string, description: The panel domain of the passkey. The browser uses a passkey only on its own domain. }
        synced: { type: boolean, description: The passkey is in a password manager or a cloud account, so it is on more than one device. }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: [string, 'null'], format: date-time }
    UserIdentity:
      type: object
      properties:
        providerId: { type: string }
        name: { type: string }
        protocol: { type: string, enum: [oidc, saml] }
        connected: { type: boolean }
        email: { type: [string, 'null'], description: The email that the provider gave at the last sign-in. }
        connectedAt: { type: [string, 'null'], format: date-time }
        lastUsedAt: { type: [string, 'null'], format: date-time }
    IdentityProvider:
      type: object
      properties:
        id: { type: string }
        name: { type: string, description: 'The text of the button "Sign in with <name>".' }
        protocol: { type: string, enum: [oidc, saml] }
        enabled: { type: boolean }
        issuer: { type: [string, 'null'], description: OpenID Connect only. }
        clientId: { type: [string, 'null'], description: OpenID Connect only. }
        hasClientSecret: { type: boolean, description: The panel does not show the secret. }
        entityId: { type: [string, 'null'], description: SAML only. The entity ID of the provider. }
        ssoUrl: { type: [string, 'null'], description: SAML only. The address of the provider for the sign-in (HTTP-Redirect binding). }
        certificate: { type: [string, 'null'], description: SAML only. The certificate of the provider, in PEM format. }
        certificateExpiresAt: { type: [string, 'null'], format: date-time }
        linkByEmail: { type: boolean, description: 'The first sign-in connects the user with the same verified email, when the domain of the email is in emailDomains.' }
        emailDomains: { type: array, items: { type: string } }
        users: { type: integer, description: The number of connected accounts. }
        createdAt: { type: string, format: date-time }
    IdentityProviderInput:
      type: object
      required: [name, password]
      properties:
        name: { type: string, maxLength: 100 }
        protocol: { type: string, enum: [oidc, saml], description: Only to add a provider. }
        enabled: { type: boolean }
        issuer: { type: string, format: uri, description: 'OpenID Connect: necessary. HTTPS.' }
        clientId: { type: string, description: 'OpenID Connect: necessary.' }
        clientSecret: { type: string, description: 'OpenID Connect: necessary to add a provider.' }
        entityId: { type: string, description: 'SAML: necessary.' }
        ssoUrl: { type: string, format: uri, description: 'SAML: necessary. HTTPS.' }
        certificate: { type: string, description: 'SAML: necessary. PEM format, or the base64 text of the metadata.' }
        linkByEmail: { type: boolean }
        emailDomains: { type: array, items: { type: string }, description: Necessary when linkByEmail is true. }
        password: { type: string }
        totp: { type: string, pattern: '^[0-9]{6}$' }
    PasskeyCeremony:
      type: object
      properties:
        ceremony: { type: string, description: Give this ID with the answer of the browser. }
        publicKey: { type: object, additionalProperties: true, description: The options for the browser, in the JSON form of WebAuthn (base64url for the binary values). }
    Token:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        scopes: { type: array, items: { type: string } }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: [string, 'null'], format: date-time }
        lastUsedAt: { type: [string, 'null'], format: date-time }
    WebsiteStatus:
      type: string
      enum: [starting, running, stopping, stopped, failed]
    Limits:
      type: object
      required: [vcpus, memoryBytes, diskBytes, diskIoBytesPerSecond, processes]
      properties:
        vcpus: { type: number }
        memoryBytes: { type: integer }
        diskBytes: { type: integer }
        diskIoBytesPerSecond: { type: integer }
        processes: { type: integer }
        bandwidthBytes:
          type: integer
          description: >-
            The traffic of a website in a calendar month. 0 or none means no limit. The panel
            shows alerts near the limit. It does not stop the website.
    UsageHistory:
      type: object
      properties:
        range: { type: string, enum: ['24h', '7d', '30d', '90d', '1y'] }
        stepMinutes: { type: integer, description: The length of each point. }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        points:
          type: array
          items:
            type: object
            description: >-
              The values of one point. Each value is null when no report is in the point. CPU is
              the percent of one CPU, and for a server the percent of the server. Memory is
              the average and the largest value, in bytes or, for a server, in percent. Disk is
              the last value. The traffic is the sum in the point. A database server has no CPU
              and no traffic.
            properties:
              at: { type: string, format: date-time }
              cpuPercent: { type: [number, 'null'] }
              cpuMaxPercent: { type: [number, 'null'] }
              memoryBytes: { type: [integer, 'null'] }
              memoryMaxBytes: { type: [integer, 'null'] }
              memoryPercent: { type: [number, 'null'] }
              memoryMaxPercent: { type: [number, 'null'] }
              diskBytes: { type: [integer, 'null'] }
              diskPercent: { type: [number, 'null'] }
              processes: { type: [integer, 'null'] }
              bytesIn: { type: [integer, 'null'] }
              bytesOut: { type: [integer, 'null'] }
        alerts: { type: array, items: { $ref: '#/components/schemas/UsageAlert' }, description: The open alerts. }
    UsageAlert:
      type: object
      properties:
        id: { type: string }
        subjectType: { type: string, enum: [website, server, database_server] }
        subjectId: { type: string }
        subjectName: { type: [string, 'null'], description: Null when the subject was removed. }
        customerId: { type: [string, 'null'], description: Null for a server. }
        serverId: { type: [string, 'null'] }
        resource: { type: string, enum: [cpu, memory, disk, bandwidth, processes] }
        level: { type: string, enum: [warning, critical] }
        used: { type: number }
        limit: { type: number }
        percent: { type: number }
        usedText: { type: string, example: 9.1 GB }
        limitText: { type: string, example: 10 GB }
        openedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        resolvedAt: { type: [string, 'null'], format: date-time }
    UsageAlertSettings:
      type: object
      required: [warningPercent, criticalPercent]
      properties:
        warningPercent: { type: integer, minimum: 1, maximum: 99, default: 80 }
        criticalPercent: { type: integer, minimum: 2, maximum: 100, default: 95, description: Larger than warningPercent. }
    WebsiteKind:
      type: string
      enum: [public, private, worker]
      description: >-
        "public": a website with domains, which the edge proxy serves. "private": a website with
        no domain: only the websites of its networks connect to it. "worker": a background
        worker that runs a command and serves no HTTP.
    Website:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        application: { type: string }
        customerId: { type: string }
        serverId: { type: string }
        planId: { type: string }
        unixUser: { type: string }
        networkHost:
          type: string
          nullable: true
          description: The name of the website for a different website of the customer in a network with it, for example "shop-a1b2.internal". The name comes from the Unix user. It is the same on each server. Null for a worker.
        networkPort:
          type: integer
          nullable: true
          description: The port that the website answers on in its networks. It is 80, with HTTP. The tunnel between two servers encrypts the traffic. Null for a worker.
        kind: { $ref: '#/components/schemas/WebsiteKind' }
        command:
          type: string
          nullable: true
          description: The start command of a worker, or of a Node.js or Python website. Null for the other websites.
        installCommand:
          type: string
          nullable: true
          description: The install command of a Node.js or Python website. Null for the other websites, and for no install step.
        environment:
          type: array
          items: { type: string }
          description: The names of the environment variables of the website. The API never gives the values.
        status: { $ref: '#/components/schemas/WebsiteStatus' }
        runtime:
          type: object
          properties:
            imageId: { type: string }
            family: { type: string }
            image: { type: string }
            digest: { type: [string, 'null'] }
            signatureVerified: { type: boolean }
            phpVersion: { type: [string, 'null'] }
            version: { type: [string, 'null'], description: 'The version of Node.js or Python, for example "24".' }
            workerMode: { type: boolean }
            extensions: { type: array, items: { type: string } }
            phpIni: { type: object, additionalProperties: { type: string } }
            previousImageId: { type: [string, 'null'] }
            documentRoot: { type: string, description: 'The directory in /app that the web server serves. "." is /app. For a Node.js or Python website, the application directory: the start command and the install command run in it.' }
            supportEndsAt: { type: [string, 'null'], format: date }
        updateReady: { type: boolean }
        limits: { $ref: '#/components/schemas/Limits' }
        usage: { type: [object, 'null'] }
        bandwidthBytes: { type: integer, description: The traffic of the website in the current calendar month (UTC), in and out. }
        domains:
          type: array
          items: { $ref: '#/components/schemas/Domain' }
        sftp: { $ref: '#/components/schemas/Sftp' }
        stagingOf: { type: [string, 'null'] }
        previewOf:
          type: [object, 'null']
          description: The pull request of a preview website. The panel removes the preview when the pull request closes.
          properties:
            websiteId: { type: string, description: The website of the Git source. }
            number: { type: integer }
            branch: { type: string }
            title: { type: string }
            url: { type: [string, 'null'] }
        diskLimitApplied:
          type: [boolean, 'null']
          description: >-
            False when the server of the website does not apply the disk limit of each of its
            websites: the file system of the websites has no user quotas, and a website with a
            disk limit has no disk image. True when the server applies the limits, with user
            quotas or with a disk image for each website. Null when the agent of the server did
            not report it.
        managedByTerraform: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Sftp:
      type: object
      properties:
        enabled: { type: boolean }
        host: { type: [string, 'null'] }
        port: { type: integer, description: The SFTP port of the server of the website. The default is 2200. }
        username: { type: string }
        authorizedKeys: { type: array, items: { type: string } }
    FileEntry:
      type: object
      properties:
        name: { type: string }
        path: { type: string, example: /public/index.php }
        type: { type: string, enum: [file, directory, link, other] }
        sizeBytes: { type: integer, description: 0 for a directory and for a link. }
        modifiedAt: { type: [string, 'null'], format: date-time }
        mode: { type: string, example: '0640', description: The permission bits. }
        target: { type: [string, 'null'], description: The target of a link. }
    CronJob:
      type: object
      properties:
        id: { type: string }
        schedule: { type: string, example: '*/5 * * * *', description: The five fields of cron. The time is UTC. }
        command: { type: string }
        enabled: { type: boolean }
        lastRunAt: { type: [string, 'null'], format: date-time }
        lastResult: { type: [string, 'null'], enum: [ok, failed, null] }
        lastExitCode: { type: [integer, 'null'], description: -1 when the command did not start. }
        lastOutput: { type: [string, 'null'], description: The end of the output of the last run. }
    WebsiteCommand:
      type: object
      properties:
        id: { type: string }
        websiteId: { type: string }
        source: { type: string, enum: [run], description: '"run" is the action "Run a command" of the panel, the API and the CLI.' }
        command: { type: string }
        state: { type: string, enum: [running, done, failed], description: '"done": the command ran and has an exit code. "failed": the command did not start.' }
        exitCode: { type: [integer, 'null'] }
        timedOut: { type: boolean, description: True when the agent stopped the command at its time limit. }
        timeoutSeconds: { type: [integer, 'null'] }
        actor: { type: string, description: The user who ran the command, as in the audit log. }
        ip: { type: [string, 'null'], description: The address of the client. Null when the user must not see it. }
        jobId: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        startedAt: { type: [string, 'null'], format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
    Deploy:
      type: object
      properties:
        source:
          type: [object, 'null']
          description: The Git repository of the website. Null when the website has none.
          properties:
            repository: { type: string }
            branch: { type: string }
            webDirectory: { type: string }
            trigger: { type: string, enum: [manual, webhook, schedule] }
            checkMinutes: { type: integer, description: The interval of the branch check for the trigger "schedule". }
            checkedAt: { type: [string, 'null'], format: date-time, description: The time of the last branch check. }
            checkError: { type: [string, 'null'], description: The error of the last branch check. }
            buildCommands: { type: array, items: { type: string } }
            migrationCommand: { type: [string, 'null'], description: The command that changes the database. }
            deployKey: { type: string, description: The public SSH key of the website. Add it to a private repository as a read-only deploy key. }
            webhookUrl: { type: [string, 'null'], description: 'A signed POST request to this address starts a deploy when the trigger is "webhook". Only a token with the scope to change websites gets it.' }
            webhookSecret: { type: [string, 'null'], description: The secret of the webhook signatures. Only a token with the scope to change websites gets it. }
            deployQueued: { type: boolean, description: True when a push came during a deploy. The panel deploys it when the deploy is complete. }
            secrets: { type: array, items: { type: string }, description: The names of the secrets. No route gives a value. }
        releases: { type: array, items: { $ref: '#/components/schemas/Release' } }
    Release:
      type: object
      properties:
        id: { type: string }
        branch: { type: string }
        commit: { type: [string, 'null'] }
        message: { type: string, description: The subject of the commit. }
        state: { type: string, enum: [building, ready, failed, removed], description: '"ready": the release is on the server. "removed": the agent removed its directory.' }
        live: { type: boolean, description: True for the release that the website serves. }
        trigger: { type: string, enum: [manual, webhook, schedule] }
        migration: { type: boolean, description: True when the deploy ran the migration command. }
        healthError: { type: [string, 'null'], description: 'The error of the health check after the switch, for a deploy with a migration. The website kept the release.' }
        durationSeconds: { type: integer }
        error: { type: [string, 'null'], description: 'The error of a deploy that failed, with the end of the output of Git, of a build command or of the migration command.' }
        jobId: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
    HookAnswer:
      type: object
      properties:
        status: { type: string, enum: [ok, started, queued, ignored, waiting, removing, updated, failed, refused] }
        message: { type: string }
        releaseId: { type: string }
        previewWebsiteId: { type: string, description: The preview website of a pull request event. }
    Previews:
      type: object
      properties:
        settings:
          type: [object, 'null']
          description: Null when the website has no Git source, or is a preview itself.
          properties:
            enabled: { type: boolean }
            domain: { type: [string, 'null'], example: preview.example.com }
            limit: { type: integer }
            copyEnvironment: { type: boolean }
        suggestedDomain: { type: [string, 'null'], description: A domain for the previews. Null for a website with no domain. }
        maxLimit: { type: integer, example: 10 }
        previews: { type: array, items: { $ref: '#/components/schemas/Preview' } }
    Preview:
      type: object
      properties:
        number: { type: integer, description: The number of the pull request. }
        title: { type: string }
        branch: { type: string, description: The head branch of the pull request. }
        url: { type: [string, 'null'], description: The page of the pull request on the Git host. }
        websiteId: { type: [string, 'null'], description: The preview website. Null when the panel could not make it. }
        name: { type: [string, 'null'], example: pr-12.preview.example.com }
        state: { type: string, enum: [creating, deploying, live, failed, removing] }
        release: { oneOf: [{ $ref: '#/components/schemas/Release' }, { type: 'null' }], description: The last deploy of the preview. }
        error: { type: [string, 'null'], description: Why the panel could not make the preview, or could not start its deploy. }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    JobState:
      type: string
      enum: [queued, running, succeeded, failed]
    Job:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        ref: { type: [string, 'null'] }
        action: { type: string }
        state: { $ref: '#/components/schemas/JobState' }
        steps: { type: array, items: { type: string } }
        step: { type: integer, description: The number of steps that are complete. }
        error: { type: [string, 'null'], description: An administrator gets the full error of the agent. Other users get a short text. }
        websiteId: { type: [string, 'null'] }
        databaseServerId: { type: [string, 'null'], description: The database server of the job. A user sees the jobs of the websites and of the database servers of its customers. }
        dnsZoneId: { type: [string, 'null'], description: The DNS zone of the job. A user sees the jobs of the DNS zones of its customers. }
        serverId: { type: string }
        createdAt: { type: string, format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
    Engine:
      type: string
      enum: [mariadb, postgresql, valkey]
    DnsRecordType:
      type: string
      enum: [A, AAAA, CNAME, MX, TXT, SRV, CAA, NS]
    DnsRecordInput:
      type: object
      properties:
        type: { $ref: '#/components/schemas/DnsRecordType' }
        name:
          type: [string, 'null']
          description: >-
            The name in the zone, for example `www` or `_dmarc`. `@` or no value is the zone
            itself. A full name in the zone, for example `www.example.com`, is also correct. The
            first label can be `*`.
        value:
          type: string
          description: >-
            A: an IPv4 address. AAAA: an IPv6 address. CNAME, MX and NS: a host name. TXT: the
            text, at most 2048 printable ASCII characters, with no quotation marks around it.
            SRV: `weight port target`, for example `5 5060 sip.example.com`. CAA: `flags tag
            "value"`, for example `0 issue "letsencrypt.org"`.
        ttl: { type: integer, minimum: 60, maximum: 604800, description: In seconds. The default is 3600. }
        priority: { type: [integer, 'null'], minimum: 0, maximum: 65535, description: For MX and SRV records. The default is 10. }
    DnsRecord:
      type: object
      properties:
        id: { type: string }
        name: { type: string, description: '`@` for the zone itself.' }
        type: { $ref: '#/components/schemas/DnsRecordType' }
        value: { type: string }
        ttl: { type: integer }
        priority: { type: [integer, 'null'] }
        managed:
          type: [string, 'null']
          enum: [ns, website, null]
          description: >-
            `ns`: an NS record of the zone itself. The panel keeps these records, and a user
            cannot change them. `website`: an A or AAAA record that the panel made for a domain
            of a website. The panel changes it when the server of the website gets a new
            address, and removes it with the domain. Null: a record of the user.
    Certificate:
      type: object
      properties:
        id: { type: string }
        customerId: { type: string }
        source: { type: string, enum: [upload, acme], description: '"upload": the customer uploaded it. "acme": the panel gets it from Let''s Encrypt with DNS validation.' }
        names: { type: array, items: { type: string }, example: [example.com, '*.example.com'] }
        state:
          type: string
          enum: [issuing, failed, renewing, expired, valid]
          description: '"issuing": the first order runs. "failed": the first order failed. "renewing": an order for a new certificate runs, and the current certificate stays in use.'
        issuer: { type: [string, 'null'] }
        fingerprint: { type: [string, 'null'], description: The SHA-256 fingerprint of the certificate, in lower-case hexadecimal. }
        notBefore: { type: [string, 'null'], format: date-time }
        expiresAt: { type: [string, 'null'], format: date-time }
        trusted: { type: [boolean, 'null'], description: False when browsers do not trust the certificate, for example a self-signed certificate. }
        renewAt: { type: [string, 'null'], format: date-time, description: 'Only for "acme": the time of the next renewal.' }
        order:
          description: The order that runs, or null.
          oneOf:
            - type: 'null'
            - type: object
              properties:
                stage: { type: string, enum: [new, dns, validating, finalizing] }
                startedAt: { type: string, format: date-time }
                records:
                  type: array
                  description: The TXT records of the DNS validation.
                  items:
                    type: object
                    properties:
                      name: { type: string, example: _acme-challenge.example.com }
                      value: { type: string }
        error: { type: [string, 'null'], description: The error of the last order. }
        nextTryAt: { type: [string, 'null'], format: date-time, description: The time of the next try of a renewal that failed. }
        usedBy:
          type: array
          description: The domains that use the certificate now, from the reports of the servers.
          items:
            type: object
            properties:
              domain: { type: string }
              websiteId: { type: [string, 'null'] }
              websiteName: { type: [string, 'null'] }
              serverName: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    DnsZone:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        customerId: { type: string }
        status:
          type: string
          enum: [active, updating, failed, removing]
          description: >-
            `updating`: a DNS server does not have the last change yet. `failed`: a DNS server
            did not take the last change. Send the zone again (`/sync`).
        serial: { type: integer, description: The serial of the zone. It is the time of the last change, in seconds. A signed zone has a serial that the DNS server makes. }
        recordCount: { type: integer }
        nameServers: { type: array, items: { type: string }, description: 'The host names of the name servers for the registrar of the domain: of the panel and of its secondary DNS servers, or of the external DNS provider of the zone. Empty until the provider gives them.' }
        provider:
          type: [object, 'null']
          description: The external DNS provider of the zone. Null for a zone on the DNS servers of the panel.
          properties:
            accountId: { type: string }
            accountName: { type: string }
            name: { type: string, description: 'The name of the provider, for example Cloudflare.' }
            state: { type: string, enum: [ok, pending, failed], description: The state of the last change at the provider. }
            error: { type: [string, 'null'], description: The error of the last try. }
            active: { type: boolean, description: True when the provider answers for the zone. Some providers wait until the registrar has their name servers. }
            syncedAt: { type: [string, 'null'], format: date-time }
            changes:
              type: [object, 'null']
              description: The changes of the last change at the provider.
              properties:
                added: { type: integer }
                changed: { type: integer }
                removed: { type: integer }
            imported:
              type: [object, 'null']
              description: The records that the panel copied from the provider when the zone came there.
              properties:
                added: { type: integer }
                existing: { type: integer }
                skipped: { type: array, items: { type: object, properties: { line: { type: integer }, text: { type: string }, code: { type: string }, reason: { type: string } } } }
            handover:
              type: [object, 'null']
              description: Not null while the DNS servers of the panel still answer for a zone that moved to the provider.
              properties:
                endsAt: { type: [string, 'null'], format: date-time, description: Null until the public DNS stops giving the name servers of the panel. }
        delegation:
          type: object
          description: What the public DNS says about the zone.
          properties:
            state:
              type: string
              enum: [here, elsewhere, none, unknown]
              description: >-
                `here`: the public DNS gives the name servers of the panel, or of the external
                DNS provider of the zone. `elsewhere`: it
                gives other name servers, so the zone on the panel has no effect yet. `none`:
                it has no name servers for the domain. `unknown`: the panel did not ask yet.
            nameServers: { type: array, items: { type: string }, description: The name servers that the public DNS gave. }
            checkedAt: { type: [string, 'null'], format: date-time }
        dnssec:
          type: object
          properties:
            enabled: { type: boolean }
            state: { type: string, enum: [off, pending, active], description: '`pending`: the external DNS provider makes the key. The DS record comes after that.' }
            ds:
              type: [object, 'null']
              description: The DS record for the registrar of the domain. Null when DNSSEC is off. An external DNS provider signs with its own key.
              properties:
                keyTag: { type: integer }
                algorithm: { type: integer, description: 13 (ECDSA P-256 with SHA-256) on the DNS servers of the panel. }
                digestType: { type: integer, description: 2 (SHA-256). }
                digest: { type: string }
                record: { type: string, description: 'The full record, for example `example.com. IN DS 22976 13 2 3A81…`.' }
            dnskey: { type: [string, 'null'], description: The DNSKEY record. Some registrars ask for it and not for the DS record. }
            rollover:
              type: [object, 'null']
              description: >-
                A change of the key (`/dnssec/rollover`). Null when the key does not change, and
                for a zone at an external DNS provider. From the step `submit`, `ds` is the DS
                record of the new key.
              properties:
                step: { type: string, enum: [publish, submit, retire] }
                startedAt: { type: string, format: date-time, description: The start of the step. }
                until: { type: [string, 'null'], format: date-time, description: 'The step can end at this time. Null in the step `publish` until each DNS server has the new key, and in the step `submit`.' }
                newDs: { $ref: '#/components/schemas/DsRecord' }
                oldDs: { $ref: '#/components/schemas/DsRecord' }
            parent:
              type: [object, 'null']
              description: >-
                The DS records of the zone at the registry, as the public DNS gave them last. The
                panel asks one time each day, and every 15 minutes during a change of the key. Null
                before the first check, and for a zone at an external DNS provider.
              properties:
                state:
                  type: string
                  enum: [ok, none, other, unknown]
                  description: >-
                    `ok`: a DS record is for a key of the zone. `none`: the registry has no DS
                    record, so resolvers do not check the signatures. `other`: no DS record is for
                    a key of the zone, so resolvers that check DNSSEC refuse the answers for the
                    domain. `unknown`: the lookup failed.
                keyTags: { type: array, items: { type: integer }, description: The keys of the zone that the registry has a DS record for. }
                otherKeyTags: { type: array, items: { type: integer }, description: The key tags of the other DS records. }
                checkedAt: { type: [string, 'null'], format: date-time }
        transfers:
          type: [object, 'null']
          description: The zone transfers to the secondary DNS servers of the owner of the zone (`/transfers`). Null for a zone at an external DNS provider.
          properties:
            addresses: { type: array, items: { type: string }, description: Empty when the zone has no transfers. }
            notify: { type: boolean }
            nameServers: { type: array, items: { type: string } }
            tsig:
              type: [object, 'null']
              properties:
                name: { type: string }
                algorithm: { type: string }
            primaries: { type: array, items: { type: string }, description: The addresses of the DNS servers of the panel. The secondaries copy the zone from these addresses. }
        servers:
          type: array
          description: The state of the zone on each DNS server of the panel. Empty for a zone at an external DNS provider, after its handover time.
          items:
            type: object
            properties:
              nameServer: { type: string }
              state: { type: string, enum: [ok, pending, failed, removed] }
        websites: { type: integer, description: The number of websites of the customer that have a domain in the zone. }
        createdAt: { type: string, format: date-time }
        records: { type: array, items: { $ref: '#/components/schemas/DnsRecord' }, description: Only in the answer for one zone. }
    DsRecord:
      type: object
      description: A DS record (RFC 4034) of a DNSSEC key.
      properties:
        keyTag: { type: integer }
        algorithm: { type: integer }
        digestType: { type: integer }
        digest: { type: string }
        record: { type: string, description: 'For example `example.com. IN DS 22976 13 2 3A81…`.' }
    DnsSecondary:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        addresses: { type: array, items: { type: string } }
        nameServer: { type: [string, 'null'], description: The host name of the secondary. Each zone on the DNS servers of the panel has an NS record for it. }
        tsig:
          type: [object, 'null']
          description: The TSIG key that signs the transfers, with no secret. Null when the transfers have no key.
          properties:
            name: { type: string }
            algorithm: { type: string, enum: [hmac-sha256, hmac-sha512] }
        notify: { type: boolean }
        catalog: { type: boolean, description: True when the secondary also copies the catalog zone. }
        createdAt: { type: string, format: date-time }
    DnsSecondaryInput:
      type: object
      properties:
        name: { type: string, maxLength: 60, description: Required for a new secondary. }
        addresses: { type: array, minItems: 1, maxItems: 10, items: { type: string }, description: Required for a new secondary. }
        nameServer: { type: [string, 'null'] }
        tsig: { type: boolean, description: 'Default: true for a new secondary.' }
        keyName: { type: [string, 'null'], description: 'Default: the current name, or a new name such as `cf-01jd…`.' }
        algorithm: { type: string, enum: [hmac-sha256, hmac-sha512] }
        secret: { type: [string, 'null'], description: A TSIG secret in base64, with 16 to 64 bytes. }
        newSecret: { type: boolean }
        notify: { type: boolean, description: 'Default: true for a new secondary.' }
        catalog: { type: boolean, description: 'Default: false for a new secondary.' }
    DnsSecondaryJobs:
      type: object
      properties:
        secondary: { $ref: '#/components/schemas/DnsSecondary' }
        jobs: { type: array, items: { $ref: '#/components/schemas/Job' } }
    TsigKey:
      type: object
      properties:
        name: { type: string }
        algorithm: { type: string, enum: [hmac-sha256, hmac-sha512] }
        secret: { type: string, description: The secret in base64. }
    Import:
      type: object
      properties:
        id: { type: string }
        status: { type: string, enum: [uploading, fetching, ready, starting, running, done, failed] }
        source: { type: string, enum: [upload, url] }
        fileName: { type: [string, 'null'] }
        sizeBytes: { type: integer }
        receivedBytes: { type: integer, description: The bytes of an upload that the panel has. }
        panel: { type: [string, 'null'], enum: [cpanel, directadmin, plesk, hestia, cloudfactory, null] }
        panelName: { type: [string, 'null'] }
        account: { type: [string, 'null'], description: The name of the account on the old panel. }
        customerId: { type: string }
        customerName: { type: [string, 'null'] }
        serverId: { type: string }
        serverName: { type: [string, 'null'] }
        error: { type: [string, 'null'] }
        counts:
          type: [object, 'null']
          properties:
            websites: { type: integer }
            databases: { type: integer }
            mailboxes: { type: integer }
            dnsZones: { type: integer }
        progress:
          type: object
          properties:
            total: { type: integer }
            done: { type: integer }
            failed: { type: integer, description: The parts that failed or that the import skipped. }
        createdAt: { type: string, format: date-time }
        startedAt: { type: [string, 'null'], format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
    ImportDetail:
      allOf:
        - { $ref: '#/components/schemas/Import' }
        - type: object
          properties:
            customer:
              type: [object, 'null']
              description: The customer in the backup.
              properties:
                name: { type: string }
                email: { type: string }
            warnings:
              type: array
              description: The parts of the account that the import does not copy.
              items:
                type: object
                properties:
                  item: { type: string }
                  message: { type: string }
            plan: { oneOf: [{ $ref: '#/components/schemas/ImportPlan' }, { type: 'null' }], description: Only for the status "ready". }
            items: { type: array, items: { $ref: '#/components/schemas/ImportItem' } }
    ImportPlan:
      type: object
      properties:
        websites:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              domains: { type: array, items: { type: object, properties: { name: { type: string }, kind: { type: string, enum: [primary, alias, redirect] } } } }
              phpVersion: { type: [string, 'null'], description: The PHP version on the old panel. }
              imageId: { type: [string, 'null'], description: The image that the import selects. }
              imageName: { type: [string, 'null'] }
              diskBytes: { type: integer }
              files: { type: boolean }
              databases: { type: array, items: { type: object, properties: { name: { type: string }, bytes: { type: integer } } } }
              databaseUsers: { type: integer }
              cronJobs: { type: integer }
              wordpress: { type: boolean }
              conflict: { type: [string, 'null'], description: The reason that the import cannot make the website. }
        mailDomains:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              mailboxes: { type: integer }
              quotaBytes: { type: integer, description: The total size of the new mailboxes. }
              aliases: { type: integer }
              messages: { type: integer }
              bytes: { type: integer }
              newPasswords: { type: integer, description: The mailboxes that get a new password. }
              conflict: { type: [string, 'null'] }
        mailSpace:
          type: [object, 'null']
          description: The free mail space in the plan of the customer. A mailbox that does not fit fails.
          properties:
            mailboxes: { type: integer }
            bytes: { type: integer }
        dnsZones:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              exists: { type: boolean, description: The customer has this zone. The import adds the records that it does not have. }
              conflict: { type: [string, 'null'] }
        images:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              name: { type: string }
              phpVersion: { type: string }
    ImportItem:
      type: object
      properties:
        id: { type: string }
        kind: { type: string, enum: [website, domain, database, databaseUsers, cronJob, files, dump, mailDomain, mailbox, mailAlias, messages, dnsZone] }
        name: { type: string }
        state: { type: string, enum: [waiting, running, done, failed, skipped] }
        error: { type: [string, 'null'] }
        detail: { type: [string, 'null'] }
        jobId: { type: [string, 'null'] }
    DnsAccount:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        customerId: { type: [string, 'null'], description: Null for an account of the panel. Each customer can use it. }
        pluginId: { type: string }
        provider: { type: string }
        providerName: { type: string }
        available: { type: boolean, description: False when the plugin is off, or does not offer the provider now. }
        account: { type: [string, 'null'], description: The name of the account at the provider, as the plugin gives it. }
        dnssec: { type: boolean, description: True when the provider can sign the zones. }
        types: { type: array, items: { type: string }, description: The record types that the provider takes. }
        credentials: { type: object, additionalProperties: { type: [string, 'null'] }, description: The values of the fields that are not secret. A secret field is null. Empty for a customer and an account of the panel. }
        zones: { type: integer, description: The zones that use the account. A customer counts only its own zones. }
        checkedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
    DnsProvider:
      type: object
      description: A DNS provider of a plugin (contract cf-dns-provider/1).
      properties:
        pluginId: { type: string }
        pluginName: { type: string }
        id: { type: string }
        name: { type: string }
        dnssec: { type: boolean }
        types: { type: array, items: { type: string } }
        credentials:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              label: { type: string }
              secret: { type: boolean }
              optional: { type: boolean }
              hint: { type: string }
    DnsImport:
      type: object
      properties:
        dryRun: { type: boolean }
        added:
          type: array
          description: The records that the panel added, or would add with `dryRun`.
          items:
            type: object
            properties:
              line: { type: integer, description: The line of the record in the zone file. }
              name: { type: string }
              type: { $ref: '#/components/schemas/DnsRecordType' }
              value: { type: string }
              ttl: { type: integer }
              priority: { type: [integer, 'null'] }
              note: { type: [string, 'null'], description: 'For example, the TTL that the panel changed.' }
        existing: { type: integer, description: The number of records of the file that the zone has already. }
        skipped:
          type: array
          description: The lines that the panel did not import.
          items:
            type: object
            properties:
              line: { type: integer }
              text: { type: string, description: The text of the line, up to 200 characters. }
              code:
                type: string
                enum: [syntax, directive, class, outside, soa, type, panel, invalid, duplicate, website]
              reason: { type: string }
        zone: { $ref: '#/components/schemas/DnsZone' }
        jobs: { type: array, items: { $ref: '#/components/schemas/Job' } }
    Snapshot:
      type: object
      properties:
        id: { type: string }
        kind: { type: string, enum: [scheduled, manual] }
        sizeBytes: { type: integer }
        databases: { type: array, items: { type: string }, description: For example "mariadb:shop". Use this value as the restore item. A snapshot has no Valkey data. }
        part:
          type: string
          enum: [website, databases]
          description: >-
            `website`: the files of the website and the databases in the database servers on
            the server of the website. `databases`: only the databases in the database servers
            on one different server. A backup of a website with such databases has one snapshot
            of each part.
        serverId: { type: string, description: The server whose repository has the snapshot. }
        mailboxes: { type: array, items: { type: string } }
        createdAt: { type: string, format: date-time }
    BackupPolicy:
      type: object
      required: [daily, weekly, monthly, time, target]
      properties:
        daily: { type: integer, minimum: 0, maximum: 365 }
        weekly: { type: integer, minimum: 0, maximum: 520 }
        monthly: { type: integer, minimum: 0, maximum: 240 }
        time: { type: string, pattern: '^[0-2][0-9]:[0-5][0-9]$', description: The time of the nightly backups, in UTC. }
        manual: { type: integer, readOnly: true, description: The number of manual backups that the panel keeps for each website. The operator sets it with CF_MANUAL_BACKUPS. }
        target: { type: string, description: 'A restic repository in object storage, for example "s3:s3.amazonaws.com/bucket/path" or "b2:bucket:path".' }
        credentials:
          type: [object, 'null']
          writeOnly: true
          description: >-
            The restic environment variables of the object storage, for example AWS_ACCESS_KEY_ID
            and AWS_SECRET_ACCESS_KEY. The panel keeps them encrypted and never shows them. Leave
            out to keep them. An empty object removes them.
          additionalProperties: { type: string }
        credentialNames: { type: array, readOnly: true, items: { type: string }, description: The names of the shared credentials that are set. Each server with no key of its own gets these credentials. }
        servers:
          type: array
          readOnly: true
          description: >-
            Administrators only. Each server that has a backup repository, with the names of
            the credentials of its own object storage key. A server with no names uses the
            shared credentials.
          items:
            type: object
            required: [serverId, server, repository, credentialNames]
            properties:
              serverId: { type: string }
              server: { type: string, description: The name of the server. }
              repository: { type: [string, 'null'], description: 'The restic repository of the server, for example s3:s3.amazonaws.com/bucket/servers/SERVER_ID. Limit the key of the server to this path. Null when no backup target is set.' }
              credentialNames: { type: array, items: { type: string }, description: The names of the credentials of the key of this server. Empty when the server uses the shared credentials. }
    Mesh:
      type: object
      properties:
        range: { type: string, description: 'The address range of the mesh, for example 10.207.0.0/16.' }
        port: { type: integer, description: The UDP port of the tunnels on each server. }
        servers:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              name: { type: string }
              location: { type: string }
              state: { type: string }
              supported: { type: boolean, description: False when the agent of the server is from a release that cannot have tunnels. }
              networks: { type: boolean, description: False when the agent of the server is from a release that cannot operate network members. A website on such a server cannot use the network name of a database server. }
              publicKey: { type: [string, 'null'], description: The public tunnel key that the agent reported. }
              address: { type: [string, 'null'], description: The mesh address of the server. }
              tunnelAddress: { type: [string, 'null'], description: The public IP address for the tunnel traffic. Null until the panel finds it or an administrator sets it. }
              tunnels: { type: integer, description: The number of tunnels of the server. }
              current: { type: boolean, description: True when the server has the mesh state that the panel wants. }
        tunnels: { type: array, items: { $ref: '#/components/schemas/MeshTunnel' } }
    MeshTunnel:
      type: object
      properties:
        id: { type: string }
        state:
          type: string
          enum: [up, down, waiting]
          description: >-
            `up`: the two servers reach each other through the tunnel. `down`: one server reports
            that the other does not answer. `waiting`: a server did not report the tunnel in the
            last three minutes.
        roundTripMs: { type: [number, 'null'], description: The larger of the two measured round-trip times, in milliseconds. }
        pinned: { type: boolean, description: True for a tunnel that an administrator made. False for a tunnel that the panel made because a website on one server uses a database server on the other. }
        inUse: { type: boolean, description: True when a website on one server uses a database server on the other. The panel keeps such a tunnel. }
        sides:
          type: array
          description: What each of the two servers reported last.
          items:
            type: object
            properties:
              serverId: { type: string }
              server: { type: [string, 'null'], description: The name of the server. }
              reachable: { type: [boolean, 'null'] }
              handshakeAt: { type: [string, 'null'], format: date-time, description: The time of the last WireGuard handshake. }
              roundTripMs: { type: [number, 'null'] }
        createdAt: { type: string, format: date-time }
    ServerRole:
      type: string
      enum: [web, database, email, dns, backup]
    Server:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        location: { type: string }
        roles: { type: array, items: { $ref: '#/components/schemas/ServerRole' } }
        state:
          type: string
          enum: [joining, healthy, agent_update, degraded, offline, rebooting]
          description: >-
            `degraded`: the agent answers, but a necessary service does not run, or the panel
            cannot connect to the agent. `services` gives the service and the reason, and
            `connectionError` gives the reason of a failed connection. A degraded server with
            a service that does not run continues to do work.
        agentVersion: { type: [string, 'null'] }
        agentUpdateAvailable:
          type: boolean
          description: The panel has a newer agent than the agent of this server. The value is correct also when the state is `degraded` or `offline`.
        agentAddress:
          type: [string, 'null']
          description: The host and the port that the panel uses to connect to the agent, for example `web2.example.com:7443`.
        connectionError:
          type: [string, 'null']
          description: >-
            The reason when the panel could not connect to the agent, for example
            `Could not resolve host: web2`. The state is then `degraded`, and the jobs of the
            server fail. Null when there is no known problem.
        panel:
          type: boolean
          description: This server has the panel. It cannot be removed.
        databaseEngines:
          type: array
          items: { $ref: '#/components/schemas/Engine' }
          description: >-
            The database engines that the agent of the server can operate. An agent of an earlier
            release has `mariadb` and `postgresql` only. Update the agent to get `valkey`.
        databaseInstances:
          type: boolean
          description: >-
            True when the agent of the server can operate the database servers of customers.
            With an agent of an earlier release, the websites of the server cannot have a
            database. Update the agent of the server.
        databaseServers: { type: [integer, 'null'], description: The number of database servers of customers on the server. A server with database servers cannot be removed. }
        mail:
          type: [object, 'null']
          description: The mail server of the server. Null until an administrator turns on email.
          properties:
            hostname: { type: string, description: The host name that mail programs and other mail servers connect to. }
            status: { type: string, enum: [starting, running, stopped, failed] }
            domains: { type: integer, description: The number of mail domains on the server. A server with mail domains cannot be removed. }
            clusterId: { type: [string, 'null'], description: Not null when the server is a member of this mail cluster. }
        os: { type: [string, 'null'] }
        kernel: { type: [string, 'null'] }
        arch: { type: [string, 'null'] }
        podmanVersion: { type: [string, 'null'] }
        gvisorVersion: { type: [string, 'null'] }
        gvisorPlatform: { type: string, enum: [systrap, kvm] }
        bareMetal: { type: boolean }
        updatePolicy: { type: string, enum: [security, all, manual] }
        maintenanceWindow: { type: string }
        pendingUpdates: { type: array, items: { type: object } }
        lastUpdateAt: { type: [string, 'null'], format: date-time }
        rebootRequired: { type: boolean }
        services:
          type: array
          description: The services that the agent examines. The panel does not show the `nftables` entry of an agent of release 0.1.
          items:
            type: object
            properties:
              name: { type: string, description: 'For example cf-agent, ssh, cf-sftp, firewall or disk-quotas.' }
              state: { type: string, enum: [running, stopped, failed] }
              optional: { type: boolean, description: The server can operate without this part. An optional part that does not run does not make the server degraded. }
              detail: { type: [string, 'null'], description: The reason when the service does not run, and the command that repairs it when there is one. }
        sftpPort:
          type: integer
          description: >-
            The port of the SFTP container of the websites on this server. The default is 2200.
            The value is 22 for an agent of release 0.1, which uses the SSH service of the host.
        usage:
          type: [object, 'null']
          description: The use of the host in percent.
          properties:
            cpuPercent: { type: number, description: The load average of one minute for each CPU. }
            memoryPercent: { type: number }
            diskPercent: { type: number, description: The file system of the website files. }
        dnsName:
          type: [string, 'null']
          description: >-
            The host name of the server as a name server, for example `ns1.example.com`. A
            server with the role `dns` answers DNS queries only when it has this name. The name
            must have an A or AAAA record with the address of the server at the DNS provider of
            its domain.
        dns: { type: boolean, description: True when the agent of the server can operate DNS. An agent of an earlier release cannot. }
        addresses: { type: array, items: { type: string }, description: The public IP addresses that the agent reported. The panel uses them for the A and AAAA records of the websites on the server. }
        websites: { type: [integer, 'null'] }
        lastSeenAt: { type: [string, 'null'], format: date-time }
    Image:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        family: { type: string }
        reference: { type: string }
        tag: { type: string }
        digest: { type: [string, 'null'] }
        availableTag: { type: [string, 'null'] }
        availableDigest: { type: [string, 'null'] }
        phpVersion: { type: [string, 'null'] }
        version: { type: [string, 'null'], description: 'The version of Node.js or Python of an official image, for example "24".' }
        supportEndsAt: { type: [string, 'null'], format: date }
        policy: { type: string, enum: [automatic, security_automatic, manual] }
        custom: { type: boolean }
        pack: { oneOf: [{ $ref: '#/components/schemas/PackRef' }, { type: 'null' }], description: The pack that gives the image. Null for the other images. }
        defaults:
          type: [object, 'null']
          description: The usual start command and install command of an application image.
          properties:
            command: { type: string }
            install: { type: string }
        signatureVerified: { type: boolean }
        checkedAt: { type: [string, 'null'], format: date-time, description: The time of the last registry check. }
        checkError: { type: [string, 'null'], description: Why the last registry check failed. }
        containerPort: { type: integer }
        command: { type: array, items: { type: string } }
        websites: { type: [integer, 'null'] }
    Rollout:
      type: object
      properties:
        id: { type: string }
        imageId: { type: string }
        title: { type: string }
        fromTag: { type: string }
        toTag: { type: string }
        severity: { type: string }
        state: { type: string, enum: [running, paused, done, rolled_back] }
        stages:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              websites: { type: integer }
              state: { type: string, enum: [waiting, in_progress, done] }
        websites: { type: integer }
        healthy: { type: integer }
        rolledBack: { type: integer }
        running: { type: integer }
        rollbacks:
          type: array
          items:
            type: object
            properties:
              website: { type: string }
              reason: { type: string }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time, nullable: true, description: The time when the rollout ended. Null while the rollout is in progress or paused. }
    Branding:
      type: object
      description: >-
        The brand of a reseller (white label). In a change, a null value removes the field. A new
        panel domain, name server host name or mail host name needs a proof of control: a verified
        domain of the reseller, a DNS zone of the reseller that is delegated to the panel, or the
        TXT record that the error message gives.
      properties:
        name: { type: [string, 'null'], maxLength: 100 }
        colour: { type: [string, 'null'], pattern: '^#[0-9a-fA-F]{6}$', description: White text on the colour must have a contrast of 4.5:1 or more. }
        logo: { type: [string, 'null'], description: 'A data URL of a PNG, JPEG or WebP image: 256 KB or less, 2048 by 2048 pixels or less.' }
        panelDomain: { type: [string, 'null'], description: The panel domain of the reseller. The edge proxy of the panel server gets a TLS certificate for it. }
        supportEmail: { type: [string, 'null'], format: email }
        nameServers: { type: [array, 'null'], items: { type: string }, description: One host name for each name server of the panel, in the order of brandStatus.panelNameServers. The zones of the reseller and of its customers get these names. }
        mailHost: { type: [string, 'null'], description: The mail host name that the customers of the reseller see. }
    BrandInput:
      type: object
      properties:
        name: { type: [string, 'null'], maxLength: 100 }
        colour: { type: [string, 'null'], pattern: '^#[0-9a-fA-F]{6}$' }
        logo: { type: [string, 'null'] }
        supportEmail: { type: [string, 'null'], format: email }
    PublicBrand:
      type: object
      properties:
        name: { type: string }
        colour: { type: string }
        logo: { type: [string, 'null'] }
        supportEmail: { type: [string, 'null'] }
        builtIn: { type: boolean, description: True when the panel has the built-in brand. The web panel then shows the built-in logo. }
    Brand:
      allOf:
        - { $ref: '#/components/schemas/PublicBrand' }
        - type: object
          properties:
            source: { type: string, enum: [panel, reseller] }
            panelDomain: { type: string }
            nameServers: { type: array, items: { type: string }, description: The host names of the name servers that the user gives to a registrar. }
            mailHost: { type: [string, 'null'] }
    Domain:
      type: object
      properties:
        name: { type: string }
        kind: { type: string, enum: [primary, redirect, alias] }
        verified: { type: boolean, description: The edge proxy serves only verified domains. }
        verification:
          description: The TXT record that proves control of the domain. Null when the domain is verified.
          oneOf:
            - type: 'null'
            - type: object
              properties:
                type: { type: string, enum: [TXT] }
                name: { type: string, example: _cloudfactory-challenge.example.com }
                value: { type: string }
        dnsPointsHere: { type: boolean }
        certificate:
          type: object
          properties:
            state: { type: string, enum: [pending, valid, expired, failed] }
            expiresAt: { type: [string, 'null'], format: date-time }
            source:
              type: string
              enum: [automatic, upload, acme]
              description: '"automatic": the edge proxy gets the certificate. "upload" or "acme": a certificate of the customer from the panel (certificateId).'
            certificateId: { type: [string, 'null'] }
    DatabaseLimits:
      type: object
      description: The limits of a database server. The agent applies the disk limit with a disk image of this size.
      required: [vcpus, memoryBytes, diskBytes]
      properties:
        vcpus: { type: number, exclusiveMinimum: 0 }
        memoryBytes: { type: integer, minimum: 536870912, description: 512 MB or more. }
        diskBytes: { type: integer, minimum: 1073741824, description: 1 GB or more. }
    MailCluster:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        hostname: { type: string, description: The shared name of the cluster. }
        status: { type: string, enum: [setting_up, running, failed] }
        phase: { type: string, enum: [prepare, bootstrap, join, first, rest, done], description: The step of the setup. }
        error: { type: [string, 'null'] }
        members:
          type: array
          items:
            type: object
            properties:
              serverId: { type: string }
              serverName: { type: string }
              serverState: { type: string }
              number: { type: integer }
              hostname: { type: string }
              endpoint: { type: string }
              address: { type: string, description: The address of the member in the private network. }
              region: { type: integer }
              step: { type: string, enum: [new, prepared, joined, running] }
        records:
          type: array
          description: The DNS records to add. The shared name gives each member, and each member has its own name.
          items:
            type: object
            properties:
              type: { type: string, enum: [A, AAAA] }
              name: { type: string }
              value: { type: string }
        domains: { type: integer, description: The number of mail domains on the members. }
        createdAt: { type: string, format: date-time }
    MailDomain:
      type: object
      required: [id, name, customerId, serverId, status, records, dnsReady]
      properties:
        id: { type: string }
        name: { type: string }
        customerId: { type: string }
        serverId: { type: string }
        status: { $ref: '#/components/schemas/MailStatus' }
        mailHost: { type: string, description: 'Mail programs connect to this host name: IMAP on port 993, SMTP on port 465 or 587.' }
        records:
          type: array
          description: The DNS records that the customer adds for the domain. Empty until the mail server has the domain.
          items:
            type: object
            required: [type, name, value, purpose]
            properties:
              type: { type: string, enum: [MX, TXT] }
              name: { type: string }
              value: { type: string }
              purpose: { type: string, enum: [mx, spf, dkim, dmarc] }
              found: { type: [boolean, 'null'], description: The result of the last DNS check. Null before the first check. }
        dnsReady: { type: boolean, description: True when the last check found all records. }
        dnsCheckedAt: { type: [string, 'null'], format: date-time }
        mailboxes: { type: integer }
        aliases: { type: integer, description: The number of aliases and forwarders. }
        createdAt: { type: string, format: date-time }
    MailStatus:
      type: string
      enum: [pending, active, failed, removing]
      description: >-
        `pending`: the job that adds the record is not complete. `failed`: the agent could not
        add the record. `removing`: the job that removes the record is not complete.
    MailboxChange:
      type: object
      properties:
        mailbox: { $ref: '#/components/schemas/Mailbox' }
        password: { type: [string, 'null'], description: The new password. Null when the password did not change. }
        job: { oneOf: [{ $ref: '#/components/schemas/Job' }, { type: 'null' }] }
    Mailbox:
      type: object
      required: [id, address, localPart, domainId, customerId, status, quotaBytes, usedBytes]
      properties:
        id: { type: string }
        address: { type: string }
        localPart: { type: string }
        domainId: { type: string }
        customerId: { type: string }
        status: { $ref: '#/components/schemas/MailStatus' }
        quotaBytes: { type: integer, description: The size of the mailbox. }
        usedBytes: { type: integer, description: The size of the messages, from the last report of the agent. }
        encryption:
          type: [object, 'null']
          description: >-
            Not null when the mail server encrypts each new message of the mailbox with an
            OpenPGP public key. The values are what the mail server found in the key.
          required: [fingerprints, keyType, expiresAt, warnings]
          properties:
            fingerprints: { type: array, items: { type: string }, description: The fingerprints of the keys in the block. }
            keyType: { type: string, example: 'OpenPGP v4: RSA-3072, X25519' }
            expiresAt: { type: [string, 'null'], format: date-time }
            warnings: { type: array, items: { type: string }, description: 'For example `expiresSoon`, `weakRsa` or `addressMismatch`.' }
        privateKey:
          type: [object, 'null']
          description: Not null when the panel made the keys of the mailbox and has the protected private key.
          required: [passwordCurrent]
          properties:
            passwordCurrent: { type: boolean, description: False when the private key has an older password of the mailbox. }
        createdAt: { type: string, format: date-time }
    MailAlias:
      type: object
      required: [id, address, localPart, domainId, customerId, kind, destinations, status]
      properties:
        id: { type: string }
        address: { type: string }
        localPart: { type: string }
        domainId: { type: string }
        customerId: { type: string }
        kind: { type: string, enum: [alias, forwarder] }
        destinations: { type: array, items: { type: string } }
        status: { $ref: '#/components/schemas/MailStatus' }
        createdAt: { type: string, format: date-time }
    DatabaseServer:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        engine: { $ref: '#/components/schemas/Engine' }
        customerId: { type: string }
        serverId: { type: string, description: The server that has the container. }
        movingToServerId:
          type: string
          nullable: true
          description: The server that receives the database server, while its status is `moving`.
        planId: { type: string, description: The plan gives the limits and the number of databases. }
        status:
          type: string
          enum: [starting, running, stopped, failed, moving, removing]
          description: >-
            "starting": the agent makes the database server. "stopped": the agent reports that the
            container does not operate. "failed": the agent could not make the database server.
            "moving": the database server moves to a different server, and does not operate.
            "removing": the agent removes the database server.
        host: { type: string, description: 'The host name that a website container connects to: `mariadb.internal`, `postgres.internal` or `valkey.internal`.' }
        port: { type: integer, description: The port that a website container connects to. }
        networkHost:
          type: [string, 'null']
          description: >-
            The network name of the database server, for example `shop-db.internal`. Each website
            that is in a network with the database server connects to this name and to
            `networkPort`, on the same server and on a different server. Null for a database
            server with a name that an engine uses (`mariadb`, `postgres` or `valkey`).
        networkPort: { type: integer, description: 'The port for `networkHost`: the usual port of the engine (3306, 5432 or 6379).' }
        limits: { $ref: '#/components/schemas/DatabaseLimits' }
        usage:
          type: [object, 'null']
          description: The last report of the agent.
          properties:
            memoryBytes: { type: integer }
            diskBytes: { type: integer, description: The disk space that the database server uses. }
            diskSizeBytes: { type: integer, description: The size of the disk of the database server. 0 when the server does not apply a disk limit. }
        databases: { type: integer, description: The number of databases in the database server. }
        maxDatabases: { type: integer, description: The number of databases that the plan of the database server allows. }
        createdAt: { type: string, format: date-time }
    DatabaseUser:
      type: object
      properties:
        id: { type: string }
        engine: { $ref: '#/components/schemas/Engine' }
        name: { type: string, description: Starts with the Unix user of the website and an underscore. }
        databaseServerId: { type: string, description: The database server of the user. }
        access: { type: string, enum: [website, anywhere], description: '"website": only the website container can connect. "anywhere": any address, with TLS.' }
        grants: { type: array, items: { $ref: '#/components/schemas/DatabaseGrant' } }
    AdminerLogin:
      type: object
      properties:
        id: { type: string }
        status: { type: string, enum: [starting, ready, failed, expired], description: '"ready": Adminer can sign in with the temporary database user.' }
        url: { type: string, description: 'The address of this sign-in in Adminer: the address of the Adminer of the customer and a random key. Adminer keeps the session of the sign-in on this address only.' }
        websiteId: { type: [string, 'null'] }
        databaseId: { type: [string, 'null'] }
        databaseName: { type: string }
        privileges: { type: string, enum: [readonly, readwrite] }
        username: { type: string, description: The temporary database user. }
        expiresAt: { type: string, format: date-time }
    DatabaseGrant:
      type: object
      properties:
        databaseId: { type: string }
        database: { type: string }
        privileges: { type: string, enum: [readonly, readwrite] }
    GrantInput:
      type: object
      required: [databaseId, privileges]
      properties:
        databaseId: { type: string, description: 'A MariaDB or PostgreSQL database of the same website, with the same engine, in the database server of the user.' }
        privileges: { type: string, enum: [readonly, readwrite] }
    Customer:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        role: { type: string, enum: [reseller, owner] }
        planId: { type: string }
        resellerId: { type: [string, 'null'] }
        branding: { oneOf: [{ $ref: '#/components/schemas/Branding' }, { type: 'null' }] }
        brandStatus:
          type: [object, 'null']
          description: For a reseller, the state of the certificate of its panel domain, and the host names of the name servers of the panel.
          properties:
            certificate:
              type: [object, 'null']
              properties:
                domain: { type: string }
                method: { type: string, enum: [letsencrypt, internal] }
                state: { type: string, enum: [valid, pending, expired] }
                expiresAt: { type: [string, 'null'], format: date-time }
                error: { type: [string, 'null'] }
                checkedAt: { type: [string, 'null'], format: date-time }
            panelDomain: { type: string, description: The domain of the panel. A CNAME record of the reseller panel domain can point to it. }
            panelNameServers: { type: array, items: { type: string } }
            nameServerAddresses:
              type: object
              description: The public addresses of each name server of the panel. Each host name that the reseller gives to a name server needs the same A and AAAA records.
              additionalProperties: { type: array, items: { type: string } }
        allowedPlanIds: { type: [array, 'null'], items: { type: string }, description: For a reseller, the plans that it can give to its customers. }
        suspended: { type: boolean }
        suspendedBy: { type: [string, 'null'], enum: [administrator, reseller, null] }
        websites: { type: [integer, 'null'] }
        databaseServers: { type: [integer, 'null'], description: The number of database servers of the customer. }
        createdAt: { type: string, format: date-time }
    PlanInput:
      type: object
      required: [name, websites, mailboxes, databases, phpExtensions, limits]
      properties:
        name: { type: string }
        websites: { type: integer, minimum: 1 }
        mailboxes: { type: integer, minimum: 0, description: The number of mailboxes of a customer with the plan. }
        mailStorageBytes:
          type: integer
          minimum: 0
          description: >-
            The total size of the mailboxes of a customer with the plan. A request with no value
            keeps the value of the plan. A new plan gets 10 GB.
        databases:
          type: integer
          minimum: 0
          description: >-
            The number of databases of each database server with the plan.
        phpExtensions: { type: array, items: { type: string } }
        limits: { $ref: '#/components/schemas/Limits', description: The limits of each website with the plan. }
        databaseServers:
          type: integer
          minimum: 0
          description: >-
            The number of database servers of a customer with the plan. A request with no value
            keeps the value of the plan. A new plan gets 3.
        dnsZones:
          type: integer
          minimum: 0
          description: >-
            The number of DNS zones of a customer with the plan. A request with no value keeps
            the value of the plan. A new plan gets 5.
        networks:
          type: integer
          minimum: 0
          maximum: 1000
          description: >-
            The number of named private networks of a customer with the plan, in addition to the
            network "default". 0 turns named networks off. A request with no value keeps the
            value of the plan. A new plan gets 0.
        databaseLimits:
          $ref: '#/components/schemas/DatabaseLimits'
          description: >-
            The limits of each database server with the plan. A request with no value keeps the
            limits of the plan. A new plan gets the vCPUs of a website, the half of its memory
            and the half of its disk space. A change gives the new limits to the database
            servers of the plan that have the limits of the plan.
    Network:
      type: object
      required: [id, customerId, name, isDefault, websiteIds, databaseServerIds]
      properties:
        id: { type: string }
        customerId: { type: string }
        name: { type: string }
        isDefault: { type: boolean, description: True for the network "default" of the customer. }
        websiteIds: { type: array, items: { type: string } }
        databaseServerIds: { type: array, items: { type: string } }
        createdAt: { type: [string, 'null'], format: date-time }
    Plan:
      allOf:
        - { $ref: '#/components/schemas/PlanInput' }
        - type: object
          properties:
            id: { type: string }
    NotificationEvent:
      type: string
      enum: [job.failed, backup.failed, certificate.expiring, account.suspended, account.restored, signin.new_device, usage.alert, server.offline, deploy.attention, password.reset]
    NotificationPreference:
      type: object
      properties:
        event: { $ref: '#/components/schemas/NotificationEvent' }
        label: { type: string }
        description: { type: string }
        email: { type: boolean, description: True when the event sends an email to the user. }
        required: { type: boolean, description: A security email. The user cannot turn it off. }
    NotificationDelivery:
      type: object
      properties:
        id: { type: string }
        event: { $ref: '#/components/schemas/NotificationEvent' }
        label: { type: string }
        recipient: { type: string }
        subject: { type: string }
        state: { type: string, enum: [queued, sent, failed, skipped], description: '"skipped": no SMTP server was set. The panel tries 3 times before "failed".' }
        error: { type: [string, 'null'] }
        attempts: { type: integer }
        sentBy: { type: string, enum: [panel, reseller], description: The SMTP server that sends the email. }
        createdAt: { type: string, format: date-time }
        sentAt: { type: [string, 'null'], format: date-time }
    MailServer:
      type: object
      properties:
        configured: { type: boolean }
        enabled: { type: boolean }
        host: { type: [string, 'null'] }
        port: { type: [integer, 'null'] }
        encryption: { type: [string, 'null'], enum: [tls, starttls, none, null] }
        username: { type: [string, 'null'] }
        hasPassword: { type: boolean }
        fromAddress: { type: [string, 'null'] }
        fromName: { type: [string, 'null'] }
        replyTo: { type: [string, 'null'] }
        testedAt: { type: [string, 'null'], format: date-time }
        testError: { type: [string, 'null'] }
        panelFallback: { type: [boolean, 'null'], description: For a reseller only. True when the server of the panel sends the emails while the reseller has none. }
    MailServerInput:
      type: object
      required: [host, port, encryption, fromAddress]
      properties:
        enabled: { type: boolean, default: true }
        host: { type: string, maxLength: 253 }
        port: { type: integer, enum: [25, 465, 587, 2525] }
        encryption: { type: string, enum: [tls, starttls, none], description: '"tls": TLS from the start (port 465). "starttls": the server must give STARTTLS. "none": no TLS.' }
        username: { type: [string, 'null'], maxLength: 200 }
        password: { type: [string, 'null'], maxLength: 500 }
        fromAddress: { type: string, format: email }
        fromName: { type: [string, 'null'], maxLength: 100 }
        replyTo: { type: [string, 'null'], format: email }
    NotificationTemplate:
      type: object
      properties:
        event: { $ref: '#/components/schemas/NotificationEvent' }
        label: { type: string }
        description: { type: string }
        subject: { type: string }
        body: { type: string }
        changed: { type: boolean, description: True when this scope changed the template. }
        originalSubject: { type: string, description: The subject after a reset. }
        originalBody: { type: string }
        variables: { type: array, items: { type: string } }
    NotificationTemplateInput:
      type: object
      required: [subject, body]
      properties:
        subject: { type: string, maxLength: 200 }
        body: { type: string, maxLength: 10000 }
    PanelCertificate:
      type: object
      required: [domain, method, state, letsEncryptAvailable, serversWithoutCa]
      properties:
        domain: { type: string }
        method: { type: [string, 'null'], enum: [internal, letsencrypt, null], description: Null until the agent on the panel server reports. }
        state: { type: string, enum: [valid, pending, expired], description: '"pending": the edge proxy does not have a certificate of the method yet.' }
        expiresAt: { type: [string, 'null'], format: date-time }
        caCertificate: { type: [string, 'null'], description: The root certificate of the panel CA in PEM format. Add it to the trust store of your browser or system. }
        caSha256: { type: [string, 'null'], description: The SHA-256 fingerprint of caCertificate. }
        reportedAt: { type: [string, 'null'], format: date-time }
        letsEncryptAvailable: { type: boolean, description: False when the panel domain is not public, for example panel.localhost. }
        serversWithoutCa: { type: array, items: { type: string }, description: The names of the other servers that do not trust the panel CA yet. }
        job: { oneOf: [{ $ref: '#/components/schemas/Job' }, { type: 'null' }], description: The current or the last change of the method. }

    HostReport:
      type: object
      required: [agentVersion]
      properties:
        agentVersion: { type: string }
        kernel: { type: string }
        podmanVersion: { type: string }
        gvisorVersion: { type: string }
        pendingUpdates:
          type: array
          items:
            type: object
            required: [name, to]
            properties:
              name: { type: string }
              from: { type: string }
              to: { type: string }
              security: { type: boolean }
              containerTool: { type: boolean, description: A held container tool. The policy "tools" updates it (FR-1113). }
        rebootRequired: { type: boolean }
        lastUpdateAt: { type: string, format: date-time }
        dns: { type: boolean, description: True when the agent can operate DNS. }
        addresses: { type: array, maxItems: 16, items: { type: string }, description: The public IP addresses of the server. }
        dnsZones:
          type: [array, 'null']
          description: The DNS zones of the server. The panel sends each zone that the server does not have with the last serial, and removes each zone that the server must not have. An agent that cannot operate DNS does not send the list.
          items:
            type: object
            required: [name, serial]
            properties:
              name: { type: string, maxLength: 253 }
              serial: { type: integer, minimum: 0, description: The serial of the zone that the DNS server loaded last. 0 when it loaded none. }
        services:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              state: { type: string, enum: [running, stopped, failed] }
              detail: { type: string, maxLength: 1000, description: The reason when the service does not run. }
              optional: { type: boolean, description: 'The server can operate without this part. The panel also knows `disk-quotas` and `database-disk-limits` as optional parts.' }
        usage:
          type: object
          description: The use of the host in percent.
          properties:
            cpuPercent: { type: number, description: The load average of one minute for each CPU. }
            memoryPercent: { type: number }
            diskPercent: { type: number, description: The file system of the website files. }
            networkInBytes: { type: integer, description: The bytes that the physical network interfaces received since the last report. }
            networkOutBytes: { type: integer, description: The bytes that the physical network interfaces sent since the last report. }
        websites:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              cpuPercent: { type: number }
              memoryBytes: { type: integer }
              diskBytes: { type: integer }
              processes: { type: integer }
              bytesIn: { type: integer, description: The size of the requests to the domains of the website through the edge proxy since the last report. }
              bytesOut: { type: integer, description: The size of the answers since the last report. }
        domains:
          type: [array, 'null']
          description: The DNS and the certificate of each domain of the websites on the server.
          items:
            type: object
            properties:
              name: { type: string }
              dnsPointsHere: { type: boolean }
              certificate: { type: string, enum: [pending, valid, expired, failed] }
              expiresAt: { type: string, format: date-time }
        databases:
          type: [array, 'null']
          description: The size of each database on the server.
          items:
            type: object
            properties:
              engine: { $ref: '#/components/schemas/Engine' }
              name: { type: string }
              sizeBytes: { type: integer }
              number: { type: integer, minimum: 1, description: Valkey only. The database number. }
              keys: { type: integer, minimum: 0, description: Valkey only. The number of keys. }
        cronRuns:
          type: [array, 'null']
          description: The results of the cron jobs that ran since the last reports. The agent sends each result in 3 reports.
          items:
            type: object
            required: [websiteId, id, at, exitCode]
            properties:
              websiteId: { type: string }
              id: { type: string, description: The ID of the cron job. }
              at: { type: string, format: date-time }
              exitCode: { type: integer, description: -1 when the command did not start. }
              output: { type: string, description: The end of the output of the command. }
        databaseEngines:
          type: [array, 'null']
          description: The database engines that the agent can operate. An agent of an earlier release does not send the field.
          items: { $ref: '#/components/schemas/Engine' }
        runtimes:
          type: [array, 'null']
          description: >-
            The website runtimes that the agent can run: the built-in runtimes and the runtimes
            of the packs that it loaded. An agent of an earlier release does not send the field.
          items: { type: string, maxLength: 32 }
        packs:
          type: [array, 'null']
          maxItems: 50
          description: >-
            The packs that the agent loaded (SetPacks): the slug and the version of each one.
            When they do not agree with the panel, the panel sends the packs again.
          items:
            type: object
            required: [slug, version]
            properties:
              slug: { type: string, maxLength: 40 }
              version: { type: string, maxLength: 40 }
        certificates:
          type: [array, 'null']
          maxItems: 2000
          description: >-
            The certificates from the panel that the edge proxy has (SetCertificates): the ID,
            the SHA-256 fingerprint and the hosts of each one. When they do not agree with the
            panel, the panel sends the certificates again. Null when the agent could not read them.
          items:
            type: object
            required: [id, sha256]
            properties:
              id: { type: string, maxLength: 64 }
              sha256: { type: string, maxLength: 64 }
              hosts: { type: array, maxItems: 5000, items: { type: string, maxLength: 253 } }
        features:
          type: [array, 'null']
          description: >-
            The optional features of the agent that are on, for example `valkey-backups`. With
            `valkey-backups`, the backups of the websites include their Valkey databases. An
            agent of an earlier release does not send the field.
          items: { type: string, maxLength: 64 }
        databaseInstances:
          type: boolean
          description: True when the agent can operate the database servers of customers. An agent of an earlier release does not send the field.
        mail:
          type: [object, 'null']
          description: The mail server of the server. An agent sends it when the mail server is installed.
          required: [state]
          properties:
            state: { type: string, enum: [running, stopped] }
            mailboxes:
              type: array
              items:
                type: object
                required: [address, usedBytes]
                properties:
                  address: { type: string }
                  usedBytes: { type: integer }
        databaseServers:
          type: [array, 'null']
          description: The state and the resource use of each database server on the server.
          items:
            type: object
            required: [id, state]
            properties:
              id: { type: string }
              state: { type: string, enum: [running, stopped] }
              memoryBytes: { type: integer }
              diskBytes: { type: integer }
              diskSizeBytes: { type: integer, description: 0 when the server does not apply a disk limit to the database server. }
        sftpPort: { type: [integer, 'null'], minimum: 1, maximum: 65535 }
        panelCertificate:
          type: [object, 'null']
          description: The certificate of the panel domain. Only the agent on the panel server sends it.
          required: [domain, method, state]
          properties:
            domain: { type: string }
            method: { type: string, enum: [internal, letsencrypt] }
            state: { type: string, enum: [valid, pending, expired] }
            expiresAt: { type: [string, 'null'], format: date-time }
            caCertificate: { type: [string, 'null'], description: The root certificate of the panel CA in PEM format. }
        panelCaSha256: { type: [string, 'null'], pattern: '^[0-9a-f]{64}$', description: The fingerprint of the root certificate of the panel CA that the agent trusts. }
