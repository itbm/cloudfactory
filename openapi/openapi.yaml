openapi: 3.1.0
info:
  title: Cloudfactory panel API
  version: 0.1.0
  summary: The public API of the Cloudfactory panel.
  description: |
    The web panel and the `cf` command line tool use only this API (FR-103).

    A change does not happen at once. The panel records the desired state, puts a job
    in the queue, and returns the job with status 202. The agent on the server applies the
    change and reports each step. Get the job to see its progress (spec section 6.3).

    Each API token has scopes and an expiry date (FR-104). A GET request needs the
    `<area>:read` scope. Other methods need `<area>:write`. A write scope also gives read access.
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only
servers:
  - url: https://panel.example.com/api
security:
  - token: []
tags:
  - name: Auth
  - name: Websites
  - name: Databases
  - name: Backups
  - name: Jobs
  - name: Servers
    description: Administrators only.
  - name: Images
    description: Administrators only.
  - name: Customers
  - name: Users
    description: The users who can sign in. These routes need the users scope.
  - name: Audit
  - name: Agent
    description: Only the agent on a server uses these routes. They use the agent token, not a user token.

paths:
  /v1/auth/login:
    post:
      tags: [Auth]
      summary: Sign in
      description: >-
        Sign in with an email address and a password. The token expires after 12 hours. The panel
        examines the password first. A wrong password gives an error on `email`, also when TOTP is
        on for the user. When the password is correct and TOTP is on for the user, a request with
        no `totp` gives status 422 with `totpRequired: true` and an error on `totp`. This answer is
        not a failed attempt: send the request again with the code. A wrong code gives an error on
        `totp`, and it is a failed attempt. A TOTP code is good one time only. After 5 failed
        attempts from one address, the account is locked for that address for 30 seconds, and the
        time doubles after each further failure, up to one hour. After 100 failed attempts in one
        hour from all addresses, the account is locked for all addresses.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
                totp: { type: string, pattern: '^[0-9]{6}$', description: Necessary when TOTP is on for the user. }
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  expiresAt: { type: string, format: date-time }
        '422':
          description: >-
            The email address, the password or the code is not correct, or the user must give a
            TOTP code. `totpRequired` is in the answer only when the password is correct and the
            request had no code.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/ValidationError' }
                  - type: object
                    properties:
                      totpRequired: { type: boolean, description: The password is correct. Send the request again with `totp`. }
        '403': { description: The customer of the user is suspended. The panel gives this answer only to a user who also gave a correct TOTP code. A user with no TOTP gets the 422 answer with an error on `email`. }
        '429': { description: Too many attempts from this address, or too many failed attempts for this account. The Retry-After header gives the number of seconds to wait. }

  /v1/auth/logout:
    post:
      tags: [Auth]
      summary: Sign out
      description: Deletes the token of this request. The token does not work after this request.
      responses:
        '204': { description: Signed out. }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /v1/me:
    get:
      tags: [Auth]
      summary: Get the user of the token
      responses:
        '200':
          description: The user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /v1/me/password:
    put:
      tags: [Auth]
      summary: Change your password
      description: Needs a sign-in session token. An API token cannot change the password. Give the current password, and your TOTP code when TOTP is on. The panel signs out all other sessions of the user and deletes all API tokens of the user. A user with a temporary password (mustChangePassword) can use only this route, /v1/me and /v1/auth/logout. Each other route gives 403 with the code password_change_required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, password, password_confirmation]
              properties:
                currentPassword: { type: string }
                password: { type: string, minLength: 12 }
                password_confirmation: { type: string }
                totp: { type: string, pattern: '^[0-9]{6}$' }
      responses:
        '204': { description: Changed. }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Invalid' }

  /v1/me/totp/setup:
    post:
      tags: [Auth]
      summary: Start to set up TOTP
      description: Needs a sign-in session token. The panel makes a new TOTP key and keeps it for 10 minutes. TOTP is on only after you confirm a code with /v1/me/totp/enable.
      responses:
        '200':
          description: The new key, and an otpauth URI for a QR code.
          content:
            application/json:
              schema:
                type: object
                properties:
                  secret: { type: string }
                  uri: { type: string }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: TOTP is already on. }

  /v1/me/totp/enable:
    post:
      tags: [Auth]
      summary: Turn on TOTP
      description: Needs a sign-in session token. Give your password and a code from the app for the key from /v1/me/totp/setup.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, code]
              properties:
                password: { type: string }
                code: { type: string, pattern: '^[0-9]{6}$' }
      responses:
        '204': { description: TOTP is on. }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: TOTP is already on. }
        '422': { $ref: '#/components/responses/Invalid' }

  /v1/me/totp/disable:
    post:
      tags: [Auth]
      summary: Turn off TOTP
      description: Needs a sign-in session token. Give your password and a code from the app.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, code]
              properties:
                password: { type: string }
                code: { type: string, pattern: '^[0-9]{6}$' }
      responses:
        '204': { description: TOTP is off. }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Invalid' }

  /v1/tokens:
    get:
      tags: [Auth]
      summary: List your API tokens
      description: Needs a session token or the tokens:read scope.
      responses:
        '200':
          description: The tokens. The secret part is not shown again.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Token' } }
    post:
      tags: [Auth]
      summary: Make an API token
      description: Needs a session token or the tokens:write scope. The new token can have only the scopes of the token that makes it. Give your password, and your TOTP code when TOTP is on.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, scopes, expiresInDays, password]
              properties:
                name: { type: string, maxLength: 100 }
                scopes: { type: array, minItems: 1, items: { $ref: '#/components/schemas/Scope' } }
                expiresInDays: { type: integer, minimum: 1, maximum: 365 }
                password: { type: string, description: The password of the user. }
                totp: { type: string, pattern: '^[0-9]{6}$', description: Necessary when TOTP is on for the user. }
      responses:
        '201':
          description: The token. Copy it now. The panel shows it only once.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer }
                  token: { type: string }
                  scopes: { type: array, items: { $ref: '#/components/schemas/Scope' } }
                  expiresAt: { type: string, format: date-time }
        '403': { description: The token does not have the tokens:write scope, or it does not have a scope that the new token asks for. }
        '422': { $ref: '#/components/responses/Invalid' }

  /v1/tokens/{id}:
    delete:
      tags: [Auth]
      summary: Revoke an API token
      description: Needs a session token or the tokens:write scope.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '204': { description: Revoked. }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/websites:
    get:
      tags: [Websites]
      summary: List websites
      description: Administrators see all websites. Resellers see the websites of their customers. Owners see their own websites.
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/WebsiteStatus' } }
        - { name: q, in: query, description: Part of the website name., schema: { type: string } }
        - { name: perPage, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: One page of websites.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Website' } }
                  meta: { type: object }
                  links: { type: object }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Websites]
      summary: Create a website
      description: >-
        FR-201. The panel selects the web server with the fewest websites when you do not give
        `serverId`. A healthy server comes before a degraded server. A server in a different state
        does not get a website. A PHP website starts with the extensions opcache, intl, gd, zip,
        mysqli, pdo_mysql and pdo_pgsql when the plan has them. The edge proxy serves the primary
        domain only after it is verified (refer to "Add a redirect or an alias").
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, imageId]
              properties:
                name: { type: string, description: The primary domain. Lower case. }
                application: { type: string, maxLength: 100 }
                imageId: { type: string }
                planId: { type: string, description: The plan of the customer when you do not give it. Only an administrator or the reseller of the customer can give a different plan. }
                serverId: { type: string }
                customerId: { type: string, description: Necessary for administrators and resellers. }
      responses:
        '202': { $ref: '#/components/responses/WebsiteJob' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Invalid' }

  /v1/websites/{id}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    get:
      tags: [Websites]
      summary: Get a website
      responses:
        '200':
          description: The website.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Website' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Websites]
      summary: Change a website
      description: Only administrators can set `limits` (FR-202). Only an administrator or the reseller of the customer can change `planId`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                application: { type: string }
                planId: { type: string }
                limits: { $ref: '#/components/schemas/Limits' }
                managedByTerraform: { type: boolean }
      responses:
        '200':
          description: Changed. `job` is null when the agent does not have to do anything.
          content:
            application/json:
              schema:
                type: object
                properties:
                  website: { $ref: '#/components/schemas/Website' }
                  job: { oneOf: [{ $ref: '#/components/schemas/Job' }, { type: 'null' }] }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Invalid' }
    delete:
      tags: [Websites]
      summary: Remove a website
      responses:
        '202': { $ref: '#/components/responses/JobOnly' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/websites/{id}/power:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    post:
      tags: [Websites]
      summary: Start, stop or restart a website
      description: >-
        The panel refuses start and restart with status 409 while the customer of the website is
        suspended. The panel refuses all actions with status 422 for a website with the status
        `failed`, because the server has no container for it. Refer to "Make a failed website
        again".
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [start, stop, restart] }
      responses:
        '202': { $ref: '#/components/responses/JobOnly' }
        '409': { description: The customer of the website is suspended. }
        '422': { $ref: '#/components/responses/Invalid' }

  /v1/websites/{id}/retry:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    post:
      tags: [Websites]
      summary: Make a failed website again
      description: >-
        Starts the job that makes the website again, with the settings that the website has now.
        Use this request when the first job failed, for example because the server could not pull
        the image. The job keeps what a previous run made. The panel accepts the request only for
        a website with the status `failed`. A staging copy cannot be made again: delete it, and
        make the staging copy again.
      responses:
        '202': { $ref: '#/components/responses/WebsiteJob' }
        '409': { description: The customer of the website is suspended. }
        '422': { $ref: '#/components/responses/Invalid' }

  /v1/websites/{id}/staging:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    post:
      tags: [Websites]
      summary: Make a staging copy
      description: >-
        FR-205. The copy has the name `staging.<domain>`. It gets a copy of each MariaDB and
        PostgreSQL database of the website, and one new database user for each engine with
        read-write access to the copies. The data of a Valkey database is not copied: the copy gets
        a new, empty Valkey database, with its own user, for each Valkey database of the website.
        The response shows the passwords of the new users once.
      responses:
        '202':
          description: The job makes the copy.
          content:
            application/json:
              schema:
                type: object
                properties:
                  website: { $ref: '#/components/schemas/Website' }
                  job: { $ref: '#/components/schemas/Job' }
                  databaseCredentials:
                    type: array
                    items:
                      type: object
                      properties:
                        engine: { $ref: '#/components/schemas/Engine' }
                        user: { type: string }
                        password: { type: string }
                        databases: { type: array, items: { type: string } }
        '422': { $ref: '#/components/responses/Invalid' }

  /v1/websites/{websiteId}/domains:
    parameters:
      - { $ref: '#/components/parameters/WebsiteId' }
    post:
      tags: [Websites]
      summary: Add a redirect or an alias
      description: >-
        You cannot add the panel domain, a reseller panel domain, the host name of a server, or a
        sub-domain of one of these. The edge proxy serves the domain only after you prove that you
        control it. Add the TXT record in "verification", then verify the domain. A domain is
        verified at once when you are an administrator, or when it is a sub-domain of a verified
        domain of the same customer. A website can have 50 domains. A customer can add 30
        domains in one hour (status 429 after that). When a different customer has the domain,
        the error message gives a TXT record. With that record, you prove that you control the
        domain, and the panel takes the domain from the other website.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, kind]
              properties:
                name: { type: string }
                kind: { type: string, enum: [redirect, alias] }
      responses:
        '202':
          description: The domain. The job is null until the domain is verified.
          content:
            application/json:
              schema:
                type: object
                properties:
                  domain: { $ref: '#/components/schemas/Domain' }
                  job: { oneOf: [{ $ref: '#/components/schemas/Job' }, { type: 'null' }] }
        '422': { $ref: '#/components/responses/Invalid' }

  /v1/websites/{websiteId}/domains/{name}/verify:
    parameters:
      - { $ref: '#/components/parameters/WebsiteId' }
      - { name: name, in: path, required: true, schema: { type: string } }
    post:
      tags: [Websites]
      summary: Verify a domain
      description: The panel reads the TXT record of the domain. When it holds the token, the edge proxy starts to serve the domain.
      responses:
        '202':
          description: The domain is verified. The job adds the domain to the edge proxy.
          content:
            application/json:
              schema:
                type: object
                properties:
                  domain: { $ref: '#/components/schemas/Domain' }
                  job: { oneOf: [{ $ref: '#/components/schemas/Job' }, { type: 'null' }] }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { description: The TXT record does not have the token. }

  /v1/websites/{websiteId}/domains/{name}/primary:
    parameters:
      - { $ref: '#/components/parameters/WebsiteId' }
      - { name: name, in: path, required: true, schema: { type: string } }
    post:
      tags: [Websites]
      summary: Make a domain the primary domain
      description: >-
        FR-401. The domain must be verified. The old primary domain becomes an alias. The website
        takes the name of the new primary domain.
      responses:
        '202': { $ref: '#/components/responses/WebsiteJob' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }

  /v1/websites/{websiteId}/domains/{name}/check:
    parameters:
      - { $ref: '#/components/parameters/WebsiteId' }
      - { name: name, in: path, required: true, schema: { type: string } }
    post:
      tags: [Websites]
      summary: Check the DNS of a domain again
      description: >-
        FR-402 and FR-403. The agent checks the DNS of the domain. When the domain points to the
        server, the edge proxy gets a certificate.
      responses:
        '202':
          description: The job checks the domain.
          content:
            application/json:
              schema:
                type: object
                properties:
                  domain: { $ref: '#/components/schemas/Domain' }
                  job: { $ref: '#/components/schemas/Job' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }

  /v1/websites/{websiteId}/sftp:
    parameters:
      - { $ref: '#/components/parameters/WebsiteId' }
    put:
      tags: [Websites]
      summary: Set the SFTP access of a website
      description: >-
        Spec section 10. The owner signs in with the user name of the website and an SSH key.
        The server refuses passwords, and allows only SFTP, in the directory of the website. To
        turn on SFTP, give at least one key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
                authorizedKeys: { type: array, maxItems: 20, items: { type: string, description: 'One OpenSSH public key, for example "ssh-ed25519 AAAA... me@laptop".' } }
      responses:
        '202':
          description: The job sets the access.
          content:
            application/json:
              schema:
                type: object
                properties:
                  sftp: { $ref: '#/components/schemas/Sftp' }
                  job: { $ref: '#/components/schemas/Job' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }

  /v1/websites/{websiteId}/domains/{name}:
    parameters:
      - { $ref: '#/components/parameters/WebsiteId' }
      - { name: name, in: path, required: true, schema: { type: string } }
    delete:
      tags: [Websites]
      summary: Remove a domain
      description: You cannot remove the primary domain. The job is null when the domain was not verified.
      responses:
        '202': { $ref: '#/components/responses/JobOnly' }
        '422': { $ref: '#/components/responses/Invalid' }

  /v1/websites/{websiteId}/runtime:
    parameters:
      - { $ref: '#/components/parameters/WebsiteId' }
    put:
      tags: [Websites]
      summary: Change the runtime
      description: |
        FR-303 to FR-305. Change the image, the PHP extensions, php.ini values or worker mode.
        The agent starts the new container, does a health check, and only then sends traffic to it.
        If the health check fails, the website stays on the previous image. For a website with the
        status `failed`, the panel makes the website again with the new settings: the job has the
        action `CreateWebsite`, and there is no previous image to go back to.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                imageId: { type: string }
                workerMode: { type: boolean, description: Only for FrankenPHP. }
                documentRoot: { type: string, maxLength: 200, description: 'Batch 1, finding 11. The directory in /app that the web server serves, for example "web". "." is /app. The default is "public".' }
                extensions: { type: array, items: { type: string }, description: Only the extensions of the plan. }
                phpIni:
                  type: object
                  description: >-
                    Permitted keys and values: memory_limit (16M to the memory limit of the website),
                    upload_max_filesize and post_max_size (a size up to 16G), max_execution_time (1 to
                    3600), max_input_vars (100 to 100000), display_errors (On or Off), date.timezone (a
                    time zone), opcache.memory_consumption (8 to the memory limit in megabytes). The
                    panel refuses -1 (no limit).
                  additionalProperties: { type: string }
      responses:
        '202': { $ref: '#/components/responses/WebsiteJob' }
        '200': { description: Nothing changed. `job` is null. }
        '422': { $ref: '#/components/responses/Invalid' }

  /v1/websites/{websiteId}/runtime/revert:
    parameters:
      - { $ref: '#/components/parameters/WebsiteId' }
    post:
      tags: [Websites]
      summary: Go back to the previous image
      responses:
        '202': { $ref: '#/components/responses/WebsiteJob' }
        '422': { $ref: '#/components/responses/Invalid' }

  /v1/websites/{websiteId}/databases:
    parameters:
      - { $ref: '#/components/parameters/WebsiteId' }
    get:
      tags: [Databases]
      summary: List the databases and database users of a website
      responses:
        '200':
          description: The databases and users.
          content:
            application/json:
              schema:
                type: object
                properties:
                  prefix: { type: string, description: 'The start of each database and user name: the Unix user of the website and an underscore.' }
                  databases:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        engine: { $ref: '#/components/schemas/Engine' }
                        name: { type: string }
                        sizeBytes: { type: integer, description: Not used for Valkey. }
                        number:
                          type: [integer, 'null']
                          minimum: 1
                          description: >-
                            Valkey only. The database number that the application selects. The value is
                            null until the job that makes the database is complete.
                        keys: { type: [integer, 'null'], description: Valkey only. The number of keys in the last report of the server. }
                  users: { type: array, items: { $ref: '#/components/schemas/DatabaseUser' } }
    post:
      tags: [Databases]
      summary: Create a database
      description: >-
        FR-501 and FR-502. The full name is the prefix of the website and the name that you give,
        for example "acme_x7k2_shop". By default the panel also makes a user with the same name and
        read-write access. Only the website container can connect.


        Each customer has its own database containers on a server. The website container connects
        to them with the host names `mariadb.internal`, `postgres.internal` and `valkey.internal`.
        A website cannot connect to the database containers of a different customer.


        A Valkey database is a database number and a user with the same name in the Valkey
        container of the customer. The application connects to the host `valkey.internal`, port
        6379, with the user name, the password and the database number. The user has access to
        that number only. `createUser` must not be false. The response is 422 when the agent of
        the server did not report the engine (see `databaseEngines` of the server), and when the
        website uses the shared database containers of an earlier release (see `sharedDatabases`
        of the website). The list of the databases gives the number when the job is complete.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [engine, name]
              properties:
                engine: { $ref: '#/components/schemas/Engine' }
                name: { type: string, pattern: '^[a-z0-9][a-z0-9_]{0,31}$', description: The name after the prefix. You can also give the full name. }
                createUser: { type: boolean, default: true }
      responses:
        '202':
          description: The password is shown only once. The panel does not keep it.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  name: { type: string }
                  user: { type: [string, 'null'] }
                  password: { type: [string, 'null'] }
                  job: { $ref: '#/components/schemas/Job' }
        '422': { $ref: '#/components/responses/Invalid' }

  /v1/websites/{websiteId}/databases/{databaseId}:
    parameters:
      - { $ref: '#/components/parameters/WebsiteId' }
      - { name: databaseId, in: path, required: true, schema: { type: string } }
    delete:
      tags: [Databases]
      summary: Remove a database
      description: >-
        The agent removes the access of each user to the database, then the database. The users
        stay. The user of a Valkey database goes with the database.
      responses:
        '202': { $ref: '#/components/responses/JobOnly' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/websites/{websiteId}/database-users:
    parameters:
      - { $ref: '#/components/parameters/WebsiteId' }
    post:
      tags: [Databases]
      summary: Create a database user
      description: >-
        A user can have access to more than one database of the website, with a permission for each
        database. For example, a sync user can have read-only access to production and read-write
        access to staging. The engine cannot be `valkey`: a Valkey database comes with its user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [engine, name]
              properties:
                engine: { $ref: '#/components/schemas/Engine' }
                name: { type: string, pattern: '^[a-z0-9][a-z0-9_]{0,31}$', description: The name after the prefix. }
                access: { type: string, enum: [website, anywhere], default: website }
                grants: { type: array, items: { $ref: '#/components/schemas/GrantInput' } }
      responses:
        '202': { $ref: '#/components/responses/DatabaseUserJob' }
        '422': { $ref: '#/components/responses/Invalid' }

  /v1/websites/{websiteId}/database-users/{userId}:
    parameters:
      - { $ref: '#/components/parameters/WebsiteId' }
      - { name: userId, in: path, required: true, schema: { type: string } }
    patch:
      tags: [Databases]
      summary: Change a database user
      description: >-
        "grants" replaces all grants of the user. "resetPassword" makes a new password. The user of
        a Valkey database accepts only "resetPassword".
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                access: { type: string, enum: [website, anywhere] }
                grants: { type: array, items: { $ref: '#/components/schemas/GrantInput' } }
                resetPassword: { type: boolean }
      responses:
        '202': { $ref: '#/components/responses/DatabaseUserJob' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }
    delete:
      tags: [Databases]
      summary: Remove a database user
      description: The response is 422 for the user of a Valkey database. Remove the database.
      responses:
        '202': { $ref: '#/components/responses/JobOnly' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }

  /v1/websites/{websiteId}/snapshots:
    parameters:
      - { $ref: '#/components/parameters/WebsiteId' }
    get:
      tags: [Backups]
      summary: List snapshots
      responses:
        '200':
          description: The newest 100 snapshots.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Snapshot' } }
    post:
      tags: [Backups]
      summary: Back up now
      description: >-
        Makes a manual backup. The panel keeps the newest manual backups of each website (the
        field "manual" of the backup policy). The retention policy of the scheduled backups does
        not remove the manual backups.
      responses:
        '202': { $ref: '#/components/responses/JobOnly' }

  /v1/websites/{websiteId}/snapshots/{snapshotId}/restore:
    parameters:
      - { $ref: '#/components/parameters/WebsiteId' }
      - { name: snapshotId, in: path, required: true, schema: { type: string } }
    post:
      tags: [Backups]
      summary: Restore from a snapshot
      description: >-
        FR-903. Restore the full website, one database or one file. A restore of the full
        website keeps the files that are not in the snapshot, unless removeNewFiles is true.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scope]
              properties:
                scope: { type: string, enum: [website, database, file] }
                item: { type: string, description: 'The database name or file path. A file path starts with "/" and cannot contain "..".' }
                removeNewFiles:
                  type: boolean
                  default: false
                  description: >-
                    Only with the scope "website". The agent removes all files of the website
                    that are not in the snapshot, for example files that an attacker added.
      responses:
        '202': { $ref: '#/components/responses/JobOnly' }
        '422': { $ref: '#/components/responses/Invalid' }

  /v1/backup-policy:
    get:
      tags: [Backups]
      summary: Get the backup policy
      description: An administrator gets all fields. Other users get only daily, weekly, monthly, time and manual.
      responses:
        '200':
          description: The policy.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BackupPolicy' }
    put:
      tags: [Backups]
      summary: Change the backup policy
      description: Administrators only.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BackupPolicy' }
      responses:
        '200':
          description: Changed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BackupPolicy' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Invalid' }

  /v1/backup-policy/repository-password:
    get:
      tags: [Backups]
      summary: Get the backup repository and the repository password of each server
      description: >-
        Administrators only. Each server that has websites has its own restic repository below
        the backup target, and its own repository password. The panel sends a password only to
        its server. Keep a copy of all passwords in a safe place: without the password of a
        server, you cannot restore the websites of that server with restic directly. Get the
        passwords again after you add a server. The panel records each request in the audit log.
      responses:
        '200':
          description: The repositories and their passwords.
          content:
            application/json:
              schema:
                type: object
                required: [repositories, shared]
                properties:
                  repositories:
                    type: array
                    items:
                      type: object
                      required: [serverId, server, repository, password]
                      properties:
                        serverId: { type: string }
                        server: { type: string, description: The name of the server. }
                        repository: { type: string, nullable: true, description: 'The restic repository of the server, for example s3:s3.amazonaws.com/bucket/servers/SERVER_ID. Null when no backup target is set.' }
                        password: { type: string }
                  shared:
                    type: object
                    nullable: true
                    description: The repository that all servers used in an earlier version of the panel. The panel uses it only to restore the snapshots from that time. Null when the panel never used it.
                    required: [repository, password]
                    properties:
                      repository: { type: string, nullable: true }
                      password: { type: string }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/jobs:
    get:
      tags: [Jobs]
      summary: List jobs
      parameters:
        - { name: websiteId, in: query, schema: { type: string } }
        - { name: serverId, in: query, schema: { type: string } }
        - { name: perPage, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: state, in: query, schema: { $ref: '#/components/schemas/JobState' } }
      responses:
        '200':
          description: One page of jobs. The newest job is first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Job' } }

  /v1/jobs/{id}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    get:
      tags: [Jobs]
      summary: Get a job
      responses:
        '200':
          description: The job.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Job' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/servers:
    get:
      tags: [Servers]
      summary: List servers
      responses:
        '200':
          description: The servers.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Server' } }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/servers/join-tokens:
    post:
      tags: [Servers]
      summary: Make a join token
      description: FR-1201. Give the token to the install script with `--join`. The token works once and expires after one day.
      responses:
        '201':
          description: The token and the install command.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  expiresAt: { type: string, format: date-time }
                  command: { type: string, description: The install command. When the panel has a CA, the command has its fingerprint (--panel-ca-sha256). }
                  installUrl: { type: string, description: 'The address of the installation script in the command: the script of the release of this panel, or the value of CF_INSTALL_URL.' }
                  panelCaSha256: { type: [string, 'null'], description: The SHA-256 fingerprint of the root certificate of the panel CA. }

  /v1/servers/{id}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    get:
      tags: [Servers]
      summary: Get a server
      responses:
        '200':
          description: The server.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Server' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Servers]
      summary: Change a server
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, pattern: '^[a-z][a-z0-9-]{1,30}$' }
                location: { type: string }
                roles: { type: array, minItems: 1, items: { $ref: '#/components/schemas/ServerRole' } }
                gvisorPlatform: { type: string, enum: [systrap, kvm], description: KVM needs a bare-metal server. }
                updatePolicy: { type: string, enum: [security, all, manual] }
                maintenanceWindow: { type: string, pattern: '^[0-2][0-9]:[0-5][0-9]-[0-2][0-9]:[0-5][0-9]$' }
      responses:
        '200':
          description: >-
            Changed. A change of the gVisor platform starts a job that writes the units again and
            restarts the containers. The server shows the new platform when the job succeeds.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Server' }
                  - type: object
                    properties:
                      job: { oneOf: [{ $ref: '#/components/schemas/Job' }, { type: 'null' }] }
        '422': { $ref: '#/components/responses/Invalid' }
    delete:
      tags: [Servers]
      summary: Remove a server
      description: >-
        Removes a server from the panel, for example a server that joined with a wrong address.
        The panel also removes the jobs of the server. It does not change the server itself. The
        answer is status 422 for a server with websites and for the server of the panel.
      responses:
        '204': { description: Removed. }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }

  /v1/servers/{id}/install-updates:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    post:
      tags: [Servers]
      summary: Install host updates now
      description: >-
        FR-1117. The agent restarts only the services that changed. With the policy "tools", the
        agent updates only the container tools (FR-1113). Update them on one server, check it,
        and then update the other servers. The panel refuses a second "tools" update while one
        is in progress.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                policy: { type: string, enum: [security, all, tools], description: The default is the update policy of the server. }
      responses:
        '202': { $ref: '#/components/responses/JobOnly' }
        '422': { $ref: '#/components/responses/Invalid' }

  /v1/servers/{id}/reboot:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    post:
      tags: [Servers]
      summary: Reboot a server
      responses:
        '202': { $ref: '#/components/responses/JobOnly' }
        '422': { $ref: '#/components/responses/Invalid' }

  /v1/servers/{id}/update-agent:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    post:
      tags: [Servers]
      summary: Update the agent
      description: >-
        The agent keeps the previous binary. It goes back to it if the new binary does not start.
        The agent refuses a version that is older than its version, unless allowDowngrade is true.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                allowDowngrade: { type: boolean, default: false }
      responses:
        '202': { $ref: '#/components/responses/JobOnly' }

  /v1/servers/{id}/check-connection:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    post:
      tags: [Servers]
      summary: Test the connection to the agent
      description: >-
        The panel connects to the agent of the server and records the result. `connectionError`
        of the server is null when the connection works.
      responses:
        '200':
          description: The server, with the result of the test.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Server' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/servers/{id}/move-databases:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    post:
      tags: [Servers]
      summary: Give each customer its own database containers
      description: >-
        Each customer has its own MariaDB, PostgreSQL and Valkey containers on a server. On a
        server from an earlier release, all websites use one MariaDB container and one PostgreSQL
        container. This request starts one job for each website of the server that uses the
        shared containers (see `sharedDatabases` of the website). The job copies the databases
        and the database users of the website to the containers of its customer. The passwords,
        the host names and the ports stay the same. The website does not operate during the copy
        of its databases. When the last website has moved, the agent stops the shared containers.
        Their data stays on the disk of the server.


        The response has no job for a website that the panel makes now, and for a website with a
        job that is not complete. After a job fails, the website uses the shared containers
        again, and you can send the request again. The response is 422 when the agent of the
        server is from an earlier release (see `databaseInstances` of the server).
      responses:
        '202':
          description: The jobs are in the queue. One job for each website.
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobs:
                    type: array
                    items: { $ref: '#/components/schemas/Job' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }

  /v1/panel-certificate:
    get:
      tags: [Servers]
      summary: Get the certificate of the panel domain
      description: >-
        The edge proxy on the panel server gets the TLS certificate of the panel domain with one
        of two methods. "internal": the CA of the panel signs it. This works for all domains,
        also localhost and panel.localhost. A browser trusts it only after you add the root
        certificate of the CA (caCertificate). A new panel uses this method. "letsencrypt": Let's
        Encrypt gives it. The domain must be public, and its DNS must point to the panel server.
      responses:
        '200':
          description: The certificate.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PanelCertificate' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [Servers]
      summary: Change the certificate method of the panel domain
      description: >-
        The agent on the panel server changes the method and waits for the new certificate. If
        the certificate does not come in time, the agent goes back to the previous method and the
        job fails. The panel refuses "internal" while other servers do not trust the panel CA
        (serversWithoutCa), and "letsencrypt" for a domain that is not public.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [method]
              properties:
                method: { type: string, enum: [internal, letsencrypt] }
      responses:
        '202':
          description: The job started.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PanelCertificate' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Invalid' }

  /v1/runtime-images:
    get:
      tags: [Images]
      summary: List the images for a new website
      description: >-
        Needs the websites:read scope. A customer or a reseller gets the official images
        only. An administrator also gets the images that they added.
      responses:
        '200':
          description: The images.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [id, name, family, tag, custom]
                      properties:
                        id: { type: string }
                        name: { type: string }
                        family: { type: string }
                        tag: { type: string }
                        phpVersion: { type: [string, 'null'] }
                        custom: { type: boolean }
                        supportEndsAt: { type: [string, 'null'], format: date-time }

  /v1/images:
    get:
      tags: [Images]
      summary: List images
      responses:
        '200':
          description: The images.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Image' } }
    post:
      tags: [Images]
      summary: Add a custom image
      description: FR-1108. The panel accepts only an image with a valid signature.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, reference, tag, policy]
              properties:
                name: { type: string, maxLength: 100 }
                reference: { type: string, description: 'For example "registry.example.com/team/app".' }
                tag: { type: string }
                policy: { type: string, enum: [automatic, manual] }
                containerPort: { type: [integer, 'null'], minimum: 1, maximum: 65535, description: FR-307. The HTTP port in the container. The default is 8080. }
                command: { type: [array, 'null'], maxItems: 32, items: { type: string, maxLength: 1024 }, description: The start command as a list of arguments. Null uses the command of the image. }
      responses:
        '201':
          description: Added.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Image' }
        '422': { $ref: '#/components/responses/Invalid' }

  /v1/images/{id}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    patch:
      tags: [Images]
      summary: Change an image
      description: The update policy. For a custom image, also the port and the start command.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                policy: { type: string, enum: [automatic, security_automatic, manual] }
                containerPort: { type: [integer, 'null'], minimum: 1, maximum: 65535 }
                command: { type: [array, 'null'], maxItems: 32, items: { type: string, maxLength: 1024 } }
      responses:
        '200':
          description: Changed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Image' }

  /v1/images/{id}/check:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    post:
      tags: [Images]
      summary: Check the registry for a new version of an image now
      description: |
        FR-1110. The scheduler does this check each hour for all images. For an official image, the
        panel takes the newest release tag with a good signature from the release key. For an image
        that an administrator added, the panel looks for a new digest of the same tag. The update
        policy of the image then decides if a rollout starts.
      responses:
        '200':
          description: Checked. `checkError` tells why a check failed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Image' }

  /v1/rollouts:
    get:
      tags: [Images]
      summary: List rollouts
      responses:
        '200':
          description: The newest 20 rollouts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Rollout' } }
    post:
      tags: [Images]
      summary: Start a rollout
      description: |
        FR-1103. Update all websites on an image in stages: one canary website, 10%, 50%, then everyone.
        A website that fails its health check goes back to the previous image. If the canary fails,
        the rollout pauses. Only one rollout runs at a time.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [imageId]
              properties:
                imageId: { type: string }
      responses:
        '201':
          description: Started.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Rollout' }
        '422': { $ref: '#/components/responses/Invalid' }

  /v1/rollouts/{id}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    get:
      tags: [Images]
      summary: Get a rollout
      responses:
        '200':
          description: The rollout.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Rollout' }

  /v1/rollouts/{id}/pause:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    post:
      tags: [Images]
      summary: Pause a rollout
      description: Jobs that run now complete. The next stage does not start.
      responses:
        '200':
          description: Paused.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Rollout' }

  /v1/rollouts/{id}/resume:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    post:
      tags: [Images]
      summary: Resume a rollout
      responses:
        '200':
          description: Resumed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Rollout' }

  /v1/rollouts/{id}/roll-back:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    post:
      tags: [Images]
      summary: Roll back a rollout
      description: FR-1107. Put all updated websites back on the previous image.
      responses:
        '200':
          description: Rolled back.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Rollout' }

  /v1/customers:
    get:
      tags: [Customers]
      summary: List customers
      responses:
        '200':
          description: The customers that you can see.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Customer' } }
    post:
      tags: [Customers]
      summary: Add a customer
      description: Administrators add resellers and owners. Resellers add owners only. With createUser, the panel also makes the first user of the customer, and the answer has the temporary password of that user one time.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, role, planId]
              properties:
                name: { type: string }
                email: { type: string, format: email }
                role: { type: string, enum: [reseller, owner] }
                planId: { type: string }
                createUser: { type: boolean, default: false, description: Also make a user with the name and the email of the customer. An API token needs the users:write scope for this. }
      responses:
        '201':
          description: Added.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Customer' }
                  - type: object
                    properties:
                      user: { $ref: '#/components/schemas/NewUser' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Invalid' }

  /v1/customers/{id}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    patch:
      tags: [Customers]
      summary: Change a customer
      description: A customer cannot move to a plan that allows fewer websites than the customer has. A reseller sets the branding (FR-106). A reseller that sets a new panel domain must prove that it controls the domain, with a verified domain of its own or a DNS TXT record that the error message gives. A reseller can give only the plans in its allowedPlanIds, and cannot lift a suspension that an administrator set.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                planId: { type: string }
                suspended: { type: boolean }
                branding: { $ref: '#/components/schemas/Branding' }
                allowedPlanIds: { type: array, items: { type: string }, description: Only an administrator, for a reseller. The plans that the reseller can give to its customers, in addition to its own plan. }
      responses:
        '200':
          description: Changed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Customer' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/plans:
    get:
      tags: [Customers]
      summary: List plans
      responses:
        '200':
          description: The plans.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Plan' } }
    post:
      tags: [Customers]
      summary: Add a plan
      description: Administrators only.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlanInput' }
      responses:
        '201':
          description: Added.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Plan' }

  /v1/plans/{id}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    patch:
      tags: [Customers]
      summary: Change a plan
      description: Administrators only.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlanInput' }
      responses:
        '200':
          description: Changed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Plan' }

  /v1/users:
    get:
      tags: [Users]
      summary: List users
      description: An administrator sees all users. A reseller sees its own users and the users of its customers. A website owner sees the users of its own account.
      responses:
        '200':
          description: The users that you can see.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/ManagedUser' } }
    post:
      tags: [Users]
      summary: Add a user
      description: The panel sends no email. The answer has a temporary password one time. Give it to the user. The user must set a new password at the first sign-in. An administrator adds users for all customers. A reseller adds users for its own customers only. With customerId null, the new user is an administrator. Only an administrator in a sign-in session can do this. An API token cannot.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, customerId]
              properties:
                name: { type: string, maxLength: 200 }
                email: { type: string, format: email }
                customerId: { type: [string, 'null'], description: The customer of the user. The role of the user is the role of the customer. Null makes an administrator. }
      responses:
        '201':
          description: Added.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NewUser' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Invalid' }

  /v1/users/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    delete:
      tags: [Users]
      summary: Delete a user
      description: Deletes the user with all sessions and API tokens. You cannot delete your own user. The rules of POST /v1/users apply.
      responses:
        '204': { description: Deleted. }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/users/{id}/reset-password:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    post:
      tags: [Users]
      summary: Give a user a new temporary password
      description: The panel deletes all sessions and API tokens of the user, and removes the sign-in lock. The user must set a new password at the next sign-in. You cannot do this for your own user. The rules of POST /v1/users apply.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                removeTotp: { type: boolean, default: false, description: Also turn off TOTP, for a user who lost the device. }
      responses:
        '200':
          description: The user with the temporary password.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NewUser' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/audit:
    get:
      tags: [Audit]
      summary: Read the audit log
      description: FR-105. Each change, with who made it, when, and from which IP address. For a user who is not an administrator, an entry of an administrator or of the provider has the text "Administrator" or "Your provider" as the actor, and no IP address.
      parameters:
        - { name: q, in: query, description: Text in the action or the target. An administrator also searches the actor and an exact IP address., schema: { type: string, maxLength: 200 } }
        - { name: perPage, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: One page of entries. The newest entry is first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        at: { type: string, format: date-time }
                        actor: { type: string }
                        ip: { type: [string, 'null'] }
                        action: { type: string }
                        target: { type: string }
                  meta:
                    type: object
                    properties:
                      currentPage: { type: integer }
                      lastPage: { type: integer }
                      total: { type: integer }

  /agent/v1/join:
    post:
      tags: [Agent]
      summary: Join a server to the panel
      description: The command `cf-agent join` calls this route. The join token works once.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, name, agentUrl, certificateSha256, certificatePem, agentVersion, os, arch]
              properties:
                token: { type: string }
                name: { type: string, pattern: '^[a-z][a-z0-9-]{1,30}$' }
                agentUrl: { type: string, format: uri }
                certificateSha256: { type: string, pattern: '^[0-9a-f]{64}$' }
                certificatePem: { type: string, description: The self-signed certificate of the agent port. The panel trusts only this certificate for the server. }
                agentVersion: { type: string }
                os: { type: string, enum: [debian-13, ubuntu-26.04] }
                osName: { type: string }
                kernel: { type: string }
                arch: { type: string, enum: [x86-64, arm64] }
                bareMetal: { type: boolean }
                podmanVersion: { type: string }
                gvisorVersion: { type: string }
                roles: { type: array, items: { $ref: '#/components/schemas/ServerRole' } }
      responses:
        '201':
          description: Joined. Keep the agent token. The panel shows it only once.
          content:
            application/json:
              schema:
                type: object
                properties:
                  serverId: { type: string }
                  agentToken: { type: string }
                  panelCertificateSha256: { type: [string, 'null'] }
                  panelCaSha256: { type: [string, 'null'], description: The agent trusts a certificate of the panel domain from the CA with this root fingerprint. }
        '401': { description: The join token is not valid or has expired. }
        '422': { $ref: '#/components/responses/Invalid' }

  /agent/v1/jobs/{id}/events:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    post:
      tags: [Agent]
      summary: Report the progress or the result of a job
      security:
        - agentToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state]
              properties:
                state: { type: string, enum: [running, succeeded, failed] }
                step: { type: integer, minimum: 0 }
                error: { type: string, maxLength: 4000 }
                result: { type: object }
      responses:
        '200': { description: Recorded. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /agent/v1/report:
    post:
      tags: [Agent]
      summary: Report the state of the host
      description: FR-1118. The agent sends this report every minute.
      security:
        - agentToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HostReport' }
      responses:
        '200':
          description: Recorded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  panelCaSha256: { type: [string, 'null'], description: The SHA-256 fingerprint of the root certificate of the panel CA. The agent trusts this CA from now on. }
        '401': { $ref: '#/components/responses/Unauthenticated' }

components:
  securitySchemes:
    token:
      type: http
      scheme: bearer
      description: A session token from /v1/auth/login, or an API token.
    agentToken:
      type: http
      scheme: bearer
      description: |
        The agent token from /agent/v1/join. The edge proxy also checks the client certificate
        and sends its SHA-256 fingerprint in the `X-Client-Cert-Sha256` header.

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string }
    WebsiteId:
      name: websiteId
      in: path
      required: true
      schema: { type: string }

  responses:
    DatabaseUserJob:
      description: The user. The password is shown only once, and only when the panel made a new one.
      content:
        application/json:
          schema:
            type: object
            properties:
              user: { $ref: '#/components/schemas/DatabaseUser' }
              password: { type: [string, 'null'] }
              job: { $ref: '#/components/schemas/Job' }
    Unauthenticated:
      description: No token, or the token has expired.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: The token does not have the necessary scope or role.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: The item does not exist, or you cannot see it.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Invalid:
      description: One or more fields are not correct.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ValidationError' }
    JobOnly:
      description: The job is in the queue.
      content:
        application/json:
          schema:
            type: object
            properties:
              job: { $ref: '#/components/schemas/Job' }
    WebsiteJob:
      description: The panel recorded the change. The job is in the queue.
      content:
        application/json:
          schema:
            type: object
            properties:
              website: { $ref: '#/components/schemas/Website' }
              job: { $ref: '#/components/schemas/Job' }

  schemas:
    Error:
      type: object
      properties:
        message: { type: string }
    ValidationError:
      type: object
      properties:
        message: { type: string }
        errors:
          type: object
          additionalProperties: { type: array, items: { type: string } }
    Scope:
      type: string
      enum: [websites:read, websites:write, databases:read, databases:write, backups:read, backups:write, servers:read, servers:write, images:read, images:write, customers:read, customers:write, users:read, users:write, audit:read, tokens:read, tokens:write]
    User:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string }
        role: { type: string, enum: [administrator, reseller, owner] }
        customerId: { type: [string, 'null'] }
        totpEnabled: { type: boolean }
        mustChangePassword: { type: boolean, description: The user has a temporary password and must set a new one. }
    ManagedUser:
      allOf:
        - { $ref: '#/components/schemas/User' }
        - type: object
          properties:
            createdAt: { type: string, format: date-time }
    NewUser:
      allOf:
        - { $ref: '#/components/schemas/ManagedUser' }
        - type: object
          properties:
            temporaryPassword: { type: string, description: The panel shows this value one time only. }
    Token:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        scopes: { type: array, items: { type: string } }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: [string, 'null'], format: date-time }
        lastUsedAt: { type: [string, 'null'], format: date-time }
    WebsiteStatus:
      type: string
      enum: [starting, running, stopping, stopped, failed]
    Limits:
      type: object
      required: [vcpus, memoryBytes, diskBytes, diskIoBytesPerSecond, processes]
      properties:
        vcpus: { type: number }
        memoryBytes: { type: integer }
        diskBytes: { type: integer }
        diskIoBytesPerSecond: { type: integer }
        processes: { type: integer }
    Website:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        application: { type: string }
        customerId: { type: string }
        serverId: { type: string }
        planId: { type: string }
        unixUser: { type: string }
        status: { $ref: '#/components/schemas/WebsiteStatus' }
        runtime:
          type: object
          properties:
            imageId: { type: string }
            family: { type: string }
            image: { type: string }
            digest: { type: [string, 'null'] }
            signatureVerified: { type: boolean }
            phpVersion: { type: [string, 'null'] }
            workerMode: { type: boolean }
            extensions: { type: array, items: { type: string } }
            phpIni: { type: object, additionalProperties: { type: string } }
            previousImageId: { type: [string, 'null'] }
            documentRoot: { type: string, description: 'The directory in /app that the web server serves. "." is /app.' }
            supportEndsAt: { type: [string, 'null'], format: date }
        updateReady: { type: boolean }
        limits: { $ref: '#/components/schemas/Limits' }
        usage: { type: [object, 'null'] }
        domains:
          type: array
          items: { $ref: '#/components/schemas/Domain' }
        sftp: { $ref: '#/components/schemas/Sftp' }
        stagingOf: { type: [string, 'null'] }
        sharedDatabases:
          type: boolean
          description: >-
            True when the website uses the shared database containers of an earlier release.
            False when it uses the database containers of its customer. A website with the shared
            containers cannot have a Valkey database.
        managedByTerraform: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Sftp:
      type: object
      properties:
        enabled: { type: boolean }
        host: { type: [string, 'null'] }
        port: { type: integer, description: The SFTP port of the server of the website. The default is 2200. }
        username: { type: string }
        authorizedKeys: { type: array, items: { type: string } }
    JobState:
      type: string
      enum: [queued, running, succeeded, failed]
    Job:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        ref: { type: [string, 'null'] }
        action: { type: string }
        state: { $ref: '#/components/schemas/JobState' }
        steps: { type: array, items: { type: string } }
        step: { type: integer, description: The number of steps that are complete. }
        error: { type: [string, 'null'], description: An administrator gets the full error of the agent. Other users get a short text. }
        websiteId: { type: [string, 'null'] }
        serverId: { type: string }
        createdAt: { type: string, format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
    Engine:
      type: string
      enum: [mariadb, postgresql, valkey]
    Snapshot:
      type: object
      properties:
        id: { type: string }
        kind: { type: string, enum: [scheduled, manual] }
        sizeBytes: { type: integer }
        databases: { type: array, items: { type: string }, description: For example "mariadb:shop". Use this value as the restore item. A snapshot has no Valkey data. }
        mailboxes: { type: array, items: { type: string } }
        createdAt: { type: string, format: date-time }
    BackupPolicy:
      type: object
      required: [daily, weekly, monthly, time, target]
      properties:
        daily: { type: integer, minimum: 0, maximum: 365 }
        weekly: { type: integer, minimum: 0, maximum: 520 }
        monthly: { type: integer, minimum: 0, maximum: 240 }
        time: { type: string, pattern: '^[0-2][0-9]:[0-5][0-9]$', description: The time of the nightly backups, in UTC. }
        manual: { type: integer, readOnly: true, description: The number of manual backups that the panel keeps for each website. The operator sets it with CF_MANUAL_BACKUPS. }
        target: { type: string, description: 'A restic repository in object storage, for example "s3:s3.amazonaws.com/bucket/path" or "b2:bucket:path".' }
        credentials:
          type: [object, 'null']
          writeOnly: true
          description: >-
            The restic environment variables of the object storage, for example AWS_ACCESS_KEY_ID
            and AWS_SECRET_ACCESS_KEY. The panel keeps them encrypted and never shows them. Leave
            out to keep them. An empty object removes them.
          additionalProperties: { type: string }
        credentialNames: { type: array, readOnly: true, items: { type: string }, description: The names of the credentials that are set. }
    ServerRole:
      type: string
      enum: [web, database, email, dns, backup]
    Server:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        location: { type: string }
        roles: { type: array, items: { $ref: '#/components/schemas/ServerRole' } }
        state:
          type: string
          enum: [joining, healthy, agent_update, degraded, offline, rebooting]
          description: >-
            `degraded`: the agent answers, but a necessary service does not run, or the panel
            cannot connect to the agent. `services` gives the service and the reason, and
            `connectionError` gives the reason of a failed connection. A degraded server with
            a service that does not run continues to do work.
        agentVersion: { type: [string, 'null'] }
        agentUpdateAvailable:
          type: boolean
          description: The panel has a newer agent than the agent of this server. The value is correct also when the state is `degraded` or `offline`.
        agentAddress:
          type: [string, 'null']
          description: The host and the port that the panel uses to connect to the agent, for example `web2.example.com:7443`.
        connectionError:
          type: [string, 'null']
          description: >-
            The reason when the panel could not connect to the agent, for example
            `Could not resolve host: web2`. The state is then `degraded`, and the jobs of the
            server fail. Null when there is no known problem.
        panel:
          type: boolean
          description: This server has the panel. It cannot be removed.
        databaseEngines:
          type: array
          items: { $ref: '#/components/schemas/Engine' }
          description: >-
            The database engines that the agent of the server can operate. An agent of an earlier
            release has `mariadb` and `postgresql` only. Update the agent to get `valkey`.
        databaseInstances:
          type: boolean
          description: >-
            True when the agent of the server gives each customer its own database containers.
            With an agent of an earlier release, all websites of the server use the same
            database containers.
        sharedDatabaseWebsites:
          type: [integer, 'null']
          description: >-
            The number of websites of the server that use the shared database containers of an
            earlier release. Send "Give each customer its own database containers" to move their
            databases. Null when `databaseInstances` is false.
        os: { type: [string, 'null'] }
        kernel: { type: [string, 'null'] }
        arch: { type: [string, 'null'] }
        podmanVersion: { type: [string, 'null'] }
        gvisorVersion: { type: [string, 'null'] }
        gvisorPlatform: { type: string, enum: [systrap, kvm] }
        bareMetal: { type: boolean }
        updatePolicy: { type: string, enum: [security, all, manual] }
        maintenanceWindow: { type: string }
        pendingUpdates: { type: array, items: { type: object } }
        lastUpdateAt: { type: [string, 'null'], format: date-time }
        rebootRequired: { type: boolean }
        services:
          type: array
          description: The services that the agent examines. The panel does not show the `nftables` entry of an agent of release 0.1.
          items:
            type: object
            properties:
              name: { type: string, description: 'For example cf-agent, ssh, cf-sftp, firewall or disk-quotas.' }
              state: { type: string, enum: [running, stopped, failed] }
              optional: { type: boolean, description: The server can operate without this part. An optional part that does not run does not make the server degraded. }
              detail: { type: [string, 'null'], description: The reason when the service does not run, and the command that repairs it when there is one. }
        sftpPort:
          type: integer
          description: >-
            The port of the SFTP container of the websites on this server. The default is 2200.
            The value is 22 for an agent of release 0.1, which uses the SSH service of the host.
        usage:
          type: [object, 'null']
          description: The use of the host in percent.
          properties:
            cpuPercent: { type: number, description: The load average of one minute for each CPU. }
            memoryPercent: { type: number }
            diskPercent: { type: number, description: The file system of the website files. }
        websites: { type: [integer, 'null'] }
        lastSeenAt: { type: [string, 'null'], format: date-time }
    Image:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        family: { type: string }
        reference: { type: string }
        tag: { type: string }
        digest: { type: [string, 'null'] }
        availableTag: { type: [string, 'null'] }
        availableDigest: { type: [string, 'null'] }
        phpVersion: { type: [string, 'null'] }
        supportEndsAt: { type: [string, 'null'], format: date }
        policy: { type: string, enum: [automatic, security_automatic, manual] }
        custom: { type: boolean }
        signatureVerified: { type: boolean }
        checkedAt: { type: [string, 'null'], format: date-time, description: The time of the last registry check. }
        checkError: { type: [string, 'null'], description: Why the last registry check failed. }
        containerPort: { type: integer }
        command: { type: array, items: { type: string } }
        websites: { type: [integer, 'null'] }
    Rollout:
      type: object
      properties:
        id: { type: string }
        imageId: { type: string }
        title: { type: string }
        fromTag: { type: string }
        toTag: { type: string }
        severity: { type: string }
        state: { type: string, enum: [running, paused, done, rolled_back] }
        stages:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              websites: { type: integer }
              state: { type: string, enum: [waiting, in_progress, done] }
        websites: { type: integer }
        healthy: { type: integer }
        rolledBack: { type: integer }
        running: { type: integer }
        rollbacks:
          type: array
          items:
            type: object
            properties:
              website: { type: string }
              reason: { type: string }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time, nullable: true, description: The time when the rollout ended. Null while the rollout is in progress or paused. }
    Branding:
      type: object
      properties:
        name: { type: string }
        colour: { type: string, pattern: '^#[0-9a-fA-F]{6}$' }
        panelDomain: { type: string }
        supportEmail: { type: string, format: email }
    Domain:
      type: object
      properties:
        name: { type: string }
        kind: { type: string, enum: [primary, redirect, alias] }
        verified: { type: boolean, description: The edge proxy serves only verified domains. }
        verification:
          description: The TXT record that proves control of the domain. Null when the domain is verified.
          oneOf:
            - type: 'null'
            - type: object
              properties:
                type: { type: string, enum: [TXT] }
                name: { type: string, example: _cloudfactory-challenge.example.com }
                value: { type: string }
        dnsPointsHere: { type: boolean }
        certificate:
          type: object
          properties:
            state: { type: string, enum: [pending, valid, expired, failed] }
            expiresAt: { type: [string, 'null'], format: date-time }
    DatabaseUser:
      type: object
      properties:
        id: { type: string }
        engine: { $ref: '#/components/schemas/Engine' }
        name: { type: string, description: Starts with the Unix user of the website and an underscore. }
        access: { type: string, enum: [website, anywhere], description: '"website": only the website container can connect. "anywhere": any address, with TLS.' }
        grants: { type: array, items: { $ref: '#/components/schemas/DatabaseGrant' } }
    DatabaseGrant:
      type: object
      properties:
        databaseId: { type: string }
        database: { type: string }
        privileges: { type: string, enum: [readonly, readwrite] }
    GrantInput:
      type: object
      required: [databaseId, privileges]
      properties:
        databaseId: { type: string, description: A MariaDB or PostgreSQL database of the same website, with the same engine. }
        privileges: { type: string, enum: [readonly, readwrite] }
    Customer:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        role: { type: string, enum: [reseller, owner] }
        planId: { type: string }
        resellerId: { type: [string, 'null'] }
        branding: { oneOf: [{ $ref: '#/components/schemas/Branding' }, { type: 'null' }] }
        allowedPlanIds: { type: [array, 'null'], items: { type: string }, description: For a reseller, the plans that it can give to its customers. }
        suspended: { type: boolean }
        suspendedBy: { type: [string, 'null'], enum: [administrator, reseller, null] }
        websites: { type: [integer, 'null'] }
        createdAt: { type: string, format: date-time }
    PlanInput:
      type: object
      required: [name, websites, mailboxes, databases, phpExtensions, limits]
      properties:
        name: { type: string }
        websites: { type: integer, minimum: 1 }
        mailboxes: { type: integer, minimum: 0 }
        databases: { type: integer, minimum: 0 }
        phpExtensions: { type: array, items: { type: string } }
        limits: { $ref: '#/components/schemas/Limits' }
    Plan:
      allOf:
        - { $ref: '#/components/schemas/PlanInput' }
        - type: object
          properties:
            id: { type: string }
    PanelCertificate:
      type: object
      required: [domain, method, state, letsEncryptAvailable, serversWithoutCa]
      properties:
        domain: { type: string }
        method: { type: [string, 'null'], enum: [internal, letsencrypt, null], description: Null until the agent on the panel server reports. }
        state: { type: string, enum: [valid, pending, expired], description: '"pending": the edge proxy does not have a certificate of the method yet.' }
        expiresAt: { type: [string, 'null'], format: date-time }
        caCertificate: { type: [string, 'null'], description: The root certificate of the panel CA in PEM format. Add it to the trust store of your browser or system. }
        caSha256: { type: [string, 'null'], description: The SHA-256 fingerprint of caCertificate. }
        reportedAt: { type: [string, 'null'], format: date-time }
        letsEncryptAvailable: { type: boolean, description: False when the panel domain is not public, for example panel.localhost. }
        serversWithoutCa: { type: array, items: { type: string }, description: The names of the other servers that do not trust the panel CA yet. }
        job: { oneOf: [{ $ref: '#/components/schemas/Job' }, { type: 'null' }], description: The current or the last change of the method. }

    HostReport:
      type: object
      required: [agentVersion]
      properties:
        agentVersion: { type: string }
        kernel: { type: string }
        podmanVersion: { type: string }
        gvisorVersion: { type: string }
        pendingUpdates:
          type: array
          items:
            type: object
            required: [name, to]
            properties:
              name: { type: string }
              from: { type: string }
              to: { type: string }
              security: { type: boolean }
              containerTool: { type: boolean, description: A held container tool. The policy "tools" updates it (FR-1113). }
        rebootRequired: { type: boolean }
        lastUpdateAt: { type: string, format: date-time }
        services:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              state: { type: string, enum: [running, stopped, failed] }
              detail: { type: string, maxLength: 1000, description: The reason when the service does not run. }
              optional: { type: boolean, description: The server can operate without this part. The panel also knows `disk-quotas` as an optional part. }
        usage:
          type: object
          description: The use of the host in percent.
          properties:
            cpuPercent: { type: number, description: The load average of one minute for each CPU. }
            memoryPercent: { type: number }
            diskPercent: { type: number, description: The file system of the website files. }
        websites:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              cpuPercent: { type: number }
              memoryBytes: { type: integer }
              diskBytes: { type: integer }
              processes: { type: integer }
        domains:
          type: [array, 'null']
          description: The DNS and the certificate of each domain of the websites on the server.
          items:
            type: object
            properties:
              name: { type: string }
              dnsPointsHere: { type: boolean }
              certificate: { type: string, enum: [pending, valid, expired, failed] }
              expiresAt: { type: string, format: date-time }
        databases:
          type: [array, 'null']
          description: The size of each database in the shared database containers.
          items:
            type: object
            properties:
              engine: { $ref: '#/components/schemas/Engine' }
              name: { type: string }
              sizeBytes: { type: integer }
              number: { type: integer, minimum: 1, description: Valkey only. The database number. }
              keys: { type: integer, minimum: 0, description: Valkey only. The number of keys. }
        databaseEngines:
          type: [array, 'null']
          description: The database engines that the agent can operate. An agent of an earlier release does not send the field.
          items: { $ref: '#/components/schemas/Engine' }
        databaseInstances:
          type: boolean
          description: True when the agent gives each customer its own database containers. An agent of an earlier release does not send the field.
        sftpPort: { type: [integer, 'null'], minimum: 1, maximum: 65535 }
        panelCertificate:
          type: [object, 'null']
          description: The certificate of the panel domain. Only the agent on the panel server sends it.
          required: [domain, method, state]
          properties:
            domain: { type: string }
            method: { type: string, enum: [internal, letsencrypt] }
            state: { type: string, enum: [valid, pending, expired] }
            expiresAt: { type: [string, 'null'], format: date-time }
            caCertificate: { type: [string, 'null'], description: The root certificate of the panel CA in PEM format. }
        panelCaSha256: { type: [string, 'null'], pattern: '^[0-9a-f]{64}$', description: The fingerprint of the root certificate of the panel CA that the agent trusts. }
